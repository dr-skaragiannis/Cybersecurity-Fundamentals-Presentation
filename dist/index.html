αφή) που περιέχουν εκτελέσιμο κώδικα (shellcode), αποκαλύπτοντας τεχνικές injection."},{"q":"Ποια είναι η βασική τεχνική δυνατότητα του YARA στην ανάλυση malware και στην απόκριση περιστατικών;","opts":[{"k":"A","v":"Αυτόματη μεταγλώττιση scripts Python σε οδηγούς συσκευών πυρήνα υψηλής υπολογιστικής ταχύτητας, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Κρυπτογράφηση πινάκων βάσεων δεδομένων με εφήμερα συμμετρικά κλειδιά ανά αίτημα χρήστη, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Δημιουργία τούνελ peer-to-peer υψηλής ταχύτητας σε υποθαλάσσια καλώδια διεθνών επικοινωνιών, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Διαχείριση καρτών φυσικής πρόσβασης στις εγκαταστάσεις και βάσεων βιομετρικών δεδομένων προσωπικού, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Συγγραφή κανόνων ταυτοποίησης μοτίβων (κείμενο, regex, hex) για κατηγοριοποίηση malware σε αρχεία και μνήμη."}],"ans":"E","exp":"Το YARA επιτρέπει στους αναλυτές να δημιουργούν κανόνες αναγνώρισης δυαδικών μοτίβων (κείμενο, δεκαεξαδικά, regex) για τον εντοπισμό και την κατηγοριοποίηση δειγμάτων malware σε αρχεία ή στη RAM."},{"q":"Ποια είναι η βασική διαφορά μεταξύ Στατικής και Δυναμικής Ανάλυσης Κακόβουλου Λογισμικού;","opts":[{"k":"A","v":"Η στατική ανάλυση εξετάζει το δυαδικό αρχείο χωρίς εκτέλεση, ενώ η δυναμική παρακολουθεί τη συμπεριφορά σε sandbox."},{"k":"B","v":"Η στατική ανάλυση λειτουργεί μόνο σε Linux, ενώ η δυναμική ανάλυση λειτουργεί μόνο σε λειτουργικά Windows."},{"k":"C","v":"Η στατική ανάλυση απαιτεί έξυπνες κάρτες, ενώ η δυναμική απαιτεί μετα-κβαντική ασύμμετρη κρυπτογράφηση, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Η στατική ανάλυση εκτελείται μόνο από διωκτικές αρχές, ενώ η δυναμική μόνο από εσωτερικές νομικές ομάδες."},{"k":"E","v":"Η στατική ανάλυση μετρά την καθυστέρηση δικτύου, ενώ η δυναμική μεταγλωττίζει οδηγούς συσκευών, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"A","exp":"Η στατική ανάλυση εξετάζει τον κώδικα χωρίς να τον εκτελεί (strings, headers, disassembly). Η δυναμική ανάλυση εκτελεί το malware σε απομονωμένο sandbox καταγράφοντας διεργασίες, αρχεία και κίνηση C2."},{"q":"Ποια τεχνική αποφυγής ιατροδικαστικής ανάλυσης είναι γνωστή ως \'Timestomping\';","opts":[{"k":"A","v":"Υπερθέρμανση του επεξεργαστή για πρόκληση αυτόματης επανεκκίνησης κατά τη συλλογή πειστηρίων, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Τροποποίηση χρονοσημάνσεων αρχείων ($STANDARD_INFORMATION στο NTFS) ώστε το malware να μοιάζει με αρχείο συστήματος."},{"k":"C","v":"Κρυπτογράφηση πινάκων βάσεων δεδομένων με εφήμερα συμμετρικά κλειδιά ανά γραμμή συναλλαγής, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Αλλοίωση εγγραφών DNS για ανακατεύθυνση της κίνησης σε μη κρυπτογραφημένο εξυπηρετητή ιστού, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Διαγραφή αρχείων καταγραφής του λειτουργικού κατά τις νυχτερινές ώρες συντήρησης του συστήματος, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"B","exp":"Το Timestomping αλλάζει τις χρονοσημάνσεις (MACB) ενός κακόβουλου αρχείου ώστε να ταιριάζουν με νόμιμα αρχεία του λειτουργικού, δυσκολεύοντας τη χρονολογική ανακατασκευή της επίθεσης."},{"q":"Ποιο ιατροδικαστικό στοιχείο στα Windows καταγράφει το ιστορικό εκτέλεσης, τη διαδρομή και τη χρονοσήμανση εφαρμογών GUI;","opts":[{"k":"A","v":"Η προσωρινή μνήμη επιλυτή DNS που αποθηκεύεται στην μη σελιδοποιημένη μνήμη του πυρήνα, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Ο πίνακας πρωτοκόλλου ARP που αντιστοιχίζει διευθύνσεις MAC σε δυναμικά υποδίκτυα IP, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Τα κλειδιά μητρώου UserAssist (τιμές κωδικοποιημένες με ROT13 στο αρχείο NTUSER.DAT του χρήστη)."},{"k":"D","v":"Η βάση δεδομένων Spanning Tree Protocol που διατηρεί διαδρομές προώθησης σε switches."},{"k":"E","v":"Τα αρχεία ρυθμίσεων Linux PAM που βρίσκονται αποθηκευμένα στη διαδρομή /etc/pam.d."}],"ans":"C","exp":"Τα κλειδιά UserAssist στο μητρώο των Windows (NTUSER.DAT) αποθηκεύουν στατιστικά (κωδικοποιημένα με ROT13) για τον αριθμό εκτελέσεων και την τελευταία ώρα εκτέλεσης εφαρμογών."},{"q":"Ποιος είναι ο κύριος τεχνικός στόχος της δημιουργίας ενός \'Super Timeline\' κατά τη διερεύνηση ψηφιακών πειστηρίων;","opts":[{"k":"A","v":"Επιτάχυνση των καρτών γραφικών κατά την εκτέλεση επιθέσεων λεξικού σε κωδικούς πρόσβασης, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Αντικατάσταση σχεσιακών πινάκων SQL με απλά αρχεία κειμένου αποθηκευμένα τοπικά στον δίσκο, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Παράκαμψη ελέγχων πρόσβασης του λειτουργικού κατά τη συλλογή πτητικής μνήμης RAM από τον πυρήνα, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Συγκέντρωση όλων των χρονικών στοιχείων (MFT, Μητρώο, Logs, Ιστορικό) σε μια ενιαία χρονολογική ακολουθία."},{"k":"E","v":"Συμπίεση αντιγράφων δίσκων σε ακουστικά σήματα για μακροχρόνια αρχειοθέτηση σε αποθήκες, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"D","exp":"Το Super Timeline (μέσω εργαλείων όπως το Plaso) συγκεντρώνει όλα τα χρονικά ίχνη (αρχεία, μητρώο, καταγραφές, ιστορικό) σε μία ενιαία γραμμή χρόνου για την πλήρη κατανόηση της επίθεσης."},{"q":"Ποιος είναι ο ρόλος του Master File Table (MFT) στην ιατροδικαστική ανάλυση συστημάτων αρχείων NTFS;","opts":[{"k":"A","v":"Μεταγλωττίζει απλά scripts Python σε οδηγούς συσκευών πυρήνα κατά την εκκίνηση του συστήματος, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Κρυπτογραφεί όλες τις συνδέσεις δικτύου χρησιμοποιώντας εφήμερα κλειδιά κρυπτογράφησης TLS 1.3, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Διαχειρίζεται τα συστήματα ψύξης και τις γεννήτριες πετρελαίου στα εταιρικά κέντρα δεδομένων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Μετατρέπει σχεσιακούς πίνακες βάσεων δεδομένων σε μη σχεσιακά έγγραφα δεδομένων σε πραγματικό χρόνο, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Διατηρεί ευρετήριο κάθε αρχείου και φακέλου στον τόμο, περιέχοντας μεταδεδομένα, χρονοσημάνσεις και δεδομένα."}],"ans":"E","exp":"Το $MFT είναι η κεντρική βάση του NTFS. Κάθε εγγραφή περιέχει μεταδεδομένα για δημιουργία, τροποποίηση, διαγραφή, δικαιώματα και πιθανά υπολείμματα διαγραμμένων αρχείων (resident data)."},{"q":"Πώς εντοπίζει η δυναμική ανάλυση σε ασφαλές sandbox τις επικοινωνίες ενός malware με διακομιστές C2;","opts":[{"k":"A","v":"Καταγράφοντας ερωτήματα DNS, κλήσεις HTTP/HTTPS beacons και εξερχόμενες συνδέσεις TCP/UDP σε πραγματικό χρόνο."},{"k":"B","v":"Μετρώντας τη φυσική θερμοκρασία των εξαρτημάτων του επεξεργαστή του εξυπηρετητή στο εργαστήριο, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Διαγράφοντας οριστικά όλους τους οδηγούς συσκευών του πυρήνα από τον φάκελο system32, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Αντικαθιστώντας ερωτήματα SQL με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα τοπικά στον δίσκο, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Απενεργοποιώντας όλες τις διαδικασίες επαλήθευσης πιστοποιητικών TLS στους περιηγητές ιστού, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"A","exp":"Τα sandboxes καταγράφουν όλη την κίνηση δικτύου (PCAP), αποκαλύπτοντας ερωτήματα DNS σε κακόβουλα domains, διευθύνσεις IP επικοινωνίας και περιοδικά σήματα (beacons) προς τον C2."},{"q":"Ποιο ιατροδικαστικό στοιχείο στα Windows καταγράφει αποδείξεις εκτέλεσης διεργασιών και τον αριθμό εκκινήσεων εφαρμογών;","opts":[{"k":"A","v":"Το αρχείο ρυθμίσεων hosts του DNS που βρίσκεται αποθηκευμένο στη διαδρομή /etc/hosts, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Τα αρχεία Windows Prefetch (.pf στο C:\\\\Windows\\\\Prefetch), καταγράφοντας όνομα εκτελέσιμου, πλήθος εκκινήσεων και ώρες."},{"k":"C","v":"Ο φάκελος ρυθμίσεων των μονάδων ταυτοποίησης Linux PAM στη διαδρομή /etc/pam.d, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Η προσωρινή μνήμη του πρωτοκόλλου ARP που αντιστοιχίζει διευθύνσεις MAC σε υποδίκτυα IP, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Η βάση δεδομένων τοπολογίας Spanning Tree Protocol που διατηρείται στους διακόπτες δικτύου, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"B","exp":"Τα αρχεία Prefetch (.pf) αποδεικνύουν ιατροδικαστικά την εκτέλεση ενός προγράμματος στα Windows, παρέχοντας το όνομα του εκτελέσιμου, το πλήθος εκκινήσεων και τις τελευταίες 8 χρονοσημάνσεις εκτέλεσης."}]},{"part":"Μέρος 4 · Λειτουργίες, Διερεύνηση και Διακυβέρνηση","time":"Κεφάλαιο 13 · ⏱️ 10–12 ώρες μελέτης","title":"13. Κυβερνοανθεκτικότητα, Διακυβέρνηση και Μελλοντικές Τάσεις","subtitle":"Αντίγραφα ασφαλείας και ανάκαμψη · BCP, RPO και RTO · Διαχείριση κινδύνου · NIST CSF 2.0, ISO/IEC 27001, CIS · ΓΚΠΔ και NIS2 · Δείκτες · Ασφάλεια OT · Μηδενική εμπιστοσύνη και νέφος","outcomes":["Να σχεδιάζετε στρατηγική αντιγράφων ασφαλείας που αντέχει σε λυτρισμικό και να ορίζετε RPO και RTO για κρίσιμες υπηρεσίες.","Να καταρτίζετε μητρώο κινδύνων και να επιλέγετε κατάλληλες επιλογές αντιμετώπισης.","Να συγκρίνετε τα NIST CSF 2.0, ISO/IEC 27001 και CIS Controls και να συνοψίζετε τις υποχρεώσεις του ΓΚΠΔ και της NIS2.","Να διακρίνετε τους ουσιαστικούς δείκτες ασφάλειας από τους δείκτες «βιτρίνας».","Να εξηγείτε τους ιδιαίτερους περιορισμούς της ασφάλειας OT, καθώς και τις αρχές της μηδενικής εμπιστοσύνης και της κοινής ευθύνης στο νέφος."],"intro":["Το τελευταίο κεφάλαιο επιστρέφει στο ερώτημα που τέθηκε στο Κεφάλαιο 1: _μπορεί ο οργανισμός να συνεχίσει να λειτουργεί και να ανακάμψει όταν τα πράγματα πάνε στραβά;_ Τα τεχνικά μέτρα είναι αναγκαία αλλά όχι επαρκή. Η ανθεκτικότητα εξαρτάται επίσης από αντίγραφα ασφαλείας που λειτουργούν όταν χρειάζονται, από σχέδια που έχουν δοκιμαστεί, από αποφάσεις για τον κίνδυνο που λαμβάνονται συνειδητά από υπόλογα πρόσωπα και από τη συμμόρφωση με ένα διαρκώς διευρυνόμενο νομικό πλαίσιο.","Το κεφάλαιο καλύπτει πρώτα τη μηχανική ανθεκτικότητας, τις αρχιτεκτονικές αντιγράφων ασφαλείας και την επιχειρησιακή συνέχεια. Στη συνέχεια στρέφεται στη διακυβέρνηση: τη διαχείριση κινδύνου στην πράξη, τα κυριότερα πλαίσια και κανονιστικά κείμενα και τους δείκτες που δείχνουν στη διοίκηση αν η ασφάλεια βελτιώνεται. Ολοκληρώνεται εξετάζοντας περιβάλλοντα και τάσεις που θα διαμορφώσουν τα επόμενα χρόνια —την επιχειρησιακή τεχνολογία και τις κρίσιμες υποδομές, την αρχιτεκτονική μηδενικής εμπιστοσύνης και την ασφάλεια του νέφους και της εφοδιαστικής αλυσίδας."],"sections":[{"id":"13.1","title":"Μηχανική ανθεκτικότητας και αρχιτεκτονικές αντιγράφων ασφαλείας","blocks":[{"type":"p","text":"Η **μηχανική ανθεκτικότητας** αποδέχεται ότι ορισμένες επιθέσεις και αστοχίες θα επιτύχουν και σχεδιάζει τα συστήματα ώστε να υποβαθμίζονται ομαλά αντί να καταρρέουν. Τα εργαλεία της περιλαμβάνουν πλεονασμό χωρίς κοινά μεμονωμένα σημεία αστοχίας, δυνατότητα απομόνωσης των στοιχείων που έχουν υποστεί ζημιά και προσχεδιασμένους τρόπους περιορισμένης λειτουργίας —για παράδειγμα, ένα νοσοκομείο που μπορεί να συνεχίσει να δέχεται ασθενείς σε χαρτί όταν το ηλεκτρονικό του σύστημα δεν είναι διαθέσιμο."},{"type":"p","text":"Τα αντίγραφα ασφαλείας αποτελούν το θεμέλιο της ανάκαμψης, και το σύγχρονο λυτρισμικό τα στοχεύει σκόπιμα. Ο κλασικός **κανόνας 3-2-1** —τρία αντίγραφα των δεδομένων, σε δύο διαφορετικούς τύπους μέσων, ένα από τα οποία εκτός εγκατάστασης— έχει γι\' αυτό επεκταθεί σε **3-2-1-1-0**: τουλάχιστον ένα αντίγραφο πρέπει να είναι **εκτός σύνδεσης ή αμετάβλητο** (αποθήκευση εφάπαξ εγγραφής ή κλείδωμα αντικειμένων που ούτε ένας διαχειριστής δεν μπορεί να διαγράψει κατά την περίοδο διατήρησης), και οι επαναφορές πρέπει να δοκιμάζονται, ώστε να υπάρχουν **μηδέν** ανεπιβεβαίωτα σφάλματα. Τα συστήματα αντιγράφων ασφαλείας χρειάζονται δικά τους, ξεχωριστά διαπιστευτήρια και MFA, διότι διαφορετικά ένας επιτιθέμενος με δικαιώματα διαχειριστή τομέα απλώς θα τα διαγράψει πριν ξεκινήσει την κρυπτογράφηση."}]},{"id":"13.2","title":"Επιχειρησιακή συνέχεια και ανάκαμψη από καταστροφές: RPO και RTO","blocks":[{"type":"p","text":"Ο **σχεδιασμός επιχειρησιακής συνέχειας** (Business Continuity Planning, BCP) διασφαλίζει ότι οι κρίσιμες επιχειρησιακές λειτουργίες συνεχίζονται κατά τη διάρκεια μιας διαταραχής, ενώ η **ανάκαμψη από καταστροφές** (Disaster Recovery, DR) εστιάζει στην αποκατάσταση των συστημάτων πληροφορικής που τις υποστηρίζουν. Και οι δύο ξεκινούν με μια **ανάλυση επιχειρησιακών επιπτώσεων**, η οποία εντοπίζει τις κρίσιμες διεργασίες και τις συνέπειες της διακοπής τους σε βάθος χρόνου. Δύο παράμετροι καθοδηγούν στη συνέχεια τον τεχνικό σχεδιασμό. Ο **στόχος σημείου ανάκαμψης** (Recovery Point Objective, RPO) είναι η μέγιστη αποδεκτή απώλεια δεδομένων, μετρούμενη σε χρόνο: RPO μίας ώρας απαιτεί αντίγραφα ή αναπαραγωγή τουλάχιστον ανά ώρα. Ο **στόχος χρόνου ανάκαμψης** (Recovery Time Objective, RTO) είναι ο μέγιστος αποδεκτός χρόνος αποκατάστασης της υπηρεσίας. Οι αυστηρότεροι στόχοι κοστίζουν περισσότερο και πρέπει, επομένως, να δικαιολογούνται από τις επιχειρησιακές επιπτώσεις."},{"type":"p","text":"Τα σχέδια είναι αξιόπιστα μόνο εφόσον δοκιμάζονται. Τα **εγχειρίδια ανάκαμψης** (DR playbooks) περιγράφουν βήμα προς βήμα πώς αποκαθίσταται κάθε κρίσιμο σύστημα, με ποια σειρά (οι υπηρεσίες ταυτότητας και η δικτύωση προηγούνται συνήθως) και ποιος είναι υπεύθυνος. Επικυρώνονται μέσω ασκήσεων επί χάρτου (tabletop), μερικών δοκιμών επαναφοράς και πλήρων ασκήσεων μετάπτωσης, και οι μετρούμενοι χρόνοι ανάκαμψης συγκρίνονται με τον RTO. Ένα σχέδιο που δεν έχει δοκιμαστεί ποτέ πρέπει να θεωρείται ότι δεν λειτουργεί."}]},{"id":"13.3","title":"Διαχείριση επιχειρησιακού κινδύνου στην πράξη","blocks":[{"type":"p","text":"Το Κεφάλαιο 1 όρισε τον κίνδυνο· η διακυβέρνηση μετατρέπει αυτόν τον ορισμό σε διαδικασία διαχείρισης. Ένα **μητρώο κινδύνων** καταγράφει κάθε κίνδυνο με σαφή διατύπωση (_απειλή_ που εκμεταλλεύεται _ευπάθεια_ προκαλώντας _επίπτωση_ σε _περιουσιακό στοιχείο_), υπεύθυνο, υφιστάμενα μέτρα, εκτιμήσεις πιθανότητας και επίπτωσης, την επιλεγμένη αντιμετώπιση και ημερομηνία επανεξέτασης. Ένας **πίνακας κινδύνων** —συνήθως πέντε επί πέντε— βοηθά στην οπτικοποίηση και σύγκριση των κινδύνων, αν και οι ποιοτικές κλίμακες πρέπει να ορίζονται προσεκτικά, ώστε το «πιθανό» να σημαίνει το ίδιο για όλους. Ποσοτικές μέθοδοι όπως η FAIR εκφράζουν τον κίνδυνο σε χρηματικούς όρους και μπορούν να υποστηρίξουν αποφάσεις επενδύσεων."},{"type":"p","text":"Κάθε κίνδυνος πρέπει να λαμβάνει ρητή **απόφαση αντιμετώπισης**: _μείωση_ με πρόσθετα μέτρα, _μεταφορά_ μέσω ασφάλισης ή συμβάσεων, _αποφυγή_ με διακοπή της δραστηριότητας ή επίσημη _αποδοχή_. Η αποδοχή είναι θεμιτή μόνο όταν αποφασίζεται από πρόσωπο με την αρμοδιότητα να φέρει τις συνέπειες, τεκμηριώνεται και επανεξετάζεται περιοδικά. Οι τεχνικές βαθμολογίες, όπως το CVSS (Κεφάλαιο 10), αποτελούν δεδομένα εισόδου αυτής της διαδικασίας και όχι υποκατάστατό της."}]},{"id":"13.4","title":"Πλαίσια και ρυθμίσεις: NIST CSF 2.0, ISO/IEC 27001, CIS, ΓΚΠΔ και NIS2","blocks":[{"type":"p","text":"Τα πλαίσια δίνουν δομή σε ένα πρόγραμμα ασφάλειας. Το **NIST Cybersecurity Framework 2.0** (2024) οργανώνει τα επιδιωκόμενα αποτελέσματα σε έξι λειτουργίες: _Διακυβέρνηση_, _Αναγνώριση_, _Προστασία_, _Ανίχνευση_, _Απόκριση_ και _Ανάκαμψη_· η νέα λειτουργία της Διακυβέρνησης υπογραμμίζει ότι η κυβερνοασφάλεια είναι ευθύνη της ηγεσίας. Το **ISO/IEC 27001** ορίζει τις απαιτήσεις ενός _συστήματος διαχείρισης ασφάλειας πληροφοριών_ (ΣΔΑΠ/ISMS) —ενός κύκλου αξιολόγησης κινδύνου, επιλογής μέτρων, παρακολούθησης και βελτίωσης— και αποτελεί τη βάση για ανεξάρτητη πιστοποίηση· το Παράρτημα Α περιλαμβάνει 93 μέτρα αναφοράς. Τα **CIS Critical Security Controls** είναι ένα ιεραρχημένο σύνολο συγκεκριμένων τεχνικών μέτρων, ομαδοποιημένων σε ομάδες υλοποίησης για οργανισμούς διαφορετικής ωριμότητας."},{"type":"p","text":"Το κανονιστικό πλαίσιο καθιστά ορισμένες πρακτικές υποχρεωτικές. Ο **Γενικός Κανονισμός για την Προστασία Δεδομένων** (ΓΚΠΔ/GDPR) της ΕΕ απαιτεί κατάλληλη ασφάλεια για τα προσωπικά δεδομένα, προστασία δεδομένων ήδη από τον σχεδιασμό και εξ ορισμού, καθώς και γνωστοποίηση των παραβιάσεων προσωπικών δεδομένων στην εποπτική αρχή εντός 72 ωρών. Η **Οδηγία NIS2** επεκτείνει τις υποχρεώσεις κυβερνοασφάλειας σε ευρύ φάσμα βασικών και σημαντικών οντοτήτων —ενέργεια, υγεία, μεταφορές, ψηφιακές υποδομές κ.ά.— απαιτώντας μέτρα διαχείρισης κινδύνου, ασφάλεια της εφοδιαστικής αλυσίδας, αναφορά περιστατικών (έγκαιρη προειδοποίηση εντός 24 ωρών) και προσωπική λογοδοσία των διοικητικών οργάνων. Στις Ηνωμένες Πολιτείες, ο νόμος **HIPAA** επιβάλλει ανάλογες διασφαλίσεις για τις πληροφορίες υγείας."},{"type":"table","caption":"Πίνακας 13.1 — Πλαίσια και κανονιστικά κείμενα με μια ματιά","head":["Κείμενο","Φύση","Κύρια εστίαση","Τυπική χρήση"],"rows":[["NIST CSF 2.0","Προαιρετικό πλαίσιο","Αποτελέσματα σε έξι λειτουργίες","Δομή προγράμματος, αποτύπωση ωριμότητας"],["ISO/IEC 27001","Πιστοποιήσιμο πρότυπο","Σύστημα διαχείρισης (ΣΔΑΠ)","Πιστοποίηση, διαβεβαίωση πελατών"],["CIS Controls v8","Ιεραρχημένο σύνολο μέτρων","Συγκεκριμένα τεχνικά μέτρα","Οδικός χάρτης υλοποίησης"],["ΓΚΠΔ","Κανονισμός ΕΕ (δεσμευτικός)","Προστασία προσωπικών δεδομένων","Νομική συμμόρφωση, γνωστοποίηση παραβιάσεων"],["NIS2","Οδηγία ΕΕ (δεσμευτική)","Ασφάλεια βασικών/σημαντικών οντοτήτων","Διαχείριση κινδύνου, αναφορά περιστατικών"]]}]},{"id":"13.5","title":"Δείκτες ασφάλειας: ουσιαστική πληροφορία έναντι βιτρίνας","blocks":[{"type":"p","text":"Η διοίκηση χρειάζεται τεκμήρια ότι η επένδυση στην ασφάλεια μειώνει τον κίνδυνο. Πολλοί συνήθως αναφερόμενοι αριθμοί είναι **δείκτες βιτρίνας**: τα «εκατομμύρια επιθέσεων που αποκλείστηκαν» μετρούν κυρίως τον αυτοματοποιημένο «θόρυβο» του διαδικτύου, ενώ ο «αριθμός των εργαλείων που έχουν εγκατασταθεί» δεν λέει τίποτα για την αποτελεσματικότητά τους. Οι **ουσιαστικοί δείκτες** συνδέονται με αποφάσεις και αποτελέσματα: το ποσοστό των κρίσιμων περιουσιακών στοιχείων που καλύπτονται από EDR και καταγραφή· ο χρόνος εφαρμογής ενημερώσεων για ευπάθειες σε συστήματα εκτεθειμένα στο διαδίκτυο που είναι γνωστό ότι αποτελούν αντικείμενο εκμετάλλευσης· οι MTTD και MTTR (Κεφάλαιο 11)· το ποσοστό αναφοράς μηνυμάτων ψαρέματος (Κεφάλαιο 5)· το ποσοστό των προνομιούχων λογαριασμών που προστατεύονται με MFA ανθεκτικό στο ψάρεμα· και το ποσοστό επιτυχίας και η διάρκεια των δοκιμών επαναφοράς αντιγράφων ασφαλείας σε σύγκριση με τον RTO."},{"type":"p","text":"Οι καλοί δείκτες έχουν καθορισμένη πηγή δεδομένων, στόχο και τάση στον χρόνο, και ο καθένας πρέπει να υποδεικνύει μια ενέργεια αν κινηθεί προς τη λάθος κατεύθυνση. Η συνεπής αναφορά λίγων τέτοιων δεικτών είναι πολύ πιο χρήσιμη για ένα διοικητικό συμβούλιο από έναν πίνακα με εκατοντάδες ανεξήγητα νούμερα."}]},{"id":"13.6","title":"Κρίσιμες υποδομές και επιχειρησιακή τεχνολογία","blocks":[{"type":"p","text":"Η **επιχειρησιακή τεχνολογία** (Operational Technology, OT) —βιομηχανικά συστήματα ελέγχου (ICS), συστήματα SCADA και προγραμματιζόμενοι λογικοί ελεγκτές που λειτουργούν δίκτυα ηλεκτρικής ενέργειας, εγκαταστάσεις επεξεργασίας νερού, παραγωγικές μονάδες και ιατροτεχνολογικά προϊόντα— έχει προτεραιότητες διαφορετικές από την πληροφορική γραφείου. Η ασφάλεια των ανθρώπων και η διαθεσιμότητα προηγούνται, τα συστήματα μπορεί να λειτουργούν για είκοσι χρόνια ή και περισσότερο, και πολλά βιομηχανικά πρωτόκολλα, όπως το Modbus, σχεδιάστηκαν χωρίς έλεγχο ταυτότητας. Η εφαρμογή ενημερώσεων μπορεί να απαιτεί διακοπή μιας γραμμής παραγωγής, ενώ μια επιθετική δικτυακή σάρωση μπορεί να θέσει εκτός λειτουργίας έναν ευαίσθητο ελεγκτή. Όπως έδειξαν το Stuxnet και μεταγενέστερες επιθέσεις σε ενεργειακά δίκτυα, οι συνέπειες μπορεί να είναι φυσικές."},{"type":"p","text":"Η ασφάλεια OT βασίζεται επομένως σε μεγάλο βαθμό στην αρχιτεκτονική. Το **μοντέλο Purdue** διαιρεί το περιβάλλον σε επίπεδα, από τις φυσικές διεργασίες (επίπεδο 0) και τους ελεγκτές (επίπεδο 1) έως την επιχειρησιακή πληροφορική (επίπεδα 4–5). Το πρότυπο **ISA/IEC 62443** ομαδοποιεί τα στοιχεία σε _ζώνες_ και επιτρέπει την επικοινωνία μόνο μέσω ελεγχόμενων _αγωγών_ (conduits), με μια βιομηχανική αποστρατιωτικοποιημένη ζώνη μεταξύ IT και OT. Η παθητική παρακολούθηση του δικτύου, σχεδιασμένη για βιομηχανικά πρωτόκολλα, παρέχει ορατότητα χωρίς να διαταράσσει τις ευαίσθητες συσκευές, ενώ ο αυστηρός έλεγχος της απομακρυσμένης πρόσβασης των προμηθευτών κλείνει ένα από τα σημεία εισόδου που γίνονται συχνότερα αντικείμενο κατάχρησης."}]},{"id":"13.7","title":"Μηδενική εμπιστοσύνη, ασφάλεια νέφους και αναδυόμενες απειλές","blocks":[{"type":"p","text":"Η **αρχιτεκτονική μηδενικής εμπιστοσύνης** (Zero Trust Architecture, NIST SP 800-207) εγκαταλείπει την ιδέα ότι οτιδήποτε βρίσκεται μέσα στην περίμετρο του δικτύου είναι αξιόπιστο. Κάθε αίτημα πρόσβασης αξιολογείται ρητά, με βάση την ταυτότητα του χρήστη, την κατάσταση της συσκευής και την ευαισθησία του πόρου· η πρόσβαση παραχωρείται με ελάχιστο προνόμιο, για περιορισμένη συνεδρία· και ο σχεδιασμός προϋποθέτει ότι μια παραβίαση έχει ήδη συμβεί. Ένα _σημείο λήψης απόφασης πολιτικής_ αξιολογεί κάθε αίτημα και ένα _σημείο επιβολής πολιτικής_ μπροστά από κάθε πόρο εφαρμόζει την απόφαση. Η μηδενική εμπιστοσύνη είναι πορεία και όχι προϊόν: οι οργανισμοί συνήθως προχωρούν από την ισχυρή ταυτότητα και το MFA, στη συμμόρφωση των συσκευών και στη μικροκατάτμηση και, τέλος, σε συνεχείς αποφάσεις πρόσβασης προσαρμοσμένες στον κίνδυνο."},{"type":"p","text":"Στο **νέφος**, η ασφάλεια ακολουθεί ένα **μοντέλο κοινής ευθύνης**: ο πάροχος προστατεύει την υποκείμενη υποδομή, ενώ ο πελάτης παραμένει υπεύθυνος για τις ταυτότητες, τη διαμόρφωση και τα δεδομένα. Οι περισσότερες παραβιάσεις στο νέφος οφείλονται σε λανθασμένες ρυθμίσεις από την πλευρά του πελάτη —δημόσια αναγνώσιμους χώρους αποθήκευσης, υπερβολικά δικαιώματα, εκτεθειμένα κλειδιά— τις οποίες έχουν σχεδιαστεί να εντοπίζουν τα εργαλεία _διαχείρισης της στάσης ασφάλειας στο νέφος_ (CSPM). Τα κοντέινερ προσθέτουν τις δικές τους απαιτήσεις: ελάχιστα και ελεγμένα είδωλα, εκτέλεση χωρίς δικαιώματα root και πολιτικές δικτύου Kubernetes με άρνηση εξ ορισμού. Κοιτάζοντας μπροστά, οι αμυνόμενοι πρέπει να προετοιμαστούν για τη μετάβαση στη **μετακβαντική κρυπτογραφία**, για το ηλεκτρονικό ψάρεμα με υποβοήθηση τεχνητής νοημοσύνης και τις απάτες με deepfakes, καθώς και για τη συνέχιση των επιθέσεων στην εφοδιαστική αλυσίδα λογισμικού. Οι αρχές αυτού του βιβλίου —ελάχιστο προνόμιο, άμυνα σε βάθος, επαλήθευση και ανθεκτικότητα— παραμένουν ο πιο αξιόπιστος οδηγός μέσα σε αυτές τις αλλαγές."}]}],"terms":[{"name":"3-2-1-1-0","def":"Κανόνας αντιγράφων: 3 αντίγραφα, 2 μέσα, 1 εκτός εγκατάστασης, 1 εκτός σύνδεσης/αμετάβλητο, 0 ανεπιβεβαίωτα σφάλματα επαναφοράς."},{"name":"RPO / RTO","def":"Μέγιστη αποδεκτή απώλεια δεδομένων (RPO) και μέγιστος αποδεκτός χρόνος διακοπής (RTO)."},{"name":"Μητρώο κινδύνων","def":"Δομημένη καταγραφή κινδύνων, υπευθύνων, μέτρων, εκτιμήσεων και αποφάσεων αντιμετώπισης."},{"name":"ΣΔΑΠ (ISMS)","def":"Σύστημα διαχείρισης ασφάλειας πληροφοριών, όπως ορίζεται στο ISO/IEC 27001."},{"name":"Μοντέλο Purdue","def":"Πολυεπίπεδη αρχιτεκτονική αναφοράς που διαχωρίζει τα επίπεδα βιομηχανικού ελέγχου από την επιχειρησιακή πληροφορική."},{"name":"Κοινή ευθύνη","def":"Κατανομή των καθηκόντων ασφάλειας μεταξύ ενός παρόχου νέφους και του πελάτη του."}],"summary":["Η ανθεκτικότητα προϋποθέτει την αστοχία: τα αμετάβλητα, δοκιμασμένα αντίγραφα ασφαλείας με ξεχωριστά διαπιστευτήρια αποτελούν τον πυρήνα της ανάκαμψης από λυτρισμικό.","Η επιχειρησιακή συνέχεια και η ανάκαμψη από καταστροφές καθοδηγούνται από τις επιχειρησιακές επιπτώσεις, εκφράζονται μέσω RPO και RTO και είναι αξιόπιστες μόνο όταν δοκιμάζονται.","Η διαχείριση κινδύνου καταγράφει, αξιολογεί και αντιμετωπίζει ρητά κάθε κίνδυνο, με την αποδοχή να αποφασίζεται από υπόλογους υπευθύνους.","Τα NIST CSF 2.0, ISO/IEC 27001 και CIS Controls δομούν τα προγράμματα ασφάλειας· ο ΓΚΠΔ και η NIS2 καθιστούν υποχρεωτικές βασικές πρακτικές.","Η ασφάλεια OT, η μηδενική εμπιστοσύνη και η κοινή ευθύνη στο νέφος επεκτείνουν τις βασικές αρχές του βιβλίου σε νέα περιβάλλοντα."],"review":["Γιατί ο κανόνας 3-2-1 από μόνος του δεν εγγυάται την ανάκαμψη από λυτρισμικό; Τι προσθέτουν το επιπλέον «1» και το «0»;","Ένα ηλεκτρονικό κατάστημα μπορεί να ανεχθεί απώλεια παραγγελιών 15 λεπτών και διακοπή λειτουργίας 2 ωρών. Μετατρέψτε αυτά σε RPO/RTO και προτείνετε τεχνικό σχεδιασμό.","Ποιος πρέπει να επιτρέπεται να αποδεχθεί έναν υψηλό υπολειπόμενο κίνδυνο και γιατί η αποδοχή πρέπει να τεκμηριώνεται;","Εξηγήστε γιατί η ενεργητική σάρωση ευπαθειών, συνήθης στην πληροφορική, μπορεί να είναι ακατάλληλη σε περιβάλλον OT."],"cli":{"title":"Προσομοιωτής Κυβερνοδιακυβέρνησης, Μοντελοποίησης Κινδύνου & Μετα-Κβαντικής Ετοιμότητας","desc":"Εκτελέστε έλεγχο συμμόρφωσης έναντι των προτύπων CIS Controls v8, υπολογίστε υπολειπόμενο κίνδυνο, δοκιμάστε ανάκαμψη καταστροφών (DR) και μετρήστε αλγορίθμους Post-Quantum ML-KEM.","meta":["⏱️ ~30 min","🐚 ciso@governance-ops:~$"],"tasks":[{"pill":"Task 1","name":"Εκτέλεση Αυτοματοποιημένου Ελέγχου CIS Controls Benchmark","instr":"Εκτελέστε αυτοματοποιημένο έλεγχο συμμόρφωσης κατά το CIS Controls Level 1 με το `cis-audit`.","hint":"Εκτελέστε: cis-audit --benchmark cis-ubuntu-v8","cmd":"$ cis-audit --benchmark cis-ubuntu-v8","ok":"Ο έλεγχος CIS ολοκληρώθηκε: Ποσοστό συμμόρφωσης 87.5% (134/153 έλεγχοι επιτυχείς)."},{"pill":"Task 2","name":"Υπολογισμός Υπολειπόμενου Κινδύνου μέσω Πίνακα Πιθανότητας / Επίπτωσης","instr":"Υπολογίστε τον υπολειπόμενο κίνδυνο ransomware με ενεργά μέτρα MFA και backups με το `risk-calc`.","hint":"Εκτελέστε: risk-calc --threat ransomware --asset customer-db --controls mfa,backups","cmd":"$ risk-calc --threat ransomware --asset customer-db --controls mfa,backups","ok":"Ο υπολειπόμενος κίνδυνος υπολογίστηκε: Εγγενής (80.0) -> Υπολειπόμενος (18.4) [Χαμηλή Ζώνη]."},{"pill":"Task 3","name":"Προσομοίωση Δοκιμής Ανάκαμψης Καταστροφών (DR Failover)","instr":"Δοκιμάστε την αυτοματοποιημένη μετάπτωση ανάκαμψης καταστροφών στη δευτερεύουσα περιοχή με το `dr-test`.","hint":"Εκτελέστε: dr-test --failover secondary-region","cmd":"$ dr-test --failover secondary-region","ok":"Η δοκιμή DR ολοκληρώθηκε ΕΠΙΤΥΧΩΣ: RPO = 45 δευτερόλεπτα, RTO = 4 λεπτά 12 δευτερόλεπτα."},{"pill":"Task 4","name":"Μέτρηση Επιδόσεων Μετα-Κβαντικής Κρυπτογραφίας (ML-KEM-768)","instr":"Μετρήστε την καθυστέρηση παραγωγής και ενθυλάκωσης κλειδιών για τον αλγόριθμο ML-KEM-768 με το `pqc-benchmark`.","hint":"Εκτελέστε: pqc-benchmark --algorithm ML-KEM-768","cmd":"$ pqc-benchmark --algorithm ML-KEM-768","ok":"Η μέτρηση PQC ολοκληρώθηκε: KeyGen = 0.045ms, Encap = 0.062ms, Decap = 0.051ms (Πρότυπο NIST Level 3)."}]},"lab":{"title":"Επιχειρησιακή Διακυβέρνηση Κυβερνοασφάλειας, Αξιολόγηση Κινδύνου (NIST CSF 2.0 / ISO 27001) & Προσομοίωση DR","desc":"Σε αυτό το εργαστήριο διακυβέρνησης 2 ωρών, οι φοιτητές αναλαμβάνουν τον ρόλο του CISO και Διαχειριστή Εταιρικού Κινδύνου. Θα αντιστοιχίσετε περιουσιακά στοιχεία στο NIST Cybersecurity Framework (NIST CSF 2.0) και στους ελέγχους ISO/IEC 27001:2022 Annex A, θα εκτελέσετε ποσοτική ανάλυση κινδύνου κατά το μοντέλο FAIR, θα συντάξετε μια Ανάλυση Επιχειρησιακών Επιπτώσεων (BIA) με παραμέτρους RPO/RTO, θα πραγματοποιήσετε προσομοίωση αποκατάστασης καταστροφών (Tabletop DR) και θα διαμορφώσετε έναν οδικό χάρτη μετάβασης σε Μετα-Κβαντική Κρυπτογραφία (PQC).","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Governance Workstation with Python 3.11, OpenFAIR risk calculation tools, CIS-CAT toolset","NIST CSF 2.0 Core Reference Mapping spreadsheets","ISO/IEC 27001:2022 Statement of Applicability (SoA) templates","Post-Quantum Cryptography OpenSSL / liboqs benchmarking binaries"],"phases":[{"badge":"Phase 1","name":"Ευθυγράμμιση Διακυβέρνησης: NIST CSF 2.0 & ISO/IEC 27001:2022","dur":"⏱️ 25 λεπτά","objs":["Δόμηση διακυβέρνησης στις 6 λειτουργίες του NIST CSF 2.0 (Govern, Identify, Protect, Detect, Respond, Recover).","Σύνταξη Δήλωσης Εφαρμοσιμότητας (SoA) για 20 κρίσιμους ελέγχους ISO/IEC 27001:2022.","Εντοπισμός κανονιστικών απαιτήσεων (Οδηγία NIS2, Κανονισμός DORA, GDPR)."],"steps":[{"type":"p","text":"1. Εξέταση του αρχείου `/workspace/governance/nist_csf_core.json`.\\n2. Συμπλήρωση της Δήλωσης Εφαρμοσιμότητας (SoA) με αιτιολόγηση ελέγχων.\\n3. Χαρτογράφηση των προθεσμιών αναφοράς περιστατικών της NIS2 (έγκαιρη προειδοποίηση 24 ωρών, επίσημη αναφορά 72 ωρών)."}]},{"badge":"Phase 2","name":"Ποσοτική Αξιολόγηση Κινδύνου (Μοντέλο FAIR)","dur":"⏱️ 45 λεπτά","objs":["Αποδόμηση σεναρίων κινδύνου βάσει του μοντέλου FAIR (Συχνότητα Συμβάντων × Ευπάθεια × Απώλεια).","Εκτέλεση προσομοιώσεων Monte Carlo σε Python για υπολογισμό της Ετήσιας Αναμενόμενης Απώλειας (ALE).","Σύνταξη ανάλυσης κόστους-οφέλους (Cost-Benefit Analysis) για επενδύσεις ασφάλειας."],"steps":[{"type":"p","text":"1. Εκτέλεση προσομοίωσης Monte Carlo κατά το μοντέλο FAIR:\\n```bash\\npython3 /workspace/scripts/run_fair_model.py --iterations 10000 --input risk_scenarios.json\\n```\\n2. Εξέταση καμπυλών κατανομής Value at Risk (VaR).\\n3. Ποσοτικοποίηση της μείωσης κινδύνου από την εφαρμογή υλικού MFA σε διαχειριστές."}]},{"badge":"Phase 3","name":"Ανάλυση Επιχειρησιακών Επιπτώσεων (BIA) & Άσκηση Προσομοίωσης DR","dur":"⏱️ 30 λεπτά","objs":["Καθορισμός MTD, RTO και RPO για κρίσιμες εφαρμογές.","Διεξαγωγή δομημένης άσκησης επί χάρτου (Tabletop DR) για καταστροφική αστοχία datacenter.","Επαλήθευση επαναφοράς από αναλλοίωτα αντίγραφα ασφαλείας (κανόνας 3-2-1-1-0)."],"steps":[{"type":"p","text":"1. Έλεγχος παραμέτρων BIA στον πίνακα `/workspace/governance/bia_matrix.xlsx`.\\n2. Προσομοίωση απώλειας datacenter και ενεργοποίηση σεναρίων failover.\\n3. Επαλήθευση ακεραιότητας εφαρμογών μετά τη μετάπτωση εντός RTO < 15 λεπτών."}]},{"badge":"Phase 4","name":"Στρατηγικός Οδικός Χάρτης Μετάβασης σε Μετα-Κβαντική Κρυπτογραφία","dur":"⏱️ 20 λεπτά","objs":["Καταγραφή ευάλωτων κλασικών κρυπτογραφικών στοιχείων (RSA, ECC) στην επιχείρηση.","Μέτρηση απόδοσης αλγορίθμων PQC του NIST (ML-KEM/Kyber, ML-DSA/Dilithium).","Σύνταξη οδικού χάρτη Κρυπτογραφικής Ευελιξίας (Crypto-Agility) για την περίοδο 2026–2030."],"steps":[{"type":"p","text":"1. Εκτέλεση σάρωσης κρυπτογραφικών περιουσιακών στοιχείων για εντοπισμό πιστοποιητικών RSA:\\n```bash\\npython3 /workspace/scripts/pqc_inventory.py --scan-dir /etc/ssl/\\n```\\n2. Δοκιμή υβριδικής ανταλλαγής κλειδιών TLS 1.3 συνδυάζοντας X25519 με ML-KEM-768.\\n3. Σύνταξη της τελικής επιτελικής έκθεσης διακυβέρνησης και ανθεκτικότητας."}]}],"checklist":["Η χαρτογράφηση NIST CSF 2.0 περιλαμβάνει τις κατηγορίες της νέας λειτουργίας \'Govern\' (GV).","Οι υπολογισμοί FAIR παρέχουν σαφή εκτίμηση οικονομικής απώλειας σε διάστημα 95%.","Οι παράμετροι BIA (MTD, RTO, RPO) καθορίζονται και επαληθεύονται στην άσκηση.","Ο οδικός χάρτης PQC περιλαμβάνει σχέδιο υβριδικής μετάβασης στους αλγορίθμους του NIST."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Εταιρική Στρατηγική Κυβερνοανθεκτικότητας & Σχέδιο Μετάβασης σε Μετα-Κβαντική Κρυπτογραφία","desc":"Ένας διεθνής όμιλος ενέργειας και τηλεπικοινωνιών λειτουργεί σε 12 ευρωπαϊκές χώρες υπό τις αυστηρές απαιτήσεις της Οδηγίας NIS2, του Κανονισμού DORA και του προτύπου ISO/IEC 27001:2022. Σας ανατίθεται ως Επικεφαλής Στρατηγικός Σύμβουλος Διακυβέρνησης να συντάξετε μια εταιρική στρατηγική κυβερνοανθεκτικότητας, να αναπτύξετε ποσοτική μοντελοποίηση κινδύνου (FAIR), να δομήσετε πλαίσιο επιχειρησιακής συνέχειας και να παραδώσετε ένα 5ετές σχέδιο μετάβασης σε Μετα-Κβαντική Κρυπτογραφία.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Κανονιστική Συμμόρφωση & Ενοποιημένο Πλαίσιο Διακυβέρνησης","desc":"Σύνθεση των απαιτήσεων NIS2, DORA και ISO 27001 σε ενιαίο κατάλογο μέτρων με αυτοματοποιημένες αναφορές.","spec":["Διενέργεια Business Impact Analysis (BIA) με εκτίμηση οικονομικής απώλειας ανά ώρα διακοπής.","Καθορισμός στόχων MTD, RTO (< 15 min) και RPO (< 5 min) για κρίσιμες υπηρεσίες.","Εντοπισμός εξαρτήσεων εφαρμογών και μοναδικών σημείων αποτυχίας (SPOF)."],"deliv":"📦 Παραδοτέο Οροσήμου: Πίνακας Ενοποιημένης Συμμόρφωσης + Καταστατικό Διακυβέρνησης."},{"num":"M2","title":"Ποσοτική Αξιολόγηση Κινδύνου FAIR & Μηχανή Monte Carlo","desc":"Ανάπτυξη του fair_engine.py για μοντελοποίηση συχνότητας απειλών, πιθανοτήτων ευπάθειας και οικονομικών απωλειών σε 10 σενάρια.","spec":["Εφαρμογή μοντέλου FAIR για ποσοτικό υπολογισμό Ετήσιας Εκτιμώμενης Απώλειας (ALE).","Μοντελοποίηση συχνότητας απειλών και μεγέθους απωλειών με κατανομές Modified PERT.","Υπολογισμός απόδοσης επένδυσης ασφάλειας (ROSI) για στρατηγικά μέτρα προστασίας."],"deliv":"📦 Παραδοτέο Οροσήμου: Μηχανή μοντελοποίησης FAIR σε Python + Φάκελος Αξιολόγησης Κινδύνου."},{"num":"M3","title":"Επιχειρησιακή Συνέχεια & Αυτοματοποιημένος Οδηγός Ανάκαμψης DR","desc":"Καθορισμός παραμέτρων BIA για κρίσιμες υπηρεσίες, σύνταξη οδηγών ανάκαμψης και αυτοματοποίηση cloud failover.","spec":["Αρχιτεκτονική multi-region active-active cloud disaster recovery με αυτόματο replication.","Υλοποίηση μεταγωγής DNS και health checks σε < 60 δευτερόλεπτα σε αστοχία κύριας περιοχής.","Δημιουργία απομονωμένου air-gapped αντιγράφου ασφαλείας με WORM retention έναντι ransomware."],"deliv":"📦 Παραδοτέο Οροσήμου: Εγχειρίδιο BCP/DR + σενάριο αυτοματοποιημένου failover."},{"num":"M4","title":"Καταστατικό Μετάβασης σε Μετα-Κβαντική Κρυπτογραφία 2026–2030","desc":"Παράδοση στρατηγικής μετάβασης με κρυπτογραφική ευελιξία, χρονοδιαγράμματα υβριδικού TLS και ενημέρωση Διοικητικού Συμβουλίου.","spec":["Σχεδιασμός εγχειριδίου ασκήσεων επί χάρτου (tabletop) για τη διοίκηση με ρεαλιστικά σενάρια κρίσεων.","Καθορισμός δέντρων αποφάσεων διαχείρισης κρίσεων και πρωτοκόλλων επικοινωνίας.","Σύνταξη Πλάνου Επιχειρησιακής Συνέχειας & Ανθεκτικότητας κατά ISO 22301 και κανονισμό DORA."],"deliv":"📦 Παραδοτέο Οροσήμου: Καταστατικό Μετάβασης PQC & Παρουσίαση Διοικητικού Συμβουλίου (12–15 σελίδες)."}],"deliverables":["Πίνακας Ενοποιημένης Διακυβέρνησης & Κανονιστικών Ελέγχων (`governance_matrix.xlsx`)","Πηγαίος Κώδικας Μηχανής Ποσοτικού Κινδύνου FAIR (`/fair_engine/`)","Εγχειρίδιο Επιχειρησιακής Συνέχειας & Ανάκαμψης Καταστροφών (`bcp_dr_manual.pdf`)","Επιτελικό Καταστατικό Μετάβασης σε Μετα-Κβαντική Κρυπτογραφία (12–15 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Μηχανής Ποσοτικής Εκτίμησης Κινδύνου FAIR & Προσομοιωτή DR σε Python","desc":"Τα στελέχη επιχειρήσεων και οι CISOs απαιτούν ποσοτική οικονομική εκτίμηση κυβερνοκινδύνου (πλαίσιο FAIR) αντί για υποκειμενικούς πίνακες \'High/Medium/Low\', ώστε να τεκμηριώνουν επενδύσεις ασφάλειας και να σχεδιάζουν ανθεκτικές υποδομές Disaster Recovery (DR). Θα κατασκευάσετε μια μηχανή ποσοτικής μοντελοποίησης κινδύνου και προσομοίωσης DR failover σε Python ( cyber_resilience_engine.py ). Το εργαλείο θα εκτελεί 100.000 προσομοιώσεις Monte Carlo για υπολογισμό της Συχνότητας Απωλειών (LEF) και της Ετήσιας Εκτιμώμενης Απώλειας (ALE), ενώ παράλληλα θα προσομοιώνει αυτοματοποιημένο cross-region failover στο cloud ελέγχοντας τους στόχους RTO (< 15 min) και RPO (< 5 min).","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Μηχανή Μαθηματικών Κατανομών FAIR & Δειγματοληψίας","desc":"Υλοποίηση δειγματοληψίας κατανομών Modified PERT και Log-Normal για μοντελοποίηση των παραμέτρων TEF, Vulnerability και Loss Magnitude.","spec":["Υλοποίηση της συνάρτησης `pert_sample(min, mode, max)` με κατανομή beta.","Μοντελοποίηση της Συχνότητας Απωλειών (LEF) ως συνδυασμού απειλών και ευπάθειας.","Μοντελοποίηση Πρωτογενών και Δευτερογενών Απωλειών (κόστος απόκρισης, πρόστιμα, διακοπή εργασιών)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα fair_math.py + δοκιμές επαλήθευσης κατανομών."},{"num":"M2","title":"Μηχανή Monte Carlo & Ανάλυση Value at Risk (VaR)","desc":"Εκτέλεση 100.000 προσομοιώσεων Monte Carlo με NumPy για υπολογισμό οικονομικών απωλειών και απόδοσης επένδυσης (ROI) μέτρων ασφαλείας.","spec":["Vectorized εκτέλεση με NumPy arrays για ολοκλήρωση 100k επαναλήψεων σε < 1 δευτερόλεπτο.","Υπολογισμός 95ου και 99ου εκατοστημορίου Value at Risk (VaR) και Μέσης Ετήσιας Απώλειας (ALE).","Προσομοίωση εφαρμογής μέτρων ασφαλείας και υπολογισμός ROI μείωσης κινδύνου."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα monte_carlo_engine.py με εξαγωγή οικονομικών κατανομών."},{"num":"M3","title":"Προσομοιωτής Αυτοματοποιημένου Cloud DR Failover","desc":"Κατασκευή μηχανής καταστάσεων που προσομοιώνει αυτοματοποιημένο cross-region failover σε περίπτωση διακοπής της κύριας περιοχής.","spec":["Προσομοίωση αποτυχίας health checks στην κύρια περιοχή (`us-east-1`).","Προαγωγή της βάσης δεδομένων Read Replica στη δευτερεύουσα περιοχή (`eu-west-1`) σε Primary.","Αλλαγή εγγραφών DNS routing για αναδρομολόγηση της κίνησης στη δευτερεύουσα περιοχή."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα dr_orchestrator.py με εκτέλεση αυτόματου failover."},{"num":"M4","title":"Αξιολογητής Μετρικών RTO/RPO & Executive Dashboard","desc":"Υπολογισμός πραγματικών χρόνων RTO και RPO από τα logs της προσομοίωσης και παρουσίαση σε διαδραστικό dashboard.","spec":["Επαλήθευση στόχων `RTO <= 15 min` και `RPO <= 5 min` (καθυστέρηση replication).","Παραγωγή διαγραμμάτων Loss Exceedance Curve και αναφοράς PDF για τη διοίκηση.","Παροχή διαδραστικού dashboard με FastAPI για δυναμική προσαρμογή παραμέτρων."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένη πλατφόρμα cyber_resilience_engine.py + executive dashboard."}],"deliverables":["Πηγαίος κώδικας Ποσοτικής Μοντελοποίησης FAIR (`/cyber_resilience/`)","Μηχανή 100.000 προσομοιώσεων Monte Carlo με NumPy","Αυτοματοποιημένος Orchestrator Cloud Disaster Recovery","Έκθεση Εταιρικής Διακυβέρνησης Κινδύνου & Ανθεκτικότητας (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 13","quiz":[{"q":"Στην ποσοτική εκτίμηση κυβερνοκινδύνου με το πλαίσιο FAIR, ποια είναι τα δύο βασικά συστατικά του Κινδύνου (Risk);","opts":[{"k":"A","v":"Συχνότητα Επεξεργαστή (GHz) και Χωρητικότητα Μνήμης RAM (GB) μετρούμενες κατά τη διάρκεια δοκιμών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Πλήθος Ανοικτών Θυρών Firewall και Συνολικό Μήκος Καλωδίων Δικτύου σε μέτρα στα κέντρα δεδομένων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Αριθμός Εργαζομένων και Συνολικό Εμβαδόν Γραφείων σε τετραγωνικά μέτρα στις εγκαταστάσεις, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Συχνότητα Συμβάντων Απώλειας (LEF) και Μέγεθος Απώλειας (LM), αξιολογούμενα μέσω πιθανοτικών μοντέλων."},{"k":"E","v":"Έκδοση Πυρήνα Λειτουργικού Συστήματος και Επίπεδο Ενημερώσεων του Hypervisor στους διακομιστές, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"D","exp":"Το FAIR ορίζει τον Κίνδυνο = Συχνότητα Συμβάντων Απώλειας (LEF) × Μέγεθος Απώλειας (LM), χρησιμοποιώντας προσομοιώσεις Monte Carlo για την έκφραση του κινδύνου σε χρηματικές κατανομές."},{"q":"Ποια είναι η βασική διαφορά μεταξύ Recovery Time Objective (RTO) και Recovery Point Objective (RPO) στον σχεδιασμό αποκατάστασης καταστροφών;","opts":[{"k":"A","v":"Το RTO αφορά μόνο συστήματα ψύξης, ενώ το RPO αφορά μόνο βιομετρικές πόρτες εισόδου εγκαταστάσεων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Το RTO υπολογίζεται σε χρηματικές μονάδες, ενώ το RPO υπολογίζεται σε πλήθος πακέτων δικτύου, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Το RTO επιβάλλεται μόνο σε δημόσιους φορείς, ενώ το RPO επιβάλλεται μόνο σε ιδιωτικά πανεπιστήμια, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Το RTO μετρά τη συχνότητα του επεξεργαστή, ενώ το RPO μετρά τη χωρητικότητα οπτικών δίσκων, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Το RTO ορίζει τον μέγιστο αποδεκτό χρόνο διακοπής, ενώ το RPO ορίζει τη μέγιστη αποδεκτή απώλεια δεδομένων σε χρόνο."}],"ans":"E","exp":"Το RTO είναι ο μέγιστος χρόνος επαναφοράς των συστημάτων μετά από καταστροφή (χρόνος εκτός λειτουργίας). Το RPO είναι η μέγιστη αποδεκτή απώλεια δεδομένων από το τελευταίο backup (σε χρόνο)."},{"q":"Σύμφωνα με την Ευρωπαϊκή Οδηγία NIS2, ποιες βασικές κανονιστικές υποχρεώσεις επιβάλλονται σε βασικές και σημαντικές οντότητες;","opts":[{"k":"A","v":"Διαχείριση κυβερνοκινδύνων, ασφάλεια εφοδιαστικής αλυσίδας, κοινοποίηση συμβάντων εντός 24 ωρών και ευθύνη διοίκησης."},{"k":"B","v":"Υποχρεωτική αντικατάσταση όλης της δικτυακής υποδομής με ιδιόκτητες κβαντικές οπτικές συνδέσεις, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Μόνιμη διακοπή της σύνδεσης στο διαδίκτυο για νοσοκομεία και τραπεζικά ιδρύματα στην Ευρωπαϊκή Ένωση, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Πλήρης απαλλαγή από ελέγχους ασφάλειας εφόσον οι οργανισμοί διαθέτουν βιομετρικές κλειδαριές, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Δημοσίευση μη κρυπτογραφημένων κωδικών πρόσβασης πελατών σε δημόσιες πύλες των ρυθμιστικών αρχών, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"A","exp":"Η οδηγία NIS2 επεκτείνει τις απαιτήσεις κυβερνοασφάλειας σε κρίσιμους τομείς, επιβάλλοντας τεχνικά μέτρα, ασφάλεια εφοδιαστικής αλυσίδας, έγκαιρη κοινοποίηση περιστατικών (εντός
