φαρμόζετε τις αρχές του ελάχιστου προνομίου, της άμυνας σε βάθος, των ασφαλών προεπιλογών και της ασφάλειας εκ σχεδιασμού κατά την αξιολόγηση μιας αρχιτεκτονικής.","Να διακρίνετε την απειλή, την ευπάθεια και τον κίνδυνο και να περιγράφετε πώς τα μέτρα ελέγχου μειώνουν την πιθανότητα ή τις συνέπειες.","Να εξηγείτε τον σκοπό των τυπικών μοντέλων ασφάλειας και των ανεξάρτητων σχημάτων αξιολόγησης, όπως τα Common Criteria."],"intro":["Κάθε επόμενο κεφάλαιο του βιβλίου —είτε αφορά λειτουργικά συστήματα, κρυπτογραφία, διαχείριση ταυτότητας είτε απόκριση σε περιστατικά— στηρίζεται σε ένα μικρό σύνολο κοινών εννοιών. Το παρόν κεφάλαιο εισάγει αυτό το λεξιλόγιο. Εξηγεί τι εννοούμε όταν μιλάμε για _ασφάλεια_, ποιες ιδιότητες της πληροφορίας επιδιώκουμε να προστατεύσουμε και ποιες αρχές σχεδίασης εφαρμόζουν οι έμπειροι μηχανικοί πριν επιλέξουν οποιοδήποτε συγκεκριμένο προϊόν ή τεχνολογία.","Η παρουσίαση κινείται από τους ορισμούς στις αρχές και, στη συνέχεια, στα τυπικά μοντέλα. Αρχικά διακρίνουμε την κυβερνοασφάλεια από τις ευρύτερες έννοιες της διασφάλισης πληροφοριών και της κυβερνοανθεκτικότητας. Ακολούθως εξετάζουμε την τριάδα CIA και τις ιδιότητες που τη συμπληρώνουν, τις κλασικές αρχές σχεδίασης των Saltzer και Schroeder, καθώς και τα ιστορικά γεγονότα που διαμόρφωσαν τη σύγχρονη αμυντική σκέψη. Το κεφάλαιο ολοκληρώνεται με τα τυπικά μοντέλα (Bell–LaPadula, Biba, Clark–Wilson) και τα σχήματα αξιολόγησης που επιτρέπουν να διατυπώνονται οι ισχυρισμοί ασφάλειας με ακρίβεια και να επαληθεύονται ανεξάρτητα."],"sections":[{"id":"1.1","title":"Ορισμοί: κυβερνοασφάλεια, διασφάλιση πληροφοριών και κυβερνοανθεκτικότητα","blocks":[{"type":"p","text":"Η **κυβερνοασφάλεια** είναι ο επιστημονικός και επαγγελματικός κλάδος που προστατεύει δικτυωμένα συστήματα, δεδομένα και υπηρεσίες από μη εξουσιοδοτημένη πρόσβαση, τροποποίηση, διακοπή και καταστροφή, διασφαλίζοντας ταυτόχρονα τη νόμιμη λειτουργία τους ακόμη και υπό εχθρικές συνθήκες. Η φράση _υπό εχθρικές συνθήκες_ έχει ιδιαίτερη σημασία: σε αντίθεση με τη μηχανική αξιοπιστίας, η οποία αντιμετωπίζει τυχαία σφάλματα, η ασφάλεια προϋποθέτει έναν ευφυή αντίπαλο που αναζητά συστηματικά το πιο αδύναμο σημείο."},{"type":"p","text":"Η **διασφάλιση πληροφοριών** (Information Assurance, IA) έχει ευρύτερο πεδίο. Συνδυάζει τεχνικά, διαδικαστικά και διοικητικά μέτρα, ώστε να διατηρείται _τεκμηριωμένη εμπιστοσύνη_ στην πληροφορία σε όλο τον κύκλο ζωής της —από τη δημιουργία και την αποθήκευση έως τη μετάδοση, τη χρήση και την τελική καταστροφή της. Επομένως, η διασφάλιση πληροφοριών δεν αφορά μόνο την αντίσταση σε επιθέσεις, αλλά και τη γνησιότητα, την προέλευση και τη διαρκή χρησιμότητα της πληροφορίας."},{"type":"p","text":"Η **κυβερνοανθεκτικότητα** διευρύνει και τις δύο έννοιες. Περιγράφει την ικανότητα ενός οργανισμού να προβλέπει, να αντέχει, να ανακάμπτει και να προσαρμόζεται σε δυσμενή κυβερνογεγονότα, συμπεριλαμβανομένων εκείνων που επιτυγχάνουν παρά τα προληπτικά μέτρα. Με απλά λόγια, η κυβερνοασφάλεια ρωτά _πώς αποτρέπουμε και εντοπίζουμε μια παραβίαση;_, η διασφάλιση πληροφοριών _μπορούμε να εμπιστευτούμε την πληροφορία μας;_ και η ανθεκτικότητα _μπορούμε να συνεχίσουμε να λειτουργούμε και πόσο γρήγορα θα ανακάμψουμε;_"},{"type":"table","caption":"Πίνακας 1.1 — Τρεις συγγενείς αλλά διακριτές έννοιες","head":["Έννοια","Βασικό ερώτημα","Τυπικά μέτρα","Συνέπεια αν παραμεληθεί"],"rows":[["Κυβερνοασφάλεια","Μπορεί ένας αντίπαλος να παραβιάσει ή να διαταράξει το σύστημα;","Τείχη προστασίας, IDS/IPS, ενημερώσεις, MFA, κρυπτογράφηση","Εισβολή, διαρροή δεδομένων, διακοπή υπηρεσίας"],["Διασφάλιση πληροφοριών","Μπορούμε να εμπιστευτούμε την πληροφορία;","Κατακερματισμός, ψηφιακές υπογραφές, προέλευση, διαβάθμιση","Αθόρυβη αλλοίωση, αποποίηση ευθύνης, παραπληροφόρηση"],["Κυβερνοανθεκτικότητα","Μπορούμε να λειτουργούμε παρά την αστοχία;","Αντίγραφα ασφαλείας, εφεδρεία, σχέδια απόκρισης, BCP/DR","Παρατεταμένη διακοπή, μη ανακτήσιμη απώλεια"]]}]},{"id":"1.2","title":"Η τριάδα CIA και οι επεκτάσεις της","blocks":[{"type":"p","text":"Η **τριάδα CIA** —Εμπιστευτικότητα (Confidentiality), Ακεραιότητα (Integrity) και Διαθεσιμότητα (Availability)— αποτελεί τον καθιερωμένο τρόπο ανάλυσης μιας απαίτησης ασφάλειας στους βασικούς της στόχους. Η **εμπιστευτικότητα** περιορίζει την αποκάλυψη της πληροφορίας μόνο σε εξουσιοδοτημένα μέρη· επιβάλλεται συνήθως μέσω ελέγχου πρόσβασης και κρυπτογράφησης. Η **ακεραιότητα** προστατεύει την πληροφορία από μη εξουσιοδοτημένη ή μη ανιχνεύσιμη τροποποίηση, ώστε τα δεδομένα να παραμένουν ακριβή και πλήρη· σε αυτόν τον στόχο συμβάλλουν οι συναρτήσεις κατακερματισμού, οι ψηφιακές υπογραφές, ο έλεγχος εκδόσεων και οι επικυρωμένες συναλλαγές. Η **διαθεσιμότητα** εξασφαλίζει έγκαιρη και αξιόπιστη πρόσβαση στους εξουσιοδοτημένους χρήστες και υποστηρίζεται από πλεονασμό, σχεδιασμό χωρητικότητας, περιορισμό ρυθμού αιτημάτων και διαδικασίες ανάκαμψης."},{"type":"p","text":"Ορισμένες πρόσθετες ιδιότητες εξειδικεύουν την τριάδα χωρίς να την αντικαθιστούν. Η **αυθεντικότητα** βεβαιώνει ότι ένα δεδομένο ή ένα μέρος είναι πράγματι αυτό που ισχυρίζεται ότι είναι. Η **λογοδοσία** συνδέει κάθε ενέργεια με ένα αναγνωρίσιμο υποκείμενο μέσω αξιόπιστων αρχείων καταγραφής. Η **μη αποποίηση** παρέχει αποδεικτικά στοιχεία που καθιστούν δύσκολη τη μεταγενέστερη άρνηση μιας ενέργειας· η ισχύς της, ωστόσο, εξαρτάται τελικά από τη φύλαξη των κλειδιών, την ταυτοποίηση των προσώπων και το νομικό πλαίσιο."},{"type":"p","text":"Οι τρεις στόχοι αλληλεπιδρούν και συχνά ανταγωνίζονται μεταξύ τους. Η κρυπτογράφηση ενισχύει την εμπιστευτικότητα, όμως αν χαθούν τα κλειδιά τα δεδομένα καθίστανται μη διαθέσιμα. Ο πλεονασμός βελτιώνει τη διαθεσιμότητα, αλλά κάθε επιπλέον αντίγραφο είναι ένα ακόμη σύστημα που πρέπει να προστατεύεται και να διατηρείται συνεπές. Μια τεκμηριωμένη αρχιτεκτονική δηλώνει, επομένως, ποιους στόχους υπηρετεί κάθε μέτρο, εντοπίζει τυχόν νέα έκθεση που αυτό εισάγει και εξηγεί πώς θα αντιμετωπιστεί ο κίνδυνος που απομένει (υπολειπόμενος κίνδυνος)."},{"type":"callout","kind":"example","title":"💡 Παράδειγμα εφαρμογής","text":"Ένα νοσοκομείο κρυπτογραφεί τη βάση δεδομένων ασθενών (εμπιστευτικότητα) και τη συγχρονίζει με δεύτερη εγκατάσταση (διαθεσιμότητα). Αν το μοναδικό αντίγραφο του κλειδιού αποκρυπτογράφησης βρίσκεται στον κύριο διακομιστή και αυτός καταστραφεί από λυτρισμικό, το αντίγραφο της βάσης είναι άχρηστο: η εμπιστευτικότητα διατηρήθηκε εις βάρος της διαθεσιμότητας. Το μέτρο που συμφιλιώνει τους δύο στόχους είναι η ορθή διαχείριση κλειδιών."}]},{"id":"1.3","title":"Αρχές σχεδίασης που διέπουν όλα τα επόμενα κεφάλαια","blocks":[{"type":"p","text":"Τέσσερις αρχές επανέρχονται σε όλο το βιβλίο ως αρχιτεκτονικοί περιορισμοί. Η **ασφάλεια εκ σχεδιασμού** (security by design) απαιτεί οι ιδιότητες ασφάλειας να προσδιορίζονται, να μοντελοποιούνται, να υλοποιούνται και να επαληθεύονται από την αρχή του κύκλου ζωής και όχι να προστίθενται μετά την παραγωγική λειτουργία, όταν οι αλλαγές είναι δαπανηρές και αποσπασματικές. Η **άμυνα σε βάθος** συνδυάζει ανεξάρτητα και ποικίλα προληπτικά, ανιχνευτικά και διορθωτικά μέτρα, ώστε η αστοχία ενός μεμονωμένου επιπέδου να μην κρίνει την έκβαση. Η **αρχή του ελάχιστου προνομίου** παραχωρεί σε κάθε χρήστη, διεργασία ή υπηρεσία μόνο την εξουσία που απαιτείται για συγκεκριμένη εργασία και για συγκεκριμένο χρονικό διάστημα, και την ανακαλεί όταν δεν είναι πλέον αναγκαία. Οι **ασφαλείς προεπιλογές** (fail-safe defaults) απορρίπτουν την πρόσβαση εκτός αν έχει ρητά επιτραπεί και απαιτούν από τα συστατικά ενός συστήματος να καταλήγουν, σε περίπτωση αστοχίας, σε γνωστή ασφαλή κατάσταση."},{"type":"p","text":"Οι αρχές αυτές προέρχονται από το θεμελιώδες άρθρο των Saltzer και Schroeder (1975), το οποίο εισήγαγε επίσης την _οικονομία μηχανισμού_ (απλοί και μικροί σχεδιασμοί, ώστε να μπορούν να ελεγχθούν), την _πλήρη διαμεσολάβηση_ (έλεγχος κάθε πρόσβασης και όχι μόνο της πρώτης), τον _ανοιχτό σχεδιασμό_ (η ασφάλεια δεν πρέπει να εξαρτάται από τη μυστικότητα του σχεδιασμού), τον _διαχωρισμό προνομίων_ (περισσότερες από μία ανεξάρτητες προϋποθέσεις για ευαίσθητες ενέργειες), τον _ελάχιστο κοινό μηχανισμό_ (περιορισμός των κοινόχρηστων στοιχείων μεταξύ χρηστών) και την _ψυχολογική αποδοχή_ (η ασφάλεια πρέπει να είναι εύχρηστη, διαφορετικά οι χρήστες θα την παρακάμψουν)."},{"type":"p","text":"Οι αρχές είναι συμπληρωματικές και πρέπει να εφαρμόζονται από κοινού. Η πολυεπίπεδη άμυνα χωρίς ελάχιστο προνόμιο απλώς πολλαπλασιάζει τους ισχυρούς λογαριασμούς που μπορεί να υποκλέψει ένας επιτιθέμενος· μια αυστηρή πολιτική άρνησης εξ ορισμού χωρίς λειτουργικές διαδικασίες ωθεί τους χρήστες σε μη ασφαλείς παρακάμψεις. Μια χρήσιμη επαγγελματική πρακτική είναι να κατονομάζεται η αρχή που παραβιάστηκε σε κάθε ανασκόπηση μετά από περιστατικό· για παράδειγμα, μια τραπεζική μεταφορά που εγκρίνεται από ένα μόνο πρόσωπο παραβιάζει τον διαχωρισμό προνομίων."}]},{"id":"1.4","title":"Ιστορική εξέλιξη: από το Creeper στον υπερσυνδεδεμένο οργανισμό","blocks":[{"type":"p","text":"Η σύγχρονη αρχιτεκτονική ασφάλειας γίνεται καλύτερα κατανοητή ως συσσώρευση διδαγμάτων και όχι ως αλληλουχία απειλών που η μία αντικατέστησε την άλλη. Τα πρώιμα πειράματα στο ARPANET, όπως το _Creeper_ και το αντίστοιχο _Reaper_ (αρχές της δεκαετίας του 1970), έδειξαν τόσο τη δυνατότητα αυτοδιαδιδόμενου κώδικα όσο και την αυτοματοποιημένη αφαίρεσή του. Το _Morris Worm_ του 1988 ανέδειξε πώς ένα μεμονωμένο σφάλμα λογισμικού μπορεί να εξαπλωθεί αλυσιδωτά σε διασυνδεδεμένους υπολογιστές και οδήγησε άμεσα στη δημιουργία της πρώτης Ομάδας Απόκρισης σε Υπολογιστικά Περιστατικά (CERT)."},{"type":"p","text":"Στη συνέχεια, το εμπορικό Διαδίκτυο και ο Παγκόσμιος Ιστός διεύρυναν δραματικά την επιφάνεια επίθεσης: οι απομακρυσμένα προσβάσιμες υπηρεσίες, η έγχυση SQL, το cross-site scripting, τα botnet και το οργανωμένο κυβερνοέγκλημα έγιναν καθημερινά ζητήματα. Τις επόμενες δεκαετίες, το υπολογιστικό νέφος, οι κινητές πλατφόρμες, το λυτρισμικό ως υπηρεσία, οι επιθέσεις με επίκεντρο την ταυτότητα, οι παραβιάσεις της εφοδιαστικής αλυσίδας λογισμικού και η σύγκλιση της πληροφορικής με την επιχειρησιακή τεχνολογία (OT) εισήγαγαν νέα διοικητικά πεδία και νέες εξαρτήσεις."},{"type":"p","text":"Κάθε εποχή στηρίχθηκε σε μια παραδοχή εμπιστοσύνης που οι επιτιθέμενοι τελικά διέψευσαν. Ο σημερινός οργανισμός είναι υβριδικός, έντονα διασυνδεδεμένος και εξαρτημένος από εξωτερικούς παρόχους ταυτότητας, λογισμικού και υποδομών. Το πρακτικό συμπέρασμα είναι ότι η θέση μέσα στο δίκτυο δεν αρκεί πλέον για να θεμελιώσει εμπιστοσύνη· η ταυτότητα, η κατάσταση της συσκευής και η εξουσιοδότηση πρέπει να επαληθεύονται συνεχώς. Αυτή είναι η βασική ιδέα της αρχιτεκτονικής μηδενικής εμπιστοσύνης (Zero Trust), την οποία εξετάζει αναλυτικά το Κεφάλαιο 13."},{"type":"table","caption":"Πίνακας 1.2 — Παραδοχές εμπιστοσύνης και οι αστοχίες που τις διέψευσαν","head":["Περίοδος","Παραδοχή εμπιστοσύνης","Χαρακτηριστική αστοχία","Καινοτομία ελέγχου που προέκυψε"],"rows":[["1970–1980","Αξιόπιστοι υπολογιστές και χρήστες","Creeper, Morris Worm","Έλεγχος πρόσβασης, CERT"],["1990–2000","Ασφαλές εσωτερικό, εχθρικό εξωτερικό","Code Red, SQL Slammer","Τείχη προστασίας, διαχείριση ενημερώσεων, antivirus"],["2010–2020","Αξιόπιστοι προμηθευτές, περίμετρος VPN","Παραβίαση Target, WannaCry","Κατάτμηση δικτύου, EDR, MFA"],["2020 κ.ε.","Ποτέ μην εμπιστεύεσαι, πάντα επαλήθευε","SolarWinds, λυτρισμικό σε OT","Zero Trust, SBOM, XDR"]]}]},{"id":"1.5","title":"Απειλή, ευπάθεια και κίνδυνος: το βασικό λεξιλόγιο","blocks":[{"type":"p","text":"Τρεις όροι χρησιμοποιούνται συχνά εναλλακτικά στην καθημερινή γλώσσα, έχουν όμως διακριτό τεχνικό περιεχόμενο. **Απειλή** είναι κάθε περίσταση, γεγονός ή δράστης που μπορεί να προκαλέσει βλάβη —μια εγκληματική ομάδα, ένας δυσαρεστημένος υπάλληλος, μια πλημμύρα. **Ευπάθεια** είναι μια αδυναμία που μπορεί να εκμεταλλευτεί ή να ενεργοποιήσει μια απειλή —μια υπηρεσία χωρίς ενημερώσεις, ένας αδύναμος κωδικός πρόσβασης, η απουσία αντιγράφων ασφαλείας. **Κίνδυνος** είναι η δυνατότητα δυσμενούς επίπτωσης υπό συνθήκες αβεβαιότητας· υπάρχει μόνο όταν μια σχετική απειλή συναντά μια εκμεταλλεύσιμη ευπάθεια σε ένα περιουσιακό στοιχείο που έχει αξία."},{"type":"p","text":"Η γνωστή έκφραση _κίνδυνος ≈ πιθανότητα × επίπτωση_ είναι χρήσιμο μοντέλο ιεράρχησης και όχι φυσικός νόμος. Κάθε οργανισμός οφείλει να ορίζει τις δικές του κλίμακες, να δηλώνει τις παραδοχές του και να αναγνωρίζει την αβεβαιότητα. **Μέτρο ελέγχου** είναι κάθε ενέργεια που μεταβάλλει την πιθανότητα, την επίπτωση ή και τα δύο: ο έλεγχος ταυτότητας πολλαπλών παραγόντων μειώνει την πιθανότητα κατάληψης λογαριασμού, ενώ τα αμετάβλητα αντίγραφα ασφαλείας μειώνουν την επίπτωση ενός λυτρισμικού."},{"type":"p","text":"Μετά την εφαρμογή των μέτρων απομένει ο **υπολειπόμενος κίνδυνος**, ο οποίος πρέπει να αντιμετωπίζεται ρητά. Υπάρχουν τέσσερις επιλογές: η περαιτέρω _μείωση_, η _αποδοχή_ (από στέλεχος που έχει τη σχετική αρμοδιότητα), η _μεταφορά_ όπου αυτό έχει νόημα (για παράδειγμα, μέσω ασφάλισης ή συμβάσεων) και η _αποφυγή_, δηλαδή η εγκατάλειψη της επικίνδυνης δραστηριότητας. Τα ώριμα προγράμματα ασφάλειας αξιολογούν το σύνολο των μέτρων τους με βάση την κάλυψη, την ανεξαρτησία και την πραγματική λειτουργική αποτελεσματικότητα —όχι με βάση τον αριθμό των προϊόντων που έχουν εγκαταστήσει."}]},{"id":"1.6","title":"Η εξάδα του Parker και ο κύβος του McCumber","blocks":[{"type":"p","text":"Η τριάδα CIA είναι αναγκαία, αλλά δεν είναι πάντοτε επαρκής. Ο Donn Parker πρότεινε την **εξάδα του Parker** (Parkerian Hexad), η οποία προσθέτει στις τρεις κλασικές ιδιότητες την _αυθεντικότητα_, την _κατοχή (έλεγχο)_ και τη _χρησιμότητα_. Οι προσθήκες αυτές αποτυπώνουν καταστάσεις που η τριάδα περιγράφει ελλιπώς. Όταν κλαπεί ένας κρυπτογραφημένος φορητός υπολογιστής, η εμπιστευτικότητα μπορεί να παραμένει άθικτη, όμως η κατοχή έχει σαφώς απολεσθεί. Όταν τα κρυπτογραφημένα δεδομένα διασώζονται αλλά τα κλειδιά έχουν χαθεί οριστικά, τα δεδομένα παραμένουν εμπιστευτικά, έχουν όμως χάσει κάθε χρησιμότητα."},{"type":"p","text":"Ο **κύβος του McCumber** προσφέρει μια συμπληρωματική, τρισδιάστατη οπτική. Εξετάζει την ασφάλεια στις τρεις _καταστάσεις_ της πληροφορίας (αποθήκευση, επεξεργασία, μετάδοση), στις τρεις _κατηγορίες μέτρων προστασίας_ (τεχνολογία, πολιτικές και πρακτικές, άνθρωποι) και στους ίδιους τους στόχους ασφάλειας. Η συνδυαστική χρήση των δύο μοντέλων αποκαλύπτει ελλιπείς ισχυρισμούς όπως «τα δεδομένα είναι κρυπτογραφημένα, άρα είναι ασφαλή». Ο αξιολογητής καλείται να ρωτήσει: ποιες ιδιότητες προστατεύονται, σε ποια κατάσταση της πληροφορίας και με ποιον συνδυασμό τεχνολογίας, διαδικασιών και ανθρώπινης συμπεριφοράς;"}]},{"id":"1.7","title":"Τυπικά μοντέλα ασφάλειας: Bell–LaPadula, Biba και Clark–Wilson","blocks":[{"type":"p","text":"Οι αρχές μάς λένε _τι_ επιδιώκουμε· τα τυπικά μοντέλα ορίζουν _με ακρίβεια_ ποιες συμπεριφορές ενός συστήματος επιτρέπονται, ώστε ένας σχεδιασμός να μπορεί να αναλυθεί και, ιδανικά, να αποδειχθεί ορθός. Το μοντέλο **Bell–LaPadula (BLP)**, που αναπτύχθηκε για στρατιωτικά συστήματα τη δεκαετία του 1970, προστατεύει την εμπιστευτικότητα με δύο κανόνες: _όχι ανάγνωση προς τα πάνω_ (ένα υποκείμενο δεν μπορεί να διαβάσει αντικείμενα υψηλότερης διαβάθμισης) και _όχι εγγραφή προς τα κάτω_ (ένα υποκείμενο δεν μπορεί να γράψει πληροφορία σε χαμηλότερη διαβάθμιση, κάτι που θα διέρρεε απόρρητα)."},{"type":"p","text":"Το μοντέλο **Biba** αποτελεί το αντίστοιχο του BLP για την ακεραιότητα και αντιστρέφει τους κανόνες του: _όχι ανάγνωση προς τα κάτω_ (μια αξιόπιστη διεργασία δεν πρέπει να καταναλώνει λιγότερο αξιόπιστα δεδομένα) και _όχι εγγραφή προς τα πάνω_ (ένα μη αξιόπιστο υποκείμενο δεν μπορεί να τροποποιεί πιο αξιόπιστα αντικείμενα). Στα εμπορικά περιβάλλοντα, ωστόσο, ενδιαφέρουν λιγότερο τα επίπεδα διαβάθμισης και περισσότερο η ορθότητα των συναλλαγών. Γι\' αυτό το μοντέλο **Clark–Wilson** επιβάλλει την ακεραιότητα μέσω _καλά σχηματισμένων συναλλαγών_, οι οποίες εκτελούνται μόνο από εξουσιοδοτημένους χρήστες μέσω πιστοποιημένων προγραμμάτων, σε συνδυασμό με τον _διαχωρισμό καθηκόντων_ και την πλήρη καταγραφή ελέγχου."},{"type":"callout","kind":"note","title":"ℹ️ Γιατί έχει πρακτική σημασία","text":"Τα υποχρεωτικά επίπεδα ακεραιότητας των Windows (Κεφάλαιο 2) προέρχονται άμεσα από το μοντέλο Biba, ενώ η έγκριση τραπεζικών μεταφορών από δύο πρόσωπα —δημιουργό και ελεγκτή (Κεφάλαιο 5)— αποτελεί κλασικό μέτρο τύπου Clark–Wilson."}]},{"id":"1.8","title":"Κριτήρια αξιολόγησης: από το TCSEC στα Common Criteria","blocks":[{"type":"p","text":"Πώς μπορεί ένας πελάτης να γνωρίζει αν ένα προϊόν παρέχει πράγματι την ασφάλεια που ισχυρίζεται ο κατασκευαστής του; Τα σχήματα αξιολόγησης απαντούν σε αυτό το ερώτημα μέσω ανεξάρτητης και επαναλήψιμης αξιολόγησης. Τα αμερικανικά **Trusted Computer System Evaluation Criteria (TCSEC)**, γνωστά ως _Πορτοκαλί Βιβλίο_ (Orange Book, 1983), κατέτασσαν τα λειτουργικά συστήματα σε κατηγορίες από D (ελάχιστη προστασία) έως A1 (τυπικά επαληθευμένος σχεδιασμός). Η Ευρώπη ακολούθησε με το **ITSEC**, το οποίο διαχώρισε τη λειτουργικότητα από τη διασφάλιση."},{"type":"p","text":"Και τα δύο αντικαταστάθηκαν από τα διεθνή **Common Criteria (ISO/IEC 15408)**. Στο πλαίσιο αυτό, ένα _Προφίλ Προστασίας_ (Protection Profile) περιγράφει τις απαιτήσεις ασφάλειας για μια κατηγορία προϊόντων (για παράδειγμα, τείχη προστασίας), ενώ ο _Στόχος Ασφάλειας_ (Security Target) του κατασκευαστή δηλώνει πώς ένα συγκεκριμένο προϊόν τις ικανοποιεί. Διαπιστευμένα εργαστήρια αξιολογούν στη συνέχεια το προϊόν σε ένα **Επίπεδο Διασφάλισης Αξιολόγησης (EAL1–EAL7)**. Είναι κρίσιμο να κατανοηθεί τι σημαίνει το EAL: μετρά την _αυστηρότητα_ της αξιολόγησης και όχι την _ισχύ_ του προϊόντος. Ένα προϊόν EAL4 έχει εξεταστεί διεξοδικότερα από ένα προϊόν EAL2, αλλά μόνο ως προς τις απαιτήσεις που δήλωσε ο δικός του Στόχος Ασφάλειας."}]}],"terms":[{"name":"Τριάδα CIA","def":"Εμπιστευτικότητα, ακεραιότητα και διαθεσιμότητα: οι τρεις βασικοί στόχοι της ασφάλειας πληροφοριών."},{"name":"Μη αποποίηση","def":"Αποδεικτικά στοιχεία που εμποδίζουν ένα μέρος να αρνηθεί αξιόπιστα μια ενέργεια που εκτέλεσε."},{"name":"Ελάχιστο προνόμιο","def":"Παραχώρηση μόνο της ελάχιστης αναγκαίας εξουσίας για μια εργασία και για τον ελάχιστο αναγκαίο χρόνο."},{"name":"Άμυνα σε βάθος","def":"Διαστρωμάτωση ανεξάρτητων και ποικίλων μέτρων, ώστε καμία μεμονωμένη αστοχία να μην είναι καθοριστική."},{"name":"Υπολειπόμενος κίνδυνος","def":"Ο κίνδυνος που απομένει μετά την εφαρμογή των μέτρων και πρέπει να αντιμετωπιστεί ρητά."},{"name":"EAL","def":"Επίπεδο Διασφάλισης Αξιολόγησης (Common Criteria): η αυστηρότητα μιας ανεξάρτητης αξιολόγησης προϊόντος."}],"summary":["Η κυβερνοασφάλεια, η διασφάλιση πληροφοριών και η κυβερνοανθεκτικότητα απαντούν σε διαφορετικά ερωτήματα: την αποτροπή της παραβίασης, την εμπιστοσύνη στην πληροφορία και τη συνέχιση της λειτουργίας παρά την αστοχία.","Η τριάδα CIA παραμένει το θεμέλιο, όμως η αυθεντικότητα, η λογοδοσία, η μη αποποίηση, η κατοχή και η χρησιμότητα είναι απαραίτητες για την περιγραφή πολλών πραγματικών καταστάσεων.","Τα μέτρα ασφάλειας επιλέγονται πρώτα με βάση τις αρχές —ελάχιστο προνόμιο, άμυνα σε βάθος, ασφαλείς προεπιλογές, ασφάλεια εκ σχεδιασμού— και μόνο έπειτα με βάση τα προϊόντα.","Ο κίνδυνος προκύπτει όταν μια απειλή συναντά μια ευπάθεια σε ένα πολύτιμο περιουσιακό στοιχείο· ο υπολειπόμενος κίνδυνος πρέπει πάντοτε να μειώνεται, να γίνεται αποδεκτός, να μεταφέρεται ή να αποφεύγεται ρητά.","Τα τυπικά μοντέλα και τα σχήματα αξιολόγησης καθιστούν τους ισχυρισμούς ασφάλειας ακριβείς και ανεξάρτητα επαληθεύσιμους."],"review":["Εξηγήστε, με δικό σας παράδειγμα, γιατί η κυβερνοανθεκτικότητα παραμένει αναγκαία ακόμη και σε έναν οργανισμό με εξαιρετικά προληπτικά μέτρα.","Περιγράψτε ένα σενάριο στο οποίο η βελτίωση της διαθεσιμότητας αποδυναμώνει την εμπιστευτικότητα. Πώς θα συμφιλιώνατε τους δύο στόχους;","Ποια αρχή των Saltzer και Schroeder παραβιάζεται όταν όλοι οι διαχειριστές μοιράζονται έναν κοινό κωδικό διαχειριστή τομέα; Τεκμηριώστε την απάντησή σας.","Γιατί η διαβάθμιση EAL των Common Criteria δεν αρκεί από μόνη της για να κρίνετε αν ένα προϊόν είναι κατάλληλο για το δικό σας περιβάλλον;"],"cli":{"title":"Προσομοιωτής Ελέγχου Βασικής Ασφάλειας & Αξιολόγησης CIA","desc":"Ελέγξτε ένα αποθετήριο χρηματοοικονομικών δεδομένων, επαληθεύστε την κρυπτογραφική ακεραιότητα, εξετάστε τα δικαιώματα ευαίσθητων αρχείων και εφαρμόστε την Αρχή του Ελάχιστου Προνομίου.","meta":["⏱️ ~30 min","🐚 analyst@cia-audit:~$"],"tasks":[{"pill":"Task 1","name":"Επαλήθευση Ακεραιότητας Δεδομένων μέσω Κρυπτογραφικού Κατακερματισμού","instr":"Υπολογίστε το SHA-256 hash του καθολικού συναλλαγών `ledger_2026.dat` για να επιβεβαιώσετε ότι δεν έχει αλλοιωθεί.","hint":"Χρησιμοποιήστε το εργαλείο: sha256sum ledger_2026.dat","cmd":"$ sha256sum ledger_2026.dat","ok":"Η ακεραιότητα επαληθεύτηκε! Το αποτύπωμα SHA-256 ταιριάζει με τη βάση αναφοράς."},{"pill":"Task 2","name":"Έλεγχος Δικαιωμάτων Αρχείων & Εντοπισμός Παραβίασης Ελάχιστου Προνομίου","instr":"Εξετάστε τα αναλυτικά μεταδεδομένα και τα δικαιώματα πρόσβασης του αρχείου `secret_vault.key` χρησιμοποιώντας την εντολή `stat`.","hint":"Εκτελέστε: stat secret_vault.key","cmd":"$ stat secret_vault.key","ok":"Εντοπίστηκε ευπάθεια: Τα δικαιώματα του κλειδιού είναι υπερβολικά χαλαρά (αναγνώσιμο από όλους)."},{"pill":"Task 3","name":"Επιβολή Αυστηρής Εμπιστευτικότητας μέσω Ελάχιστου Προνομίου","instr":"Περιορίστε τα δικαιώματα στο `secret_vault.key` ώστε μόνο ο ιδιοκτήτης να έχει ανάγνωση/εγγραφή (οκταδικό 600).","hint":"Εκτελέστε: chmod 600 secret_vault.key","cmd":"$ chmod 600 secret_vault.key","ok":"Επιβλήθηκε το ελάχιστο προνόμιο! Η πρόσβαση περιορίστηκε αποκλειστικά στον ιδιοκτήτη."},{"pill":"Task 4","name":"Έλεγχος Ρύθμισης Ακεραιότητας Συστήματος","instr":"Διαβάστε τις ρυθμίσεις στο `audit_policy.conf` για να επαληθεύσετε την ενεργή ανίχνευση αλλοιώσεων.","hint":"Εκτελέστε: cat audit_policy.conf","cmd":"$ cat audit_policy.conf","ok":"Η πολιτική ελέγχου είναι ενεργή. Επαληθεύτηκε η διατήρηση καταγραφών και οι ειδοποιήσεις αλλοίωσης."}]},"lab":{"title":"Αξιολόγηση Ασφάλειας Πληροφοριών Επιχείρησης & Πολυεπίπεδη Ενίσχυση Ελέγχων","desc":"Σε αυτό το ολοκληρωμένο τεχνικό εργαστήριο διάρκειας 2 ωρών, οι φοιτητές αναλαμβάνουν τον ρόλο Συμβούλου Ασφάλειας Πληροφοριών στην εταιρεία \'FinTech Global Inc.\'. Θα αξιολογήσετε μια αρχιτεκτονική πληρωμών, θα αποδομήσετε εταιρικά περιουσιακά στοιχεία βάσει των απαιτήσεων Εμπιστευτικότητας, Ακεραιότητας και Διαθεσιμότητας (CIA), θα εντοπίσετε μοναδικά σημεία αποτυχίας (SPOF), θα εφαρμόσετε τις αρχές Saltzer–Schroeder και θα υλοποιήσετε τεχνικά μέτρα ενίσχυσης.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Ubuntu Linux 24.04 LTS / Debian 12 (Virtual Machine or Container)","Core utilities: `sha256sum`, `stat`, `chmod`, `auditctl`, `diff`, `openssl`, `curl`","Audit daemon (`auditd`) & Netfilter/iptables tools","Text editor (VS Code, Nano or Vim) for audit log review and policy configuration"],"phases":[{"badge":"Phase 1","name":"Καταγραφή Περιουσιακών Στοιχείων, Ταξινόμηση & Χαρτογράφηση CIA","dur":"⏱️ 25 λεπτά","objs":["Καταγραφή 5 κρίσιμων ψηφιακών περιουσιακών στοιχείων της ροής πληρωμών.","Απόδοση διαβαθμίσεων επίπτωσης CIA (Υψηλή/Μέτρια/Χαμηλή) βάσει FIPS 199.","Εντοπισμός συμβιβασμών μεταξύ διαθεσιμότητας και αυστηρής εμπιστευτικότητας."],"steps":[{"type":"p","text":"1. Εξετάστε τον κατάλογο εταιρικών περιουσιακών στοιχείων στη διαδρομή `/opt/fintech/assets/`."},{"type":"p","text":"2. Εκτελέστε την εντολή καταγραφής για συλλογή μεταδεδομένων:\\n```bash\\nls -la /opt/fintech/assets/\\nfile /opt/fintech/assets/*\\n```"},{"type":"p","text":"3. Συμπληρώστε τον Πίνακα Στόχων Ασφάλειας CIA για τα δεδομένα PII, το API πληρωμών, το Καθολικό Συναλλαγών και τα Ιδιωτικά Κλειδιά HSM."},{"type":"table","caption":"Πίνακας 1.L1 — Πίνακας Ταξινόμησης CIA Επιχείρησης","head":["Περιουσιακό Στοιχείο","Εμπιστευτικότητα","Ακεραιότητα","Διαθεσιμότητα","Κύριο Διάνυσμα Απειλής"],"rows":[["Δεδομένα PII Πελατών","Υψηλή","Υψηλή","Μέτρια","Διαρροή δεδομένων, μη εξουσιοδοτημένη εξαγωγή"],["API Επεξεργασίας Πληρωμών","Μέτρια","Υψηλή","Κρίσιμη (Υψηλή)","Επιθέσεις DDoS, API injection, MITM"],["Καθολικό Συναλλαγών","Μέτρια","Κρίσιμη (Υψηλή)","Υψηλή","Μη εξουσιοδοτημένη τροποποίηση / αλλοίωση"],["Ιδιωτικό Κλειδί HSM","Κρίσιμη (Υψηλή)","Κρίσιμη (Υψηλή)","Μέτρια","Κλοπή κλειδιού, εσωτερική κακόβουλη εξαγωγή"]]}]},{"badge":"Phase 2","name":"Έλεγχος Κρυπτογραφικής Ακεραιότητας & Ανίχνευση Αλλοιώσεων","dur":"⏱️ 45 λεπτά","objs":["Δημιουργία κρυπτογραφικού αρχείου βάσης αναφοράς με αποτυπώματα SHA-256.","Προσομοίωση μη εξουσιοδοτημένης επίθεσης αλλοίωσης σε επίπεδο byte στα αρχεία πληρωμών.","Ανίχνευση αποκλίσεων με αυτοματοποιημένη επαλήθευση κατακερματισμού και diff."],"steps":[{"type":"p","text":"1. Δημιουργήστε το αρχείο αναφοράς κρυπτογραφικών αποτυπωμάτων για όλα τα αρχεία ρυθμίσεων:\\n```bash\\nsha256sum /opt/fintech/assets/*.dat > /var/log/baseline_hashes.sha256\\ncat /var/log/baseline_hashes.sha256\\n```"},{"type":"p","text":"2. Προσομοιώστε επίθεση αλλοίωσης στη συναλλαγή #4801:\\n```bash\\nsed -i \'s/AMOUNT: 100/AMOUNT: 99000/\' /opt/fintech/assets/ledger_2026.dat\\n```"},{"type":"p","text":"3. Εκτελέστε αυτοματοποιημένο έλεγχο έναντι του αρχείου βάσης:\\n```bash\\nsha256sum --check /var/log/baseline_hashes.sha256\\n```"},{"type":"p","text":"4. Αναλύστε την έξοδο: Το εργαλείο επισημαίνει άμεσα `FAILED` στο `ledger_2026.dat`. Εντοπίστε την ακριβή αλλαγή με δεκαεξαδικό έλεγχο:\\n```bash\\nhexdump -C /opt/fintech/assets/ledger_2026.dat | head -n 10\\n```"}]},{"badge":"Phase 3","name":"Εφαρμογή Αρχών Saltzer–Schroeder & Ελάχιστου Προνομίου","dur":"⏱️ 30 λεπτά","objs":["Έλεγχος δικαιωμάτων DAC σε κρίσιμους καταλόγους της εφαρμογής.","Εξάλειψη δικαιωμάτων καθολικής ανάγνωσης/εγγραφής (777, 666) σε ιδιωτικά κλειδιά.","Εφαρμογή ασφαλών προεπιλογών (fail-safe defaults) και πλήρους διαμεσολάβησης."],"steps":[{"type":"p","text":"1. Εντοπίστε επικίνδυνα δικαιώματα στο σύστημα αρχείων:\\n```bash\\nfind /opt/fintech -perm -o=w -o -perm -o=r -ls\\n```"},{"type":"p","text":"2. Αποκατάσταση: Αναθέστε την ιδιοκτησία στον αποκλειστικό χρήστη `fintech-svc` και περιορίστε τα δικαιώματα σε `600`:\\n```bash\\nsudo chown -R fintech-svc:fintech-group /opt/fintech/secrets\\nsudo chmod 600 /opt/fintech/secrets/*.key\\nsudo chmod 700 /opt/fintech/secrets\\n```"},{"type":"p","text":"3. Επαληθεύστε με την εντολή `stat`:\\n```bash\\nstat /opt/fintech/secrets/master.key\\n```"},{"type":"p","text":"4. Ενεργοποιήστε συνεχή παρακολούθηση ακεραιότητας μέσω του δαίμονα `auditd`:\\n```bash\\nsudo auditctl -w /opt/fintech/secrets/master.key -p wa -k secret_key_tamper\\nsudo auditctl -l\\n```"}]},{"badge":"Phase 4","name":"Υπολογισμός Υπολειπόμενου Κινδύνου & Σύνταξη Έκθεσης Ελέγχου","dur":"⏱️ 20 λεπτά","objs":["Υπολογισμός Εγγενούς έναντι Υπολειπόμενου Κινδύνου (Κίνδυνος = Πιθανότητα × Επίπτωση).","Τεκμηρίωση των μέτρων που εφαρμόστηκαν και των εναπομενουσών ευπαθειών.","Διατύπωση επίσημων συστάσεων αξιολόγησης βάσει Common Criteria / EAL."],"steps":[{"type":"p","text":"1. Εξετάστε τον πίνακα αξιολόγησης κινδύνου πριν και μετά την εφαρμογή των μέτρων."},{"type":"p","text":"2. Συνθέστε τα ευρήματα στην τελική αναφορά ελέγχου:\\n```bash\\nsudo ausearch -k secret_key_tamper --format text > /var/log/audit_evidence.log\\n```"},{"type":"p","text":"3. Επιβεβαιώστε ότι και οι 4 αποστολές του εργαστηρίου πληρούν τα πρότυπα συμμόρφωσης."}]}],"checklist":["Η καταγραφή περιουσιακών στοιχείων κατηγοριοποιεί ορθά 5 στοιχεία με αιτιολογημένη βαθμολόγηση CIA.","Η επαλήθευση SHA-256 εντοπίζει αξιόπιστα τροποποιήσεις ενός byte στο ledger_2026.dat .","Τα δικαιώματα στο /opt/fintech/secrets είναι αυστηρά περιορισμένα σε 0600/0700.","Το auditctl καταγράφει ενεργά οποιαδήποτε εγγραφή ή τροποποίηση ιδιοτήτων στα κλειδιά.","Η εξίσωση υπολειπόμενου κινδύνου υπολογίζεται και αιτιολογείται πλήρως."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αρχιτεκτονική Ασφάλειας Επιχείρησης & Αξιολόγηση Κινδύνου CIA για Ψηφιακή Τραπεζική Πύλη","desc":"Μια ευρωπαϊκή ψηφιακή τράπεζα (neo-bank) εγκαινιάζει μια υποδομή μικροϋπηρεσιών άμεσων πληρωμών. Ως Επικεφαλής Αρχιτέκτονας Ασφάλειας, σας ανατίθεται να σχεδιάσετε την αρχιτεκτονική ασφάλειας από το μηδέν, να αξιολογήσετε τις εξαρτήσεις CIA, να επιλέξετε τυπικά μοντέλα ελέγχου πρόσβασης (Bell–LaPadula έναντι Biba) και να παραδώσετε μια πλήρη ανάλυση απειλών και επικινδυνότητας.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Αρχιτεκτονική Συστήματος & Φάκελος Μοντελοποίησης Απειλών","desc":"Δημιουργία αρχιτεκτονικού διαγράμματος με όρια εμπιστοσύνης, σημεία ελέγχου ταυτότητας και επίπεδα ταξινόμησης δεδομένων.","spec":["Ορισμός 3 διακριτών ζωνών ασφαλείας: DMZ (API Gateway), App Tier (Μικροϋπηρεσίες) και Secure DB Tier.","Χαρτογράφηση επιπέδων ταξινόμησης (Public, Internal, Confidential, Restricted) σε όλες τις βάσεις δεδομένων.","Καταγραφή 5 ορίων εμπιστοσύνης και προδιαγραφή απαιτήσεων αυθεντικοποίησης/εξουσιοδότησης σε κάθε όριο."],"deliv":"📦 Παραδοτέο Οροσήμου: Αρχιτεκτονικό διάγραμμα + Πίνακας Ταξινόμησης Δεδομένων."},{"num":"M2","title":"Σχέδιο Εφαρμογής των Αρχών Saltzer–Schroeder","desc":"Παροχή τεχνικών προδιαγραφών για την επιβολή της Οικονομίας Μηχανισμού, των Ασφαλών Προεπιλογών, της Πλήρους Διαμεσολάβησης και του Ελάχιστου Προνομίου.","spec":["Προδιαγραφή παραμετροποίησης Envoy proxy για επιβολή Πλήρους Διαμεσολάβησης σε κάθε κλήση API.","Ορισμός NetworkPolicies στο Kubernetes για επιβολή Fail-Safe Defaults (default deny).","Δημιουργία RoleBindings στο Kubernetes για υλοποίηση του Ελάχιστου Προνομίου."],"deliv":"📦 Παραδοτέο Οροσήμου: Έγγραφο τεχνικών προδιαγραφών (4 σελίδων) με παραδείγματα κώδικα ρυθμίσεων."},{"num":"M3","title":"Επιλογή Τυπικού Μοντέλου Ασφάλειας & Ορισμός Πολιτικής","desc":"Σύγκριση των μοντέλων Bell–LaPadula, Biba και Clark–Wilson. Τεκμηρίωση της υπεροχής του Clark–Wilson για εμπορική οικονομική ακεραιότητα.","spec":["Τυπικός ορισμός CDIs, UDIs και Transformation Procedures (TPs) κατά το μοντέλο Clark-Wilson.","Ορισμός κανόνων Διαχωρισμού Καθηκόντων (SoD) με έλεγχο δύο ατόμων για έγκριση συναλλαγών.","Κατασκευή πίνακα ελέγχου πρόσβασης συγκρίνοντας τα μοντέλα Bell-LaPadula, Biba και Clark-Wilson."],"deliv":"📦 Παραδοτέο Οροσήμου: Τυπική συγκριτική ανάλυση & Πίνακας Κανόνων Διαχωρισμού Καθηκόντων (SoD)."},{"num":"M4","title":"Ολοκληρωμένη Αξιολόγηση Κινδύνου & Στρατηγικός Οδικός Χάρτης","desc":"Υπολογισμός εγγενούς και υπολειπόμενου κινδύνου για 10 σενάρια απειλών. Παρουσίαση ιεραρχημένου οδικού χάρτη 12 μηνών για το Διοικητικό Συμβούλιο.","spec":["Αξιολόγηση 10 σεναρίων απειλών με ποσοτική βαθμολόγηση κατά ISO 27005 (ALE = SLE * ARO).","Σύνθεση ευρημάτων σε επιτελικό πίνακα με Εγγενή Κίνδυνο, Μέτρα Προστασίας και Υπολειπόμενο Κίνδυνο.","Ανάπτυξη ιεραρχημένου οδικού χάρτη αντιμετώπισης 12 μηνών για το Διοικητικό Συμβούλιο."],"deliv":"📦 Παραδοτέο Οροσήμου: Επιτελικό Σχέδιο Αντιμετώπισης Κινδύνων και σύνοψη διαφανειών παρουσίασης."}],"deliverables":["Τελική Τεχνική Έκθεση Έργου (PDF/Markdown, 10–15 σελίδες)","Διάγραμμα Αρχιτεκτονικής & Ορίων Εμπιστοσύνης (PNG/SVG)","Μητρώο Ταξινόμησης Δεδομένων & Επιπτώσεων CIA (CSV/Excel)","Πίνακας Σχεδίου Αντιμετώπισης Κινδύνων με Βαθμολόγηση Πιθανότητας/Επίπτωσης"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου Δαίμονα Ελέγχου Ακεραιότητας Αρχείων (FIM) σε Python","desc":"Οι παραγωγικοί διακομιστές απαιτούν συνεχή έλεγχο ότι κρίσιμα εκτελέσιμα αρχεία (/bin, /etc) δεν αλλοιώνονται από κακόβουλο λογισμικό ή εισβολείς. Σε αυτό το έργο ανάπτυξης λογισμικού, θα κατασκευάσετε έναν ολοκληρωμένο δαίμονα FIM σε Python ( pyfim_daemon.py ) που αποθηκεύει κρυπτογραφικά αποτυπώματα SHA-256, παρακολουθεί γεγονότα του πυρήνα Linux, εντοπίζει μη εξουσιοδοτημένες τροποποιήσεις και αποστέλλει άμεσες ειδοποιήσεις.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Μηχανή Κρυπτογραφικού Baseline & Επίπεδο Αποθήκευσης SQLite","desc":"Ανάπτυξη της μηχανής αναδρομικής σάρωσης που διατρέχει τους φακέλους στόχους, υπολογίζει hashes SHA-256, καταγράφει δικαιώματα και ιδιοκτήτες και αποθηκεύει τις εγγραφές σε βάση SQLite.","spec":["Δημιουργία κλάσης `DatabaseManager` με σχήμα: `id, file_path, sha256_hash, permissions, owner_uid, group_gid, size_bytes, last_modified, baseline_created_at`.","Υλοποίηση του `HashWorker` που διαβάζει αρχεία σε blocks των 64KB (`hashlib.sha256()`) για αποφυγή υπερχείλισης μνήμης.","Προσθήκη εντολής CLI `--init-baseline --path <DIR>` για δημιουργία του αρχικού baseline."],"deliv":"📦 Παραδοτέο Λογισμικού: Πηγαίος κώδικας database.py και hasher.py + δοκιμές αρχικοποίησης βάσης."},{"num":"M2","title":"Παρακολούθηση Συμβάντων Inotify σε Πραγματικό Χρόνο & Μηχανή Diff","desc":"Υλοποίηση δαίμονα παρασκηνίου που συνδέει inotify watchers στους φακέλους, συλλαμβάνει τροποποιήσεις και συγκρίνει το τρέχον hash με το baseline.","spec":["Υλοποίηση του `FileSystemEventHandler` για χειρισμό των συμβάντων `on_created`, `on_deleted`, `on_modified`, `on_moved`.","Προσθήκη λογικής debouncing (500ms) για αποφυγή πολλαπλών ειδοποιήσεων σε συνεχείς εγγραφές.","Υπολογισμός διαφοράς hash και παραγωγή αντικειμένου ειδοποίησης με μεταδεδομένα πριν και μετά."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα δαίμονα watcher.py με επίδειξη ανίχνευσης τροποποίησης στο /etc/passwd ."},{"num":"M3","title":"Διανομέας Ειδοποιήσεων Πολλαπλών Καναλιών & Ενσωμάτωση Syslog","desc":"Κατασκευή αγωγού διανομής ειδοποιήσεων με μηνύματα RFC 5424 Syslog, αρχεία JSON και HTTP webhooks.","spec":["Μορφοποίηση ειδοποιήσεων σε μορφή CEF και JSON με βαθμίδα κινδύνου (CRITICAL, HIGH, INFO).","Προσθήκη μηχανισμού επαναπροσπάθειας με εκθετική καθυστέρηση για αποτυχίες HTTP webhooks.","Τοπική καταγραφή στο `/var/log/pyfim_alerts.log` με διαχείριση rotation."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα ειδοποιήσεων alerts.py + δοκιμή ενσωμάτωσης webhook."},{"num":"M4","title":"Πακετοποίηση, Υπηρεσία Systemd & Αυτοματοποιημένες Δοκιμές","desc":"Πακετοποίηση της εφαρμογής σε υπηρεσία systemd με CLI διαχείρισης, αρχείο ρυθμίσεων ( /etc/pyfim.conf ) και σουίτα δοκιμών pytest.","spec":["Συγγραφή αρχείου unit `pyfim.service` για systemd με παραμέτρους sandboxing (`ProtectSystem=strict`).","Δημιουργία αυτοματοποιημένων δοκιμών προσομοίωσης επίθεσης (αλλοίωση αρχείου, αλλαγή δικαιωμάτων) και επαλήθευση ειδοποιήσεων.","Σύνταξη τεχνικού εγχειριδίου χρήσης και οδηγού CLI."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρες αποθετήριο κώδικα με systemd service, ρυθμίσεις, δοκιμές pytest και βίντεο επίδειξης."}],"deliverables":["Πλήρης πηγαίος κώδικας Python (`/pyfim/`) με αρθρωτή αρχιτεκτονική","Αρχείο υπηρεσίας systemd (`pyfim.service`) και πρότυπο ρυθμίσεων (`pyfim.yaml`)","Σουίτα αυτοματοποιημένων δοκιμών PyTest με 15 σενάρια ελέγχου","Τεχνικός Οδηγός Αρχιτεκτονικής & Ανάπτυξης (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 1","quiz":[{"q":"Ένας μη εξουσιοδοτημένος εισβολέας παραποιεί τραπεζικές συναλλαγές για να αλλάξει τα υπόλοιπα πελατών. Ποιος πυλώνας της τριάδας CIA παραβιάστηκε άμεσα;","opts":[{"k":"A","v":"Εμπιστευτικότητα, εκθέτοντας ιδιωτικά τραπεζικά στοιχεία υπολοίπου σε μη εξουσιοδοτημένα άτομα."},{"k":"B","v":"Ακεραιότητα, τροποποιώντας εγγραφές συναλλαγών και δεδομένα υπολοίπων χωρίς έγκυρη εξουσιοδότηση."},{"k":"C","v":"Διαθεσιμότητα, εμποδίζοντας τους νόμιμους κατόχους λογαριασμών να εισέλθουν στην πύλη e-banking."},{"k":"D","v":"Μη αποποίηση, αφαιρώντας όλες τις χρονοσημάνσεις ψηφιακών υπογραφών από τα αρχεία συναλλαγών."},{"k":"E","v":"Υπευθυνότητα, διαγράφοντας πλήρως τα αρχεία καταγραφής ελέγχου και τα συμβάντα ασφάλειας."}],"ans":"B","exp":"Η ακεραιότητα διασφαλίζει ότι τα δεδομένα παραμένουν ακριβή, αυθεντικά και προστατευμένα από μη εξουσιοδοτημένη τροποποίηση. Η παραποίηση τραπεζικών δεδομένων συνιστά παραβίαση ακεραιότητας."},{"q":"Πώς διαφέρει θεμελιωδώς η \'κυβερνοανθεκτικότητα\' (cyber resilience) από την παραδοσιακή προληπτική κυβερνοασφάλεια;","opts":[{"k":"A","v":"Η κυβερνοανθεκτικότητα εστιάζει αποκλειστικά σε τείχη προστασίας περιμέτρου και συστήματα αποτροπής εισβολών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Η κυβερνοανθεκτικότητα εξαλείφει την ανάγκη κρυπτογράφησης μέσω αυστηρών βιομετρικών ελέγχων φυσικής πρόσβασης, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Η κυβερνοανθεκτικότητα θεωρεί δεδομένη την παραβίαση και εστιάζει στην πρόβλεψη, αντοχή, ανάκαμψη και προσαρμογή."},{"k":"D","v":"Η κυβερνοανθεκτικότητα εγγυάται απόλυτα μηδενικό χρόνο διακοπής μέσω ιδιόκτητου υλικού αυτόματης ανακατεύθυνσης."},{"k":"E","v":"Η κυβερνοανθεκτικότητα περιορίζεται αποκλειστικά σε ελέγχους συμμόρφωσης χωρίς εφαρμογή τεχνικών μέτρων."}],"ans":"C","exp":"Η κυβερνοανθεκτικότητα αποδέχεται ότι οι παραβιάσεις είναι αναπόφευκτες, δίνοντας προτεραιότητα στην ικανότητα αντοχής, προσαρμογής και ταχείας αποκατάστασης των κρίσιμων λειτουργιών."},{"q":"Σύμφωνα με τις αρχές σχεδίασης των Saltzer και Schroeder, τι επιτάσσει η αρχή των \'Ασφαλών Προεπιλογών\' (Fail-Safe Defaults);","opts":[{"k":"A","v":"Τα συστήματα πρέπει να επανεκκινούν αυτόματα σε απομονωμένο περιβάλλον πυρήνα όταν προκύψει σφάλμα, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Τα κρυπτογραφικά κλειδιά πρέπει να είναι ενσωματωμένα στο firmware για αποφυγή απώλειας ή αλλοίωσης."},{"k":"C","v":"Οι μηχανισμοί watchdog πρέπει να παρακάμπτουν τους ελέγχους ταυτοποίησης σε περιπτώσεις διακοπής δικτύου."},{"k":"D","v":"Οι αποφάσεις πρόσβασης πρέπει να βασίζονται σε ρητή άδεια αντί για εξαίρεση (προεπιλεγμένη άρνηση / default deny)."},{"k":"E","v":"Τα διαχειριστικά διαπιστευτήρια πρέπει να επανέρχονται αυτόματα στις εργοστασιακές ρυθμίσεις σε διακοπή ρεύματος, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"D","exp":"Η αρχή των Ασφαλών Προεπιλογών ορίζει ότι η πρόσβαση απαγορεύεται από προεπιλογή και πρέπει να παραχωρείται ρητά και τεκμηριωμένα."},{"q":"Ποια είναι η βασική εννοιολογική διαφορά μεταξύ μιας \'ευπάθειας\' (vulnerability) και μιας \'απειλής\' (threat);","opts":[{"k":"A","v":"Η ευπάθεια είναι ένας ενεργός εξωτερικός επιτιθέμενος, ενώ η απειλή είναι μια εσωτερική αδυναμία λογισμικού, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Η ευπάθεια αντιπροσωπεύει το οικονομικό κόστος, ενώ η απειλή αντιπροσωπεύει τη στατιστική πιθανότητα, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Η ευπάθεια αφορά αποκλειστικά υλικό δικτύου, ενώ η απειλή αφορά αποκλειστικά βάσεις δεδομένων εφαρμογών, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Η ευπάθεια δημιουργείται από κακόβουλη πρόθεση, ενώ η απειλή προκύπτει μόνο από τυχαία σφάλματα κώδικα, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Η ευπάθεια είναι μια εγγενής αδυναμία σε ένα στοιχείο, ενώ η απειλή είναι ο παράγοντας που την εκμεταλλεύεται."}],"ans":"E","exp":"Ευπάθεια είναι ένα κενό ή αδυναμία σε σχεδιασμό, κώδικα ή μέτρα ασφάλειας. Απειλή είναι κάθε δράστης ή συμβάν που μπορεί να εκμεταλλευτεί αυτό το κενό."},{"q":"Ποιο τυπικό μοντέλο ασφάλειας σχεδιάστηκε για την επιβολή εμπιστευτικότητας σε πολυεπίπεδα συστήματα μέσω των κανόνων \'No Read Up\' και \'No Write Down\';","opts":[{"k":"A","v":"Το Μοντέλο Bell–LaPadula, διασφαλίζοντας την εμπιστευτικότητα μέσω της απλής ιδιότητας και της ιδιότητας-αστέρι."},{"k":"B","v":"Το Μοντέλο Ακεραιότητας Biba, αποτρέποντας την ανάγνωση αλλοιωμένων δεδομένων μεταξύ επιπέδων διαβάθμισης, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Το Μοντέλο Clark–Wilson, επιβάλλοντας ορθά δομημένες εμπορικές συναλλαγές μέσω κανόνων πιστοποίησης, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Το Μοντέλο Graham–Denning, ορίζοντας συγκεκριμένους κανόνες κατανομής δικαιωμάτων σε αντικείμενα λειτουργικού."},{"k":"E","v":"Το Μοντέλο Brewer–Nash (Κινεζικό Τείχος), περιορίζοντας την πρόσβαση βάσει συγκρούσεων συμφερόντων."}],"ans":"A","exp":"Το μοντέλο Bell–LaPadula επιβάλλει εμπιστευτικότητα μέσω της Απλής Ιδιότητας (No Read Up) και της Ιδιότητας-* (No Write Down)."},{"q":"Τι ορίζει η \'Απλή Ιδιότητα Ακεραιότητας\' (Simple Integrity Property) του μοντέλου ακεραιότητας Biba;","opts":[{"k":"A","v":"Ένα υποκείμενο δεν μπορεί να εγγράψει σε αντικείμενο υψηλότερης ακεραιότητας (No Write Up), προστατεύοντας ανώτερα επίπεδα."},{"k":"B","v":"Ένα υποκείμενο δεν μπορεί να διαβάσει αντικείμενο χαμηλότερης ακεραιότητας (No Read Down), αποτρέποντας μόλυνση."},{"k":"C","v":"Ένα υποκείμενο μπορεί να εκτελεί λειτουργίες μόνο μέσα σε απομονωμένο περιβάλλον chroot sandbox, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Ένα υποκείμενο πρέπει να πραγματοποιεί αμοιβαία κρυπτογραφική ταυτοποίηση πριν από κάθε εγγραφή, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Ένα υποκείμενο δεν μπορεί να έχει πρόσβαση σε αντικρουόμενα δεδομένα ανταγωνιστικών επιχειρήσεων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"B","exp":"Η Απλή Ιδιότητα Ακεραιότητας του Biba ορίζει το \'No Read Down\': ένα υποκείμενο δεν επιτρέπεται να διαβάζει δεδομένα χαμηλότερης ακεραιότητας για να μην αλλοιωθεί."},{"q":"Γιατί το μοντέλο ασφάλειας Clark–Wilson προτιμάται έναντι του Bell–LaPadula για εμπορικά τραπεζικά συστήματα;","opts":[{"k":"A","v":"Επειδή εξαλείφει πλήρως το υπολογιστικό κόστος συμμετρικής κρυπτογράφησης σε κατανεμημένες βάσεις δεδομένων, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Επειδή επιτρέπει σε μη ταυτοποιημένους χρήστες να τροποποιούν αρχεία καταγραφής σε κατάσταση ανάγκης, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Επειδή επιβάλλει την ακεραιότητα μέσω Ορθά Δομημένων Συναλλαγών και Διαχωρισμού Καθηκόντων."},{"k":"D","v":"Επειδή βελτιστοποιεί τη διαμεταγωγή πακέτων δικτύου σε κατανεμημένους εξισορροπητές φορτίου cloud, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Επειδή απαιτεί στρατιωτικές διαβαθμίσεις ασφάλειας για όλους τους τραπεζικούς υπαλλήλους πρώτης γραμμής, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"C","exp":"Τα εμπορικά συστήματα απαιτούν ακεραιότητα δεδομένων και αποτροπή απάτης. Το Clark–Wilson το επιτυγχάνει μέσω Ορθά Δομημένων Συναλλαγών και Διαχωρισμού Καθηκόντων."},{"q":"Τι απαιτεί συγκεκριμένα η Αρχή του Ελάχιστου Προνομίου (PoLP) στις σύγχρονες αρχιτεκτονικές διαχείρισης πρόσβασης;","opts":[{"k":"A","v":"Οι διαχειριστές συστημάτων πρέπει να αποκλείονται πλήρως από την πρόσβαση στον πηγαίο κώδικα εφαρμογών."},{"k":"B","v":"Οι κωδικοί πρόσβασης των χρηστών πρέπει να ανανεώνονται κάθε 24 ώρες για αποτροπή επιθέσεων credential stuffing, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Όλες οι θύρες δικτύου στους περιφερειακούς δρομολογητές πρέπει να απενεργοποιούνται μόνιμα, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Κάθε οντότητα πρέπει να διαθέτει μόνο τα ελάχιστα δικαιώματα που είναι απαραίτητα για την εκτέλεση της εργασίας της."},{"k":"E","v":"Όλες οι εγγραφές βάσεων δεδομένων πρέπει να κρυπτογραφούνται με ξεχωριστά εφήμερα κλειδιά ανά γραμμή, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"D","exp":"Η αρχή του ελάχιστου προνομίου επιβάλλει κάθε χρήστης ή διεργασία να έχει μόνο τα απολύτως απαραίτητα δικαιώματα για τον ρόλο του."},{"q":"Ποιος ποσοτικός δείκτης στην κλασική εκτίμηση επικινδυνότητας αντιπροσωπεύει την αναμενόμενη ετήσια οικονομική ζημία από μια απειλή;","opts":[{"k":"A","v":"Single Loss Expectancy (SLE), υπολογιζόμενο ως αξία στοιχείου πολλαπλασιασμένη με συντελεστή έκθεσης."},{"k":"B","v":"Return on Security Investment (ROSI), υπολογιζόμενο ως μείωση κινδύνου μείον κόστος ελέγχων."},{"k":"C","v":"Annualized Rate of Occurrence (ARO), μετρώντας την εκτιμώμενη συχνότητα εμφάνισης συμβάντων."},{"k":"D","v":"Mean Time to Recovery (MTTR), μετρώντας τη μέση χρονική διάρκεια αποκατάστασης των συστημάτων."},{"k":"E","v":"Annualized Loss Expectancy (ALE), υπολογιζόμενο ως το γινόμενο του SLE με το ARO."}],"ans":"E","exp":"Το Annualized Loss Expectancy (ALE = SLE × ARO) αντιπροσωπεύει την αναμενόμενη ετήσια οικονομική ζημία από έναν συγκεκριμένο κίνδυνο."},{"q":"Ποιο βασικό όφελος ασφάλειας επιτυγχάνεται με την επιβολή του \'Διαχωρισμού Καθηκόντων\' (Separation of Duties) σε κρίσιμες ροές εργασίας;","opts":[{"k":"A","v":"Αποτρέπει την απάτη και τα κρίσιμα σφάλματα απαιτώντας συνεργασία ή έγκριση από περισσότερα του ενός άτομα."},{"k":"B","v":"Εξαλείφει την ανάγκη διατήρησης κεντρικών παρόχων ταυτότητας και συστημάτων διαχείρισης διαπιστευτηρίων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Εγγυάται ότι η χρήση του υλικού διακομιστών παραμένει ομοιόμορφα κατανεμημένη στους πυρήνες CPU, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Επιλύει αυτόματα προβλήματα καθυστέρησης επιπέδου μεταφοράς σε κατανεμημένα δίκτυα ευρείας περιοχής, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Κρυπτογραφεί τα εσωτερικά κανάλια επικοινωνίας με μετα-κβαντική ασύμμετρη κρυπτογραφία πλεγμάτων, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"A","exp":"Ο Διαχωρισμός Καθηκόντων αποτρέπει απάτες και κρίσιμα λάθη διασπώντας τις ευαίσθητες ενέργειες σε πολλαπλά πρόσωπα, απαιτώντας συνωμοσία για την τέλεση παραβίασης."}]},{"part":"Μέρος 1 · Θεμέλια","time":"Κεφάλαιο 2 · ⏱️ 7–9 ώρες μελέτης","title":"2. Ασφάλεια Λειτουργικών Συστημάτων: Αρχιτεκτονική POSIX και Windows","subtitle":"Διακριτικός έλεγχος πρόσβασης · Ειδικά δικαιώματα · ACL και capabilities · Υποχρεωτικοί έλεγχοι · Token, UAC και επίπεδα ακεραιότητας στα Windows","outcomes":["Να διαβάζετε, να ερμηνεύετε και να ορίζετε δικαιώματα POSIX σε συμβολική και οκταδική μορφή.","Να εξηγείτε τον σκοπό και τους κινδύνους των ειδικών δικαιωμάτων SetUID, SetGID και sticky bit.","Να περιγράφετε πώς οι ACL, οι δυνατότητες (capabilities) και ο υποχρεωτικός έλεγχος πρόσβασης (SELinux, AppArmor) εξειδικεύουν το βασικό μοντέλο δικαιωμάτων.","Να εξηγείτε τον ρόλο των SID, των διακριτικών πρόσβασης, του UAC και των επιπέδων ακεραιότητας στα Windows.","Να εντοπίζετε συνήθεις εσφαλμένες ρυθμίσεις λειτουργικών συστημάτων που επιτρέπουν κλιμάκωση προνομίων ή πλευρική κίνηση."],"intro":["Το λειτουργικό σύστημα είναι το πρώτο απτό όριο ασφάλειας που συναντά ο φοιτητής. Κάθε αρχείο, κάθε διεργασία και κάθε δικτυακή υποδοχή (socket) ελέγχεται τελικά από τον πυρήνα, ο οποίος αποφασίζει ποιος μπορεί να κάνει τι. Αν ο έλεγχος πρόσβασης του λειτουργικού συστήματος είναι λανθασμένα διαμορφωμένος, οι άμυνες υψηλότερου επιπέδου, όπως τα τείχη προστασίας ή το λογισμικό προστασίας από ιούς, συχνά παρακάμπτονται με ελάχιστη προσπάθεια.","Το κεφάλαιο συγκρίνει τις δύο κυρίαρχες οικογένειες ελέγχου πρόσβασης. Αρχικά εξηγεί το μοντέλο POSIX που χρησιμοποιούν το Linux, το macOS και τα υπόλοιπα συστήματα τύπου Unix, συμπεριλαμβανομένων των ειδικών δικαιωμάτων που αποτελούν συχνή αιτία κλιμάκωσης προνομίων. Στη συνέχεια προχωρά πέρα από τα απλά δικαιώματα, στις λίστες ελέγχου πρόσβασης (ACL), στις δυνατότητες (capabilities) του Linux και στα πλαίσια υποχρεωτικού ελέγχου πρόσβασης. Το δεύτερο μισό αφιερώνεται στα Windows: αναγνωριστικά ασφάλειας, διακριτικά πρόσβασης (access tokens), Έλεγχος Λογαριασμού Χρήστη (UAC), το μητρώο (registry) και τα υποχρεωτικά επίπεδα ακεραιότητας."],"sections":[{"id":"2.1","title":"Διακριτικός έλεγχος πρόσβασης POSIX: μοντέλο και λειτουργία","blocks":[{"type":"p","text":"Τα συστήματα POSIX εφαρμόζουν **διακριτικό έλεγχο πρόσβασης** (Discretionary Access Control, DAC): ο κάτοχος ενός αρχείου αποφασίζει ποιοι άλλοι μπορούν να έχουν πρόσβαση σε αυτό. Κάθε αρχείο έχει έναν κάτοχο (αναγνωριστικό χρήστη), μια ομάδα (αναγνωριστικό ομάδας) και τρία σύνολα δικαιωμάτων —για τον _κάτοχο_, την _ομάδα_ και τους _λοιπούς_. Κάθε σύνολο περιλαμβάνει τρία δικαιώματα: **ανάγνωση (r)**, **εγγραφή (w)** και **εκτέλεση (x)**. Στους καταλόγους η σημασία διαφοροποιείται ελαφρώς: η ανάγνωση επιτρέπει την εμφάνιση των ονομάτων, η εγγραφή τη δημιουργία ή διαγραφή εγγραφών και η εκτέλεση την είσοδο στον κατάλογο και την πρόσβαση στα αρχεία που περιέχει."},{"type":"p","text":"Τα δικαιώματα γράφονται συνήθως σε οκταδική μορφή, όπου η ανάγνωση αντιστοιχεί στο 4, η εγγραφή στο 2 και η εκτέλεση στο 1. Επομένως, η τιμή `640` σημαίνει _rw-_ για τον κάτοχο, _r--_ για την ομάδα και _---_ για όλους τους υπόλοιπους —μια τυπική ρύθμιση για αρχείο ρυθμίσεων που περιέχει μυστικά. Όταν μια διεργασία ζητά πρόσβαση, ο πυρήνας ελέγχει τις κατηγορίες με σειρά (κάτοχος, ομάδα, λοιποί) και εφαρμόζει μόνο την _πρώτη_ κατηγορία που ταιριάζει. Κατά συνέπεια, ένας κάτοχος που έχει αφαιρέσει από τον εαυτό του το δικαίωμα ανάγνωσης δεν αποκτά πρόσβαση, ακόμη κι αν οι «λοιποί» μπορούν να διαβάσουν το αρχείο."},{"type":"callout","kind":"example","title":"💡 Παράδειγμα εφαρμογής","text":"Η εντολή `chmod 750 /srv/reports` παρέχει στον κάτοχο πλήρη έλεγχο (7 = 4+2+1), επιτρέπει στα μέλη της ομάδας να βλέπουν και να εισέρχονται στον κατάλογο (5 = 4+1) και απαγορεύει κάθε πρόσβαση στους υπόλοιπους χρήστες (0). Ένας διακομιστής ιστού που εκτελείται με άσχετο λογαριασμό δεν θα μπορεί, επομένως, να διαβάσει τις αναφορές, ακόμη κι αν μια ευπάθεια του επιτρέπει να μαντέψει τη διαδρομή τους."}]},{"id":"2.2","title":"Ειδικά δικαιώματα: SetUID, SetGID και sticky bit","blocks":[{"type":"p","text":"Τρία πρόσθετα bit τροποποιούν τη συμπεριφορά των βασικών δικαιωμάτων. Το **SetUID** (οκταδικό 4000) προκαλεί την εκτέλεση ενός προγράμματος με τα προνόμια του _κατόχου_ του και όχι του χρήστη που το εκκίνησε. Με αυτόν τον τρόπο ένας απλός χρήστης μπορεί να αλλάξει τον κωδικό του με την εντολή `passwd`, ένα πρόγραμμα που ανήκει στον root και πρέπει να γράψει στο προστατευμένο αρχείο `/etc/shadow`. Το **SetGID** (2000) λειτουργεί ανάλογα για την ομάδα· όταν εφαρμόζεται σε κατάλογο, κάνει επιπλέον τα νέα αρχεία να κληρονομούν την ομάδα του καταλόγου, κάτι χρήσιμο για κοινόχρηστους φακέλους έργων. Το **sticky bit** (1000) σε κατάλογο με δικαίωμα εγγραφής για όλους, όπως ο `/tmp`, επιτρέπει σε κάθε χρήστη να διαγράφει μόνο τα δικά του αρχεία."},{"type":"p","text":"Τα προγράμματα SetUID που ανήκουν στον root είναι από τους πιο ελκυστικούς στόχους για τους επιτιθέμενους, επειδή οποιοδήποτε σφάλμα τους —υπερχείλιση ενδιάμεσης μνήμης, μη ασφαλής κλήση άλλου προγράμματος, διαδρομή βιβλιοθήκης με δικαίωμα εγγραφής— οδηγεί αμέσως σε πλήρη διαχειριστικό έλεγχο. Γι\' αυτό οι διαχειριστές συστημάτων οφείλουν να τα καταγράφουν περιοδικά (για παράδειγμα με την εντολή `find / -perm -4000 -type f`), να αφαιρούν το bit όπου δεν είναι απολύτως αναγκαίο και να προτιμούν λεπτομερέστερους μηχανισμούς, όπως οι δυνατότητες (capabilities)."}]},{"id":"2.3","title":"Πέρα από τα βασικά δικαιώματα: ACL, capabilities και υποχρεωτικός έλεγχος πρόσβασης","blocks":[{"type":"p","text":"Το μοντέλο κάτοχος–ομάδα–λοιποί είναι απλό, αλλά δεν μπορεί να εκφράσει κανόνες όπως _η Αλίκη μπορεί να διαβάσει αυτό το αρχείο και ο Βασίλης να το τροποποιήσει, ενώ κανείς άλλος δεν μπορεί να κάνει τίποτα από τα δύο_. Οι **λίστες ελέγχου πρόσβασης POSIX (ACL)** επιλύουν το πρόβλημα, προσθέτοντας εγγραφές για συγκεκριμένους χρήστες και ομάδες, οι οποίες διαχειρίζονται με την εντολή `setfacl` και εμφανίζονται με την `getfacl`. Μια εγγραφή _μάσκας_ περιορίζει τα μέγιστα δικαιώματα που μπορεί να λάβει οποιαδήποτε ονομαστική εγγραφή, επιτρέποντας στους διαχειριστές να περιορίζουν γρήγορα την πρόσβαση."},{"type":"p","text":"Οι **δυνατότητες (capabilities) του Linux** διασπούν το παντοδύναμο προνόμιο του root σε περίπου σαράντα ανεξάρτητες μονάδες. Ένας διακομιστής ιστού που χρειάζεται μόνο να δεσμεύσει τη θύρα 80 μπορεί να λάβει τη δυνατότητα `CAP_NET_BIND_SERVICE` αντί να εκτελείται ως root, ώστε η παραβίασή του να μην παρέχει έλεγχο ολόκληρου του συστήματος. Τέλος, τα πλαίσια **υποχρεωτικού ελέγχου πρόσβασης** (Mandatory Access Control, MAC), όπως τα **SELinux** και **AppArmor**, επιβάλλουν μια πολιτική σε επίπεδο συστήματος την οποία δεν μπορεί να παρακάμψει ούτε ο κάτοχος του αρχείου. Υπό καθεστώς MAC, μια παραβιασμένη διεργασία παραμένει περιορισμένη στους πόρους που της επιτρέπει ρητά η πολιτική —εφαρμογή της αρχής των ασφαλών προεπιλογών που εισήχθη στο Κεφάλαιο 1."}]},{"id":"2.4","title":"Αρχιτεκτονική ασφάλειας των Windows: ταυτότητες, token, UAC και μητρώο","blocks":[{"type":"p","text":"Τα Windows αναγνωρίζουν κάθε χρήστη, ομάδα και υπολογιστή μέσω ενός **αναγνωριστικού ασφάλειας** (Security Identifier, SID), μιας μοναδικής τιμής που παραμένει σταθερή ακόμη κι αν ο λογαριασμός μετονομαστεί. Όταν ένας χρήστης συνδέεται, η Τοπική Αρχή Ασφάλειας (LSA) δημιουργεί ένα **διακριτικό πρόσβασης** (access token), το οποίο περιέχει το SID του χρήστη, τα SID των ομάδων του και τα προνόμιά του. Κάθε διεργασία που εκκινεί ο χρήστης κληρονομεί αντίγραφο αυτού του διακριτικού. Αντικείμενα όπως αρχεία, κλειδιά μητρώου και υπηρεσίες φέρουν έναν **περιγραφέα ασφάλειας** (security descriptor), του οποίου η **λίστα διακριτικού ελέγχου πρόσβασης** (DACL) περιέχει εγγραφές που επιτρέπουν ή απαγορεύουν την πρόσβαση. Όταν μια διεργασία ζητά πρόσβαση, η Οθόνη Αναφοράς Ασφάλειας (Security Reference Monitor) συγκρίνει το διακριτικό με τη DACL· οι ρητές απαγορεύσεις αξιολογούνται πριν από τις άδειες."},{"type":"p","text":"Ο **Έλεγχος Λογαριασμού Χρήστη** (User Account Control, UAC) αντιμετωπίζει ένα ιστορικό πρόβλημα: για χρόνια, οι περισσότεροι χρήστες των Windows εργάζονταν μόνιμα ως διαχειριστές. Με το UAC, ένας διαχειριστής λαμβάνει κατά τη σύνδεση δύο διακριτικά —ένα _φιλτραρισμένο_ διακριτικό απλού χρήστη για την καθημερινή εργασία και ένα _πλήρες_ διακριτικό που ενεργοποιείται μόνο μετά από ρητή συγκατάθεση. Το **μητρώο** (registry), η ιεραρχική βάση δεδομένων που αποθηκεύει τις ρυθμίσεις του συστήματος και των εφαρμογών, προστατεύεται από τους ίδιους περιγραφείς ασφάλειας. Κλειδιά μητρώου όπως το `HKLM\\\\...\\\\Run` αποτελούν αγαπημένο σημείο εγκατάστασης μόνιμης παρουσίας (persistence) για το κακόβουλο λογισμικό· γι\' αυτό τα δικαιώματα και οι μεταβολές τους πρέπει να παρακολουθούνται."}]},{"id":"2.5","title":"Τα Windows σε βάθος: επίπεδα ακεραιότητας, προνόμια και επιφάνεια πλευρικής κίνησης","blocks":[{"type":"p","text":"Από τα Windows Vista και έπειτα, κάθε διεργασία και κάθε αντικείμενο φέρει επιπλέον ένα **υποχρεωτικό επίπεδο ακεραιότητας**: _Χαμηλό_, _Μεσαίο_, _Υψηλό_ ή _Συστήματος_. Μια διεργασία δεν μπορεί να γράψει σε αντικείμενο υψηλότερου επιπέδου ακεραιότητας, ανεξάρτητα από το τι ορίζει η DACL. Πρόκειται για άμεση εφαρμογή του μοντέλου Biba (Κεφάλαιο 1). Οι φυλλομετρητές ιστού αξιοποιούν αυτόν τον μηχανισμό, εκτελώντας τις διεργασίες απόδοσης περιεχομένου σε Χαμηλό επίπεδο ακεραιότητας, ώστε κακόβουλο περιεχόμενο ιστού να μην μπορεί να τροποποιήσει τα αρχεία του χρήστη ακόμη κι αν επιτύχει εκτέλεση κώδικα."},{"type":"p","text":"Ορισμένα **προνόμια** ενός διακριτικού είναι τόσο ισχυρά, ώστε ισοδυναμούν ουσιαστικά με πλήρη έλεγχο. Το `SeDebugPrivilege` επιτρέπει την ανάγνωση της μνήμης οποιασδήποτε διεργασίας —συμπεριλαμβανομένης της LSASS, όπου διατηρούνται διαπιστευτήρια— ενώ τα `SeImpersonatePrivilege` και `SeBackupPrivilege` έχουν επανειλημμένα χρησιμοποιηθεί για κλιμάκωση προνομίων. Σε ένα περιβάλλον τομέα (domain), αυτές οι τοπικές αδυναμίες μετατρέπονται σε δικτυακό πρόβλημα: τα αποθηκευμένα διαπιστευτήρια, οι κοινοί κωδικοί τοπικού διαχειριστή και τα πρωτόκολλα απομακρυσμένης διαχείρισης (SMB, WMI, WinRM, RDP) επιτρέπουν σε έναν επιτιθέμενο να κινηθεί πλευρικά από έναν παραβιασμένο σταθμό εργασίας σε πολλούς άλλους. Τα αντίμετρα περιλαμβάνουν μοναδικούς κωδικούς τοπικού διαχειριστή (Windows LAPS), το Credential Guard, την κλιμακωτή (tiered) διαχείριση και τον περιορισμό των λογαριασμών που επιτρέπεται να συνδέονται σε κάθε σύστημα."},{"type":"table","caption":"Πίνακας 2.1 — Σύγκριση ελέγχου πρόσβασης σε POSIX και Windows","head":["Χαρακτηριστικό","POSIX (Linux)","Windows"],"rows":[["Ταυτότητα","UID / GID","SID"],["Πολιτική ανά αντικείμενο","Βασικά δικαιώματα + προαιρετική ACL","Περιγραφέας ασφάλειας με DACL"],["Ανύψωση προνομίων","SetUID, sudo, capabilities","Συγκατάθεση UAC, προνόμια στο διακριτικό"],["Υποχρεωτικός έλεγχος","SELinux, AppArmor","Επίπεδα ακεραιότητας, AppContainer"],["Συνήθης οδός κλιμάκωσης","Ευάλωτο εκτελέσιμο SetUID","Κατάχρηση προνομίου διακριτικού, αδύναμη ACL υπηρεσίας"]]}]}],"terms":[{"name":"DAC","def":"Διακριτικός έλεγχος πρόσβασης: ο κάτοχος ενός πόρου αποφασίζει ποιος έχει πρόσβαση σε αυτόν."},{"name":"SetUID","def":"Ειδικό δικαίωμα που κάνει ένα πρόγραμμα να εκτελείται με τα προνόμια του κατόχου του."},{"name":"Δυνατότητα (capability)","def":"Αυτοτελής μονάδα του προνομίου root που μπορεί να παραχωρηθεί χωριστά."},{"name":"MAC","def":"Υποχρεωτικός έλεγχος πρόσβασης: πολιτική σε επίπεδο συστήματος που δεν μπορεί να παρακάμψει ο κάτοχος (SELinux, AppArmor)."},{"name":"Διακριτικό πρόσβασης","def":"Δομή των Windows που περιέχει την ταυτότητα, τις ομάδες και τα προνόμια μιας διεργασίας."},{"name":"Επίπεδο ακεραιότητας","def":"Ετικέτα των Windows (Χαμηλό–Συστήματος) που εμποδίζει διεργασίες χαμηλότερου επιπέδου να γράφουν σε αντικείμενα υψηλότερου."}],"summary":["Τα συστήματα POSIX ελέγχουν την πρόσβαση μέσω δικαιωμάτων για κάτοχο, ομάδα και λοιπούς· αποφασίζει η πρώτη κατηγορία που ταιριάζει.","Τα SetUID και SetGID είναι αναγκαία σε λίγα σημεία, αλλά αποτελούν βασικό στόχο κλιμάκωσης προνομίων και πρέπει να καταγράφονται.","Οι ACL προσθέτουν λεπτομερείς διακριτικούς κανόνες, οι δυνατότητες διασπούν το προνόμιο του root και ο MAC περιορίζει ακόμη και παραβιασμένες διεργασίες.","Τα Windows συνδυάζουν SID, διακριτικά πρόσβασης και DACL· το UAC διαχωρίζει την καθημερινή εργασία από τις διαχειριστικές ενέργειες.","Τα επίπεδα ακεραιότητας και η προσεκτική διαχείριση προνομίων περιορίζουν τόσο την τοπική κλιμάκωση όσο και την πλευρική κίνηση σε έναν τομέα."],"review":["Ένα αρχείο έχει δικαιώματα `604` και κάτοχο την alice. Μπορεί η alice να το διαβάσει; Μπορεί ο bob; Εξηγήστε τη σειρά αξιολόγησης που οδηγεί στην απάντησή σας.","Γιατί ένα ευάλωτο εκτελέσιμο SetUID που ανήκει στον root είναι πιο επικίνδυνο από την ίδια ευπάθεια σε ένα συνηθισμένο πρόγραμμα;","Συγκρίνετε τις δυνατότητες του Linux με τα προνόμια διακριτικού των Windows. Ποια αρχή ασφάλειας υλοποιούν και οι δύο μηχανισμοί;","Εξηγήστε πώς οι κοινοί κωδικοί τοπικού διαχειριστή διευκολύνουν την πλευρική κίνηση και περιγράψτε δύο αντίμετρα."],"cli":{"title":"Προσομοιωτής Ελέγχου Προνομίων ΛΣ & Ελέγχου Πρόσβασης","desc":"Ερευνήστε επικίνδυνα εκτελέσιμα SUID root, ελέγξτε τις επεκτάσεις POSIX ACLs και εξετάστε εγγραφές ελέγχου πρόσβασης DACL στα Windows.","meta":["⏱️ ~30 min","🐚 analyst@os-audit:~$"],"tasks":[{"pill":"Task 1","name":"Εντοπισμός Εκτελέσιμων SUID Root στο Σύστημα Αρχείων","instr":"Αναζητήστε στο σύστημα αρχείων εκτελέσιμα με ενεργό το SUID bit (`-perm -4000`) που εκτελούνται με προνόμια root.","hint":"Εκτελέστε: find / -perm -4000","cmd":"$ find / -perm -4000","ok":"Τα SUID εκτελέσιμα καταγράφηκαν! Εντοπίστηκε το μη ενισχυμένο εκτελέσιμο custom_backup_tool ."},{"pill":"Task 2","name":"Έλεγχος Εκτεταμένων Λιστών Ελέγχου Πρόσβασης (POSIX ACL)","instr":"Εξετάστε τα εκτεταμένα δικαιώματα πρόσβασης στο ευαίσθητο αρχείο `payroll.db` χρησιμοποιώντας το εργαλείο `getfacl`.","hint":"Εκτελέστε: getfacl payroll.db","cmd":"$ getfacl payroll.db","ok":"Το POSIX ACL ελέγχθηκε! Βρέθηκαν ενεργές εγγραφές ACE για τον χρήστη \'auditor\' και την ομάδα \'finance\'."},{"pill":"Task 3","name":"Αποκατάσταση Δικαιωμάτων ACL για Μη Εξουσιοδοτημένες Ομάδες","instr":"Ανακαλέστε όλα τα δικαιώματα πρόσβασης για την ομάδα `contractors` στο `payroll.db` χρησιμοποιώντας το `setfacl`.","hint":"Εκτελέστε: setfacl -m g:contractors:--- payroll.db","cmd":"$ setfacl -m g:contractors:--- payroll.db","ok":"Το ACL ενισχύθηκε! Η πρόσβαση της ομάδας συνεργατών αποκλείστηκε ρητά."},{"pill":"Task 4","name":"Έλεγχος Περιγραφέων Ασφάλειας Windows μέσω icacls","instr":"Προσομοιώστε την αξιολόγηση DACL των Windows για το εταιρικό λογιστικό φύλλο με το εργαλείο `icacls`.","hint":"Εκτελέστε: icacls C:\\\\Confidential\\\\Finances.xlsx","cmd":"$ icacls C:\\\\Confidential\\\\Finances.xlsx","ok":"Το Windows DACL επαληθεύτηκε. Πρόσβαση έχουν μόνο το SYSTEM, οι Administrators και οι Finance Users."}]},"lab":{"title":"Ενίσχυση Τερματικών Linux & Windows: DACL/SACL, AppArmor/SELinux & Άμυνες Κλιμάκωσης Προνομίων","desc":"Αυτό το τεχνικό εργαστήριο εξοπλίζει τους φοιτητές με πρακτικές δεξιότητες ενίσχυσης λειτουργικών συστημάτων σε περιβάλλοντα POSIX (Linux) και Windows NT. Θα αναλύσετε διαπιστευτήρια UID/GID, θα ελέγξετε την επιφάνεια επίθεσης SUID/SGID, θα συντάξετε πολιτικές Υποχρεωτικού Ελέγχου Πρόσβασης (MAC) με AppArmor/SELinux και θα αποδομήσετε Windows Access Tokens, SIDs, DACLs και SACLs.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Ubuntu 24.04 LTS VM (Linux terminal access with `sudo`)","Windows 11 / Windows Server 2022 VM (PowerShell and `icacls`)","Security tools: `getfacl`, `setfacl`, `aa-status`, `auditctl`, `accesschk.exe`, `whoami /priv`","GDB and strace for process privilege debugging"],"phases":[{"badge":"Phase 1","name":"Διαπιστευτήρια Διεργασιών POSIX & Εντοπισμός Ευπαθειών SUID","dur":"⏱️ 25 λεπτά","objs":["Διάκριση Πραγματικού UID (RUID), Ενεργού UID (EUID) και Αποθηκευμένου UID (SUID).","Εντοπισμός επικίνδυνων εκτελέσιμων SUID που εκτελούν εντολές κελύφους.","Επίδειξη απεμπόλησης προνομίων μέσω της κλήσης `setresuid()` σε C."],"steps":[{"type":"p","text":"1. Εξετάστε τα διαπιστευτήρια διεργασιών του τρέχοντος κελύφους:\\n```bash\\nid\\nps -eo pid,ruid,euid,comm | grep -E \'root|sudo\'\\n```"},{"type":"p","text":"2. Αναζητήστε εκτελέσιμα SUID με δικαίωμα καθολικής εκτέλεσης:\\n```bash\\nfind / -type f -perm -4000 -exec ls -ld {} + 2>/dev/null\\n```"},{"type":"p","text":"3. Αφαιρέστε το SUID bit από μη απαραίτητα εργαλεία:\\n```bash\\nsudo chmod u-s /usr/local/bin/legacy_backup\\n```"}]},{"badge":"Phase 2","name":"Λίστες Ελέγχου Πρόσβασης POSIX & Ενίσχυση Συστήματος Αρχείων Linux","dur":"⏱️ 45 λεπτά","objs":["Ρύθμιση λεπτομερών POSIX ACLs με `setfacl` και επαλήθευση με `getfacl`.","Επιβολή του Sticky Bit (`+t`) σε κοινόχρηστους καταλόγους (`/tmp`).","Προσάρτηση συστημάτων αρχείων με σημαίες `noexec`, `nosuid` και `nodev`."],"steps":[{"type":"p","text":"1. Δημιουργήστε έναν ασφαλή τμηματικό κατάλογο και ορίστε βασικά δικαιώματα:\\n```bash\\nsudo mkdir -p /srv/finance_data\\nsudo chown root:finance /srv/finance_data\\nsudo chmod 750 /srv/finance_data\\n```"},{"type":"p","text":"2. Παραχωρήστε δικαίωμα μόνο ανάγνωσης στον εξωτερικό ελεγκτή `compliance_user` χωρίς ένταξη στην ομάδα:\\n```bash\\nsudo setfacl -m u:compliance_user:r-x /srv/finance_data\\nsudo getfacl /srv/finance_data\\n```"},{"type":"p","text":"3. Επαληθεύστε τις επιλογές προσάρτησης στο `/etc/fstab` για τα `/tmp` και `/var/tmp`."}]},{"badge":"Phase 3","name":"Υποχρεωτικός Έλεγχος Πρόσβασης (MAC) με το AppArmor","dur":"⏱️ 30 λεπτά","objs":["Εξέταση ενεργών προφίλ περιορισμού AppArmor μέσω του `aa-status`.","Σύνταξη και επιβολή αυστηρού προφίλ AppArmor για προσαρμοσμένο Python daemon.","Επαλήθευση αποτροπής όταν ο daemon επιχειρεί μη εξουσιοδοτημένη πρόσβαση αρχείων."],"steps":[{"type":"p","text":"1. Ελέγξτε την κατάσταση λειτουργίας του AppArmor:\\n```bash\\nsudo aa-status\\n```"},{"type":"p","text":"2. Δημιουργήστε προφίλ AppArmor στο `/etc/apparmor.d/opt.fintech.daemon` που επιτρέπει μόνο σύνδεση δικτύου στη θύρα 8080 και ανάγνωση ρυθμίσεων."},{"type":"p","text":"3. Φορτώστε το προφίλ σε κατάσταση επιβολής (enforce mode):\\n```bash\\nsudo apparmor_parser -r /etc/apparmor.d/opt.fintech.daemon\\n```"},{"type":"p","text":"4. Επαληθεύστε την απόρριψη στα logs κατά την απόπειρα ανάγνωσης του `/etc/shadow`:\\n```bash\\nsudo dmesg | grep -i apparmor\\n```"}]},{"badge":"Phase 4","name":"Αρχιτεκτονική Ελέγχου Πρόσβασης Windows: Tokens, DACLs & SACLs","dur":"⏱️ 20 λεπτά","objs":["Ανάλυση προνομίων Windows Access Token με την εντολή `whoami /priv`.","Έλεγχος λιστών DACL και SACL μέσω του PowerShell.","Αποκατάσταση χαλαρών δικαιωμάτων αντικειμένων με το `icacls`."],"steps":[{"type":"p","text":"1. Εξετάστε τα ενεργά προνόμια token και το επίπεδο ακεραιότητας (Integrity Level):\\n```cmd\\nwhoami /priv\\nwhoami /groups\\n```"},{"type":"p","text":"2. Ελέγξτε τα δικαιώματα NTFS σε ευαίσθητους καταλόγους:\\n```cmd\\nicacls C:\\\\EnterpriseSecrets\\n```"},{"type":"p","text":"3. Αφαιρέστε την κληρονομικότητα και παραχωρήστε ρητή ανάγνωση μόνο στους Ελεγκτές:\\n```cmd\\nicacls C:\\\\EnterpriseSecrets /inheritance:r /grant:r \\"CORP\\\\Auditors\\":(OI)(CI)(R)\\n```"}]}],"checklist":["Δεν παραμένουν μη επαληθευμένα εκτελέσιμα SUID στις διαδρομές του συστήματος.","Τα τμηματικά δεδομένα προστατεύονται με ρητά POSIX ACLs απορρίπτοντας μη εξουσιοδοτημένους χρήστες.","Το προφίλ AppArmor βρίσκεται σε enforce mode και μπλοκάρει επιτυχώς μη εξουσιοδοτημένες προσβάσεις.","Τα Windows NTFS DACLs έχουν απενεργοποιημένη την κληρονομικότητα και επιβάλλουν το Ελάχιστο Προνόμιο."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αυτοματοποιημένη Μηχανή Ενίσχυσης Τερματικών & Ελέγχου Συμμόρφωσης (Bash / PowerShell)","desc":"Μια διεθνής επιχείρηση που διαχειρίζεται υβριδικό στόλο 5.000 εξυπηρετητών Linux και Windows απαιτεί μια αυτοματοποιημένη μηχανή ελέγχου και ενίσχυσης ασφάλειας. Σας ανατίθεται να αναπτύξετε ένα διαπλατφορμικό εργαλείο που ελέγχει δικαιώματα αρχείων, παραμέτρους πυρήνα ( sysctl ), πολιτικές λογαριασμών, εκτελέσιμα SUID και ρυθμίσεις DACL/MAC βάσει του προτύπου CIS Benchmark Level 1.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Μηχανή Ελέγχου POSIX & Ασφάλειας Πυρήνα (Linux)","desc":"Δημιουργία του audit_linux.sh για έλεγχο SUID/SGID, καθολικά εγγράψιμων αρχείων και προστασιών ASLR.","spec":["Μέτρηση επιδόσεων AES-256-GCM έναντι ChaCha20-Poly1305 σε υψηλό φόρτο.","Υλοποίηση γεννήτριας μοναδικών nonces 96-bit για αποφυγή επαναχρησιμοποίησης κλειδιού στο GCM.","Καθορισμός παραμέτρων παραγωγής κλειδιών με PBKDF2 και Argon2id."],"deliv":"📦 Παραδοτέο Οροσήμου: Εκτελέσιμο σενάριο Bash + αποτελέσματα δοκιμών."},{"num":"M2","title":"Ελεγκτής Περιγραφέων Ασφάλειας & Tokens Windows (PowerShell)","desc":"Δημιουργία του Audit-WindowsSecurity.ps1 για ανάλυση περιγραφέων NTFS, προνομίων ( SeDebugPrivilege ) και UAC.","spec":["Σχεδιασμός υβριδικού πρωτοκόλλου ανταλλαγής κλειδιών με ECDH (X25519) και εφήμερα κλειδιά.","Υλοποίηση αγωγού επαλήθευσης ψηφιακών υπογραφών με RSA-PSS (4096-bit) και Ed25519.","Αρχιτεκτονική καταγραφής μη-αποποίησης με υπογεγραμμένα digests συναλλαγών."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα PowerShell + αρχείο καταγραφής δοκιμών."},{"num":"M3","title":"Υποσύστημα Αυτοματοποιημένης Αποκατάστασης & Επαναφοράς","desc":"Υλοποίηση σημαιών --remediate και --rollback που εφαρμόζουν ενισχυμένες ρυθμίσεις κρατώντας αντίγραφο ασφαλείας.","spec":["Σχεδιασμός ιεραρχίας PKI 3 επιπέδων: Offline Root CA, Issuing Intermediate CA και Leaf Services.","Προδιαγραφή αποθήκευσης κλειδιών σε HSM (FIPS 140-3 Level 3) με τελετές quorum.","Καθορισμός διανομής λιστών CRL και OCSP stapling."],"deliv":"📦 Παραδοτέο Οροσήμου: Μηχανή ενίσχυσης με επαληθευμένη λειτουργία rollback."},{"num":"M4","title":"Αντιστοίχιση CIS Benchmark & Επιτελικός Πίνακας Συμμόρφωσης","desc":"Δημιουργία τυποποιημένων αναφορών JSON και HTML με ποσοστά επιτυχίας/αποτυχίας ανά τερματικό.","spec":["Σύνταξη Πλάνου Διαχείρισης Κρυπτογραφικών Κλειδιών κατά NIST SP 800-57.","Καθιέρωση διαδικασιών αυτόματης ανανέωσης πιστοποιητικών (90 ημερών) και crypto-shredding.","Σχεδίαση χρονοδιαγράμματος μετάβασης σε Μετα-Κβαντική Κρυπτογραφία (PQC ML-KEM / ML-DSA)."],"deliv":"📦 Παραδοτέο Οροσήμου: Γεννήτρια αναφορών συμμόρφωσης + δείγμα τελικής έκθεσης."}],"deliverables":["Πλήρες Αποθετήριο Πηγαίου Κώδικα (`audit_linux.sh`, `Audit-WindowsSecurity.ps1`)","Πίνακας Αντιστοίχισης CIS Benchmark (`cis_controls_mapping.json`)","Αποδεικτικά Εκτέλεσης & Καταγραφές Ενίσχυσης","Αρχιτεκτονική & Τεχνική Τεκμηρίωση (8–10 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένης Υποδομής Mini-PKI & mTLS Reverse Proxy σε Python","desc":"Οι αρχιτεκτονικές μικροϋπηρεσιών απαιτούν αυτοματοποιημένη εσωτερική Υποδομή Δημόσιου Κλειδιού (PKI) για έκδοση πιστοποιητικών X.509 και επιβολή mutual TLS (mTLS). Θα κατασκευάσετε μια ολοκληρωμένη σουίτα PKI σε Python ( pki_engine.py ) με τη βιβλιοθήκη cryptography που δημιουργεί Root CA, εκδίδει πιστοποιητικά με επεκτάσεις SAN, παράγει λίστες ανάκλησης CRL και περιλαμβάνει έναν mTLS reverse proxy.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Παραγωγός Κρυπτογραφικών Root & Intermediate CAs","desc":"Υλοποίηση παραγωγής κλειδιών, δημιουργίας Root CA με Basic Constraints CA:TRUE και υπογραφής ενδιάμεσης CA.","spec":["Χρήση του `CertificateBuilder` με `is_ca=True` και `path_length=1` για τη Root CA.","Κρυπτογράφηση ιδιωτικών κλειδιών με AES-256-CBC (`BestAvailableEncryption`).","Εξαγωγή πιστοποιητικών σε μορφή PEM και επαλήθευση επεκτάσεων X.509 v3."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα ca_builder.py + πιστοποιητικά root/intermediate."},{"num":"M2","title":"Αναλυτής CSR & Μηχανή Έκδοσης Πιστοποιητικών SAN","desc":"Κατασκευή μηχανής που διαβάζει CSRs, επαληθεύει υπογραφές, προσθέτει Subject Alternative Names (SAN) και εκδίδει πιστοποιητικά.","spec":["Ανάγνωση CSR με το `load_pem_x509_csr` και επαλήθευση εσωτερικής υπογραφής.","Ενσωμάτωση επέκτασης `SubjectAlternativeName` με ονόματα DNS και διευθύνσεις IP.","Καθορισμός διάρκειας ισχύος (π.χ. 30 ημέρες) και υπογραφή με την ενδιάμεση CA."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα cert_issuer.py + εντολή CLI έκδοσης."},{"num":"M3","title":"Μηχανή Ανάκλησης CRL & Διακομιστής OCSP","desc":"Υλοποίηση μητρώου ανακλήσεων, υπογραφή λιστών CRL κατά το RFC 5280 και παροχή endpoint διάθεσης της CRL.","spec":["Χρήση του `CertificateRevocationListBuilder` για προσθήκη ανακληθέντων σειριακών αριθμών.","Υπογραφή της CRL με το κλειδί της CA και ορισμός ημερομηνίας `next_update`.","Ανάπτυξη ελαφρού HTTP server για διάθεση του `crl.pem`."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα revocation.py + σενάριο επαλήθευσης CRL."},{"num":"M4","title":"Εφαρμογή mTLS Reverse Proxy","desc":"Ανάπτυξη ασύγχρονου mTLS reverse proxy που απαιτεί πιστοποιητικό πελάτη υπογεγραμμένο από την CA και απορρίπτει ανακληθέντα πιστοποιητικά.","spec":["Παραμετροποίηση context SSL με `ssl.Purpose.CLIENT_AUTH`.","Επιβολή `ssl.CERT_REQUIRED`, φόρτωση trust bundle και επαλήθευση SAN πελάτη.","Δρομολόγηση εγκεκριμένης κίνησης στο backend και απόρριψη μη εξουσιοδοτημένων πελατών."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένη εφαρμογή mtls_proxy.py + σουίτα δοκιμών σύνδεσης."}],"deliverables":["Πλήρης πηγαίος κώδικας Mini-PKI (`/py_pki/`) με εργαλεία CLI","Διακομιστής Mutual TLS Reverse Proxy (`mtls_proxy.py`)","Αυτοματοποιημένες δοκιμές έκδοσης, ανάκλησης και επικύρωσης mTLS","Εγχειρίδιο Αρχιτεκτονικής PKI & Ασφάλειας (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 2","quiz":[{"q":"Γιατί το AES σε κατάσταση Galois/Counter Mode (AES-GCM) προτιμάται ευρέως έναντι του AES-CBC;","opts":[{"k":"A","v":"Το AES-GCM εξαλείφει την ανάγκη χρήσης οποιουδήποτε διανύσματος αρχικοποίησης (IV) ή nonce, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Το AES-GCM βασίζεται εξ ολοκλήρου σε ασύμμετρο πολλαπλασιασμό σημείων ελλειπτικών καμπυλών, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Το AES-GCM παρέχει αυθεντικοποιημένη κρυπτογράφηση (AEAD), διασφαλίζοντας ταυτόχρονα εμπιστευτικότητα και ακεραιότητα."},{"k":"D","v":"Το AES-GCM λειτουργεί αποκλειστικά με μήκος μπλοκ 512-bit για αντοχή σε κβαντικές επιθέσεις Shor, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Το AES-GCM δεν απαιτεί ειδικές εντολές επιτάχυνσης υλικού σε σύγχρονους επεξεργαστές x86 και ARM, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"C","exp":"Το AES-GCM είναι ένας τρόπος AEAD που παρέχει ταυτόχρονα εμπιστευτικότητα και επαλήθευση ακεραιότητας σε μία αποδοτική, παραλληλοποιήσιμη διαδικασία."},{"q":"Ποια καταστροφική συνέπεια ασφάλειας προκύπτει όταν επαναχρησιμοποιείται το ίδιο nonce με το ίδιο κλειδί στο AES-GCM;","opts":[{"k":"A","v":"Το κρυπτογραφημένο κείμενο διαγράφεται αυτόματα από την προσωρινή μνήμη του παραλήπτη, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Ο πυρήνας του λειτουργικού καταρρέει αμέσως λόγω μη διαχειρίσιμου κρυπτογραφικού σφάλματος μνήμης, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Το συμμετρικό κλειδί μετατρέπεται αυτόματα σε ασύμμετρο δημόσιο εκθέτη RSA χωρίς padding, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Το υποκλειδί αυθεντικοποίησης GHASH παραβιάζεται, επιτρέποντας στους επιτιθέμενους να πλαστογραφούν tags."},{"k":"E","v":"Ο παραλήπτης απορρίπτει τη σύνδεση TCP λόγω μη ευθυγραμμισμένης ακολουθίας bytes στο δίκτυο, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"D","exp":"Η επανάληψη nonce στο GCM καταστρέφει την αυθεντικοποίηση: ο επιτιθέμενος μπορεί να ανακτήσει το κλειδί GHASH και να πλαστογραφήσει tags για αυθαίρετα μηνύματα."},{"q":"Ποια μαθηματική ιδιότητα των συναρτήσεων κατακερματισμού διασφαλίζει ότι είναι υπολογιστικά ανέφικτο να βρεθούν ΟΠΟΙΑΔΗΠΟΤΕ δύο διαφορετικά μηνύματα με το ίδιο hash;","opts":[{"k":"A","v":"Αντίσταση Πρώτης Προεικόνας, διασφαλίζοντας ότι για δοθέν y είναι δύσκολο να βρεθεί x ώστε H(x) = y, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Αντίσταση Δεύτερης Προεικόνας, διασφαλίζοντας ότι για δοθέν x είναι δύσκολο να βρεθεί x\' ώστε H(x) = H(x\')."},{"k":"C","v":"Ντετερμινιστικό Μήκος Εξόδου, διασφαλίζοντας ότι όλα τα μηνύματα παράγουν πανομοιότυπο αριθμό bits, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Κριτήριο Αυστηρής Χιονοστιβάδας, διασφαλίζοντας ότι η αλλαγή ενός bit αλλάζει τουλάχιστον τα μισά bits εξόδου, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Αντίσταση σε Συγκρούσεις, διασφαλίζοντας ότι είναι υπολογιστικά ανέφικτο να βρεθεί οποιοδήποτε ζεύγος (x, x\') με H(x) = H(x\')."}],"ans":"E","exp":"Η Αντίσταση σε Συγκρούσεις απαιτεί να είναι υπολογιστικά αδύνατη η εύρεση οποιωνδήποτε δύο μηνυμάτων x και x\' με ίδιο αποτύπωμα H(x) = H(x\')."},{"q":"Πώς συγκρίνεται η Κρυπτογραφία Ελλειπτικών Καμπυλών (ECC) με το κλασικό RSA ως προς το μήκος κλειδιού και την υπολογιστική αποδοτικότητα;","opts":[{"k":"A","v":"Το ECC παρέχει ισοδύναμη ασφάλεια με το RSA χρησιμοποιώντας σημαντικά μικρότερα κλειδιά και λιγότερη υπολογιστική ισχύ."},{"k":"B","v":"Το ECC απαιτεί κλειδιά 4096-bit για να φτάσει το επίπεδο ασφάλειας ενός τυπικού ζεύγους κλειδιών RSA 1024-bit, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Το ECC είναι αποκλειστικά συμμετρικό και δεν υποστηρίζει ψηφιακές υπογραφές ή ανταλλαγή δημόσιων κλειδιών, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Το ECC είναι απόλυτα ευάλωτο σε κλασικές επιθέσεις εξαντλητικής αναζήτησης λόγω αλγορίθμων παραγοντοποίησης, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Το ECC αντικαθιστά την αριθμητική υπολοίπων με μη κρυπτογραφημένη ολίσθηση bits σε κοινόχρηστους καταχωρητές, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"A","exp":"Ένα κλειδί ECC 256-bit προσφέρει ασφάλεια ισοδύναμη με RSA 3072-bit, προσφέροντας ταχύτερους υπολογισμούς και μικρότερο μέγεθος υπογραφών."},{"q":"Ποιο βασικό σκοπό εξυπηρετεί το Πρωτόκολλο Κατάστασης Πιστοποιητικών Online (OCSP) σε μια υποδομή PKI X.509;","opts":[{"k":"A","v":"Δημιουργεί αυτόματα νέα ιδιωτικά κλειδιά RSA κάθε φορά που ένας περιηγητής συνδέεται σε διακομιστή, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Ελέγχει σε πραγματικό χρόνο εάν ένα ψηφιακό πιστοποιητικό έχει ανακληθεί πριν από την προγραμματισμένη λήξη του."},{"k":"C","v":"Κρυπτογραφεί τα πακέτα επίλυσης DNS χρησιμοποιώντας μετα-κβαντικούς αλγορίθμους πλεγμάτων, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Αντικαθιστά τις Αρχές Πιστοποίησης διανέμοντας peer-to-peer διακριτικά εμπιστοσύνης στους πελάτες, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Μετατρέπει μη κρυπτογραφημένα αιτήματα HTTP σε κρυπτογραφημένες συνόδους TLS 1.3 χωρίς πιστοποιητικά, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"B","exp":"Το OCSP επιτρέπει στους πελάτες να ρωτούν την Αρχή Πιστοποίησης σε πραγματικό χρόνο για να εξακριβώσουν αν ένα πιστοποιητικό έχει ανακληθεί."},{"q":"Ποιος είναι ο βασικός κρυπτογραφικός μηχανισμός πίσω από τα πρωτόκολλα Diffie–Hellman (DH) και ECDH;","opts":[{"k":"A","v":"Υπογράφει εκτελέσιμα δυαδικά αρχεία με ιδιωτικό κλειδί για να αποδείξει την αυθεντικότητά τους στο λειτουργικό, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Συμπιέζει μεγάλα αρχεία καταγραφών σε μικρά σταθερά αποτυπώματα hash για μακροχρόνια αρχειοθέτηση, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Επιτρέπει σε δύο μέρη να δημιουργήσουν ένα κοινό μυστικό κλειδί μέσω μη ασφαλούς καναλιού χωρίς να το μεταδώσουν."},{"k":"D","v":"Κρυπτογραφεί σκληρούς δίσκους με κύριο κωδικό ανάκτησης αποθηκευμένο σε μονάδα ασφαλείας υλικού (HSM), πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Κρυπτογραφεί πίνακες βάσεων δεδομένων με συμμετρικούς αλγορίθμους ροής και στατικούς κωδικούς, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"C","exp":"Η ανταλλαγή κλειδιών Diffie–Hellman επιτρέπει σε δύο μέρη να παράγουν ένα κοινό μυστικό κλειδί μέσω ανασφαλούς δικτύου χωρίς να το στείλουν ποτέ."},{"q":"Ποια εγγύηση ασφάλειας παρέχει η \'Τέλεια Μελλοντική Μυστικότητα\' (PFS) στις επικοινωνίες πρωτοκόλλου TLS;","opts":[{"k":"A","v":"Ο διακομιστής ιστού προστατεύεται εγγυημένα από κατανεμημένες επιθέσεις άρνησης εξυπηρέτησης (DDoS), σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Οι πελάτες απαλλάσσονται μόνιμα από την επαλήθευση της αλυσίδας πιστοποίησης των Root CA, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Όλα τα cookies συνόδου κατακερματίζονται αυτόματα με SHA-3 πριν από τη μετάδοση στο τοπικό δίκτυο, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Η παραβίαση του μακροπρόθεσμου ιδιωτικού κλειδιού του διακομιστή δεν αποκαλύπτει παλαιότερες κρυπτογραφημένες συνόδους."},{"k":"E","v":"Οι συμμετρικοί αλγόριθμοι κρυπτογράφησης αναβαθμίζονται δυναμικά σε μήκος 1024-bit ανά πακέτο, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"D","exp":"Το PFS χρησιμοποιεί εφήμερα κλειδιά συνόδου (π.χ. ECDHE). Αν το μόνιμο ιδιωτικό κλειδί του διακομιστή κλαπεί αργότερα, οι επιτιθέμενοι δεν μπορούν να αποκρυπτογραφήσουν παλαιότερη κίνηση."},{"q":"Γιατί η κατάσταση Electronic Codebook (ECB) θεωρείται επικίνδυνα ανασφαλής για κρυπτογράφηση δομημένων δεδομένων;","opts":[{"k":"A","v":"Το ECB απαιτεί συνεχή σύνδεση στο διαδίκτυο με Αρχές Πιστοποίησης κατά τη διάρκεια της κρυπτογράφησης, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Το ECB δεν μπορεί να υλοποιηθεί σε υλικό επειδή χρησιμ
