:"⏱️ 45 λεπτά","objs":["Ιχνηλάτηση πλευρικής μετακίνησης μέσω SMB/WMI (EventID 4688, Sysmon EventID 1).","Ανίχνευση κλιμάκωσης προνομίων σε Domain Admin μέσω υποκλοπής του NTDS.dit.","Χαρτογράφηση μετακίνησης του επιτιθέμενου σε δευτερεύοντες διακομιστές."],"steps":[{"type":"p","text":"1. Αναζήτηση απομακρυσμένης δημιουργίας υπηρεσιών (EventID 7045):\\n```bash\\ngrep -E \'7045|PSEXESVC\' /var/log/soc_incident/system_events.log\\n```"},{"type":"p","text":"2. Εντοπισμός καταγραφών σεναρίων PowerShell (EventID 4104) με συσκοτισμένες εντολές:\\n```bash\\ngrep -A 5 -E \'ScriptBlockText\' /var/log/soc_incident/powershell_events.log\\n```"},{"type":"p","text":"3. Σχεδίαση του γραφήματος πλευρικής μετακίνησης από το αρχικό τερματικό προς τον domain controller."}]},{"badge":"Phase 3","name":"Απομόνωση Τερματικών, Ανάκληση Διαπιστευτηρίων & Εξάλειψη Απειλής","dur":"⏱️ 30 λεπτά","objs":["Έκδοση εντολών δικτυακής απομόνωσης EDR στα 3 παραβιασμένα συστήματα.","Ανάκληση εισιτηρίων Kerberos TGT και καθολική επαναφορά κωδικού του λογαριασμού KRBTGT.","Αποκλεισμός διευθύνσεων C2 στο περιμετρικό firewall."],"steps":[{"type":"p","text":"1. Εκτέλεση απομόνωσης τερματικών:\\n```bash\\n./scripts/edr_cli.py isolate --host WS-FINANCE-04 --host SRV-LEDGER-01\\n```"},{"type":"p","text":"2. Αποκλεισμός διευθύνσεων C2 στο firewall:\\n```bash\\nsudo iptables -I INPUT -s 198.51.100.44 -j DROP\\n```"},{"type":"p","text":"3. Τερματισμός κακόβουλων προγραμματισμένων εργασιών και διαγραφή κλειδιών επιμονής από το μητρώο."}]},{"badge":"Phase 4","name":"Ανακατασκευή Περιστατικού, Χρονολόγιο & Έκθεση Διδαγμάτων (Post-Mortem)","dur":"⏱️ 20 λεπτά","objs":["Σύνθεση ενιαίου χρονολογίου συνδυάζοντας EDR, SIEM, firewalls και email logs.","Προσδιορισμός αρχικής αιτίας (Spearphishing έγγραφο με μακροεντολές).","Σύνταξη της επίσημης Έκθεσης Διδαγμάτων (Lessons Learned) και σχεδίου βελτίωσης."],"steps":[{"type":"p","text":"1. Παραγωγή συγκεντρωτικού πίνακα χρονολογίου:\\n```bash\\npython3 scripts/build_timeline.py --input /var/log/soc_incident/ --output master_timeline.csv\\n```"},{"type":"p","text":"2. Υπολογισμός δεικτών MTTD (Μέσος Χρόνος Ανίχνευσης) και MTTR (Μέσος Χρόνος Αποκατάστασης).\\n3. Παράδοση της τελικής επιτελικής ενημέρωσης διοίκησης."}]}],"checklist":["Το αρχικό διάνυσμα εισβολής ταυτοποιήθηκε πλήρως με ακριβές χρονικό σήμα.","Η πλευρική μετακίνηση μέσω SMB/WMI ιχνηλατήθηκε σε όλα τα επηρεασθέντα συστήματα.","Η απομόνωση EDR διέκοψε επιτυχώς τις συνδέσεις C2.","Η τελική έκθεση περιλαμβάνει μετρικές MTTD/MTTR και σαφείς συστάσεις βελτίωσης."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Επιχειρησιακό Εγχειρίδιο SOC & Αυτοματοποιημένη Ενορχήστρωση Απόκρισης (SOAR)","desc":"Ένας πάροχος κρίσιμων υποδομών εκσυγχρονίζει το 24/7 Κέντρο Επιχειρήσεων Ασφάλειας (SOC). Ως Επικεφαλής Αρχιτέκτονας Ανίχνευσης & Απόκρισης, σας ανατίθεται να αναπτύξετε έναν αγωγό Μηχανικής Ανίχνευσης (Detection Engineering με κανόνες Sigma), να κατασκευάσετε αυτοματοποιημένα εγχειρίδια SOAR (για phishing, κατάχρηση διαπιστευτηρίων και ransomware) και να συντάξετε εκστρατείες προληπτικής αναζήτησης απειλών (Threat Hunting).","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Αγωγός Μηχανικής Ανίχνευσης & Μηχανή Μετατροπής Sigma","desc":"Ανάπτυξη του detection_compiler.py για επικύρωση κανόνων Sigma και αυτόματη μεταγλώττιση σε γλώσσες ερωτημάτων SIEM.","spec":["Μοντελοποίηση απειλών σε εφαρμογές LLM βάσει MITRE ATLAS και OWASP Top 10 for LLMs.","Ανάλυση κινδύνων: Direct Prompt Injection, Data Poisoning, Insecure Output Handling.","Αρχιτεκτονική ορίων εμπιστοσύνης μεταξύ εισόδου χρήστη και εσωτερικών εργαλείων agent."],"deliv":"📦 Παραδοτέο Οροσήμου: Κώδικας μεταγλωττιστή + σουίτα 15 επικυρωμένων κανόνων Sigma."},{"num":"M2","title":"Μηχανή Αυτοματοποίησης Εγχειριδίων SOAR","desc":"Ανάπτυξη ασύγχρονων handlers ενορχήστρωσης για αυτοματοποιημένες ενέργειες περιορισμού (μπλοκάρισμα IP, απομόνωση τερματικού) με έγκριση αναλυτή.","spec":["Αρχιτεκτονική διπλού LLM Guardrail gateway για έλεγχο prompts και απαντήσεων.","Σημασιολογικό φιλτράρισμα jailbreaks, τοξικού περιεχομένου και διαρροής PII/κωδικών.","Ενσωμάτωση canary tokens για εντοπισμό υποκλοπής system prompt."],"deliv":"📦 Παραδοτέο Οροσήμου: Σενάρια SOAR playbooks + δοκιμές ολοκλήρωσης."},{"num":"M3","title":"Εκστρατεία Δομημένης Προληπτικής Αναζήτησης Απειλών (Threat Hunting)","desc":"Σχεδιασμός και εκτέλεση 5 υποθέσεων threat hunting για εργαλεία LOLBins, μη ασφαλή service paths και επιθέσεις Kerberoasting.","spec":["Σχεδιασμός ασφαλούς RAG vector database με απομόνωση multi-tenant δεδομένων.","Εφαρμογή ACLs πρόσβασης σε επίπεδο κειμενικών chunks και επαλήθευση embeddings.","Καθαρισμός ανακτηθέντων δεδομένων πριν τη σύνθεση στο prompt του LLM."],"deliv":"📦 Παραδοτέο Οροσήμου: Εγχειρίδια threat hunting + αποτελέσματα εκτέλεσης ερωτημάτων."},{"num":"M4","title":"Καταστατικό Διακυβέρνησης SOC & Πίνακας Μετρικών","desc":"Σύνταξη διαδικασιών παράδοσης βάρδιας SOC, επιπέδων SLA, δεικτών MTTD/MTTR και συγγραφή του τελικού Εγχειριδίου Λειτουργίας SOC.","spec":["Αυτοματοποιημένο red-teaming στο CI/CD για έλεγχο ανθεκτικότητας σε adversarial prompts.","Πλαίσιο συμμόρφωσης με την Ευρωπαϊκή Πράξη για την Τεχνητή Νοημοσύνη (EU AI Act).","Σύνταξη Εταιρικής Πολιτικής Διακυβέρνησης AI & Διαχείρισης Μοντέλων."],"deliv":"📦 Παραδοτέο Οροσήμου: Εγχειρίδιο Λειτουργίας SOC & Καταστατικό Διακυβέρνησης (12–15 σελίδες)."}],"deliverables":["Πηγαίος Κώδικας Αγωγού Μηχανικής Ανίχνευσης (`/detection_pipeline/`)","Σουίτα 15 Εταιρικών Κανόνων Ανίχνευσης Sigma (`/rules/sigma_enterprise/`)","Σουίτα Αυτοματοποιημένων Σεναρίων SOAR (`/soar_playbooks/`)","Ολοκληρωμένο Εγχειρίδιο Λειτουργίας & Διακυβέρνησης SOC (12–15 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου AI Security Guardrail & LLM SAST Engine σε Python","desc":"Η ενσωμάτωση Μεγάλων Γλωσσικών Μοντέλων (LLMs) στις επιχειρήσεις εισάγει νέους κινδύνους (Prompt Injections, Jailbreaks, Διαρροή System Prompts), ενώ παράλληλα προσφέρει δυνατότητες για αυτοματοποιημένη στατική ανάλυση κώδικα (SAST). Θα κατασκευάσετε έναν AI security guardrail και αναλυτή ευπαθειών κώδικα σε Python ( ai_guardrail_sast.py ). Το εργαλείο θα προστατεύει LLMs από επιθέσεις prompt injection, θα ελέγχει canary tokens, θα αναλύει τον κώδικα σε Abstract Syntax Trees (AST) για εντοπισμό ευπαθειών OWASP Top 10 και θα καλεί LLMs (μέσω Ollama ή OpenAI API) για αυτόματη παραγωγή ασφαλών διορθώσεων.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Guardrail Προστασίας από Prompt Injection & Jailbreaks","desc":"Κατασκευή middleware επικύρωσης εισόδου που επιθεωρεί prompts χρηστών για μοτίβα παράκαμψης οδηγιών.","spec":["Εντοπισμός μοτίβων: `ignore previous instructions`, `DAN mode`, εντολές αποκωδικοποίησης Base64.","Υπολογισμός εντροπίας χαρακτήρων για εντοπισμό παραλλαγμένων ακολουθιών tokens.","Αποκλεισμός κακόβουλων prompts και επιστροφή ασφαλούς μηνύματος σφάλματος."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα guardrail_filter.py με επιτυχή αποκλεισμό 25 jailbreaks."},{"num":"M2","title":"Ελεγκτής Διαρροής System Prompt με Canary Tokens","desc":"Υλοποίηση μηχανισμού εισαγωγής canary tokens στα system prompts για άμεσο εντοπισμό διαρροής οδηγιών.","spec":["Παραγωγή μοναδικού canary token ανά σύνοδο: `CANARY_SECRET_xyz`.","Ενσωμάτωση οδηγίας στο system prompt για μη αποκάλυψη του canary token.","Έλεγχος απάντησης του μοντέλου: αν περιέχει το token, απόρριψη και παραγωγή ειδοποίησης CRITICAL."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα canary_monitor.py με επαλήθευση εντοπισμού διαρροής."},{"num":"M3","title":"Στατικός Αναλυτής Ευπαθειών Python AST","desc":"Κατασκευή αναλυτή AST NodeVisitor που διατρέχει αρχεία κώδικα Python για εντοπισμό επισφαλών συναρτήσεων.","spec":["Εντοπισμός Command Injection: `subprocess.Popen(shell=True)` ή `os.system` με συνένωση συμβολοσειρών.","Εντοπισμός SQL Injection: f-strings στο `cursor.execute()`.","Εντοπισμός επισφαλούς deserialization: `pickle.loads()` σε μη αξιόπιστα δεδομένα."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα ast_sast_scanner.py με εντοπισμό 10 ευπαθειών σε test repo."},{"num":"M4","title":"LLM Agent Αποκατάστασης & Αυτόματη Παραγωγή Patches","desc":"Σύνδεση των ευρημάτων του AST με LLM agent που εξηγεί την ευπάθεια και παράγει ασφαλή διόρθωση κώδικα (diff patch).","spec":["Δόμηση prompt με το ευάλωτο απόσπασμα κώδικα και τον κανόνα του AST προς το LLM API.","Λήψη τυποποιημένου Git unified diff με παραμετροποιημένο κώδικα.","Συντακτικός έλεγχος του παραγόμενου patch με `ast.parse()`."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένο εργαλείο ai_guardrail_sast.py + δοκιμές παραγωγής patches."}],"deliverables":["Πηγαίος κώδικας AI Guardrail & AST SAST (`/ai_guardrail/`)","Φάκελος κανόνων αποτροπής Prompt Injections & Jailbreaks","Μηχανή Στατικής Ανάλυσης Python AST","Τεχνική Έκθεση Ασφάλειας Τεχνητής Νοημοσύνης (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 11","quiz":[{"q":"Ποιος είναι ο τεχνικός μηχανισμός μιας επίθεσης \'Direct Prompt Injection\' κατά εφαρμογών Μεγάλων Γλωσσικών Μοντέλων (LLM);","opts":[{"k":"A","v":"Υπερχείλιση των καταχωρητών μνήμης της GPU κατά τον πολλαπλασιασμό τανυστών του μοντέλου, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Διαμόρφωση εισόδου χρήστη που υπερισχύει των οδηγιών συστήματος, εξαναγκάζοντας το μοντέλο σε μη εγκεκριμένες ενέργειες."},{"k":"C","v":"Αποκρυπτογράφηση του συνόλου δεδομένων προ-εκπαίδευσης με χρήση κβαντικών αλγορίθμων παραγοντοποίησης, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Υποκλοπή πακέτων Ethernet μεταξύ διεπαφής ιστού και πύλης API χρησιμοποιώντας φυσικές παγίδες καλωδίων, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Μετατροπή σχεσιακών πινάκων SQL σε απλά αρχεία κειμένου αποθηκευμένα τοπικά στον δίσκο, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"B","exp":"Το Direct Prompt Injection συμβαίνει όταν η είσοδος του χρήστη παρακάμπτει τις οδηγίες συστήματος (system prompts) του LLM, εξαναγκάζοντας το μοντέλο να εκτελέσει μη εξουσιοδοτημένες εντολές ή να διαρρεύσει μυστικά."},{"q":"Πώς διαφέρει μια επίθεση \'Indirect Prompt Injection\' από μια άμεση έγχυση prompt;","opts":[{"k":"A","v":"Η επίθεση απαιτεί φυσική παρέμβαση στο υλικό της μητρικής κάρτας των εξυπηρετητών του κέντρου δεδομένων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Η επίθεση τροποποιεί τα βάρη των νευρωνικών δικτύων απευθείας στον δίσκο πριν από την εκτέλεση, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Οι κακόβουλες οδηγίες είναι ενσωματωμένες σε εξωτερικά δεδομένα (ιστοσελίδες, PDFs, emails) που διαβάζει το μοντέλο."},{"k":"D","v":"Η επίθεση εκτελείται αποκλειστικά μέσω αναλογικών τηλεφωνικών γραμμών του δημόσιου δικτύου, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Η επίθεση αναγκάζει τον περιηγητή να διαγράψει όλα τα τοπικά δεδομένα και τα προσωρινά αρχεία, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"C","exp":"Στο indirect prompt injection, ο επιτιθέμενος τοποθετεί εντολές σε εξωτερικά αρχεία ή ιστοσελίδες που επεξεργάζεται το LLM, κάνοντάς το να εκτελέσει κακόβουλες ενέργειες (π.χ. εξαγωγή δεδομένων)."},{"q":"Τι είναι η \'Δηλητηρίαση Δεδομένων Εκπαίδευσης\' (Training Data Poisoning) στην ασφάλεια μηχανικής μάθησης;","opts":[{"k":"A","v":"Κατακλυσμός της πύλης API με τεράστιο όγκο κατανεμημένης κίνησης άρνησης εξυπηρέτησης (DDoS), χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Εξαγωγή των υπερπαραμέτρων του μοντέλου παρατηρώντας τις διακυμάνσεις κατανάλωσης ισχύος της GPU, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Κρυπτογράφηση πινάκων βάσεων δεδομένων με εφήμερα συμμετρικά κλειδιά ανά γραμμή συναλλαγής, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Αλλοίωση των δεδομένων εκπαίδευσης για εισαγωγή backdoors, προκαταλήψεων ή μείωση της ακρίβειας ταξινόμησης."},{"k":"E","v":"Απενεργοποίηση των κανόνων firewall του λειτουργικού κατά την επανεκπαίδευση του μοντέλου, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"D","exp":"Η δηλητηρίαση δεδομένων συμβαίνει όταν ο επιτιθέμενος αλλοιώνει το σύνολο εκπαίδευσης, εισάγοντας κρυφά μοτίβα (backdoors) που αναγκάζουν το μοντέλο να κάνει λάθη σε συγκεκριμένες εισόδους."},{"q":"Ποια απειλή ασφάλειας αφορά τις \'Επιθέσεις Εξαγωγής Μέλους\' (Membership Inference Attacks) σε μοντέλα ML;","opts":[{"k":"A","v":"Εκτέλεση αυθαίρετου κώδικα μηχανής μέσα στην προσωρινή μνήμη εντολών της κάρτας γραφικών GPU, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Συμπίεση των βαρών των νευρωνικών δικτύων σε μη κρυπτογραφημένα αρχεία ήχου στον δίσκο, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Παράκαμψη ελέγχων πρόσβασης του λειτουργικού κατά τη συλλογή πτητικής μνήμης RAM από τον πυρήνα, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Αλλοίωση των περιβαλλοντικών θερμοκρασιών ψύξης στις αίθουσες των κέντρων δεδομένων, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Εξακρίβωση του εάν τα ευαίσθητα δεδομένα ενός συγκεκριμένου ατόμου περιλαμβάνονταν στο σύνολο εκπαίδευσης."}],"ans":"E","exp":"Οι επιθέσεις εξαγωγής μέλους επιτρέπουν στον επιτιθέμενο να εξακριβώσει εάν ένα συγκεκριμένο αρχείο (π.χ. ιατρικός φάκελος ασθενούς) χρησιμοποιήθηκε στην εκπαίδευση του μοντέλου, παραβιάζοντας την ιδιωτικότητα."},{"q":"Ποιος είναι ο σκοπός της χρήσης \'Canary Tokens\' στις οδηγίες συστήματος και στα δεδομένα πλαισίου ενός AI;","opts":[{"k":"A","v":"Ενσωμάτωση μοναδικών ανιχνεύσιμων συμβολοσειρών για τον εντοπισμό διαρροής των οδηγιών συστήματος στην έξοδο."},{"k":"B","v":"Επιτάχυνση των πράξεων πολλαπλασιασμού τανυστών σε κατανεμημένες συστοιχίες GPUs στο cloud, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Αντικατάσταση της ασύμμετρης κρυπτογραφίας με συμμετρικούς αλγορίθμους σε κατάσταση counter mode, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Απενεργοποίηση των ελέγχων επαλήθευσης πιστοποιητικών TLS στους περιηγητές των τελικών χρηστών, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Διαχείριση καρτών φυσικής πρόσβασης και βάσεων βιομετρικών δεδομένων προσωπικού στις εγκαταστάσεις, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"A","exp":"Το canary token είναι μια μυστική, μοναδική συμβολοσειρά στο system prompt. Αν ένας εισβολέας καταφέρει να αποσπάσει τις οδηγίες, η εμφάνιση του token στην έξοδο σημαίνει άμεσο συναγερμό διαρροής."},{"q":"Σύμφωνα με τον Κανονισμό της ΕΕ για την Τεχνητή Νοημοσύνη (EU AI Act), ποια κατηγορία κινδύνου ισχύει για συστήματα βιομετρικής κατηγοριοποίησης και κρίσιμων υποδομών;","opts":[{"k":"A","v":"Ελάχιστος Κίνδυνος (Minimal Risk), χωρίς κανονιστικές υποχρεώσεις ή τεχνικούς ελέγχους, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Υψηλός Κίνδυνος (High Risk), απαιτώντας αξιολόγηση συμμόρφωσης, διαχείριση κινδύνων, ανθρώπινη εποπτεία και κυβερνοασφάλεια."},{"k":"C","v":"Μηδενικός Κίνδυνος (Zero Risk), εξαιρώντας το λογισμικό από τους ευρωπαϊκούς κανονισμούς προστασίας δεδομένων, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Τυπικός Εμπορικός Κίνδυνος, απαιτώντας μόνο γενικές σημάνσεις καταναλωτικών ηλεκτρονικών προϊόντων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Πειραματικός Κίνδυνος, επιτρέποντας διάθεση χωρίς τεχνική τεκμηρίωση ασφάλειας, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"B","exp":"Ο Κανονισμός AI της ΕΕ κατατάσσει τα συστήματα κρίσιμων υποδομών και βιομετρικής αναγνώρισης στον \'Υψηλό Κίνδυνο\', επιβάλλοντας αυστηρές απαιτήσεις διαχείρισης κινδύνων, διαφάνειας και κυβερνοασφάλειας."},{"q":"Πώς χρησιμοποιούν τα αυτοματοποιημένα εργαλεία AST την τεχνητή νοημοσύνη για τη διόρθωση ευάλωτου πηγαίου κώδικα;","opts":[{"k":"A","v":"Μεταγλωττίζοντας πηγαία αρχεία σε κρυπτογραφημένα δυαδικά αρχεία που εκτελούνται στον πυρήνα, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Απενεργοποιώντας όλες τις διαδικασίες επαλήθευσης πιστοποιητικών TLS στις μικροϋπηρεσίες, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Αναλύοντας τη ροή δεδομένων στο δέντρο σύνταξης και παράγοντας ασφαλή κώδικα (π.χ. παραμετροποιημένα ερωτήματα)."},{"k":"D","v":"Αντικαθιστώντας ερωτήματα SQL με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα τοπικά στον δίσκο, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Μετατρέποντας τον κώδικα JavaScript των περιηγητών σε ιδιόκτητα αναλογικά ακουστικά σήματα, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"C","exp":"Τα εργαλεία AST αναλύουν τη δομή του κώδικα και τη ροή δεδομένων από επικίνδυνες πηγές, χρησιμοποιώντας AI για την παραγωγή ασφαλών διορθώσεων (όπως parameterized queries και shlex escaping)."},{"q":"Τι είναι η \'Αντιστροφή Μοντέλου\' (Model Inversion) στην αντίπαλη μηχανική μάθηση;","opts":[{"k":"A","v":"Αντιστροφή της σειράς των επιπέδων νευρωνικών δικτύων για επιτάχυνση των υπολογισμών εκτέλεσης, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Μετατροπή ενός επιβλεπόμενου νευρωνικού δικτύου σε πολιτική ενισχυτικής μάθησης χωρίς επίβλεψη, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Εξαγωγή σειριακών αριθμών υλικού από το firmware της κάρτας γραφικών του εξυπηρετητή, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Ανακατασκευή ευαίσθητων χαρακτηριστικών των δεδομένων εκπαίδευσης (π.χ. πρόσωπα) μέσω ερωτημάτων στο API."},{"k":"E","v":"Αλλαγή των περιορισμών ξένων κλειδιών της βάσης κατά την εκτέλεση μεγάλου όγκου συναλλαγών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"D","exp":"Η επίθεση αντιστροφής μοντέλου εκμεταλλεύεται τις τιμές εμπιστοσύνης των προβλέψεων για να ανακατασκευάσει ευαίσθητα δεδομένα εκπαίδευσης (όπως φωτογραφίες προσώπων που χρησιμοποιήθηκαν στην εκπαίδευση)."},{"q":"Ποιος αμυντικός μηχανισμός τοποθετείται μπροστά από εταιρικά LLMs για την αποκοπή κακόβουλων prompts και τον καθαρισμό εξόδου;","opts":[{"k":"A","v":"Stateless τείχη προστασίας πακέτων που λειτουργούν αποκλειστικά σε επίπεδο διευθύνσεων MAC Layer 2, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Μονάδες αδιάλειπτης παροχής ισχύος UPS εγκατεστημένες στα ικριώματα των κέντρων δεδομένων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Εργαλεία βελτιστοποίησης μεταγλωττιστών που μετατρέπουν κώδικα Python σε στατικό κώδικα μηχανής C++, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Διακομιστές πρωτοκόλλου ώρας δικτύου NTP που συγχρονίζουν τα ρολόγια σε δίκτυα ευρείας περιοχής, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"AI Guardrail Gateways, αναλύοντας σημασιολογική πρόθεση, μπλοκάροντας jailbreaks και φιλτράροντας διαρροές PII."}],"ans":"E","exp":"Οι πύλες AI Guardrails ελέγχουν τις εισόδους για απόπειρες jailbreak και φιλτράρουν τις εξόδους του μοντέλου αποτρέποντας τη διαρροή προσωπικών δεδομένων (PII) και εταιρικών μυστικών."},{"q":"Τι είναι μια \'Επίθεση Διαφυγής\' (Evasion Attack) κατά ενός ταξινομητή κακόβουλου λογισμικού μηχανικής μάθησης;","opts":[{"k":"A","v":"Προσθήκη ανεπαίσθητων αλλαγών στο κακόβουλο δυαδικό αρχείο ώστε το μοντέλο ML να το θεωρήσει ασφαλές."},{"k":"B","v":"Υπερθέρμανση του επεξεργαστή του υπολογιστή για πρόκληση αυτόματης επανεκκίνησης ασφαλείας, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Αποκρυπτογράφηση κλειδιών AES-256 με επιθέσεις λεξικού σε συστοιχίες καρτών γραφικών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Αλλοίωση εγγραφών DNS για ανακατεύθυνση της κίνησης σε μη κρυπτογραφημένο εξυπηρετητή ιστού, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Διαγραφή αρχείων καταγραφής του λειτουργικού κατά τις νυχτερινές ώρες συντήρησης του συστήματος, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"A","exp":"Οι επιθέσεις διαφυγής προσθέτουν μικρές τροποποιήσεις (π.χ. αδρανή τμήματα κώδικα) στο κακόβουλο αρχείο, αλλοιώνοντας τα χαρακτηριστικά που εξετάζει το μοντέλο ML ώστε να το κατατάξει ως ακίνδυνο."}]},{"part":"Μέρος 4 · Λειτουργίες, Διερεύνηση και Διακυβέρνηση","time":"Κεφάλαιο 12 · ⏱️ 10–12 ώρες μελέτης","title":"12. Ανάλυση Κακόβουλου Λογισμικού, Ψηφιακή Εγκληματολογία και Αναγνώριση μέσω OSINT","subtitle":"Στατική αρχική αξιολόγηση · Δυναμική ανάλυση και ανάλυση συμπεριφοράς · Παθητική και ενεργητική αναγνώριση · Απαρίθμηση DNS · Δεοντολογία OSINT · Σειρά πτητικότητας · Χρονολόγια και ανάκτηση δεδομένων","outcomes":["Να πραγματοποιείτε στατική αρχική αξιολόγηση ενός ύποπτου αρχείου με συνόψεις, κεφαλίδες, εντροπία και συμβολοσειρές.","Να σχεδιάζετε μια ασφαλή δυναμική ανάλυση και να ερμηνεύετε τα ίχνη συμπεριφοράς.","Να διακρίνετε την παθητική από την ενεργητική αναγνώριση και να χαρτογραφείτε την επιφάνεια επίθεσης ενός οργανισμού μέσω τεχνικών DNS και μηχανών αναζήτησης.","Να εφαρμόζετε νομικούς, δεοντολογικούς κανόνες και κανόνες επιχειρησιακής ασφάλειας στην εργασία OSINT.","Να εφαρμόζετε τη σειρά πτητικότητας και την αλυσίδα επιμέλειας και να κατασκευάζετε χρονολόγιο από τα ίχνη του συστήματος αρχείων."],"intro":["Όταν σημειώνεται ένα περιστατικό, προκύπτουν τρία ερευνητικά ερωτήματα. Τι κάνει ο κακόβουλος κώδικας; Τι μπορεί να αποκαλύψει σε έναν αντίπαλο η έκθεση του οργανισμού; Και τι ακριβώς συνέβη στα επηρεαζόμενα συστήματα; Το κεφάλαιο εισάγει τους κλάδους που απαντούν σε αυτά: την ανάλυση κακόβουλου λογισμικού, την αναγνώριση μέσω πληροφοριών ανοιχτών πηγών (OSINT) και την ψηφιακή εγκληματολογία.","Οι τρεις κλάδοι μοιράζονται μια κοινή δεοντολογία. Οι αναλυτές εργάζονται σε ελεγχόμενα περιβάλλοντα, συλλέγουν πληροφορίες νόμιμα και χειρίζονται τα αποδεικτικά στοιχεία με τρόπο που διαφυλάσσει την ακεραιότητα και το παραδεκτό τους. Το κεφάλαιο κινείται από τη στατική και δυναμική ανάλυση ενός ύποπτου αρχείου, στη χαρτογράφηση της εξωτερικής επιφάνειας επίθεσης ενός οργανισμού και, τέλος, στις αρχές της εγκληματολογικής απόκτησης δεδομένων και στην ανασύνθεση των γεγονότων από τα ίχνη του συστήματος αρχείων."],"sections":[{"id":"12.1","title":"Στατική αρχική αξιολόγηση: συνόψεις, κεφαλίδες, εντροπία, συμβολοσειρές και packers","blocks":[{"type":"p","text":"Η **στατική ανάλυση** εξετάζει ένα αρχείο χωρίς να το εκτελεί και αποτελεί πάντοτε το πρώτο και ασφαλέστερο βήμα. Ο αναλυτής ξεκινά υπολογίζοντας **κρυπτογραφικές συνόψεις** (SHA-256), ώστε να ταυτοποιήσει μοναδικά το δείγμα και να αναζητήσει προηγούμενες αναφορές σε βάσεις πληροφοριών απειλών. Στη συνέχεια, η **κεφαλίδα** του αρχείου αποκαλύπτει τον πραγματικό του τύπο ανεξάρτητα από την επέκταση: τα εκτελέσιμα των Windows ξεκινούν με τα bytes `MZ` και η δομή τους _Portable Executable (PE)_ περιλαμβάνει χρονοσφραγίδες μεταγλώττισης, ενότητες και εισαγόμενες συναρτήσεις. Εισαγωγές όπως οι `VirtualAllocEx` και `CreateRemoteThread` υποδηλώνουν έγχυση σε διεργασίες· η `CryptEncrypt` μαζί με συναρτήσεις απαρίθμησης αρχείων μπορεί να παραπέμπει σε λυτρισμικό."},{"type":"p","text":"Η **εντροπία** μετρά την τυχαιότητα σε κλίμακα από 0 έως 8 bit ανά byte. Ο συνηθισμένος κώδικας έχει μέτρια εντροπία, ενώ ενότητες με εντροπία κοντά στο 8 είναι πιθανότατα συμπιεσμένες ή κρυπτογραφημένες —τυπική ένδειξη ενός **packer**, δηλαδή ενός εργαλείου που περιτυλίγει το πραγματικό φορτίο ώστε αυτό να αποκαλύπτεται μόνο στη μνήμη. Η εξαγωγή αναγνώσιμων **συμβολοσειρών** μπορεί να αποκαλύψει URL, διευθύνσεις IP, διαδρομές μητρώου ή μηνύματα σφάλματος, αν και οι δημιουργοί κακόβουλου λογισμικού συχνά τις συσκοτίζουν. Όταν απαιτείται βαθύτερη κατανόηση, οι **αποσυμβολομεταφραστές και αποσυμπιλητές** (disassemblers, decompilers), όπως τα Ghidra ή IDA, μεταφράζουν τον κώδικα μηχανής σε συμβολική γλώσσα ή ψευδο-C, επιτρέποντας στον αναλυτή να παρακολουθήσει τη λογική του προγράμματος."}]},{"id":"12.2","title":"Δυναμική ανάλυση και ανάλυση συμπεριφοράς","blocks":[{"type":"p","text":"Η **δυναμική ανάλυση** εκτελεί το δείγμα στο απομονωμένο εργαστήριο που περιγράφηκε στο Κεφάλαιο 11 και παρατηρεί τι κάνει. Αυτοματοποιημένα **περιβάλλοντα απομονωμένης εκτέλεσης** (sandboxes), όπως το CAPE ή αντίστοιχα εμπορικά, εκτελούν το αρχείο, καταγράφουν τη δραστηριότητά του και παράγουν αναφορά μέσα σε λίγα λεπτά. Η χειροκίνητη ανάλυση προσφέρει περισσότερο έλεγχο: ο αναλυτής λαμβάνει στιγμιότυπο, ενεργοποιεί εργαλεία παρακολούθησης, εκτελεί το δείγμα, αλληλεπιδρά μαζί του αν χρειάζεται και στη συνέχεια συγκρίνει την κατάσταση του συστήματος πριν και μετά την εκτέλεση."},{"type":"p","text":"Ο **έλεγχος συμπεριφοράς** εστιάζει στα ίχνη που αφήνει το δείγμα. Στο σύστημα αρχείων, οι αναλυτές αναζητούν αρχεία που δημιουργήθηκαν και έγγραφα που τροποποιήθηκαν· στο μητρώο, νέα κλειδιά _Run_ ή υπηρεσίες· στο δέντρο διεργασιών, θυγατρικές διεργασίες και έγχυση σε νόμιμες διεργασίες· και στο δίκτυο, ερωτήματα DNS και συνδέσεις με διακομιστές διοίκησης και ελέγχου. Εργαλεία όπως τα Process Monitor, Process Explorer, Regshot και Wireshark καταγράφουν αυτά τα συμβάντα, ενώ η παρακολούθηση κλήσεων API αποκαλύπτει ποιες λειτουργίες του συστήματος καλεί το κακόβουλο λογισμικό. Οι αναλυτές πρέπει να θυμούνται ότι ένα εξελιγμένο κακόβουλο πρόγραμμα μπορεί να αναγνωρίσει το sandbox —ελέγχοντας για εικονικό υλικό, μικρό χρόνο λειτουργίας ή απουσία δραστηριότητας χρήστη— και να παραμείνει αδρανές· επομένως, μια «καθαρή» αναφορά sandbox δεν αποτελεί ποτέ απόδειξη αθωότητας."}]},{"id":"12.3","title":"Αναγνώριση: παθητικές και ενεργητικές τεχνικές, dorking και DNS","blocks":[{"type":"p","text":"Η αναγνώριση είναι η πρώτη φάση του Kill Chain, και την πραγματοποιούν επίσης οι αμυνόμενοι, ώστε να βλέπουν τον οργανισμό τους όπως θα τον έβλεπε ένας επιτιθέμενος. Η **παθητική αναγνώριση** συλλέγει πληροφορίες χωρίς άμεση αλληλεπίδραση με τα συστήματα του στόχου: δημόσιους ιστοτόπους, μέσα κοινωνικής δικτύωσης, αγγελίες εργασίας που αποκαλύπτουν τις τεχνολογίες που χρησιμοποιούνται, εγγραφές WHOIS, αρχεία διαφάνειας πιστοποιητικών και βάσεις δεδομένων σαρώσεων ολόκληρου του διαδικτύου, όπως τα Shodan ή Censys. Η **ενεργητική αναγνώριση** αλληλεπιδρά με τον στόχο —σάρωση θυρών, λήψη εμβλημάτων υπηρεσιών (banner grabbing), δοκιμή καταλόγων με ωμή βία— και είναι επομένως ανιχνεύσιμη και νομικά επιτρεπτή μόνο με εξουσιοδότηση."},{"type":"p","text":"Οι μηχανές αναζήτησης είναι ισχυρά εργαλεία αναγνώρισης. Το **Google dorking** χρησιμοποιεί προηγμένους τελεστές, όπως οι `site:`, `filetype:` και `intitle:`, για τον εντοπισμό εκτεθειμένων εγγράφων, σελίδων σύνδεσης, αρχείων ρυθμίσεων ή λιστών καταλόγων που δεν προορίζονταν ποτέ για δημόσια χρήση. Η **απαρίθμηση DNS** χαρτογραφεί την παρουσία ενός οργανισμού στο διαδίκτυο: υποβολή ερωτημάτων για τύπους εγγραφών (A, MX, TXT, NS), ανακάλυψη υποτομέων μέσω αρχείων διαφάνειας πιστοποιητικών και βάσεων παθητικού DNS, και έλεγχος αν λανθασμένα ρυθμισμένοι διακομιστές ονομάτων επιτρέπουν _μεταφορές ζώνης_ που αποκαλύπτουν κάθε εγγραφή. Ξεχασμένοι υποτομείς που εξακολουθούν να παραπέμπουν σε καταργημένους πόρους νέφους μπορούν ακόμη και να _καταληφθούν_ από έναν επιτιθέμενο —κίνδυνος που οι τακτικές επισκοπήσεις της επιφάνειας επίθεσης έχουν σχεδιαστεί να εντοπίζουν."}]},{"id":"12.4","title":"Δεοντολογία OSINT, επιχειρησιακή ασφάλεια και αξιοποιήσιμη αναφορά","blocks":[{"type":"p","text":"Το ότι μια πληροφορία είναι δημόσια προσβάσιμη δεν σημαίνει ότι μπορεί να συλλεχθεί και να χρησιμοποιηθεί χωρίς όρια. Η εργασία OSINT πρέπει να σέβεται τον νόμο —οι κανόνες προστασίας δεδομένων, όπως ο ΓΚΠΔ, εφαρμόζονται στα προσωπικά δεδομένα ακόμη κι όταν αυτά είναι δημόσια— καθώς και τους όρους χρήσης των πλατφορμών και το συμφωνημένο πεδίο της ανάθεσης. Οι αναλυτές πρέπει να συλλέγουν μόνο ό,τι είναι αναγκαίο για τον δηλωμένο σκοπό και να μην επιχειρούν ποτέ πρόσβαση σε λογαριασμούς ή παράκαμψη ελέγχων πρόσβασης, κάτι που θα μετέτρεπε την αναγνώριση σε εισβολή."},{"type":"p","text":"Η **επιχειρησιακή ασφάλεια** (OPSEC) προστατεύει την ίδια την έρευνα: οι αναλυτές χρησιμοποιούν αποκλειστικά ερευνητικά περιβάλλοντα και λογαριασμούς, αποφεύγουν να αποκαλύψουν στον στόχο την ταυτότητα ή τον οργανισμό τους και τεκμηριώνουν τις πηγές τους με χρονοσφραγίδες και αρχειοθετημένα αντίγραφα, ώστε τα ευρήματα να είναι αναπαραγώγιμα. Η αξία της αναγνώρισης βρίσκεται σε όσα ακολουθούν. Μια **αναφορά επιφάνειας επίθεσης** πρέπει να μετατρέπει τα ευρήματα σε ιεραρχημένα δελτία αποκατάστασης με συγκεκριμένο υπεύθυνο —«κατάργηση του ορφανού υποτομέα `old-shop.example.com`», «αφαίρεση του εκτεθειμένου αρχείου αντιγράφου ασφαλείας»— αντί να παρουσιάζει έναν αδιαφοροποίητο κατάλογο ανακαλύψεων."}]},{"id":"12.5","title":"Αρχές εγκληματολογικής ανάλυσης, σειρά πτητικότητας και αλυσίδα επιμέλειας","blocks":[{"type":"p","text":"Η **ψηφιακή εγκληματολογία** είναι η επιστημονική συλλογή, διαφύλαξη, ανάλυση και παρουσίαση ψηφιακών αποδεικτικών στοιχείων με τρόπο που μπορεί να αντέξει τον νομικό έλεγχο. Η θεμελιώδης αρχή της, που απορρέει από την αρχή ανταλλαγής του Locard, είναι ότι κάθε ενέργεια αφήνει ίχνος —συμπεριλαμβανομένων των ενεργειών του ίδιου του ερευνητή. Τα αποδεικτικά στοιχεία πρέπει, επομένως, να αποκτώνται με τρόπο που τα μεταβάλλει όσο το δυνατόν λιγότερο, και κάθε βήμα πρέπει να τεκμηριώνεται. Οι δίσκοι αντιγράφονται bit προς bit σε εγκληματολογικά είδωλα με τη χρήση **αναστολέων εγγραφής** (write blockers), και κάθε είδωλο επαληθεύεται συγκρίνοντας τη σύνοψή του με εκείνη του πρωτοτύπου."},{"type":"p","text":"Επειδή ορισμένα δεδομένα εξαφανίζονται ταχύτερα από άλλα, τα αποδεικτικά στοιχεία συλλέγονται σύμφωνα με τη **σειρά πτητικότητας** (RFC 3227): πρώτα οι καταχωρητές και η κρυφή μνήμη του επεξεργαστή, έπειτα η κύρια μνήμη (RAM), συμπεριλαμβανομένων των διεργασιών σε εκτέλεση και των δικτυακών συνδέσεων· στη συνέχεια τα προσωρινά αρχεία και ο χώρος εναλλαγής· έπειτα τα περιεχόμενα του δίσκου· και, τέλος, τα απομακρυσμένα αρχεία καταγραφής και τα αρχειακά μέσα. Αν αποσυνδεθεί πρώτα το καλώδιο ρεύματος, καταστρέφονται τα πιο πτητικά —και συχνά τα πιο αποκαλυπτικά— αποδεικτικά στοιχεία. Κάθε στοιχείο καταχωρίζεται σε ένα αρχείο **αλυσίδας επιμέλειας** (chain of custody), το οποίο δηλώνει ποιος το συνέλεξε, πότε, πώς, πού φυλάχθηκε και σε ποιον παραδόθηκε. Ένα κενό σε αυτή την αλυσίδα μπορεί να καταστήσει μη παραδεκτά αποδεικτικά στοιχεία που κατά τα λοιπά είναι έγκυρα."}]},{"id":"12.6","title":"Ίχνη του συστήματος αρχείων, ανάκτηση δεδομένων και χρονολόγια","blocks":[{"type":"p","text":"Τα συστήματα αρχείων καταγράφουν πολύ περισσότερα από τα περιεχόμενα των αρχείων. Στα Windows, ο **Κύριος Πίνακας Αρχείων** (Master File Table, MFT) του NTFS αποθηκεύει μεταδεδομένα για κάθε αρχείο, συμπεριλαμβανομένων τεσσάρων χρονοσφραγίδων —δημιουργίας, τροποποίησης, πρόσβασης και αλλαγής της εγγραφής MFT— σε δύο χωριστά χαρακτηριστικά, κάτι που βοηθά τους ερευνητές να εντοπίζουν το _timestomping_, δηλαδή τη σκόπιμη παραποίηση χρονοσφραγίδων. Άλλα πολύτιμα ίχνη είναι το ημερολόγιο αλλαγών **$UsnJrnl**, τα αρχεία **Prefetch** που αποδεικνύουν ότι ένα πρόγραμμα εκτελέστηκε, τα αρχεία συντομεύσεων **LNK** και οι **Jump Lists** που αποκαλύπτουν πρόσφατα ανοιγμένα έγγραφα, τα **ShellBags** που καταγράφουν την πρόσβαση σε φακέλους και τα αρχεία συμβάντων των Windows. Η διαγραφή ενός αρχείου συνήθως αφαιρεί μόνο την εγγραφή του στον κατάλογο, οπότε τα περιεχόμενά του μπορεί να παραμένουν στον δίσκο έως ότου επαναχρησιμοποιηθεί ο χώρος."},{"type":"p","text":"Η **ανάκτηση αρχείων με βάση το περιεχόμενο** (file carving) ανακτά τέτοια διαγραμμένα δεδομένα αναζητώντας στον μη κατανεμημένο χώρο γνωστές υπογραφές αρχείων —για παράδειγμα την αρχή και το τέλος μιας εικόνας JPEG— χωρίς να βασίζεται στα μεταδεδομένα του συστήματος αρχείων. Τέλος, οι ερευνητές συνδυάζουν τις χρονοσφραγίδες όλων των πηγών σε ένα ενιαίο **υπερ-χρονολόγιο** (super-timeline), με εργαλεία όπως τα Plaso ή Autopsy. Ένα χρονολόγιο μετατρέπει χιλιάδες μεμονωμένα ίχνη σε αφήγηση: το μήνυμα ηλεκτρονικού ψαρέματος έφτασε στις 09:12, το συνημμένο άνοιξε στις 09:14, το PowerShell εκτελέστηκε στις 09:14:07, μια προγραμματισμένη εργασία δημιουργήθηκε στις 09:15 και τα δεδομένα συμπιέστηκαν και αποστάλθηκαν εκτός οργανισμού στις 02:30 της επόμενης νύχτας."}]}],"terms":[{"name":"Εντροπία","def":"Μέτρο τυχαιότητας· υψηλές τιμές υποδηλώνουν συμπιεσμένο ή κρυπτογραφημένο (packed) περιεχόμενο."},{"name":"Sandbox","def":"Απομονωμένο περιβάλλον που εκτελεί δείγματα και καταγράφει τη συμπεριφορά τους."},{"name":"Παθητική αναγνώριση","def":"Συλλογή πληροφοριών χωρίς άμεση αλληλεπίδραση με τα συστήματα του στόχου."},{"name":"Σειρά πτητικότητας","def":"Συλλογή αποδεικτικών στοιχείων από την πιο βραχύβια προς την πιο μόνιμη πηγή."},{"name":"Αλυσίδα επιμέλειας","def":"Τεκμηριωμένο αρχείο του ποιος χειρίστηκε τα αποδεικτικά στοιχεία, πότε και πώς."},{"name":"Υπερ-χρονολόγιο","def":"Ενιαία χρονολογική αλληλουχία γεγονότων που κατασκευάζεται από πολλές πηγές ιχνών."}],"summary":["Η στατική αρχική αξιολόγηση —συνόψεις, κεφαλίδες, εισαγόμενες συναρτήσεις, εντροπία και συμβολοσειρές— είναι το ασφαλές πρώτο βήμα και καθοδηγεί τη βαθύτερη ανάλυση.","Η δυναμική ανάλυση αποκαλύπτει τη συμπεριφορά, όμως το κακόβουλο λογισμικό με τεχνικές αποφυγής σημαίνει ότι ένα «καθαρό» αποτέλεσμα sandbox δεν αποδεικνύει τίποτα.","Η παθητική αναγνώριση, το dorking και η απαρίθμηση DNS επιτρέπουν στους αμυνόμενους να βλέπουν την έκθεσή τους όπως οι επιτιθέμενοι.","Η εργασία OSINT πρέπει να είναι νόμιμη, αναλογική και να λαμβάνει υπόψη την επιχειρησιακή ασφάλεια, ενώ τα αποτελέσματά της πρέπει να μετατρέπονται σε ενέργειες αποκατάστασης με συγκεκριμένο υπεύθυνο.","Η εγκληματολογική ανάλυση ακολουθεί τη σειρά πτητικότητας και την αλυσίδα επιμέλειας, ενώ τα χρονολόγια μετατρέπουν τα ίχνη σε αξιόπιστη αφήγηση."],"review":["Ένα αρχείο PE έχει μια ενότητα με εντροπία 7,9 και ελάχιστες εισαγόμενες συναρτήσεις. Τι συμπεραίνετε και ποιο είναι το επόμενο βήμα σας;","Γιατί ένα αποτέλεσμα sandbox «καμία κακόβουλη δραστηριότητα» δεν επαρκεί για να θεωρηθεί ασφαλές ένα ύποπτο αρχείο;","Κατατάξτε ως παθητικές ή ενεργητικές τις εξής ενέργειες: αναζήτηση σε αρχεία διαφάνειας πιστοποιητικών, σάρωση με Nmap, αναζήτηση στο Shodan, απόπειρα μεταφοράς ζώνης.","Γιατί πρέπει να συλλέγεται η μνήμη πριν από το είδωλο του δίσκου κατά την απόκριση σε σύστημα σε λειτουργία;"],"cli":{"title":"Προσομοιωτής Ψηφιακής Εγκληματολογίας, Ανάλυσης Μνήμης & Αναγνώρισης OSINT","desc":"Εξάγετε κρυφά μεταδεδομένα εγγράφου με το ExifTool, αναλύστε ένα memory dump με το Volatility 3 για εντοπισμό injected processes και εκτελέστε αναγνώριση OSINT.","meta":["⏱️ ~30 min","🐚 forensics@dfir-lab:~$"],"tasks":[{"pill":"Task 1","name":"Εξαγωγή Κρυφών Μεταδεδομένων Εγγράφου με το ExifTool","instr":"Εξάγετε όνομα συντάκτη, ημερομηνίες και έκδοση λογισμικού από το `confidential_leak.docx` με το `exiftool`.","hint":"Εκτελέστε: exiftool confidential_leak.docx","cmd":"$ exiftool confidential_leak.docx","ok":"Τα μεταδεδομένα εξήχθησαν! Εντοπίστηκε ο συντάκτης Attacker_Alias_Ghost και τα χρονικά σήματα."},{"pill":"Task 2","name":"Ανακατασκευή Δέντρου Διεργασιών από Memory Dump","instr":"Αναλύστε τις εκτελούμενες διεργασίες στο `memory.raw` με το πρόσθετο `windows.pstree` του Volatility 3.","hint":"Εκτελέστε: volatility -f memory.raw windows.pstree","cmd":"$ volatility -f memory.raw windows.pstree","ok":"Το δέντρο διεργασιών αναλύθηκε: Εντοπίστηκε η ύποπτη διεργασία ransom_core.exe (PID 3940)."},{"pill":"Task 3","name":"Εντοπισμός Εγχυμένου Κώδικα στη Μνήμη με το Malfind","instr":"Σαρώστε τη μνήμη για σελίδες με δικαιώματα RWX (PAGE_EXECUTE_READWRITE) χρησιμοποιώντας το `windows.malfind`.","hint":"Εκτελέστε: volatility -f memory.raw windows.malfind","cmd":"$ volatility -f memory.raw windows.malfind","ok":"ΕΝΤΟΠΙΣΜΟΣ MALFIND: Ανακαλύφθηκε εγχυμένο εκτελέσιμο PE στον χώρο μνήμης του PID 1024!"},{"pill":"Task 4","name":"Εκτέλεση Παθητικής Έρευνας OSINT WHOIS σε Domain","instr":"Αναζητήστε μεταδεδομένα καταχώρισης και nameservers για το domain `darkops-gateway.org`.","hint":"Εκτελέστε: whois darkops-gateway.org","cmd":"$ whois darkops-gateway.org","ok":"Τα στοιχεία WHOIS ανακτήθηκαν: Το domain κατοχυρώθηκε ανώνυμα σε bulletproof hosting provider."}]},"lab":{"title":"Ψηφιακή Εγκληματολογία & Ανακατασκευή Περιστατικού: Ανάλυση Μνήμης, Εξαγωγή Ευρημάτων Δίσκου & Αλυσίδα Επιμέλειας","desc":"Σε αυτό το εργαστήριο 2 ωρών, οι φοιτητές αναλαμβάνουν τον ρόλο Εμπειρογνώμονα Ψηφιακής Εγκληματολογίας (DFIR). Θα συντάξετε νομικά έγγραφα Αλυσίδας Επιμέλειας (Chain of Custody), θα επαληθεύσετε hashes ειδώλων (E01/DD), θα αναλύσετε αρχεία RAM με το Volatility 3, θα εξάγετε ευρήματα από τον δίσκο (Master File Table $MFT , Windows Prefetch, Shimcache, Shellbags) και θα ανακατασκευάσετε ένα ενοποιημένο χρονολόγιο γεγονότων.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["SIFT Workstation (SANS Investigative Forensic Toolkit) / REMnux VM","Forensic suites: `volatility3`, `exiftool`, `sleuthkit` (`fls`, `icat`, `mmls`), `log2timeline` / `plaso`","Evidence archive: `/evidence/suspect_endpoint.raw` and `/evidence/c_drive.e01`","Chain of Custody tracking forms (`/evidence/chain_of_custody_form.pdf`)"],"phases":[{"badge":"Phase 1","name":"Συλλογή Πειστηρίων, Κατακερματισμός (Hashing) & Αλυσίδα Επιμέλειας","dur":"⏱️ 25 λεπτά","objs":["Τεκμηρίωση παραλαβής πειστηρίων (σειριακοί αριθμοί, όνομα εξεταστή, hashes SHA-256).","Προσάρτηση ειδώλων δίσκου σε λειτουργία μόνο ανάγνωσης με write-blocking.","Εξέταση πινάκων κατατμήσεων με το εργαλείο `mmls`."],"steps":[{"type":"p","text":"1. Επαλήθευση κρυπτογραφικών αποτυπωμάτων πειστηρίων:\\n```bash\\nsha256sum /evidence/suspect_endpoint.raw /evidence/c_drive.e01\\n```"},{"type":"p","text":"2. Συμπλήρωση του επίσημου εντύπου Αλυσίδας Επιμέλειας (Chain of Custody).\\n3. Εξέταση κατατμήσεων δίσκου:\\n```bash\\nmmls /evidence/c_drive.e01\\n```"}]},{"badge":"Phase 2","name":"Εγκληματολογική Ανάλυση Πτητικής Μνήμης με το Volatility 3","dur":"⏱️ 45 λεπτά","objs":["Εντοπισμός ενεργών και κρυφών διεργασιών με `windows.pslist` και `windows.psscan`.","Ανίχνευση εγχυμένου κώδικα με το `windows.malfind` και εξαγωγή αρχείων μνήμης.","Εξαγωγή ενεργών συνδέσεων δικτύου και sockets με το `windows.netscan`."],"steps":[{"type":"p","text":"1. Σάρωση λίστας διεργασιών:\\n```bash\\nvol -f /evidence/suspect_endpoint.raw windows.pslist\\n```"},{"type":"p","text":"2. Σάρωση δικτυακών συνδέσεων:\\n```bash\\nvol -f /evidence/suspect_endpoint.raw windows.netscan\\n```"},{"type":"p","text":"3. Εξαγωγή του εγχυμένου εκτελέσιμου αρχείου από τη μνήμη:\\n```bash\\nvol -f /evidence/suspect_endpoint.raw windows.dumpfiles --pid 1024\\n```"}]},{"badge":"Phase 3","name":"Εγκληματολογία Δίσκου: Μητρώο, Prefetch, Shimcache & Ανάλυση $MFT","dur":"⏱️ 30 λεπτά","objs":["Εξαγωγή και ανάλυση του Master File Table (`$MFT`) για εντοπισμό timestomping.","Ανάλυση αρχείων Windows Prefetch (`.pf`) για απόδειξη εκτέλεσης εκτελέσιμων.","Έλεγχος Shimcache και Shellbags για ιστορικό εκτέλεσης και πρόσβασης σε φακέλους."],"steps":[{"type":"p","text":"1. Ανάλυση του πίνακα `$MFT`:\\n```bash\\npython3 analyzeMFT.py -f /mnt/c_drive/\\\\$MFT -o /workspace/mft_parsed.csv\\n```"},{"type":"p","text":"2. Ανάλυση αρχείων Prefetch:\\n```bash\\nPECmd.exe -d /mnt/c_drive/Windows/Prefetch/ --csv /workspace/prefetch_out/\\n```"},{"type":"p","text":"3. Έλεγχος των κλειδιών Run στο μητρώο για μηχανισμούς επιμονής."}]},{"badge":"Phase 4","name":"Παραγωγή Ενοποιημένου Χρονολογίου & Έκθεση Πραγματογνωμοσύνης","dur":"⏱️ 20 λεπτά","objs":["Σύνθεση ενιαίου super-timeline με το Plaso/Log2Timeline.","Συσχέτιση των σταδίων εισβολής, εκτέλεσης, επιμονής και εξαγωγής δεδομένων.","Συγγραφή της επίσημης Έκθεσης Πραγματογνωμοσύνης για δικαστική χρήση."],"steps":[{"type":"p","text":"1. Παραγωγή αρχείου Plaso timeline:\\n```bash\\nlog2timeline.py /workspace/timeline.plaso /evidence/c_drive.e01\\n```"},{"type":"p","text":"2. Εξαγωγή φιλτραρισμένου χρονολογίου σε CSV:\\n```bash\\npsort.py -o l2tcsv /workspace/timeline.plaso \\"date > \'2026-09-28\'\\" -w /workspace/final_timeline.csv\\n```"},{"type":"p","text":"3. Σύνταξη της τελικής έκθεσης πραγματογνωμοσύνης."}]}],"checklist":["Τα hashes επαληθεύτηκαν πριν και μετά από κάθε ενέργεια προσάρτησης.","Οι εγχυμένες διεργασίες και τα κακόβουλα τμήματα μνήμης ταυτοποιήθηκαν με ακρίβεια PID.","Η ανάλυση MFT και Prefetch ανακατασκευάζει πιστά την ακολουθία εκτέλεσης αρχείων.","Η έκθεση συμμορφώνεται πλήρως με τα διεθνή πρότυπα ψηφιακών πειστηρίων (ISO/IEC 27037)."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Ολοκληρωμένη Ψηφιακή Εγκληματολογία & Έρευνα OSINT Απόδοσης Απειλών","desc":"Ένας διακομιστής διαβαθμισμένων δεδομένων κρατικής υπηρεσίας παραβιάστηκε σε εκστρατεία κυβερνοκατασκοπείας με αποτέλεσμα διαρροή απορρήτων. Ως Επικεφαλής Εγκληματολόγος & Αναλυτής OSINT, σας ανατίθεται να εκτελέσετε εις βάθος ανάλυση δίσκου και μνήμης στο είδωλο του διακομιστή, να ανακαλύψετε κρυμμένα ψηφιακά πειστήρια, να ιχνηλατήσετε την υποδομή C2 του αντιπάλου μέσω καναλιών OSINT και να συντάξετε έναν φάκελο απόδοσης ευθύνης.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Συλλογή Πειστηρίων & Εγκληματολογική Ανάλυση Μνήμης","desc":"Σύνταξη Αλυσίδας Επιμέλειας, επαλήθευση hashes και ανάλυση του memory dump με το Volatility 3 για εξαγωγή κακόβουλων payloads.","spec":["Σχεδιασμός απομονωμένου εργαστηρίου DFIR με hardware write-blockers.","Δημιουργία ασφαλούς αποθήκης ψηφιακών πειστηρίων με SHA-256 hashes και RFC 3161 timestamps.","Σύνταξη τυπικών διαδικασιών Chain of Custody κατά το πρότυπο ISO/IEC 27037."],"deliv":"📦 Παραδοτέο Οροσήμου: Αρχείο καταγραφής ανάλυσης μνήμης + εξαχθέντα εκτελέσιμα."},{"num":"M2","title":"Ανάλυση Μεταδεδομένων Δίσκου & Χρονολογίου ($MFT / Shimcache)","desc":"Εξαγωγή $MFT, ανάλυση Shimcache και Prefetch και εντοπισμός αλλοιώσεων χρονικών σημάτων (timestomping).","spec":["Ανάπτυξη σεναρίων άμεσης συλλογής πτητικών δεδομένων RAM, συνδέσεων δικτύου και διεργασιών.","Αυτοματοποιημένη εξαγωγή αντιγράφων δίσκων μέσω SSH με διατήρηση χρονικών σημάτων MACB.","Συλλογή και ανάλυση Windows Event Logs, MFT, Prefetch και Shimcache."],"deliv":"📦 Παραδοτέο Οροσήμου: Αρχεία CSV ευρημάτων δίσκου + αναφορά εντοπισμού timestomping."},{"num":"M3","title":"Έρευνα OSINT Υποδομών Απειλών & Χαρτογράφηση Δικτύου Αντιπάλου","desc":"Διερεύνηση των IPs και domains του C2 με χρήση logs Certificate Transparency ( crt.sh ), ιστορικού DNS και ανάλυσης ASN.","spec":["Ανακατασκευή super-timeline με Plaso/log2timeline για συσχέτιση συμβάντων.","Χαρτογράφηση πλευρικής μετακίνησης (lateral movement) και μηχανισμών persistence στο MITRE ATT&CK.","Ανάλυση κακόβουλου λογισμικού (reverse engineering) για εξαγωγή δεικτών IOCs και κλειδιών C2."],"deliv":"📦 Παραδοτέο Οροσήμου: Γράφημα υποδομών OSINT (Maltego/Draw.io) + φάκελος domains."},{"num":"M4","title":"Ενοποιημένο Χρονολόγιο & Φάκελος Απόδοσης Ευθύνης Απειλής","desc":"Σύνθεση όλων των ευρημάτων σε ενιαίο χρονολόγιο, αξιολόγηση επιπέδου βεβαιότητας απόδοσης και συγγραφή της τελικής έκθεσης.","spec":["Σύνταξη τελικής έκθεσης Root Cause Analysis (RCA) από την αρχική παραβίαση έως τον περιορισμό.","Παραγωγή πακέτων threat intelligence σε μορφή STIX 2.1 / TAXII.","Ορισμός διαδικασίας κοινοποίησης παραβίασης κατά το Άρθρο 33 του GDPR (εντός 72 ωρών)."],"deliv":"📦 Παραδοτέο Οροσήμου: Ολοκληρωμένη Έκθεση Πραγματογνωμοσύνης & Απόδοσης OSINT (12–15 σελίδες)."}],"deliverables":["Επαληθευμένη Αλυσίδα Επιμέλειας & Πρωτόκολλο Παραλαβής (`chain_of_custody_intake.pdf`)","Ενοποιημένο Χρονολόγιο Συμβάντων Super-Timeline (`master_timeline.csv`)","Γράφημα Υποδομών Αντιπάλου OSINT (`threat_infrastructure_graph.png`)","Πλήρης Φάκελος Πραγματογνωμοσύνης & Απόδοσης Απειλής (12–15 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου Αναλυτή Μνήμης RAM & Εξαγωγέα Εκτελέσιμων PE σε Python","desc":"Οι ειδικοί ψηφιακής εγκληματολογικής (DFIR) αναλύουν dumps πτητικής μνήμης RAM για εντοπισμό fileless malware, rootkits και injected shellcode που δεν αποθηκεύονται στον δίσκο. Θα κατασκευάσετε ένα αυτόνομο εργαλείο ανάλυσης μνήμης σε Python ( mem_forensics.py ) χωρίς εξάρτηση από πρόσθετα του Volatility. Το εργαλείο θα αναλύει raw memory dumps 64-bit Windows, θα εντοπίζει το σύμβολο PsActiveProcessHead , θα διατρέχει τη διπλά συνδεδεμένη λίστα EPROCESS ( ActiveProcessLinks ), θα επιθεωρεί δέντρα VAD για εκτελέσιμες σελίδες μνήμης και θα εξάγει κρυμμένα αρχεία PE (DLL/EXE).","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Αναλυτής Κεφαλίδας Μνήμης & Μηχανή Μετάφρασης Σελίδων","desc":"Κατασκευή αναγνώστη αρχείων raw dump που διαχειρίζεται το CR3 του πυρήνα Windows και μεταφράζει εικονικές σε φυσικές διευθύνσεις.","spec":["Υλοποίηση μετάφρασης σελιδοποίησης 4 επιπέδων x86_64 (PML4 -> PDPT -> PD -> PT).","Ανάγνωση δεδομένων με `mmap` για υψηλή ταχύτητα σε μεγάλα memory dumps.","Εντοπισμός Kernel Base και δομών `KPROCESS`."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα mem_translator.py με ανάγνωση διευθύνσεων από δείγμα RAM."},{"num":"M2","title":"Διασχιστής Λίστας EPROCESS & Εντοπιστής Rootkits DKOM","desc":"Διάσχιση της διπλά συνδεδεμένης λίστας ActiveProcessLinks και εντοπισμός αποσυνδεδεμένων/κρυφών διεργασιών (DKOM).","spec":["Αποκωδικοποίηση πεδίων `EPROCESS`: PID, PPID, `ImageFileName`, `CreateTime`.","Έλεγχος δεικτών `Flink`/`Blink` για επαλήθευση ακεραιότητας της λίστας.","Διασταύρωση με τη λίστα threads για εντοπισμό κρυφών διεργασιών rootkits."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα pslist_parser.py με εξαγωγή διεργασιών και εντοπισμό DKOM."},{"num":"M3","title":"Επιθεωρητής Δέντρου VAD & Ανιχνευτής Memory Injection","desc":"Διάσχιση του δυαδικού δέντρου VAD κάθε διεργασίας για εντοπισμό injected, μη καταχωρημένων εκτελέσιμων περιοχών μνήμης.","spec":["Ανάλυση δομών `MMVAD` και εξαγωγή ορίων μνήμης και δικαιωμάτων προστασίας.","Επισήμανση περιοχών με δικαιώματα RWX χωρίς αντίστοιχο αρχείο στον δίσκο (unbacked memory).","Υπολογισμός εντροπίας Shannon για εντοπισμό κρυπτογραφημένου shellcode."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα vad_inspector.py με εντοπισμό injected μνήμης."},{"num":"M4","title":"Μηχανή Εξαγωγής Αρχείων PE & Έκθεση Εγκληματολογικής","desc":"Εξαγωγή εκτελέσιμων αρχείων PE από τη μνήμη, διόρθωση virtual offsets των sections και αποθήκευση των binaries στον δίσκο.","spec":["Σάρωση για headers `MZ` και `PE��` στα εξαχθέντα τμήματα μνήμης.","Ανάλυση sections (`.text`, `.data`), διόρθωση alignment και ανακατασκευή έγκυρου αρχείου PE.","Υπολογισμός hash SHA-256 του εξαχθέντος δείγματος και σύνταξη αναφοράς εγκληματολογικής."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρης σουίτα mem_forensics.py + εξαγωγή δείγματος και αναφορά."}],"deliverables":["Πηγαίος κώδικας Εργαλείου Ανάλυσης Μνήμης (`/mem_forensics/`)","Διασχιστής Λίστας EPROCESS & Ανιχνευτής Rootkits DKOM","Επιθεωρητής VAD & Μηχανή Εξαγωγής Αρχείων PE","Τεχνική Έκθεση Ψηφιακής Εγκληματολογικής RAM (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 12","quiz":[{"q":"Σύμφωνα με το RFC 3227 (Σειρά Πτητικότητας), ποια πηγή πειστηρίων πρέπει να συλλέγεται ΠΡΩΤΗ κατά την ιατροδικαστική απόκριση;","opts":[{"k":"A","v":"Μαγνητικές ταινίες
