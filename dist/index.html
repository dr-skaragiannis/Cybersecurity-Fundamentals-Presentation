οποιεί μη γραμμικούς υπολογισμούς πινάκων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Το ECB μετατρέπει αυτόματα τα συμμετρικά κλειδιά 256-bit σε αδύναμες ρυθμίσεις εξαγωγής DES 40-bit, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Το ECB περιορίζει το μέγιστο μέγεθος μεταφοράς αρχείων στα 64 kilobytes σε τυπικά sockets TCP, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Το ECB κρυπτογραφεί πανομοιότυπα μπλοκ απλού κειμένου σε πανομοιότυπα μπλοκ κρυπτοκειμένου, αποκαλύπτοντας μοτίβα."}],"ans":"E","exp":"Επειδή το ECB κρυπτογραφεί ίδια μπλοκ κειμένου στα ίδια μπλοκ κρυπτοκειμένου χωρίς IV, διατηρεί τα υποκείμενα μοτίβα (όπως στο περίφημο παράδειγμα του πιγκουίνου Tux)."},{"q":"Ποιος μετα-κβαντικός κρυπτογραφικός αλγόριθμος που τυποποιήθηκε από το NIST σχεδιάστηκε για ενθυλάκωση κλειδιών (KEM);","opts":[{"k":"A","v":"ML-KEM (Kyber), τυποποιημένος για γενική ασύμμετρη κρυπτογράφηση πλεγμάτων και ενθυλάκωση κλειδιών."},{"k":"B","v":"ML-DSA (Dilithium), τυποποιημένος κυρίως για ψηφιακές υπογραφές υψηλής ταχύτητας, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"SLH-DSA (SPHINCS+), τυποποιημένος ως stateless αλγόριθμος υπογραφών βασισμένος σε συναρτήσεις hash, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"AES-256-CTR, τυποποιημένος για συμμετρική κρυπτογράφηση τύπου ροής σε μπλοκ δεδομένων, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"SHA-512/256, τυποποιημένος για αποκομμένο κρυπτογραφικό κατακερματισμό σε περιορισμένους πόρους, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"A","exp":"Το NIST τυποποίησε το ML-KEM (FIPS 203, βασισμένο στο Kyber) ως τον κύριο μετα-κβαντικό μηχανισμό ενθυλάκωσης κλειδιών (KEM) έναντι κβαντικών επιθέσεων."},{"q":"Πώς επαληθεύει μαθηματικά μια ψηφιακή υπογραφή τόσο την αυθεντικότητα όσο και τη μη αποποίηση ενός μηνύματος;","opts":[{"k":"A","v":"Ο αποστολέας κρυπτογραφεί ολόκληρο το μήνυμα χρησιμοποιώντας το δημόσιο κλειδί του παραλήπτη σε CBC mode."},{"k":"B","v":"Ο αποστολέας υπολογίζει το hash του μηνύματος και το υπογράφει/κρυπτογραφεί με το δικό του ιδιωτικό κλειδί."},{"k":"C","v":"Ο αποστολέας στέλνει το συμμετρικό κλειδί σε έναν ενδιάμεσο διακομιστή proxy για φύλαξη escrow."},{"k":"D","v":"Ο αποστολέας ενσωματώνει δυναμική χρονοσήμανση GPS στα πεδία ακολουθίας της κεφαλίδας πακέτου TCP."},{"k":"E","v":"Ο αποστολέας συμπιέζει το αρχείο με ιδιόκτητο αλγόριθμο και κοινόχρηστο στατικό κωδικό πρόσβασης."}],"ans":"B","exp":"Μια ψηφιακή υπογραφή δημιουργείται υπολογίζοντας το hash του μηνύματος και υπογράφοντάς το με το ιδιωτικό κλειδί του αποστολέα. Επαληθεύεται από οποιονδήποτε διαθέτει το δημόσιο κλειδί."}]},{"part":"Μέρος 2 · Αντίπαλοι και Επιθέσεις","time":"Κεφάλαιο 3 · ⏱️ 6–8 ώρες μελέτης","title":"3. Δράστες Απειλών, Κίνητρα και Μοντέλα Κύκλου Ζωής Επιθέσεων","subtitle":"Ταξινόμηση δραστών · Το φάσμα των χάκερ · Cyber Kill Chain · MITRE ATT&CK · Μοντέλο Διαμαντιού και D3FEND · Πληροφορίες απειλών και ανταλλαγή τους","outcomes":["Να ταξινομείτε τους δράστες απειλών με βάση το κίνητρο, τις ικανότητες και την επιμονή τους και να τους συσχετίζετε με κατάλληλες άμυνες.","Να διακρίνετε τη δραστηριότητα white-, grey- και black-hat με κριτήριο την εξουσιοδότηση και την πρόθεση.","Να αντιστοιχίζετε μια επίθεση στις φάσεις του Cyber Kill Chain και στις τακτικές και τεχνικές του ATT&CK.","Να χρησιμοποιείτε το Μοντέλο Διαμαντιού για τη δομημένη ανάλυση μιας εισβολής.","Να περιγράφετε τον κύκλο ζωής των πληροφοριών απειλών και να εφαρμόζετε το Πρωτόκολλο Φωτεινού Σηματοδότη (TLP) κατά την ανταλλαγή τους."],"intro":["Οι άμυνες αποκτούν νόημα μόνο σε σχέση με τους αντιπάλους που καλούνται να σταματήσουν. Μια μικρή επιχείρηση και ένας εθνικός πάροχος ενέργειας αντιμετωπίζουν πολύ διαφορετικούς αντιπάλους, με διαφορετικούς στόχους, πόρους και υπομονή. Για τον λόγο αυτό, το κεφάλαιο μετατοπίζει την οπτική από το σύστημα στον επιτιθέμενο.","Αρχικά ταξινομούμε τους δράστες απειλών με βάση το κίνητρο και τις ικανότητές τους και αποσαφηνίζουμε τις ηθικές και νομικές διακρίσεις πίσω από τη γνωστή ορολογία των «καπέλων». Στη συνέχεια μελετάμε τρία συμπληρωματικά μοντέλα που περιγράφουν την εξέλιξη μιας επίθεσης: το Cyber Kill Chain της Lockheed Martin, τη βάση γνώσης MITRE ATT&CK και το Μοντέλο Διαμαντιού για την ανάλυση εισβολών. Το κεφάλαιο ολοκληρώνεται με τις πληροφορίες κυβερνοαπειλών (Cyber Threat Intelligence) —πώς παράγεται, αξιολογείται και ανταλλάσσεται υπεύθυνα η γνώση για τους αντιπάλους."],"sections":[{"id":"3.1","title":"Ταξινόμηση των δραστών απειλών","blocks":[{"type":"p","text":"Οι δράστες απειλών ομαδοποιούνται χρήσιμα με βάση το τι επιδιώκουν και τι μπορούν να κάνουν. Οι **κρατικά υποστηριζόμενες ομάδες**, γνωστές και ως _προηγμένες επίμονες απειλές_ (Advanced Persistent Threats, APT), επιδιώκουν κατασκοπεία, δολιοφθορά ή επηρεασμό· διαθέτουν τους πόρους για εκμεταλλεύσεις μηδενικής ημέρας (zero-day) και για επιχειρήσεις μέσω της εφοδιαστικής αλυσίδας και μπορούν να παραμένουν σε ένα δίκτυο για μήνες ή χρόνια. Οι **κυβερνοεγκληματίες** έχουν οικονομικά κίνητρα· η οικονομία του λυτρισμικού ως υπηρεσίας (Ransomware-as-a-Service) έχει δώσει ακόμη και σε συνεργάτες μέτριας δεξιότητας πρόσβαση σε επαγγελματικά εργαλεία. Οι **χακτιβιστές** επιδιώκουν δημοσιότητα για έναν πολιτικό ή κοινωνικό σκοπό, συνήθως μέσω επιθέσεων άρνησης υπηρεσίας, αλλοίωσης ιστοτόπων ή διαρροών."},{"type":"p","text":"Οι **εσωτερικοί δράστες** χρειάζονται ιδιαίτερη προσοχή, διότι διαθέτουν ήδη νόμιμη πρόσβαση και, επομένως, ακυρώνουν τις παραδοχές που βασίζονται στην περίμετρο. Ένας _κακόβουλος_ εσωτερικός δράστης μπορεί να υποκλέψει δεδομένα ή να δολιοφθείρει συστήματα από απληστία ή μνησικακία, ενώ ένας _αμελής_ προκαλεί ζημιά ακούσια, για παράδειγμα μέσω λανθασμένης ρύθμισης ή επειδή ενέδωσε σε ένα μήνυμα ηλεκτρονικού ψαρέματος. Η κατανόηση των δραστών που αφορούν πραγματικά έναν οργανισμό τού επιτρέπει να επιλέγει μέτρα ανάλογα με τον πραγματικό κίνδυνο και όχι με τους πιο εντυπωσιακούς τίτλους ειδήσεων."},{"type":"table","caption":"Πίνακας 3.1 — Προφίλ δραστών απειλών","head":["Δράστης","Κίνητρο","Ικανότητα","Τυπική διάρκεια παραμονής","Χαρακτηριστικές τεχνικές"],"rows":[["Κρατική ομάδα APT","Κατασκοπεία, δολιοφθορά, επηρεασμός","Πολύ υψηλή","Μήνες έως χρόνια","Στοχευμένο ψάρεμα, χρήση νόμιμων εργαλείων του συστήματος, κρυφή διοίκηση και έλεγχος"],["Κυβερνοεγκληματίας","Οικονομικό όφελος","Μέτρια έως υψηλή","Ημέρες έως εβδομάδες","Ψάρεμα, λυτρισμικό, κλοπή δεδομένων για εκβιασμό"],["Χακτιβιστής","Ιδεολογία, δημοσιότητα","Χαμηλή έως μέτρια","Ώρες έως ημέρες","DDoS, αλλοίωση ιστοτόπων, δημοσιοποίηση προσωπικών στοιχείων"],["Κακόβουλος εσωτερικός","Όφελος, μνησικακία","Μέτρια (εξουσιοδοτημένη πρόσβαση)","Μεταβλητή","Κατάχρηση προνομίων, διαρροή δεδομένων"],["Αμελής εσωτερικός","Κανένα (σφάλμα)","Χαμηλή (ακούσια)","—","Λανθασμένες ρυθμίσεις, επαναχρησιμοποίηση κωδικών"]]}]},{"id":"3.2","title":"Το φάσμα των χάκερ: ηθική και νομιμότητα","blocks":[{"type":"p","text":"Η δημοφιλής ορολογία των «καπέλων» ταξινομεί την **εξουσιοδότηση και την πρόθεση**, όχι την τεχνική δεξιότητα. Ένας **white-hat** (ηθικός) χάκερ ελέγχει συστήματα μόνο με ρητή, γραπτή άδεια και εντός συμφωνημένου πεδίου, αναφέροντας τα ευρήματα ώστε να διορθωθούν. Ένας **black-hat** χάκερ ενεργεί χωρίς εξουσιοδότηση και με κακόβουλη ή ιδιοτελή πρόθεση. Ανάμεσά τους βρίσκεται ο **grey-hat**, ο οποίος μπορεί να ενεργεί χωρίς άδεια αλλά χωρίς σαφή κακοβουλία —για παράδειγμα, σαρώνει τον ιστότοπο μιας εταιρείας και στη συνέχεια την ενημερώνει για μια ευπάθεια."},{"type":"p","text":"Οι φοιτητές πρέπει να κατανοήσουν ότι οι καλές προθέσεις δεν δημιουργούν νομική εξουσιοδότηση. Στις περισσότερες έννομες τάξεις, συμπεριλαμβανομένων εκείνων που ενσωματώνουν την Οδηγία της ΕΕ για τις επιθέσεις κατά συστημάτων πληροφοριών, η πρόσβαση σε σύστημα χωρίς άδεια αποτελεί ποινικό αδίκημα ακόμη κι αν δεν προκληθεί ζημιά. Γι\' αυτό η επαγγελματική δοκιμή διείσδυσης (Κεφάλαιο 10) ξεκινά πάντοτε με υπογεγραμμένο πεδίο εφαρμογής και κανόνες εμπλοκής, και γι\' αυτό υπάρχουν τα προγράμματα συντονισμένης γνωστοποίησης ευπαθειών και τα προγράμματα επιβράβευσης (bug bounties): μετατρέπουν την περιέργεια του grey-hat σε εξουσιοδοτημένη και νομικά προστατευμένη έρευνα."}]},{"id":"3.3","title":"Το Cyber Kill Chain της Lockheed Martin","blocks":[{"type":"p","text":"Το **Cyber Kill Chain**, που δημοσίευσε η Lockheed Martin το 2011, περιγράφει μια στοχευμένη εισβολή ως επτά διαδοχικές φάσεις: **αναγνώριση** (συλλογή πληροφοριών για τον στόχο), **οπλοποίηση** (σύζευξη μιας εκμετάλλευσης με ένα ωφέλιμο φορτίο), **παράδοση** (για παράδειγμα, ένα συνημμένο ηλεκτρονικού ταχυδρομείου), **εκμετάλλευση** (ενεργοποίηση της ευπάθειας), **εγκατάσταση** (εδραίωση μόνιμης παρουσίας), **διοίκηση και έλεγχος** (δημιουργία απομακρυσμένου καναλιού) και **ενέργειες επί των στόχων** (κλοπή δεδομένων, κρυπτογράφηση, δολιοφθορά)."},{"type":"p","text":"Η βασική ιδέα του μοντέλου είναι αμυντική: επειδή ο επιτιθέμενος πρέπει να επιτύχει σε _κάθε_ φάση, ο αμυνόμενος αρκεί να σπάσει την αλυσίδα _μία_ φορά. Η έγκαιρη διακοπή είναι φθηνότερη —ο αποκλεισμός ενός κακόβουλου συνημμένου στη φάση της παράδοσης αποτρέπει μια δαπανηρή απόκριση σε περιστατικό αργότερα. Το μοντέλο έχει όμως περιορισμούς. Σχεδιάστηκε με βάση εισβολές με κακόβουλο λογισμικό που προέρχονται από το εξωτερικό και περιγράφει λιγότερο ικανοποιητικά τις εσωτερικές απειλές, την κατάχρηση διαπιστευτηρίων και τις επιθέσεις στο νέφος. Για τον λόγο αυτό συνδυάζεται συνήθως με το λεπτομερέστερο πλαίσιο ATT&CK."}]},{"id":"3.4","title":"MITRE ATT&CK: τακτικές, τεχνικές και διαδικασίες","blocks":[{"type":"p","text":"Το **MITRE ATT&CK** είναι μια δημόσια διαθέσιμη βάση γνώσης για τη συμπεριφορά των αντιπάλων, η οποία έχει δημιουργηθεί από παρατηρήσεις πραγματικών εισβολών. Οργανώνεται ως πίνακας. Οι στήλες είναι οι **τακτικές** —οι βραχυπρόθεσμοι στόχοι του επιτιθέμενου, όπως η _Αρχική Πρόσβαση_, η _Εκτέλεση_, η _Μόνιμη Παρουσία_, η _Κλιμάκωση Προνομίων_, η _Αποφυγή Άμυνας_, η _Πρόσβαση σε Διαπιστευτήρια_, η _Πλευρική Κίνηση_ και η _Διαρροή Δεδομένων_. Κάθε στήλη περιέχει **τεχνικές** που περιγράφουν _πώς_ επιτυγχάνεται ο στόχος· για παράδειγμα, η T1059.001 δηλώνει εκτέλεση εντολών μέσω PowerShell. Οι **διαδικασίες** είναι οι συγκεκριμένοι τρόποι με τους οποίους μια ομάδα έχει χρησιμοποιήσει μια τεχνική."},{"type":"p","text":"Το ATT&CK παρέχει στους αμυνόμενους μια κοινή γλώσσα. Μια ομάδα ασφάλειας μπορεί να αντιστοιχίσει τους κανόνες ανίχνευσής της σε τεχνικές και να διαπιστώσει αμέσως πού υπάρχουν κενά κάλυψης· μια αναφορά πληροφοριών απειλών μπορεί να δηλώνει ποιες τεχνικές χρησιμοποιεί μια ομάδα· και μια κόκκινη ομάδα (red team) μπορεί να προσομοιώσει αυτές τις τεχνικές για να ελέγξει αν οι άμυνες λειτουργούν πράγματι. Η έμφαση στη _συμπεριφορά_ και όχι σε εύκολα μεταβαλλόμενες ενδείξεις, όπως οι τιμές κατακερματισμού αρχείων, είναι αυτό που καθιστά το πλαίσιο ανθεκτικό στον χρόνο."}]},{"id":"3.5","title":"Το Μοντέλο Διαμαντιού και το MITRE D3FEND","blocks":[{"type":"p","text":"Το **Μοντέλο Διαμαντιού για την Ανάλυση Εισβολών** (Diamond Model) αναπαριστά κάθε κακόβουλο γεγονός μέσω τεσσάρων συνδεδεμένων στοιχείων: του **αντιπάλου**, της **δυνατότητας** (εργαλεία και κακόβουλο λογισμικό), της **υποδομής** (ονόματα τομέα, διακομιστές, διευθύνσεις IP) και του **θύματος**. Η δύναμη του μοντέλου βρίσκεται στη _μετάβαση_ (pivoting) από στοιχείο σε στοιχείο: μόλις ο αναλυτής γνωρίζει μία κορυφή, οι συνδέσεις υποδεικνύουν πού να αναζητήσει στη συνέχεια. Ένα δείγμα κακόβουλου λογισμικού (δυνατότητα) μπορεί να αποκαλύψει έναν τομέα διοίκησης και ελέγχου (υποδομή), του οποίου τα στοιχεία καταχώρισης μπορεί να οδηγούν σε άλλα θύματα και, τελικά, σε ένα προφίλ αντιπάλου."},{"type":"p","text":"Ενώ το ATT&CK καταγράφει την επιθετική συμπεριφορά, το **MITRE D3FEND** καταγράφει αμυντικά αντίμετρα —όπως η _ανάλυση δημιουργίας διεργασιών_ ή η _θωράκιση διαπιστευτηρίων_— και τα συνδέει με τις επιθετικές τεχνικές που αντιμετωπίζουν. Σε συνδυασμό, το Kill Chain απαντά στο _πότε_ να παρέμβουμε, το ATT&CK στο _τι_ κάνει ο αντίπαλος, το Μοντέλο Διαμαντιού στο _ποιος και με ποια μέσα_ και το D3FEND στο _ποιο μέτρο_ αντιμετωπίζει κάθε συμπεριφορά."}]},{"id":"3.6","title":"Πληροφορίες κυβερνοαπειλών: κύκλος ζωής, είδη και υπεύθυνη ανταλλαγή","blocks":[{"type":"p","text":"Οι **πληροφορίες κυβερνοαπειλών** (Cyber Threat Intelligence, CTI) είναι πληροφορίες για τους αντιπάλους που έχουν συλλεχθεί, αναλυθεί και τοποθετηθεί σε πλαίσιο, ώστε να υποστηρίζουν τη λήψη αποφάσεων. Παράγονται μέσω ενός **κύκλου ζωής πληροφοριών**: _καθοδήγηση_ (προσδιορισμός του τι χρειάζεται να γνωρίζουν όσοι λαμβάνουν αποφάσεις), _συλλογή_, _επεξεργασία_, _ανάλυση_, _διάχυση_ και _ανατροφοδότηση_. Οι πληροφορίες διακρίνονται συχνά σε τρία επίπεδα. Οι **στρατηγικές** ενημερώνουν τη διοίκηση για τάσεις και κινδύνους· οι **επιχειρησιακές** περιγράφουν εκστρατείες και δράστες· οι **τακτικές** παρέχουν τεχνικές λεπτομέρειες, όπως τεχνικές επίθεσης και ενδείξεις παραβίασης."},{"type":"p","text":"Οι πληροφορίες αποκτούν αξία όταν ανταλλάσσονται, όμως η ανταλλαγή πρέπει να σέβεται τις επιθυμίες της πηγής. Το **Πρωτόκολλο Φωτεινού Σηματοδότη** (Traffic Light Protocol, TLP 2.0) χαρακτηρίζει τις πληροφορίες ως _TLP:RED_ (μόνο ονομαστικοί παραλήπτες), _TLP:AMBER_ (ο οργανισμός του παραλήπτη, βάσει ανάγκης γνώσης), _TLP:GREEN_ (η ευρύτερη κοινότητα) ή _TLP:CLEAR_ (δημόσιες). Η μηχανικά αναγνώσιμη ανταλλαγή βασίζεται στο **STIX**, μια τυποποιημένη γλώσσα περιγραφής πληροφοριών απειλών, και στο **TAXII**, ένα πρωτόκολλο μεταφοράς τους. Κλαδικές κοινότητες, όπως τα Κέντρα Ανταλλαγής και Ανάλυσης Πληροφοριών (ISAC), επιτρέπουν σε οργανισμούς που αντιμετωπίζουν παρόμοιες απειλές να προειδοποιούν γρήγορα ο ένας τον άλλον."}]}],"terms":[{"name":"APT","def":"Προηγμένη επίμονη απειλή: δράστης με σημαντικούς πόρους που διατηρεί μακροχρόνια κρυφή πρόσβαση."},{"name":"Kill Chain","def":"Μοντέλο επτά φάσεων μιας στοχευμένης εισβολής, από την αναγνώριση έως τις ενέργειες επί των στόχων."},{"name":"TTP","def":"Τακτικές, τεχνικές και διαδικασίες: η συμπεριφορική περιγραφή του τρόπου δράσης ενός αντιπάλου."},{"name":"Μοντέλο Διαμαντιού","def":"Αναλυτικό μοντέλο που συνδέει αντίπαλο, δυνατότητα, υποδομή και θύμα."},{"name":"TLP","def":"Πρωτόκολλο Φωτεινού Σηματοδότη: χαρακτηρισμοί που ορίζουν πόσο ευρέως μπορεί να αναδιανεμηθεί μια πληροφορία."},{"name":"STIX / TAXII","def":"Τυποποιημένη γλώσσα (STIX) και πρωτόκολλο μεταφοράς (TAXII) για την ανταλλαγή πληροφοριών απειλών."}],"summary":["Οι δράστες απειλών διαφέρουν ως προς το κίνητρο, τις ικανότητες και την επιμονή· οι άμυνες πρέπει να είναι ανάλογες με τους δράστες που πράγματι αφορούν τον οργανισμό.","Η ορολογία των «καπέλων» αφορά την εξουσιοδότηση και την πρόθεση· η μη εξουσιοδοτημένη πρόσβαση είναι παράνομη ανεξάρτητα από το κίνητρο.","Το Kill Chain δείχνει ότι η διακοπή οποιασδήποτε φάσης σταματά την εισβολή και ότι η έγκαιρη διακοπή κοστίζει λιγότερο.","Το ATT&CK περιγράφει λεπτομερώς τη συμπεριφορά των αντιπάλων και παρέχει κοινή γλώσσα για την ανίχνευση, τις πληροφορίες απειλών και τις δοκιμές.","Το Μοντέλο Διαμαντιού υποστηρίζει τη μετάβαση μεταξύ στοιχείων κατά την ανάλυση, ενώ οι πληροφορίες πρέπει να ανταλλάσσονται με σαφείς κανόνες, όπως το TLP."],"review":["Γιατί οι εσωτερικές απειλές αντιμετωπίζονται δύσκολα με μέτρα που βασίζονται στην περίμετρο; Προτείνετε δύο μέτρα αποτελεσματικά απέναντί τους.","Αντιστοιχίστε μια τυπική επίθεση που ξεκινά με ηλεκτρονικό ψάρεμα και καταλήγει σε λυτρισμικό στις επτά φάσεις του Cyber Kill Chain.","Εξηγήστε γιατί οι ανιχνεύσεις που βασίζονται σε τεχνικές του ATT&CK είναι πιο ανθεκτικές από εκείνες που βασίζονται σε τιμές κατακερματισμού αρχείων.","Ένας συνεργάτης σάς αποστέλλει αναφορά με χαρακτηρισμό TLP:AMBER. Μπορείτε να την προωθήσετε σε έναν προμηθευτή; Τεκμηριώστε την απάντησή σας."],"cli":{"title":"Προσομοιωτής Χαρτογράφησης MITRE ATT&CK & Κύκλου Ζωής Επιθέσεων","desc":"Αναλύστε τηλεμετρία δραστών απειλών, συσχετίστε παρατηρηθέντες δείκτες με το Cyber Kill Chain, αναζητήστε τεχνικές στο MITRE ATT&CK και συντάξτε αποδόσεις με το Μοντέλο Διαμαντιού.","meta":["⏱️ ~30 min","🐚 analyst@threat-intel:~$"],"tasks":[{"pill":"Task 1","name":"Αναζήτηση Πληροφοριών Απειλών για Γνωστές Ομάδες Δραστών","instr":"Αναζητήστε στη βάση πληροφοριών απειλών τις δυνατότητες και τεχνικές του APT29 με το `threat-intel`.","hint":"Εκτελέστε: threat-intel --actor APT29","cmd":"$ threat-intel --actor APT29","ok":"Οι πληροφορίες απειλών ανακτήθηκαν! Οι τακτικές του APT29 φορτώθηκαν."},{"pill":"Task 2","name":"Χαρτογράφηση Τεχνικών Δραστών στον Πίνακα MITRE ATT&CK","instr":"Αναζητήστε στο MITRE ATT&CK τις τεχνικές που σχετίζονται με την τακτική Αρχικής Πρόσβασης (Initial Access).","hint":"Εκτελέστε: att&ck --tactic initial-access","cmd":"$ att&ck --tactic initial-access","ok":"Η χαρτογράφηση ATT&CK επιβεβαιώθηκε: Εντοπίστηκε η τεχνική T1566.001 (Spearphishing Attachment)."},{"pill":"Task 3","name":"Ιχνηλάτηση Κύκλου Ζωής Επίθεσης μέσω Cyber Kill Chain","instr":"Ανακατασκευάστε τα χρονολογικά στάδια του περιστατικού INC-4029 στις 7 φάσεις του Kill Chain με το `killchain-trace`.","hint":"Εκτελέστε: killchain-trace --incident INC-4029","cmd":"$ killchain-trace --incident INC-4029","ok":"Η ανακατασκευή Kill Chain ολοκληρώθηκε! Συσχετίστηκαν τα στάδια Delivery, Exploitation και C2."},{"pill":"Task 4","name":"Συσχέτιση Υποδομών μέσω του Μοντέλου Διαμαντιού","instr":"Συσχετίστε την υποδομή του αντιπάλου `c2-beacon.darkops-gateway.org` για εντοπισμό δυνατοτήτων και θυμάτων.","hint":"Εκτελέστε: diamond-model --correlate c2-beacon.darkops-gateway.org","cmd":"$ diamond-model --correlate c2-beacon.darkops-gateway.org","ok":"Ο κόμβος Μοντέλου Διαμαντιού ολοκληρώθηκε: Συνδέθηκαν Αντίπαλος, Υποδομή, Δυνατότητα και Θύμα."}]},"lab":{"title":"Προληπτική Αναζήτηση Απειλών & Ανακατασκευή Εκστρατείας Επίθεσης με Μοντέλο Διαμαντιού και MITRE ATT&CK","desc":"Σε αυτό το τεχνικό εργαστήριο 2 ωρών, οι φοιτητές λειτουργούν σε Κέντρο Πληροφοριών Κυβερνοαπειλών (CTI) διερευνώντας μια προηγμένη εκστρατεία επίθεσης APT. Θα επεξεργαστείτε δείκτες παραβίασης (IOCs), θα αναλύσετε επιθετικές συμπεριφορές, θα χαρτογραφήσετε Τακτικές, Τεχνικές και Διαδικασίες (TTPs) στο MITRE ATT&CK, θα συνδέσετε νήματα δραστηριότητας με το Μοντέλο Διαμαντιού και θα σχεδιάσετε αντίμετρα με το MITRE D3FEND.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Linux / macOS CTI workstation with Python 3.11+, jq, curl, git","OpenCTI / MISP Threat Intelligence Platform (Docker sandbox instance)","ATT&CK Navigator local JSON workbench","STIX 2.1 validator & PyTAK / TAXII 2.1 client libraries"],"phases":[{"badge":"Phase 1","name":"Εισαγωγή Πληροφοριών Απειλών & Κανονικοποίηση Δεικτών IOC","dur":"⏱️ 25 λεπτά","objs":["Επεξεργασία ανεπεξέργαστων ροών STIX 2.1 JSON.","Εξαγωγή και κανονικοποίηση Δεικτών Παραβίασης (IPs, hashes, domains, mutexes).","Διάκριση τακτικών ατομικών δεικτών από στρατηγικά συμπεριφορικά TTPs."],"steps":[{"type":"p","text":"1. Εισαγωγή της ροής STIX της εκστρατείας με χρήση του `curl`:\\n```bash\\ncurl -s http://cti-feed.local/campaign_99.stix2 | jq \'.objects[] | select(.type==\\"indicator\\")\' > parsed_iocs.json\\n```"},{"type":"p","text":"2. Κατηγοριοποίηση των IOCs βάσει της Πυραμίδας του Πόνου (Pyramid of Pain) του David Bianco."},{"type":"p","text":"3. Επαλήθευση φήμης hashes μέσω τοπικού εξυπηρετητή CTI cache."}]},{"badge":"Phase 2","name":"Ανακατασκευή Σταδίων Cyber Kill Chain & Συσχέτιση","dur":"⏱️ 45 λεπτά","objs":["Ιχνηλάτηση των 7 διαδοχικών σταδίων του Kill Chain.","Εντοπισμός ακριβών χρονικών σημάτων και τηλεμετρίας ανά φάση.","Εντοπισμός του αρχικού διανύσματος εισβολής (εκμετάλλευση WinRAR CVE-2023-38831)."],"steps":[{"type":"p","text":"1. Συσχέτιση καταγραφών πύλης ηλεκτρονικού ταχυδρομείου με τηλεμετρία EDR:\\n```bash\\ngrep -E \'attachment|invoice.xlsm\' /var/log/mail_gateway.log\\n```"},{"type":"p","text":"2. Χαρτογράφηση δέντρου διεργασιών: `OUTLOOK.EXE` -> `WINRAR.EXE` -> `cmd.exe` -> `powershell.exe`."},{"type":"p","text":"3. Τεκμηρίωση μοτίβων επικοινωνίας C2 μέσω HTTPS θύρας 443 με διακυμάνσεις jitter."}]},{"badge":"Phase 3","name":"Χαρτογράφηση Πίνακα MITRE ATT&CK & Σύνθεση Μοντέλου Διαμαντιού","dur":"⏱️ 30 λεπτά","objs":["Χαρτογράφηση 8 παρατηρηθεισών τεχνικών σε αναγνωριστικά τεχνικών MITRE ATT&CK.","Κατασκευή πλήρους γραφήματος Μοντέλου Διαμαντιού (Αντίπαλος, Δυνατότητα, Υποδομή, Θύμα).","Αξιολόγηση επιπέδου βεβαιότητας για την απόδοση ευθύνης (APT28 έναντι APT29 έναντι FIN7)."],"steps":[{"type":"p","text":"1. Δημιουργία επιπέδου ATT&CK Navigator JSON για τις ενεργές τεχνικές:\\n```bash\\npython3 scripts/build_attck_layer.py --input observed_ttps.json --output layer.json\\n```"},{"type":"p","text":"2. Κατασκευή Νήματος Δραστηριότητας Μοντέλου Διαμαντιού συνδέοντας τη θυματολογία στον ενεργειακό τομέα."},{"type":"p","text":"3. Αντιπαραβολή χρονικών σημάτων μεταγλώττισης και ομοιοτήτων κώδικα με γνωστές βιβλιοθήκες εργαλείων."}]},{"badge":"Phase 4","name":"Σχεδιασμός Αμυντικών Αντιμέτρων με το MITRE D3FEND","dur":"⏱️ 20 λεπτά","objs":["Άμεση αντιστοίχιση επιθετικών τεχνικών ATT&CK στα αμυντικά στοιχεία του MITRE D3FEND.","Σχεδιασμός κανόνων ανίχνευσης (Sigma/YARA) για διακοπή των πρώιμων σταδίων της επίθεσης.","Σύνταξη της επιτελικής έκθεσης Πληροφοριών Απειλών."],"steps":[{"type":"p","text":"1. Εντοπισμός αντιμέτρων D3FEND για το T1059.001 (Εκτέλεση PowerShell -> Ανάλυση Εκτέλεσης Σεναρίων)."},{"type":"p","text":"2. Εξαγωγή πακέτου προληπτικής αναζήτησης απειλών με κανόνες Sigma και λίστες αποκλεισμού IOCs."},{"type":"p","text":"3. Παρουσίαση επιτελικών συμπερασμάτων και σύνοψης απόδοσης ευθύνης."}]}],"checklist":["Και τα 7 στάδια του Cyber Kill Chain ταυτοποιήθηκαν με σαφή αποδεικτικά στοιχεία.","Τουλάχιστον 8 τεχνικές MITRE ATT&CK αντιστοιχίστηκαν με ορθά sub-technique IDs.","Το Μοντέλο Διαμαντιού συνδέει ορθά Υποδομή, Δυνατότητα, Αντίπαλο και Θύμα.","Τα αμυντικά αντίμετρα D3FEND παρέχουν άμεσα εφαρμόσιμους τεχνικούς ελέγχους."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Κατάρτιση Προφίλ Δραστών Απειλών & Αυτοματοποιημένος Πίνακας MITRE ATT&CK Navigator","desc":"Μια κοινοπραξία Κρίσιμων Εθνικών Υποδομών στον ενεργειακό τομέα αντιμετωπίζει συντονισμένες εκστρατείες κυβερνοκατασκοπείας και ransomware. Προσλαμβάνεστε ως Επικεφαλής Αρχιτέκτονας Πληροφοριών Απειλών για να αναπτύξετε μια αυτοματοποιημένη πλατφόρμα που συλλέγει ροές STIX/TAXII, κανονικοποιεί TTPs δραστών, δημιουργεί δυναμικούς χάρτες θερμότητας MITRE ATT&CK και παράγει σχέδια προσομοίωσης αντιπάλων.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Μηχανή Εισαγωγής & Κανονικοποίησης STIX/TAXII","desc":"Ανάπτυξη του taxii_collector.py για σύνδεση σε TAXII servers, ανάκτηση attack patterns και αποθήκευση σε βάση δεδομένων.","spec":["Σχεδιασμός τμηματοποίησης VLAN 802.1Q (Management, Corporate, IoT, Production DB).","Προδιαγραφή αρχιτεκτονικής Software-Defined Perimeter (SDP) για πρόσβαση Zero-Trust.","Ορισμός σχήματος διευθύνσεων IP (RFC 1918) με transit subnets και NAT gateways."],"deliv":"📦 Παραδοτέο Οροσήμου: Σενάριο συλλογής Python + σχήμα σχεσιακής βάσης δεδομένων."},{"num":"M2","title":"Μηχανή Αναλυτικής TTPs & Υπολογισμού Ομοιότητας Δραστών","desc":"Υλοποίηση μαθηματικών δεικτών ομοιότητας για σύγκριση επικάλυψης τεχνικών μεταξύ κρατικών και εγκληματικών ομάδων.","spec":["Αρχιτεκτονική DMZ διπλού τείχους προστασίας με ετερογενείς μηχανές firewall.","Ορισμός κανόνων Netfilter/iptables με default-drop και αυστηρό egress filtering.","Ενσωμάτωση Suricata IPS inline με ροές threat intelligence."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα αναλυτικής + οπτικοποίηση πίνακα ομοιότητας."},{"num":"M3","title":"Γεννήτρια Δυναμικών Χαρτών Θερμότητας ATT&CK Navigator","desc":"Παραγωγή δυναμικών επιπέδων ATT&CK με χρωματική κωδικοποίηση για συχνότητα τεχνικών και κενά κάλυψης.","spec":["Προδιαγραφή VPN tunnels IPsec IKEv2 με AES-256-GCM και PFS Diffie-Hellman Group 20.","Παραμετροποίηση WireGuard gateway με κρυπτογράφηση Noise protocol.","Ορισμός πολιτικών split-tunneling και ελέγχων ασφάλειας τερματικών."],"deliv":"📦 Παραδοτέο Οροσήμου: Διαδραστική γεννήτρια επιπέδων + εξαγόμενα αρχεία JSON."},{"num":"M4","title":"Εγχειρίδιο Προσομοίωσης Αντιπάλου & Επιτελική Ενημέρωση CTI","desc":"Σύνταξη αυτοματοποιημένων δοκιμών με αρχεία YAML του Atomic Red Team και παράδοση στρατηγικής ενημέρωσης CTI.","spec":["Σχεδιασμός αγωγού συλλογής τηλεμετρίας δικτύου με ροές NetFlow/IPFIX και Zeek logs.","Υλοποίηση ειδοποιήσεων ανωμαλιών για DNS tunneling και lateral movement.","Κατασκευή πίνακα ανθεκτικότητας δικτύου με BGP failover και προστασία DDoS."],"deliv":"📦 Παραδοτέο Οροσήμου: Εγχειρίδιο προσομοίωσης + στρατηγική παρουσίαση CTI."}],"deliverables":["Πλήρης Πηγαίος Κώδικας Πλατφόρμας Python (`/src/collector/`, `/src/analytics/`)","Δυναμικά Αρχεία Επιπέδων ATT&CK Navigator (`energy_sector_threats.json`)","Σουίτα Σεναρίων Προσομοίωσης YAML (`emulation_suite/`)","Στρατηγικός Φάκελος Πληροφοριών Κυβερνοαπειλών (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου Συστήματος Ανίχνευσης Εισβολών Δικτύου (NIDS) σε Python","desc":"Οι αμυνόμενοι οφείλουν να κατανοούν τον μηχανισμό ανάλυσης πακέτων σε χαμηλό επίπεδο. Σε αυτό το έργο, θα κατασκευάσετε ένα λειτουργικό πολυνηματικό Σύστημα Ανίχνευσης Εισβολών Δικτύου (NIDS) σε Python ( custom_nids.py ) με raw sockets και Scapy. Η μηχανή σας θα συλλαμβάνει δικτυακή κίνηση σε promiscuous mode, θα αναλύει κανόνες Snort, θα ανακατασκευάζει TCP streams, θα ανιχνεύει port scans και επιθέσεις ARP poisoning και θα παράγει αρχεία καταγραφής ειδοποιήσεων.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Σύλληψη Πακέτων Promiscuous & Αναλυτής Πρωτοκόλλων","desc":"Κατασκευή αγωγού σύλληψης πακέτων που αποκωδικοποιεί πλαίσια Ethernet, κεφαλίδες IP και κεφαλίδες επιπέδου μεταφοράς TCP/UDP.","spec":["Υλοποίηση raw socket listener με `AF_PACKET, SOCK_RAW` στο Linux.","Αποκωδικοποίηση δυαδικών κεφαλίδων με το `struct.unpack`.","Προώθηση αποκωδικοποιημένων πακέτων σε ουρές επεξεργασίας σε worker threads."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα packet_dissector.py + έξοδος ανάλυσης PCAP."},{"num":"M2","title":"Αναλυτής Κανόνων Snort & Μηχανή Υπογραφών","desc":"Υλοποίηση μηχανής αντιστοίχισης υπογραφών που φορτώνει κανόνες Snort και εκτελεί ταχείες αναζητήσεις συμβολοσειρών Boyer-Moore στο payload.","spec":["Ανάλυση κανόνων Snort με επιλογές `msg`, `content`, `nocase`, `sid`.","Υλοποίηση μηχανής αναζήτησης υπογραφών στα δεδομένα του πακέτου.","Παραγωγή δομημένης ειδοποίησης με χρονικό σήμα, SID κανόνα και IPs."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα rule_engine.py + δοκιμές επαλήθευσης 10 κανόνων."},{"num":"M3","title":"Ανιχνευτής Στατιστικών Ανωμαλιών Port Scan & ARP Spoofing","desc":"Ανάπτυξη αλγορίθμων ανίχνευσης ανωμαλιών που παρακολουθούν συχνότητες συνδέσεων για εντοπισμό SYN/Xmas scans και πλαστογράφησης ARP.","spec":["Διατήρηση πίνακα συνδέσεων sliding window: επισήμανση IP που στέλνει > 20 SYN πακέτα σε 2 δευτερόλεπτα.","Εντοπισμός ανωμαλιών flags (π.χ. SYN+FIN, ή πακέτα NULL).","Δυναμική παρακολούθηση πίνακα ARP: ειδοποίηση σε περίπτωση αλλαγής MAC διεύθυνσης για υπάρχουσα IP."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα anomaly_detector.py με επιτυχή ανίχνευση σαρώσεων Nmap."},{"num":"M4","title":"Διανομέας Ειδοποιήσεων & Μέτρηση Επιδόσεων","desc":"Μορφοποίηση ειδοποιήσεων σε CEF/Syslog, ζωντανή απεικόνιση σε κονσόλα και μέτρηση ρυθμαπόδοσης σε υψηλό φόρτο.","spec":["Εξαγωγή ειδοποιήσεων στο `/var/log/custom_nids.log` και στην κονσόλα.","Μέτρηση επιδόσεων με χρήση του `tcpreplay` σε ρυθμό 100.000 πακέτων/δευτερόλεπτο.","Καταγραφή ποσοστού απώλειας πακέτων και κατανάλωσης CPU."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένη εφαρμογή custom_nids.py + αναφορά μετρήσεων και βίντεο."}],"deliverables":["Πλήρης πηγαίος κώδικας NIDS (`/py_nids/`) με αναλυτή πακέτων και κανόνων","Αρχείο κανόνων (`rules.conf`) με 20+ υπογραφές επιθέσεων","Συλλογή αρχείων PCAP με προσομοιώσεις επιθέσεων","Τεχνική Αναφορά Αρχιτεκτονικής & Μέτρησης Επιδόσεων (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 3","quiz":[{"q":"Σε ποιο επίπεδο του μοντέλου OSI λειτουργεί μια επίθεση πλαστογράφησης ARP (ARP spoofing);","opts":[{"k":"A","v":"Επίπεδο 1 (Φυσικό Επίπεδο), αλλάζοντας την τάση των ηλεκτρικών σημάτων στα καλώδια χαλκού."},{"k":"B","v":"Επίπεδο 3 (Επίπεδο Δικτύου), εισάγοντας πλαστά χαρακτηριστικά δρομολόγησης BGP αυτόνομων συστημάτων."},{"k":"C","v":"Επίπεδο 4 (Επίπεδο Μεταφοράς), τροποποιώντας αριθμούς ακολουθίας TCP για υποκλοπή ενεργών συνόδων."},{"k":"D","v":"Επίπεδο 2 (Επίπεδο Συνδέσμου Δεδομένων), δηλητηριάζοντας τους τοπικούς πίνακες αντιστοίχισης MAC προς IP."},{"k":"E","v":"Επίπεδο 7 (Επίπεδο Εφαρμογής), εισάγοντας κακόβουλο κώδικα JavaScript σε κεφαλίδες αιτημάτων HTTP."}],"ans":"D","exp":"Το ARP λειτουργεί στο Επίπεδο 2 (Συνδέσμου Δεδομένων) για την αντιστοίχιση διευθύνσεων IPv4 σε διευθύνσεις MAC στο τοπικό δίκτυο."},{"q":"Πώς βελτιώνει το TLS 1.3 την καθυστέρηση χειραψίας και την ασφάλεια σε σύγκριση με το TLS 1.2;","opts":[{"k":"A","v":"Αντικαθιστώντας όλους τους συμμετρικούς αλγορίθμους με μη κρυπτογραφημένη εκπομπή datagrams UDP, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Καταργώντας την ανάγκη ψηφιακών πιστοποιητικών διακομιστή μέσω υποχρεωτικής βιομετρικής ταυτοποίησης, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Επιβάλλοντας σε όλους τους πελάτες στατική ανταλλαγή RSA 4096-bit αντί για εφήμερο Diffie–Hellman, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Δρομολογώντας όλη την κρυπτογραφημένη κίνηση μέσω ενδιάμεσων διακομιστών proxy των Αρχών Πιστοποίησης, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Μειώνοντας την πλήρη χειραψία σε έναν μόνο κύκλο (1-RTT) και καταργώντας απαρχαιωμένα ανασφαλή ciphers."}],"ans":"E","exp":"Το TLS 1.3 μειώνει την καθυστέρηση χειραψίας σε 1-RTT (με υποστήριξη 0-RTT) και αφαιρεί επισφαλή ciphers όπως στατικό RSA, RC4 και SHA-1."},{"q":"Ποια βασική ευπάθεια του Συστήματος Ονομάτων Χώρου (DNS) αντιμετωπίζει αποτελεσματικά το DNSSEC;","opts":[{"k":"A","v":"Δηλητηρίαση προσωρινής μνήμης (cache poisoning) και πλαστογράφηση, μέσω ψηφιακών υπογραφών."},{"k":"B","v":"Ογκομετρικές επιθέσεις ενίσχυσης DNS (DNS amplification) κατά έγκυρων διακομιστών ονομάτων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Φυσική υποκλοπή σημάτων σε υπερατλαντικά υποβρύχια καλώδια οπτικών ινών τηλεπικοινωνιών, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Επιθέσεις εξαντλητικής αναζήτησης κωδικών πρόσβασης σε πίνακες διαχείρισης καταχωρητών domain, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Υπερχειλίσεις μνήμης buffer σε τοπικές υπηρεσίες αναδρομικής επίλυσης ονομάτων DNS, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"A","exp":"Το DNSSEC προσθέτει κρυπτογραφικές υπογραφές (RRSIG) στις εγγραφές DNS, επιτρέποντας στους επιλυτές να επαληθεύουν την αυθεντικότητα και να αποτρέπουν το cache poisoning."},{"q":"Πώς αξιολογεί τα εισερχόμενα πακέτα ένα stateful firewall σε σύγκριση με ένα stateless φίλτρο πακέτων;","opts":[{"k":"A","v":"Τα stateful firewalls ελέγχουν κάθε πακέτο μεμονωμένα χωρίς να παρακολουθούν το πλαίσιο της σύνδεσης, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Τα stateful firewalls παρακολουθούν την κατάσταση των ενεργών συνδέσεων, αξιολογώντας ροές πακέτων."},{"k":"C","v":"Τα stateful firewalls αποκρυπτογραφούν όλα τα δεδομένα TLS χρησιμοποιώντας ενσωματωμένα κλειδιά CA, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Τα stateful firewalls λειτουργούν αποκλειστικά σε επίπεδο MAC Layer 2, αγνοώντας κεφαλίδες IP και TCP, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Τα stateful firewalls αντικαθιστούν τους πίνακες δρομολόγησης με ιδιόκτητα κβαντικά φίλτρα τυχαιότητας, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"B","exp":"Τα stateful firewalls διατηρούν πίνακα ενεργών συνδέσεων TCP/UDP. Επιτρέπουν αυτόματα την επιστροφή απαντήσεων που ανήκουν σε ήδη εγκεκριμένη σύνοδο."},{"q":"Ποιο μηχανισμό λειτουργίας χρησιμοποιεί ένα σύστημα NIDS βασισμένο σε υπογραφές για τον εντοπισμό κακόβουλης κίνησης;","opts":[{"k":"A","v":"Εκτελεί όλα τα εισερχόμενα δυαδικά αρχεία σε απομονωμένο hypervisor πριν από την προώθηση των πακέτων."},{"k":"B","v":"Επαναδρομολογεί δυναμικά τους πίνακες BGP για να απομονώσει ολόκληρα αυτόνομα συστήματα δικτύου."},{"k":"C","v":"Συγκρίνει τα περιεχόμενα πακέτων και τις κεφαλίδες με μια βάση δεδομένων γνωστών μοτίβων απειλών."},{"k":"D","v":"Επανακρυπτογραφεί όλες τις τοπικές μεταδόσεις δεδομένων με μετα-κβαντικούς αλγορίθμους πλεγμάτων."},{"k":"E","v":"Μπλοκάρει μόνιμα όλες τις διευθύνσεις IP που προέρχονται από οικιακούς παρόχους διαδικτύου."}],"ans":"C","exp":"Τα NIDS βασισμένα σε υπογραφές (π.χ. Suricata, Snort) σαρώνουν πακέτα αναζητώντας προκαθορισμένα μοτίβα bytes και ανωμαλίες που αντιστοιχούν σε γνωστές επιθέσεις."},{"q":"Ποια είναι η θεμελιώδης αρχή ασφάλειας μιας Αρχιτεκτονικής Μηδενικής Εμπιστοσύνης (Zero Trust Architecture);","opts":[{"k":"A","v":"Εμπιστοσύνη σε όλη την εσωτερική κίνηση δικτύου εφόσον η συσκευή έχει συνδεθεί στο εταιρικό VPN."},{"k":"B","v":"Πλήρης αποκλεισμός εξωτερικής πρόσβασης στο διαδίκτυο για όλους τους σταθμούς εργασίας ανεξαιρέτως, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Απαίτηση φυσικών κλειδιών ασφαλείας για μη κρυπτογραφημένες τοπικές κλήσεις εκπομπής (broadcast)."},{"k":"D","v":"Ποτέ μην εμπιστεύεσαι, πάντα να επαληθεύεις: κάθε αίτημα πρέπει να ταυτοποιείται, να εγκρίνεται και να κρυπτογραφείται."},{"k":"E","v":"Ανάθεση όλων των αποφάσεων ελέγχου πρόσβασης στους δρομολογητές του εξωτερικού παρόχου internet."}],"ans":"D","exp":"Το Zero Trust επιβάλλει \'never trust, always verify\'. Εξαλείφει την τυφλή εμπιστοσύνη βάσει τοποθεσίας δικτύου, απαιτώντας συνεχή αυθεντικοποίηση και μικρο-κατάτμηση."},{"q":"Πώς εξαντλεί τους πόρους του διακομιστή-στόχου μια επίθεση TCP SYN Flood κατά τη χειραψία επιπέδου μεταφοράς;","opts":[{"k":"A","v":"Αλλοιώνοντας τα αρχεία μεταφοράς ζώνης DNS για ανακατεύθυνση των ερωτημάτων σε κακόβουλους επιλυτές, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Υπερφορτώνοντας τις θύρες των Ethernet switches με πακέτα εκπομπής ARP σε όλα τα υποδίκτυα, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Δημιουργώντας εκατομμύρια πλήρως ολοκληρωμένες συνόδους TLS 1.3 που παραμένουν αδρανείς επ\' άπειρον, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Εκμεταλλευόμενη κενά υπερχείλισης μνήμης buffer στον χρονοπρογραμματιστή του λειτουργικού συστήματος, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Στέλνοντας τεράστιο όγκο πακέτων SYN με πλαστές IP, γεμίζοντας την ουρά ημι-ανοικτών συνδέσεων (SYN queue)."}],"ans":"E","exp":"Στο SYN flood, ο επιτιθέμενος στέλνει πακέτα SYN χωρίς να στείλει το τελικό ACK. Ο διακομιστής δεσμεύει πόρους για κάθε ημι-ανοικτή σύνδεση μέχρι να εξαντληθεί η ουρά (backlog)."},{"q":"Ποιος είναι ο κύριος αρχιτεκτονικός σκοπός της δημιουργίας μιας Αποστρατιωτικοποιημένης Ζώνης (DMZ) στην ασφάλεια δικτύων;","opts":[{"k":"A","v":"Να φιλοξενεί δημόσια προσβάσιμες υπηρεσίες σε απομονωμένο υποδίκτυο, προστατεύοντας το εσωτερικό δίκτυο."},{"k":"B","v":"Να επιταχύνει τη μεταφορά δεδομένων στο τοπικό δίκτυο καταργώντας όλους τους κανόνες δρομολόγησης firewall, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Να αντικαταστήσει την κλασική συμμετρική κρυπτογράφηση με αυτοματοποιημένα κβαντικά κανάλια διανομής, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Να επιτρέπει σε εξωτερικούς συνεργάτες πρόσβαση σε εσωτερικές βάσεις χωρίς ταυτοποίηση, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Να συγκεντρώσει όλους τους σταθμούς εργασίας των υπαλλήλων σε ένα ενιαίο επίπεδο δίκτυο Layer 2, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"A","exp":"Η DMZ λειτουργεί ως ενδιάμεση ζώνη απομόνωσης για δημόσιες υπηρεσίες. Εάν ένας διακομιστής στην DMZ παραβιαστεί, το τείχος προστασίας αποτρέπει την πλευρική μετακίνηση στο εσωτερικό LAN."},{"q":"Πώς επιτρέπει η υποκλοπή BGP (BGP Hijacking) σε κακόβουλους δράστες να ανακατευθύνουν παγκόσμια κίνηση διαδικτύου;","opts":[{"k":"A","v":"Υποκλέπτοντας ιδιωτικά κλειδιά Root CA για αποκρυπτογράφηση διεθνών επικοινωνιών οπτικών ινών, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Δημοσιεύοντας ψευδείς ανακοινώσεις προθεμάτων IP (route prefixes) στο πρωτόκολλο BGP χωρίς εξουσιοδότηση."},{"k":"C","v":"Παράγοντας κακοσχηματισμένα πακέτα απαντήσεων ARP σε υποθαλάσσια καλώδια δικτύων ευρείας περιοχής, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Εξαντλώντας τους κύκλους CPU σε έγκυρους διακομιστές DNS μέσω ανακλώμενων αναδρομικών ερωτημάτων, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Τροποποιώντας τα αρχεία hosts των λειτουργικών συστημάτων μέσω ευπαθειών JavaScript στον περιηγητή, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"B","exp":"Το BGP βασίζεται στην εμπιστοσύνη μεταξύ Αυτόνομων Συστημάτων. Οι επιτιθέμενοι ανακοινώνουν μη εξουσιοδοτημένα προθέματα IP, κάνοντας τους δρομολογητές να στέλνουν την κίνηση στον επιτιθέμενο."},{"q":"Ποιο πρωτόκολλο τηλεμετρίας δικτύου χρησιμοποιείται για την εξαγωγή στατιστικών ροών (IPs, θύρες, πλήθος πακέτων) σε κεντρικούς συλλέκτες;","opts":[{"k":"A","v":"Border Gateway Protocol (BGP), διαφημίζοντας πληροφορίες προσβασιμότητας μεταξύ αυτόνομων συστημάτων."},{"k":"B","v":"Dynamic Host Configuration Protocol (DHCP), αποδίδοντας δυναμικές ρυθμίσεις διευθύνσεων σε υπολογιστές."},{"k":"C","v":"NetFlow / IPFIX, εξάγοντας εγγραφές ροών με διευθύνσεις προέλευσης/προορισμού και στατιστικά bytes."},{"k":"D","v":"Simple Mail Transfer Protocol (SMTP), δρομολογώντας μηνύματα ηλεκτρονικού ταχυδρομείου σε πράκτορες."},{"k":"E","v":"Spanning Tree Protocol (STP), αποτρέποντας βρόχους μεταγωγής σε δίκτυα Ethernet επιπέδου Layer 2, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"C","exp":"Τα πρωτόκολλα NetFlow και IPFIX εξάγουν συγκεντρωτικά μεταδεδομένα ροών δικτύου (IPs, θύρες, πρωτόκολλο, όγκος πακέτων) για παρακολούθηση ασφάλειας και ανάλυση ανωμαλιών."}]},{"part":"Μέρος 2 · Αντίπαλοι και Επιθέσεις","time":"Κεφάλαιο 4 · ⏱️ 8–10 ώρες μελέτης","title":"4. Ταξινόμηση του Κακόβουλου Λογισμικού και του Κακόβουλου Κώδικα","subtitle":"Ιοί · Σκουλήκια (worms) · Δούρειοι ίπποι (trojans) · Λογισμικό κατασκοπείας · Λυτρισμικό · Επιθέσεις χωρίς αρχεία · Rootkits · Ενδείξεις παραβίασης · Stuxnet, WannaCry, Emotet","outcomes":["Να διακρίνετε τις κατηγορίες κακόβουλου λογισμικού με βάση την αναπαραγωγή, τη διάδοση και το ωφέλιμο φορτίο τους και να επιλέγετε την κατάλληλη στρατηγική περιορισμού.","Να εξηγείτε την εκτέλεση χωρίς αρχεία, τον πολυμορφισμό και τα rootkits, καθώς και τον λόγο για τον οποίο παρακάμπτουν την ανίχνευση με υπογραφές.","Να αναγνωρίζετε ενδείξεις παραβίασης σε υπολογιστές και δίκτυα και να εξηγείτε γιατί απαιτείται συσχέτισή τους.","Να περιγράφετε τα στάδια μιας σύγχρονης επίθεσης λυτρισμικού και τη σωστή σειρά απόκρισης.","Να αντλείτε αμυντικά διδάγματα από τις περιπτώσεις Stuxnet, WannaCry και Emotet."],"intro":["Το κακόβουλο λογισμικό είναι το πιο ορατό εργαλείο των κυβερνοεπιθέσεων, ωστόσο τα μέσα ενημέρωσης χρησιμοποιούν συχνά την ορολογία του χαλαρά. Ο χαρακτηρισμός κάθε μόλυνσης ως «ιού» δεν είναι μόνο ανακριβής· μπορεί να οδηγήσει σε λανθασμένη απόκριση. Ένα σκουλήκι περιορίζεται με την απομόνωση δικτύων, ενώ ένας δούρειος ίππος σταματά με την παρεμπόδιση της εκτέλεσής του. Η ακριβής ταξινόμηση αποτελεί επομένως επιχειρησιακή αναγκαιότητα και όχι ακαδημαϊκή άσκηση.","Το κεφάλαιο οργανώνει το κακόβουλο λογισμικό με βάση τον _μηχανισμό_ του —πώς διαδίδεται, πώς κρύβεται και τι κάνει— και όχι με βάση τα ονόματα μεμονωμένων οικογενειών. Στη συνέχεια εξετάζει τις προηγμένες τεχνικές που επιτρέπουν στα σύγχρονα εμφυτεύματα να αποφεύγουν την ανίχνευση, εξηγεί πώς αναγνωρίζεται μια παραβίαση σε υπολογιστές και δίκτυα, αναλύει τη σύγχρονη επιχείρηση λυτρισμικού και αντλεί διδάγματα από τρεις ιστορικές περιπτώσεις."],"sections":[{"id":"4.1","title":"Βασικές κατηγορίες: τι αναπαράγεται, τι εξαπατά, τι αποφέρει κέρδος","blocks":[{"type":"p","text":"Ένας **ιός** προσκολλάται σε ένα αρχείο-ξενιστή ή έγγραφο και αναπαράγεται μόνο όταν αυτό εκτελεστεί· επομένως, εξαρτάται συνήθως από κάποια ενέργεια του χρήστη. Αντίθετα, ένα **σκουλήκι** (worm) είναι αυτοτελές και διαδίδεται από μόνο του στα δίκτυα, εκμεταλλευόμενο ευάλωτες υπηρεσίες· το Morris Worm και η διάδοση του WannaCry μέσω του πρωτοκόλλου SMB είναι κλασικά παραδείγματα. Ένας **δούρειος ίππος** (trojan) δεν αναπαράγεται καθόλου. Παρουσιάζεται ως νόμιμο λογισμικό, ώστε να πείσει το θύμα να τον εκτελέσει, και η επικινδυνότητά του έγκειται στην κοινωνική του αληθοφάνεια και στα ωφέλιμα φορτία που μεταφέρει."},{"type":"p","text":"Άλλες κατηγορίες ορίζονται από το τι κάνουν και όχι από το πώς διαδίδονται. Το **λογισμικό κατασκοπείας** (spyware) συλλέγει κρυφά τη δραστηριότητα ή τα δεδομένα του χρήστη· το **διαφημιστικό λογισμικό** (adware) εκμεταλλεύεται οικονομικά την προσοχή του θύματος και συχνά λειτουργεί ως πύλη για λογισμικό κατασκοπείας· οι **καταγραφείς πληκτρολογήσεων** (keyloggers) καταγράφουν ό,τι πληκτρολογείται για να υποκλέψουν κωδικούς. Το **λυτρισμικό** (ransomware) στερεί την πρόσβαση στα δεδομένα, είτε κρυπτογραφώντας αρχεία (_κρυπτογραφικό λυτρισμικό_) είτε κλειδώνοντας το σύστημα (_λυτρισμικό κλειδώματος_), και σήμερα συνήθως συνδυάζει την κρυπτογράφηση με κλοπή δεδομένων —τον λεγόμενο _διπλό εκβιασμό_."},{"type":"table","caption":"Πίνακας 4.1 — Κατηγορίες κακόβουλου λογισμικού και κύριες άμυνες","head":["Κατηγορία","Αυτοαναπαράγεται;","Απαιτεί ενέργεια χρήστη;","Κύρια άμυνα"],"rows":[["Ιός","Ναι, μέσω αρχείων-ξενιστών","Συνήθως","Παρεμπόδιση εκτέλεσης, antivirus, ενημερώσεις"],["Σκουλήκι","Ναι, μέσω δικτύου","Όχι","Κατάτμηση δικτύου, άμεση ενημέρωση υπηρεσιών, IDS"],["Δούρειος ίππος","Όχι","Ναι (εξαπάτηση)","Λίστες επιτρεπόμενων εφαρμογών, υπογραφή κώδικα, ευαισθητοποίηση"],["Λυτρισμικό","Ενίοτε (όπως σκουλήκι)","Συχνά (ψάρεμα, εκτεθειμένο RDP)","Αμετάβλητα αντίγραφα ασφαλείας, MFA, EDR, ενημερώσεις"],["Λογισμικό κατασκοπείας / keylogger","Όχι","Ναι (ενσωματωμένο σε λογισμικό)","Ελάχιστο προνόμιο, παρακολούθηση εξερχόμενης κίνησης"]]}]},{"id":"4.2","title":"Προηγμένοι μηχανισμοί: εκτέλεση χωρίς αρχεία, πολυμορφισμός και rootkits","blocks":[{"type":"p","text":"Τα παραδοσιακά προϊόντα προστασίας από ιούς σαρώνουν αρχεία στον δίσκο και τα συγκρίνουν με γνωστές υπογραφές. Τα σύγχρονα εμφυτεύματα σχεδιάζονται ακριβώς για να παρακάμπτουν αυτή την προσέγγιση. Το **κακόβουλο λογισμικό χωρίς αρχεία** (fileless malware) βρίσκεται στη μνήμη, στο μητρώο, σε συνδρομές WMI ή σε προγραμματισμένες εργασίες και κάνει κατάχρηση νόμιμων εργαλείων του συστήματος, όπως το PowerShell, το `mshta` ή το `wmic`. Η πρακτική αυτή ονομάζεται _living off the land_, επειδή ο επιτιθέμενος χρησιμοποιεί ό,τι είναι ήδη εγκατεστημένο. Τεχνικές όπως η _ανακλαστική έγχυση DLL_ (reflective DLL injection) και η _εκκένωση διεργασίας_ (process hollowing) φορτώνουν κακόβουλο κώδικα στη μνήμη μιας αξιόπιστης διεργασίας, ώστε κανένα ύποπτο εκτελέσιμο να μη γράφεται ποτέ στον δίσκο."},{"type":"p","text":"Ο **πολυμορφικός** και ο **μεταμορφικός** κώδικας μεταβάλλει τη δυαδική του αναπαράσταση σε κάθε μόλυνση —μέσω κρυπτογραφικών περιτυλιγμάτων ή αντικατάστασης εντολών— ενώ η συμπεριφορά του παραμένει ίδια. Μια υπογραφή που γράφτηκε για ένα αντίγραφο αποτυγχάνει επομένως να ταιριάξει με το επόμενο· γι\' αυτό οι αμυνόμενοι στρέφονται στην ανίχνευση συμπεριφοράς και σε κανόνες προτύπων όπως οι κανόνες YARA (Κεφάλαιο 11). Τα **rootkits** προχωρούν ένα βήμα παραπέρα: λειτουργώντας σε επίπεδο χρήστη, στον πυρήνα, στη διαδικασία εκκίνησης ή ακόμη και στο υλικολογισμικό, παρεμβάλλονται στα ερωτήματα προς το σύστημα για να αποκρύψουν αρχεία, διεργασίες και δικτυακές συνδέσεις. Επειδή ένα rootkit ελέγχει τι αναφέρει το παραβιασμένο σύστημα για τον εαυτό του, πρέπει να ανιχνεύεται _εκτός_ αυτού του συστήματος —μέσω ασφαλούς εκκίνησης (secure boot), εγκληματολογικής ανάλυσης μνήμης ή ανάλυσης του δίσκου εκτός λειτουργίας."}]},{"id":"4.3","title":"Ενδείξεις παραβίασης σε υπολογιστές και δίκτυα","blocks":[{"type":"p","text":"Μια παραβίαση συνήθως αποκαλύπτεται ως **απόκλιση από τη φυσιολογική συμπεριφορά αναφοράς** (baseline). Σε έναν υπολογιστή, τυπικές ενδείξεις είναι η παρατεταμένη δραστηριότητα επεξεργαστή, δίσκου ή δικτύου χωρίς αντίστοιχο φόρτο εργασίας του χρήστη· νέοι μηχανισμοί μόνιμης παρουσίας, όπως κλειδιά _Run_ στο μητρώο, υπηρεσίες, εργασίες cron ή συνδρομές WMI· ασυνήθιστα δέντρα διεργασιών, για παράδειγμα ένας επεξεργαστής κειμένου που εκκινεί γραμμή εντολών· και στοιχεία παραποίησης των αμυνών, όπως απενεργοποιημένος πράκτορας προστασίας ή διαγραμμένο αρχείο καταγραφής ασφάλειας (συμβάν 1102 στα Windows). Στο δίκτυο, ύποπτες ενδείξεις αποτελούν οι τακτικές συνδέσεις «σηματοδότησης» (beaconing) σε σταθερά διαστήματα, τα πολύ μεγάλα ή φαινομενικά τυχαία ονόματα τομέα και τα αποτυπώματα πελάτη TLS που δεν αντιστοιχούν σε κανένα νόμιμο λογισμικό του οργανισμού."},{"type":"p","text":"Μια σημαντική αρχή της ανάλυσης είναι ότι **μια μεμονωμένη ένδειξη απλώς υποδηλώνει· πολλές συσχετισμένες ενδείξεις επιβεβαιώνουν**. Οι διαχειριστές εκτελούν περιστασιακά PowerShell και το νόμιμο λογισμικό επικοινωνεί μερικές φορές με ασυνήθιστους τομείς. Η βεβαιότητα αυξάνεται όταν ανεξάρτητες παρατηρήσεις οδηγούν στο ίδιο συμπέρασμα —για παράδειγμα, ένα έγγραφο Office εκκινεί PowerShell, το οποίο δημιουργεί ένα κλειδί Run και αρχίζει να επικοινωνεί κάθε εξήντα δευτερόλεπτα με έναν πρόσφατα καταχωρισμένο τομέα. Το Κεφάλαιο 11 μετατρέπει αυτή την αρχή σε κανόνες ανίχνευσης και το Κεφάλαιο 12 την εφαρμόζει στην εγκληματολογική ανάλυση."}]},{"id":"4.4","title":"Droppers, loaders, trojans απομακρυσμένης πρόσβασης και wipers","blocks":[{"type":"p","text":"Οι σύγχρονες εισβολές σπάνια πραγματοποιούνται από ένα μόνο πρόγραμμα. Αντίθετα, μια αλυσίδα εξειδικευμένων στοιχείων μεταβιβάζει τον έλεγχο από το ένα στάδιο στο επόμενο. Ένας **dropper** μεταφέρει το ωφέλιμο φορτίο μέσα του και το εγγράφει στο σύστημα. Ένας **downloader** ή **loader** —γνωστά παραδείγματα είναι τα Emotet, TrickBot και QakBot— ανακτά πρόσθετες μονάδες από το διαδίκτυο μετά την αρχική μόλυνση, γεγονός που επέτρεψε την ανάπτυξη μιας οικονομίας _εγκληματικού λογισμικού ως υπηρεσίας_, στην οποία μια ομάδα πωλεί πρόσβαση σε άλλη. Ένας **δούρειος ίππος απομακρυσμένης πρόσβασης** (Remote Access Trojan, RAT) παρέχει στον επιτιθέμενο διαδραστικό έλεγχο: καταγραφή πληκτρολογήσεων, λήψη στιγμιοτύπων οθόνης, μεταφορά αρχείων και χρήση του θύματος ως ενδιάμεσου κόμβου."},{"type":"p","text":"Ένας **wiper**, όπως τα Shamoon, WhisperGate ή HermeticWiper, σχεδιάζεται αποκλειστικά για καταστροφή, αν και μπορεί να μεταμφιέζεται σε λυτρισμικό. Η σωστή αναγνώριση είναι εδώ κρίσιμη: επειδή δεν υπάρχει κλειδί αποκρυπτογράφησης, ένα σχέδιο απόκρισης που εξετάζει την καταβολή λύτρων δεν είναι απλώς μάταιο αλλά και επιζήμιο, διότι καθυστερεί την ανάκαμψη από τα αντίγραφα ασφαλείας. Κατά την ανάλυση ενός περιστατικού, οι αναλυτές πρέπει επομένως να κατονομάζουν το _στάδιο_ που παρατήρησαν και όχι μόνο την οικογένεια —η διατύπωση «loader του QakBot, πριν από την εγκατάσταση RAT» είναι πολύ πιο χρήσιμη για την ομάδα απόκρισης από το σκέτο «QakBot»."}]},{"id":"4.5","title":"Ανατομία του σύγχρονου λυτρισμικού","blocks":[{"type":"p","text":"Το σύγχρονο κρυπτογραφικό λυτρισμικό βασίζεται στην **υβριδική κρυπτογράφηση**. Κάθε αρχείο κρυπτογραφείται με έναν ταχύ συμμετρικό αλγόριθμο (AES ή ChaCha20) και ένα μοναδικό κλειδί· τα κλειδιά αυτά κρυπτογραφούνται με τη σειρά τους με το δημόσιο κλειδί του επιτιθέμενου (RSA ή ελλειπτικών καμπυλών), ώστε μόνο εκείνος να μπορεί να τα ανακτήσει. Πριν αρχίσει η κρυπτογράφηση, το κακόβουλο λογισμικό διαγράφει συνήθως τα σκιώδη αντίγραφα (shadow copies) και τους καταλόγους αντιγράφων ασφαλείας των Windows (για παράδειγμα με την εντολή `vssadmin delete shadows`), ώστε να αποτρέψει την εύκολη ανάκτηση, και επιχειρεί να απενεργοποιήσει τα εργαλεία ασφάλειας, ενίοτε επανεκκινώντας το σύστημα σε ασφαλή λειτουργία, όπου οι πράκτορες προστασίας δεν εκτελούνται."},{"type":"p","text":"Η πίεση προς το θύμα ασκείται μέσω **πολλαπλού εκβιασμού**: τα δεδομένα κρυπτογραφούνται, τα κλεμμένα δεδομένα απειλούνται με δημοσιοποίηση σε ιστότοπο διαρροών και ορισμένες ομάδες προσθέτουν επιθέσεις άρνησης υπηρεσίας ή επικοινωνούν απευθείας με τους πελάτες του θύματος. Η σωστή απόκριση ακολουθεί αυστηρή σειρά: πρώτα **απομονώνονται** οι επηρεασμένοι υπολογιστές και οι παραβιασμένες ταυτότητες· έπειτα **διαφυλάσσονται τα αποδεικτικά στοιχεία**, συμπεριλαμβανομένων των ειδώλων μνήμης και των σημειωμάτων λύτρων, που περιέχουν αναγνωριστικά του θύματος· στη συνέχεια **προσδιορίζεται το στέλεχος** και ελέγχεται αν υπάρχει δωρεάν εργαλείο αποκρυπτογράφησης (για παράδειγμα στην πύλη No More Ransom)· και μόνο τότε γίνεται **αποκατάσταση** από αντίγραφα ασφαλείας που είναι γνωστό ότι δεν έχουν μολυνθεί. Η καταβολή λύτρων δεν εγγυάται ούτε την αποκρυπτογράφηση ούτε τη διαγραφή των κλεμμένων δεδομένων και μπορεί επιπλέον να δημιουργήσει νομικά ζητήματα."},{"type":"callout","kind":"key","title":"🔑 Βασική αρχή","text":"Το πιο αποτελεσματικό τεχνικό μέτρο απέναντι στο λυτρισμικό είναι ένα αντίγραφο ασφαλείας που ο επιτιθέμενος δεν μπορεί να προσεγγίσει ή να τροποποιήσει: εκτός σύνδεσης ή αμετάβλητο, τακτικά δοκιμασμένο και προστατευμένο με ξεχωριστά διαπιστευτήρια (βλ. Κεφάλαιο 13)."}]},{"id":"4.6","title":"Ιστορικές μελέτες περίπτωσης: Stuxnet, WannaCry και Emotet","blocks":[{"type":"p","text":"Το **Stuxnet** (ανακαλύφθηκε το 2010) στόχευε προγραμματιζόμενους λογικούς ελεγκτές της Siemens που λειτουργούσαν φυγοκεντρητές εμπλουτισμού ουρανίου. Χρησιμοποίησε αρκετές ευπάθειες μηδενικής ημέρας, διέσχισε ένα φυσικά απομονωμένο δίκτυο (air gap) μέσω μέσων USB, έφερε οδηγούς υπογεγραμμένους με κλεμμένα πιστοποιητικά και μετέβαλε τη φυσική συμπεριφορά των μηχανημάτων, ενώ εμφάνιζε στους χειριστές κανονικές ενδείξεις. Το δίδαγμά του είναι ότι τα περιβάλλοντα επιχειρησιακής τεχνολογίας δεν μπορούν να βασίζονται μόνο στην απομόνωση (Κεφάλαιο 13)."},{"type":"p","text":"Το **WannaCry** (2017) συνδύασε λυτρισμικό με σκουλήκι που εκμεταλλευόταν την ευπάθεια MS17-010 του SMBv1 (την εκμετάλλευση _EternalBlue_). Μέσα σε λίγες ώρες διατάραξε οργανισμούς σε όλο τον κόσμο, μεταξύ των οποίων νοσοκομεία του Εθνικού Συστήματος Υγείας του Ηνωμένου Βασιλείου, παρότι η σχετική ενημέρωση ήταν διαθέσιμη εδώ και δύο μήνες. Το δίδαγμα είναι ότι η καθυστερημένη εφαρμογή ενημερώσεων και τα επίπεδα, μη κατατμημένα δίκτυα αλληλοενισχύονται: μόλις ένα σκουλήκι εισέλθει, τίποτα δεν επιβραδύνει τη διάδοσή του. Το **Emotet** (2014–2021) εξελίχθηκε από τραπεζικός δούρειος ίππος σε υπηρεσία φόρτωσης (loader-as-a-service) που διανεμόταν μέσω κακόβουλων μηνυμάτων ηλεκτρονικού ταχυδρομείου και εγκαθιστούσε το TrickBot και, τελικά, το λυτρισμικό Ryuk, έως ότου μια διεθνής επιχείρηση των διωκτικών αρχών εξάρθρωσε την υποδομή του. Το δίδαγμά του είναι ότι τα εγκληματικά οικοσυστήματα λειτουργούν όπως οι εφοδιαστικές αλυσίδες και ότι η άμυνα στο αρχικό στάδιο του loader αποτρέπει όλα όσα ακολουθούν."}]}],"terms":[{"name":"Σκουλήκι (worm)","def":"Αυτοτελές κακόβουλο λογισμικό που διαδίδεται στα δίκτυα χωρίς ενέργεια του χρήστη."},{"name":"Δούρειος ίππος","def":"Κακόβουλο λογισμικό μεταμφιεσμένο σε νόμιμο, το οποίο δεν αυτοαναπαράγεται."},{"name":"Κακόβουλο λογισμικό χωρίς αρχεία","def":"Κακόβουλος κώδικας που εκτελείται από τη μνήμη ή μέσω εργαλείων του συστήματος χωρίς να γράφει εκτελέσιμα στον δίσκο."},{"name":"Rootkit","def":"Κακόβουλο λογισμικό που κρύβει την παρουσία του παρεμβαίνοντας στις αναφορές του ίδιου του λειτουργικού συστήματος."},{"name":"Loader","def":"Στάδιο κακόβουλου λογισμικού που κατεβάζει και εκτελεί πρόσθετες μονάδες μετά την αρχική μόλυνση."},{"name":"Διπλός εκβιασμός","def":"Τακτική λυτρισμικού που συνδυάζει την κρυπτογράφηση με την απειλή δημοσιοποίησης κλεμμένων δεδομένων."}],"summary":["Το κακόβουλο λογισμικό ταξινομείται καλύτερα με βάση τον μηχανισμό —αναπαραγωγή, διάδοση και ωφέλιμο φορτίο— επειδή κάθε μηχανισμός απαιτεί διαφορετική στρατηγική περιορισμού.","Οι τεχνικές χωρίς αρχεία, ο πολυμορφισμός και τα rootkits παρακάμπτουν τις υπογραφές αρχείων και απαιτούν ανίχνευση συμπεριφοράς και ανίχνευση εκτός του παραβιασμένου συστήματος.","Οι ενδείξεις παραβίασης αποκτούν νόημα μέσω της συσχέτισης· μια μεμονωμένη ανωμαλία είναι απλώς ένα στοιχείο προς διερεύνηση.","Οι σύγχρονες εισβολές είναι σταδιακές αλυσίδες από droppers, loaders, RAT και τελικά φορτία, όπως λυτρισμικό ή wipers.","Τα Stuxnet, WannaCry και Emotet αναδεικνύουν τα όρια της απομόνωσης, το κόστος της καθυστερημένης ενημέρωσης και τον χαρακτήρα εφοδιαστικής αλυσίδας του κυβερνοεγκλήματος."],"review":["Γιατί η στρατηγική περιορισμού ενός σκουληκιού διαφέρει από εκείνη ενός δούρειου ίππου; Δώστε ένα συγκεκριμένο μέτρο για καθένα.","Εξηγήστε γιατί η εκκένωση διεργασίας (process hollowing) παρακάμπτει τις λίστες επιτρεπόμενων εφαρμογών που βασίζονται σε τιμές κατακερματισμού.","Αναφέρετε τρεις ενδείξεις σε υπολογιστή και δύο δικτυακές ενδείξεις που, συνδυαστικά, θα σας έπειθαν ότι ένας σταθμός εργασίας έχει παραβιαστεί.","Γιατί είναι επικίνδυνο να αντιμετωπιστεί ένας wiper σαν να ήταν λυτρισμικό;"],"cli":{"title":"Προσομοιωτής Στατικής Ανάλυσης Malware & Υπογραφών YARA","desc":"Αναλύστε με ασφάλεια ένα ύποπτο εκτελέσιμο σε απομονωμένο sandbox, υπολογίστε hashes, εξάγετε αλφαριθμητικά strings, αξιολογήστε την εντροπία PE και εκτελέστε κανόνες YARA.","meta":["⏱️ ~30 min","🐚 analyst@malware-lab:~$"],"tasks":[{"pill":"Task 1","name":"Υπολογισμός Κρυπτογραφικού Hash για Ανάλυση Malware","instr":"Υπολογίστε το SHA-256 hash του `suspicious_sample.bin` για έλεγχο σε βάσεις δεδομένων απειλών.","hint":"Εκτελέστε: sha256sum suspicious_sample.bin","cmd":"$ sha256sum suspicious_sample.bin","ok":"Το hash δημιουργήθηκε: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855."},{"pill":"Task 2","name":"Εξαγωγή Ενσωματωμένων Strings και Δεικτών C2","instr":"Εξάγετε αναγνώσιμα strings από το εκτελέσιμο για εντοπισμό διευθύνσεων URL και εντολών.","hint":"Εκτελέστε: strings suspicious_sample.bin","cmd":"$ strings suspicious_sample.bin","ok":"Τα strings εξήχθησαν! Εντοπίστηκε το C2 beacon URL και εντολές διαγραφής shadow copies."},{"pill":"Task 3","name":"Ανάλυση Επικεφαλίδας PE & Εντροπίας Τμημάτων","instr":"Εξετάστε τις επικεφαλίδες PE και την εντροπία τμημάτων για εντοπισμό packers με το `pecheck`.","hint":"Εκτελέστε: pecheck suspicious_sample.bin","cmd":"$ pecheck suspicious_sample.bin","ok":"Η επικεφαλίδα PE αναλύθηκε: Υψηλή εντροπία (7.84) στο τμήμα .upx1 επιβεβαιώνει πακεταρισμένο κώδικα (UPX)."},{"pill":"Task 4","name":"Εκτέλεση Προσαρμοσμένου Κανόνα YARA","instr":"Σαρώστε το δείγμα έναντι του κανόνα YARA `rules/ransomware.yar` χρησιμοποιώντας το `yara`.","hint":"Εκτελέστε: yara rules/ransomware.yar suspicious_sample.bin","cmd":"$ yara rules/ransomware.yar suspicious_sample.bin","ok":"ΕΠΙΤΥΧΗΣ ΑΝΙΧΝΕΥΣΗ YARA: Ο κανόνας εντόπισε το mutex και τους δείκτες ransomware!"}]},"lab":{"title":"Ασφαλής Διαλογή Malware, Δυναμική Συμπεριφορική Ανάλυση σε Sandbox & Εξαγωγή IOCs","desc":"Σε αυτό το τεχνικό εργαστήριο 2 ωρών, οι φοιτητές εισέρχονται σε ένα απομονωμένο περιβάλλον ανάλυσης κακόβουλου λογισμικού (malware sandbox). Θα αναλύσετε με ασφάλεια ένα άγνωστο δυαδικό αρχείο, θα εντοπίσετε τεχνικές συσκότισης και πακεταρίσματος (UPX/crypters), θα αναλύσετε κλήσεις Windows API (Process Hollowing), θα παρακολουθήσετε αλλαγές στο μητρώο, θα καταγράψετε κίνηση C2 και θα συντάξετε έναν κανόνα ανίχνευσης YARA.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["REMnux Linux VM (Static analysis suite: Ghidra, Cutter, YARA, pecheck, strings, capa)","Windows Flare-VM (Dynamic analysis suite: Process Hacker, ProcMon, Wireshark, RegShot, x64dbg)","Isolated internal host-only virtual switch (INetSim / FakeNet-NG active)","Pre-packaged live sample repository (`/malware_samples/sample_lockbit_variant.bin`)"],"phases":[{"badge":"Phase 1","name":"Στατικές Ιδιότητες, Hashes & Ανίχνευση Συσκότισης","dur":"⏱️ 25 λεπτά","objs":["Παραγωγή hashes MD5, SHA-1, SHA-256 και ασαφούς κατακερματισμού SSDEEP.","Έλεγχος επικεφαλίδων PE, χρονικών σημάτων μεταγλώττισης και ψηφιακών πιστοποιητικών.","Υπολογισμός εντροπίας Shannon ανά τμήμα για επιβεβαίωση πακεταρίσματος."],"steps":[{"type":"p","text":"1. Παραγωγή κρυπτογραφικών αποτυπωμάτων στο ύποπτο εκτελέσιμο:\\n```bash\\nsha256sum sample_lockbit_variant.bin\\nssdeep sample_lockbit_variant.bin > sample.ssdeep\\n```"},{"type":"p","text":"2. Ανάλυση της επικεφαλίδας PE με το `pecheck`:\\n```bash\\npecheck sample_lockbit_variant.bin\\n```"},{"type":"p","text":"3. Εντοπισμός τμημάτων υψηλής εντροπίας (`.upx0`, `.upx1` με εντροπία > 7.2)."},{"type":"p","text":"4. Αποσυμπίεση του εκτελέσιμου με το εργαλείο UPX:\\n```bash\\nupx -d sample_lockbit_variant.bin -o sample_unpacked.bin\\n```"}]},{"badge":"Phase 2","name":"Ανάλυση Εισαγωγών API & Χαρτογράφηση Δυνατοτήτων με το CAPA","dur":"⏱️ 45 λεπτά","objs":["Έλεγχος Import Address Table (IAT) για συναρτήσεις έγχυσης κώδικα (`VirtualAllocEx`, `WriteProcessMemory`).","Εκτέλεση του Mandiant CAPA για αυτόματη αντιστοίχιση δυνατοτήτων σε τεχνικές ATT&CK.","Εντοπισμός τεχνικών αποφυγής εντοπισμού σφαλμάτων (`IsDebuggerPresent`)."],"steps":[{"type":"p","text":"1. Εκτέλεση ανάλυσης δυνατοτήτων με το εργαλείο `capa`:\\n```bash\\ncapa sample_unpacked.bin\\n```"},{"type":"p","text":"2. Αποσυναρμολόγηση και ανάλυση συναρτήσεων στο Ghidra / Cutter."},{"type":"p","text":"3. Τεκμηρίωση διευθύνσεων πορτοφολιών κρυπτονομισμάτων και κειμένου σημειώματος λύτρων."}]},{"badge":"Phase 3","name":"Δυναμική Εκτέλεση σε Sandbox & Συμπεριφορικό Προφίλ","dur":"⏱️ 30 λεπτά","objs":["Εκτέλεση του payload στο Flare-VM με καταγραφή από ProcMon και Process Hacker.","Καταγραφή δημιουργίας αρχείων, τροποποιήσεων μητρώου (Run keys) και διαγραφής shadow copies.","Υποκλοπή προσομοιωμένης κίνησης C2 με FakeNet-NG και Wireshark."],"steps":[{"type":"p","text":"1. Εκκίνηση του FakeNet-NG για προσομοίωση υπηρεσιών DNS και HTTP.\\n2. Εκτέλεση του δείγματος και παρακολούθηση στο ProcMon.\\n3. Καταγραφή εντολών: `vssadmin.exe delete shadows /all /quiet`.\\n4. Αποθήκευση αρχείου PCAP με τις κλήσεις HTTP POST προς τον C2."}]},{"badge":"Phase 4","name":"Σύνταξη Κανόνα YARA, Επαλήθευση & Πακετοποίηση IOCs","dur":"⏱️ 20 λεπτά","objs":["Σύνταξη κανόνα YARA για εντοπισμό μοναδικών byte patterns και mutexes.","Δοκιμή του κανόνα έναντι καθαρών αρχείων συστήματος για αποφυγή ψευδώς θετικών ενδείξεων.","Εξαγωγή καταλόγου δεικτών IOC σε μορφή OpenIOC / MISP."],"steps":[{"type":"p","text":"1. Σύνταξη του αρχείου `/rules/apt_lockbit.yar` με δεκαεξαδικές ακολουθίες και strings.\\n2. Επαλήθευση ανίχνευσης:\\n```bash\\nyara -w -s /rules/apt_lockbit.yar /malware_samples/\\n```\\n3. Επιβεβαίωση μηδενικών ψευδώς θετικών στα `/bin` και `/usr/bin`.\\n4. Σύνταξη της τελικής αναφοράς ανάλυσης κακόβουλου λογισμικού."}]}],"checklist":["Τα hashes και το SSDEEP ταυτοποιήθηκαν πλήρως.","Το πακετάρισμα UPX αποσυμπιέστηκε επιτυχώς και αναλύθηκε στο Ghidra.","Η καταγραφή ProcMon αποκαλύπτει ακριβείς αλλαγές μητρώου και διαγραφή shadow copies.","Ο κανόνας YARA ανιχνεύει επιτυχώς το δείγμα με μηδέν ψευδώς θετικά."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αυτοματοποιημένος Αγωγός Διαλογής Malware & Μηχανή Εισαγωγής Πληροφοριών Απειλών","desc":"Ένας Πάροχος Διαχειριζόμενων Υπηρεσιών Ασφάλειας (MSSP) που διαχειρίζεται καθημερινά πάνω από 10.000 ύποπτα συνημμένα αρχεία απαιτεί έναν αυτοματοποιημένο αγωγό διαλογής malware. Σας ανατίθεται να αναπτύξετε ένα πλαίσιο Python που λαμβάνει ύποπτα εκτελέσιμα, εξάγει μεταδεδομένα PE, εκτελεί δυναμική ανάλυση σε sandbox, εφαρμόζει κανόνες YARA και προωθεί δείκτες IOCs στα τερματικά EDR.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Υποσύστημα Εξαγωγής Στατικών Χαρακτηριστικών PE & Εγγράφων","desc":"Ανάπτυξη του static_analyzer.py για εξαγωγή επικεφαλίδων, τμημάτων, εισαγωγών, εντροπίας και πόρων.","spec":["Σύνταξη σεναρίων Ansible για εφαρμογή του CIS Linux Level 2 Benchmark.","Απενεργοποίηση παλαιών πρωτοκόλλων, μη αναγκαίων συστημάτων αρχείων και πυρήνα modules.","Παραμετροποίηση `/etc/sysctl.conf`: πλήρες ASLR, SYN cookies και απαγόρευση IP forwarding."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα στατικής ανάλυσης + έξοδος JSON."},{"num":"M2","title":"Δυναμική Εκτέλεση Sandbox & Συλλέκτης Δικτυακής Τηλεμετρίας","desc":"Ανάπτυξη του sandbox_client.py για υποβολή δειγμάτων σε API sandbox και ανάκτηση PCAPs και δέντρων διεργασιών.","spec":["Σχεδιασμός προφίλ AppArmor και πολιτικών SELinux σε κατάσταση enforcing.","Παραμετροποίηση στοίβας PAM με `pam_faillock` και `pam_pwquality`.","Ανάπτυξη κανόνων `auditd` για παρακολούθηση κρίσιμων αρχείων και syscalls."],"deliv":"📦 Παραδοτέο Οροσήμου: Σύνδεσμος sandbox + περιβάλλον προσομοίωσης API."},{"num":"M3","title":"Μηχανή Ομαδοποίησης Malware με YARA & Ασαφή Hashes","desc":"Συλλογή 20 κανόνων YARA και υλοποίηση ομαδοποίησης με ασαφή hashes για αυτόματη ταξινόμηση σε οικογένειες.","spec":["Σχεδιασμός αγωγού Immutable Golden Images με Packer και OpenSCAP.","Αυτοματοποιημένος έλεγχος ευπαθειών CI/CD με απόρριψη εικόνων με CVSS >= 7.0.","Ψηφιακή υπογραφή εικόνων δίσκου με Cosign και TPM 2.0."],"deliv":"📦 Παραδοτέο Οροσήμου: Μηχανή ομαδοποίησης + επαλήθευση κανόνων."},{"num":"M4","title":"Αυτοματοποιημένος Αποστολέας Πληροφοριών Απειλών & Απόκρισης","desc":"Μορφοποίηση ευρημάτων σε γνωρίσματα MISP, κανόνες Sigma και μπλοκαρίσματα EDR με διεπαφή web.","spec":["Αρχιτεκτονική ανάπτυξης EDR agents σε 5.000 τερματικά με πολιτικές προστασίας από αλλοίωση.","Ορισμός playbooks αυτόματης απόκρισης: απομόνωση host, εξαγωγή μνήμης και triage.","Δημιουργία dashboard παρακολούθησης υγείας τερματικών και προσπαθειών υποκλοπής κωδικών."],"deliv":"📦 Παραδοτέο Οροσήμου: Μηχανή εξαγωγής MISP/EDR + Διαδικτυακός Πίνακας Ελέγχου."}],"deliverables":["Πλήρης Πηγαίος Κώδικας Αγωγού Python (`/triage_pipeline/`)","Σουίτα 20 Εταιρικών Κανόνων YARA (`/rules/enterprise_suite.yar`)","Αυτοματοποιημένη Σουίτα Δοκιμών με Δείγματα Δεδομένων","Οδηγός Αρχιτεκτονικής & Ανάπτυξης Συστήματος (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου Host Security Agent & Ανιχνευτή Process Injection σε Python","desc":"Οι πλατφόρμες EDR προστατεύουν τους υπολογιστές παρακολουθώντας διεργασίες, εντοπίζοντας τεχνικές process injection και αποτρέποντας κλιμάκωση προνομίων. Θα κατασκευάσετε έναν ελαφρύ host security agent σε Python ( host_guard.py ) για Linux που επιθεωρεί το σύστημα /proc , εντοπίζει διεργασίες με σελίδες μνήμης RWX (ένδειξη injection shellcode), παρακολουθεί ύποπτα SUID binaries και τερματίζει κακόβουλες διεργασίες.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Αναλυτής Δέντρου Διεργασιών & Χαρτών Μνήμης /proc","desc":"Κατασκευή αναλυτή διεργασιών που διαβάζει το /proc/[pid]/maps και ανακατασκευάζει δέντρα διεργασιών και δικαιώματα μνήμης.","spec":["Ανάγνωση του `/proc/[pid]/maps` και ανάλυση των πεδίων δικαιωμάτων.","Επισήμανση τμημάτων μνήμης με δικαιώματα `rwxp` ως κρίσιμη ένδειξη memory injection.","Σύγκριση του συνδέσμου `/proc/[pid]/exe` με το `cmdline` για εντοπισμό παραπλανητικών ονομάτων."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα proc_inspector.py + αναφορά ανάλυσης μνήμης διεργασιών."},{"num":"M2","title":"Ανιχνευτής Ευπαθειών SUID & Κλιμάκωσης Προνομίων","desc":"Υλοποίηση σαρωτή αρχείων που εντοπίζει εκτελέσιμα με ενεργό το bit SUID/SGID και ιδιοκτήτη root, ελέγχοντας έναντι της βάσης GTFOBins.","spec":["Έλεγχος με `os.stat` για `st_mode & S_ISUID` και `st_uid == 0`.","Ενσωμάτωση λεξικού ευάλωτων εκτελέσιμων GTFOBins (`find`, `vim`, `bash`, `nmap`).","Παραγωγή ειδοποίησης HIGH με πρόταση αποκατάστασης (`chmod u-s <path>`)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα suid_auditor.py με εντοπισμό ευάλωτων SUID binaries."},{"num":"M3","title":"Μηχανή Αυτόματης Άμυνας & Απομόνωσης Διεργασιών","desc":"Ανάπτυξη μηχανής απόκρισης που παγώνει ύποπτες διεργασίες, εξάγει τη μνήμη τους για εγκληματολογική ανάλυση και τερματίζει τα κακόβουλα PIDs.","spec":["Χρήση του `os.kill(pid, signal.SIGSTOP)` για άμεσο πάγωμα της εκτέλεσης.","Εξαγωγή των bytes της μνήμης RWX στον φάκελο `/var/log/forensics_dumps/`.","Εκτέλεση `SIGKILL` και καταγραφή των ενεργειών περιορισμού."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα quarantine.py με επαλήθευση αυτόματου περιορισμού διεργασίας."},{"num":"M4","title":"Κονσόλα CLI, Υπηρεσία Systemd & Δοκιμές Συστήματος","desc":"Ενοποίηση του agent σε δαίμονα συστήματος με ζωντανή κονσόλα διαχείρισης και σουίτα δοκιμών pytest.","spec":["Κατασκευή κονσόλας τερματικού με μετρικές διεργασιών και ειδοποιήσεις RWX/SUID.","Συγγραφή αρχείου υπηρεσίας `host_guard.service` για systemd.","Εκτέλεση δοκιμής: δημιουργία εικονικής διεργασίας με σελίδα RWX και επιβεβαίωση άμεσου εντοπισμού."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρες αποθετήριο host_guard/ + δοκιμές pytest και βίντεο."}],"deliverables":["Πλήρης πηγαίος κώδικας Host Security Agent (`/host_guard/`)","Αρθρώματα εντοπισμού σελίδων μνήμης RWX και ελέγχου SUID","Αρχείο ενσωμάτωσης systemd (`host_guard.service`)","Τεχνική Έκθεση Ασφάλειας Host & Endpoint (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 4","quiz":[{"q":"Ποιος βασικός κίνδυνος ασφάλειας εισάγεται όταν ένα εκτελέσιμο αρχείο στο Linux έχει ενεργοποιημένο το SUID bit;","opts":[{"k":"A","v":"Το εκτελέσιμο μεταγλωττίζεται αυτόματα σε μη κρυπτογραφημένο κώδικα assembly αναγνώσιμο από όλους, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Το εκτελέσιμο απενεργοποιεί μόνιμα το υποσύστημα ελέγχου auditd του πυρήνα κατά την εγγραφή στον δίσκο, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Το εκτελέσιμο παρακάμπτει τους ελέγχους μετάφρασης διευθύνσεων της μονάδας MMU στον επεξεργαστή x86, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Το εκτελέσιμο αναγκάζει την κάρτα δικτύου να τεθεί σε κατάσταση promiscuous mode για υποκλοπή πακέτων, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Το εκτελέσιμο εκτελείται με τα δικαιώματα του ιδιοκτήτη (συχνά root), εισάγοντας κίνδυνο κλιμάκωσης προνομίων."}],"ans":"E","exp":"Τα εκτελέσιμα SUID εκτελούνται με τα προνόμια του ιδιοκτήτη τους (συχνά root). Εάν περιέχουν σφάλμα, μη προνομιούχοι χρήστες μπορούν να το εκμεταλλευτούν για κλιμάκωση προνομίων."},{"q":"Πώς διαφέρει θεμελιωδώς ο Υποχρεωτικός Έλεγχος Πρόσβασης (MAC) του SELinux από τον Προαιρετικό Έλεγχο Πρόσβασης (DAC);","opts":[{"k":"A","v":"Στο DAC οι ιδιοκτήτες ορίζουν δικαιώματα, ενώ στο MAC κεντρικές πολιτικές του συστήματος επιβάλλουν αυστηρό περιορισμό."},{"k":"B","v":"Το DAC βασίζεται αποκλειστικά σε βιομετρικά tokens υλικού, ενώ το MAC βασίζεται σε κωδικούς πρόσβασης, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Το DAC επιβάλλεται από τείχη προστασίας δικτύου, ενώ το MAC επιβάλλεται από το περιβάλλον φλοιού (shell), χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Στο DAC ο υπερχρήστης root δεν μπορεί να αλλάξει αρχεία, ενώ στο MAC οι απλοί χρήστες έχουν πλήρη δικαιώματα, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Το DAC κρυπτογραφεί τα μπλοκ αρχείων με AES-256, ενώ το MAC συμπιέζει αρχεία με αλγορίθμους χωρίς απώλειες, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"A","exp":"Στο DAC ο ιδιοκτήτης του αρχείου καθορίζει τα δικαιώματα. Στο MAC (SELinux) ο πυρήνας επιβάλλει αυστηρούς κεντρικούς κανόνες που περιορίζουν ακόμη και τον χρήστη root."},{"q":"Ποια τεχνική προστασίας τυχαιοποιεί τις διευθύνσεις μνήμης (στοίβα, σωρός, βιβλιοθήκες) κατά την εκτέλεση ενός προγράμματος;","opts":[{"k":"A","v":"Data Execution Prevention (DEP / NX bit), μαρκάροντας σελίδες μνήμης ως μη εκτελέσιμες για αποτροπή shellcode, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Address Space Layout Randomization (ASLR), καθιστώντας δύσκολη την πρόβλεψη διευθύνσεων στόχων στη μνήμη."},{"k":"C","v":"Stack Canaries, τοποθετώντας τιμές ελέγχου ακεραιότητας πριν από τον δείκτη πλαισίου και τη διεύθυνση επιστροφής, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Control Flow Guard (CFG), επαληθεύοντας στόχους έμμεσων κλήσεων μέσω πινάκων που παράγει ο μεταγλωττιστής, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"SafeSEH, διασφαλίζοντας ότι οι συναρτήσεις διαχείρισης εξαιρέσεων είναι καταχωρημένες σε έγκυρο πίνακα, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"B","exp":"Το ASLR τυχαιοποιεί τις διευθύνσεις μνήμης σε κάθε εκτέλεση, καθιστώντας εξαιρετικά δύσκολη την αξιοποίηση υπερχειλίσεων μνήμης και τεχνικών ROP."},{"q":"Ποιο χαρακτηριστικό του πυρήνα Linux παρέχει απομόνωση διεργασιών διαχωρίζοντας πόρους όπως PIDs, κάρτες δικτύου και σημεία προσάρτησης;","opts":[{"k":"A","v":"Control Groups (cgroups), επιβάλλοντας όρια κατανάλωσης πόρων επεξεργαστή και μνήμης RAM σε διεργασίες, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Pluggable Authentication Modules (PAM), παρέχοντας υποδομή δυναμικής ταυτοποίησης για εισόδους συστήματος."},{"k":"C","v":"Linux Namespaces, απομονώνοντας πόρους ώστε οι διεργασίες να έχουν ανεξάρτητη θέαση του συστήματος."},{"k":"D","v":"Extended File Attributes (xattr), αποθηκεύοντας πρόσθετα μεταδεδομένα μαζί με τους δείκτες αρχείων POSIX."},{"k":"E","v":"Netfilter Hooks, υποκλέπτοντας και φιλτράροντας πακέτα δικτύου μέσα στη στοίβα δικτύωσης του πυρήνα, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"C","exp":"Τα Linux Namespaces απομονώνουν πόρους του συστήματος (pid, net, mnt κ.ά.), αποτελώντας τη βάση για τη δημιουργία απομονωμένων containers (π.χ. Docker)."},{"q":"Ποιο ρόλο διαδραματίζουν τα Linux Control Groups (cgroups v2) στην ασφάλεια και τη διαχείριση πόρων των containers;","opts":[{"k":"A","v":"Κρυπτογραφούν όλες τις συνδέσεις δικτύου χρησιμοποιώντας εφήμερα κλειδιά κρυπτογράφησης TLS 1.3, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Εφαρμόζουν αυτόματα διορθώσεις ασφάλειας σε βιβλιοθήκες C χωρίς να απαιτείται επανεκκίνηση υπηρεσιών, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Παράγουν ψηφιακά πιστοποιητικά για την εσωτερική επικοινωνία υπηρεσιών σε πλέγματα service mesh, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Περιορίζουν και ρυθμίζουν την κατανάλωση πόρων (CPU, μνήμη, δίσκος), αποτρέποντας επιθέσεις Denial of Service."},{"k":"E","v":"Αντικαθιστούν την κλασική ταυτοποίηση χρηστών με βιομετρική σάρωση δακτυλικών αποτυπωμάτων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"D","exp":"Τα cgroups περιορίζουν και ελέγχουν τη χρήση φυσικών πόρων (CPU, μνήμη, I/O), αποτρέποντας μια κακόβουλη διεργασία από το να εξαντλήσει τους πόρους του εξυπηρετητή."},{"q":"Πώς απλοποιεί το Linux PAM τη διαχείριση πρόσβασης σε διάφορες υπηρεσίες του λειτουργικού συστήματος;","opts":[{"k":"A","v":"Επιβάλλοντας έναν ενιαίο υποχρεωτικό κωδικό πρόσβασης σε όλους τους λογαριασμούς υπηρεσιών τοπικά, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Μεταγλωττίζοντας όλα τα εκτελέσιμα του συστήματος σε στατικά αρχεία χωρίς δυναμικές βιβλιοθήκες, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Δρομολογώντας όλες τις προσπάθειες σύνδεσης μέσω ιδιόκτητων εξωτερικών κόμβων ταυτότητας στο cloud, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Απενεργοποιώντας μόνιμα την απομακρυσμένη πρόσβαση SSH όποτε ένας απλός χρήστης εκτελεί εντολές sudo, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Διαχωρίζοντας τη λογική ταυτοποίησης εφαρμογών από τους μηχανισμούς ταυτότητας μέσω αρθρωτών ρυθμίσεων."}],"ans":"E","exp":"Το PAM αποσυνδέει τους μηχανισμούς ταυτοποίησης από τις εφαρμογές, επιτρέποντας την εφαρμογή πολιτικών (MFA, πολυπλοκότητα κωδικών, κλείδωμα λογαριασμών) χωρίς αλλαγές στον κώδικα."},{"q":"Ποια είναι η βασική λειτουργία του υποσυστήματος ελέγχου του Linux (auditd) στην παρακολούθηση ασφάλειας συστήματος;","opts":[{"k":"A","v":"Να καταγράφει κλήσεις συστήματος του πυρήνα, προσβάσεις αρχείων και αλλαγές δικαιωμάτων για ανάλυση."},{"k":"B","v":"Να βελτιστοποιεί την ταχύτητα εκτέλεσης ερωτημάτων SQL αναδιατάσσοντας τα ευρετήρια των δίσκων, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Να παράγει αυτόματα κλειδιά συμμετρικής κρυπτογράφησης για όλους τους νέους φακέλους χρηστών, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Να αποτρέπει την απώλεια πακέτων δικτύου κατά τη διάρκεια ογκομετρικών επιθέσεων άρνησης εξυπηρέτησης, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Να μεταγλωττίζει απλά scripts Python σε απομονωμένους οδηγούς συσκευών σε επίπεδο πυρήνα, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"A","exp":"Το auditd καταγράφει κρίσιμες κλήσεις συστήματος (execve, open, chmod) και προσπάθειες πρόσβασης απευθείας από τον πυρήνα για ιατροδικαστική ανάλυση και συμμόρφωση."},{"q":"Ποιο μέτρο ασφάλειας προστατεύει τον πυρήνα του λειτουργικού από την εκτέλεση μη εξουσιοδοτημένων οδηγών συσκευών;","opts":[{"k":"A","v":"Δυναμική Μετάφραση Διευθύνσεων, επαναχαρτογραφώντας μπλοκ φυσικής μνήμης κατά τις διακοπές συσκευών, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Κρυπτογραφική Υπογραφή Αρθρωμάτων Πυρήνα, επαληθεύοντας ψηφιακές υπογραφές πριν τη φόρτωση (.ko)."},{"k":"C","v":"Επένδυση Στοίβας (Stack Padding), δεσμεύοντας τυχαία bytes ανάμεσα σε μεταβλητές χρήστη, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Προαιρετικός Έλεγχος Πρόσβασης, επιτρέποντας στους ιδιοκτήτες αρχείων να αλλάζουν τη μνήμη του πυρήνα, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Επαλήθευση DNSSEC, επικυρώνοντας εγγραφές ονομάτων χώρου πριν από τη δημιουργία συνδέσεων δικτύου."}],"ans":"B","exp":"Η υπογραφή αρθρωμάτων πυρήνα απαιτεί τα αρχεία .ko να φέρουν έγκυρη ψηφιακή υπογραφή από έμπιστο κλειδί, αποτρέποντας τη φόρτωση rootkits στον πυρήνα (ring 0)."},{"q":"Ποια είναι η βασική λειτουργία ενός εργαλείου Ελέγχου Ακεραιότητας Αρχείων (FIM) όπως το AIDE ή το Tripwire;","opts":[{"k":"A","v":"Να αποκρυπτογραφεί φακέλους χρηστών σε πραγματικό χρόνο κατά τη διάρκεια συντήρησης του συστήματος, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Να επανεκκινεί αυτόματα υπηρεσίες όποτε η κατανάλωση μνήμης υπερβεί το 90% των διαθέσιμων πόρων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Να συγκρίνει περιοδικά κρυπτογραφικά hashes και δικαιώματα κρίσιμων αρχείων με μια βάση αναφοράς."},{"k":"D","v":"Να απορρίπτει εισερχόμενες συνδέσεις TCP που προέρχονται από δυναμικές διευθύνσεις IP του διαδικτύου, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Να μετατρέπει κωδικούς πρόσβασης σε αποτυπώματα SHA-512 με salt μέσα στο αρχείο shadow, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"C","exp":"Τα εργαλεία FIM παρακολουθούν κρίσιμα αρχεία συγκρίνοντας τα hashes και τα δικαιώματά τους με μια ασφαλή βάση αναφοράς, ειδοποιώντας για οποιαδήποτε μη εξουσιοδοτημένη τροποποίηση."},{"q":"Ποια συγκεκριμένη ευπάθεια διαχείρισης μνήμης αντιμετωπίζει το Stack Canary κατά την εκτέλεση;","opts":[{"k":"A","v":"Επιθέσεις SQL injection που επιχειρούν να παρακάμψουν τη λογική ελέγχου ταυτότητας της βάσης, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Επιθέσεις Cross-site scripting (XSS) που εισάγουν κακόβουλο κώδικα στον περιηγητή του χρήστη, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Επιθέσεις Server-Side Request Forgery (SSRF) κατά τοπικών υπηρεσιών μεταδεδομένων cloud, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Υπερχειλίσεις μνήμης buffer στη στοίβα που επιχειρούν να αλλοιώσουν τη διεύθυνση επιστροφής."},{"k":"E","v":"Σφάλματα συγχρονισμού (race conditions) κατά την ταυτόχρονη εγγραφή σε κοινόχρηστα αρχεία, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"D","exp":"Το stack canary είναι μια τιμή ασφαλείας στη στοίβα πριν από τη διεύθυνση επιστροφής. Εάν αλλοιωθεί από υπερχείλιση buffer, το πρόγραμμα τερματίζει αμέσως αποτρέποντας εκτέλεση shellcode."}]},{"part":"Μέρος 2 · Αντίπαλοι και Επιθέσεις","time":"Κεφάλαιο 5 · ⏱️ 5–7 ώρες μελέτης","title":"5. Ανθρώπινος Παράγοντας, Κοινωνική Μηχανική και Ψηφιακή Ασφάλεια","subtitle":"Ψυχολογία της πειθούς · Ηλεκτρονικό ψάρεμα και οι παραλλαγές του · Φυσικά κανάλια · Stalkerware και μεταδεδομένα · Παραβίαση επιχειρηματικού email · Κουλτούρα ασφάλειας","outcomes":["Να εξηγείτε τις ψυχολογικές αρχές που εκμεταλλεύονται οι κοινωνικοί μηχανικοί.","Να διακρίνετε το ηλεκτρονικό ψάρεμα, το στοχευμένο ψάρεμα, το whaling, το vishing, το smishing, την κατασκευή προσχήματος και το δόλωμα.","Να περιγράφετε τα φυσικά κανάλια επίθεσης και τα κανάλια παρατήρησης, καθώς και τα αντίμετρά τους.","Να αναλύετε μια παραβίαση επιχειρηματικού email και μια επίθεση κόπωσης MFA και να προτείνετε πολυεπίπεδες άμυνες.","Να σχεδιάζετε μέτρα ευαισθητοποίησης και δείκτες που μειώνουν την ευαλωτότητα χωρίς να επιρρίπτουν ευθύνες στους χρήστες."],"intro":["Τα τεχνικά μέτρα προστατεύουν τα συστήματα, όμως τα συστήματα τα χειρίζονται άνθρωποι, και οι άνθρωποι μπορούν να πειστούν. Η κοινωνική μηχανική εκμεταλλεύεται την εμπιστοσύνη, την προθυμία για βοήθεια, τον φόβο και τη συνήθεια, ώστε ένας νόμιμος χρήστης να εκτελέσει μια ενέργεια που ωφελεί τον επιτιθέμενο —να ανοίξει ένα συνημμένο, να αποκαλύψει έναν κωδικό, να εγκρίνει μια πληρωμή. Οι κλαδικές αναφορές παραβιάσεων διαπιστώνουν σταθερά ότι ο ανθρώπινος παράγοντας εμπλέκεται στην πλειονότητα των επιτυχημένων εισβολών.","Το κεφάλαιο εξηγεί γιατί λειτουργεί η κοινωνική μηχανική, παρουσιάζει τις κύριες μεθόδους επίθεσης και εξετάζει δύο απειλές που έχουν αυξηθεί σημαντικά τα τελευταία χρόνια: την παραβίαση επιχειρηματικού ηλεκτρονικού ταχυδρομείου και την «κόπωση» του ελέγχου ταυτότητας πολλαπλών παραγόντων. Εξετάζει επίσης την προσωπική ψηφιακή ασφάλεια, συμπεριλαμβανομένου του λογισμικού παρακολούθησης (stalkerware) και της διαρροής μεταδεδομένων. Το κεφάλαιο κλείνει με ένα εποικοδομητικό μήνυμα: οι χρήστες δεν είναι ο «πιο αδύναμος κρίκος» που πρέπει ν
