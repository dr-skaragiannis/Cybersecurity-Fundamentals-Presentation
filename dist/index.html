 injection στο `src/controllers/auth.py`.","hint":"Εκτελέστε: semgrep --config p/sql-injection src/","cmd":"$ semgrep --config p/sql-injection src/","ok":"Ο κανόνας Semgrep ταυτοποιήθηκε: Εντοπίστηκε επικίνδυνη ένωση αλφαριθμητικών στο ερώτημα SQL στη γραμμή 2."},{"pill":"Task 4","name":"Επαλήθευση Διόρθωσης με Παραμετροποιημένα Ερωτήματα","instr":"Ελέγξτε την ασφαλή διόρθωση παραμετροποιημένου ερωτήματος με το `sql-sanitize`.","hint":"Εκτελέστε: sql-sanitize --test src/controllers/auth.py","cmd":"$ sql-sanitize --test src/controllers/auth.py","ok":"Η διόρθωση επιβεβαιώθηκε! Το παραμετροποιημένο ερώτημα αποτρέπει πλήρως το SQL injection."}]},"lab":{"title":"Ενσωμάτωση Αγωγού DevSecOps: Αυτοματοποιημένο SAST/SCA, Μοντελοποίηση STRIDE & Ασφαλής Προγραμματισμός","desc":"Σε αυτό το εργαστήριο 2 ωρών, οι φοιτητές υλοποιούν έναν ολοκληρωμένο Κύκλο Ασφαλούς Ανάπτυξης Λογισμικού (SSDLC) και αγωγό DevSecOps. Θα σχεδιάσετε ένα μοντέλο απειλών STRIDE για ένα microservice API, θα ενσωματώσετε εργαλεία SAST (Semgrep/SonarQube) και SCA (Trivy) σε αγωγούς CI/CD, θα διορθώσετε κρίσιμες ευπάθειες του OWASP Top 10 (SQLi, XSS, CSRF, IDOR) και θα επιβάλετε αυτοματοποιημένες πύλες ποιότητας ασφάλειας σε pull requests.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Linux DevSecOps workstation with Git, Python 3.11, Node.js 20, Docker","Security analysis tools: `semgrep`, `bandit`, `trufflehog`, `trivy`, `npm audit`, `pip-audit`","Vulnerable web application repository (`/workspace/vulnerable_microservice/`)","Local CI/CD runner sandbox simulating automated pipeline execution"],"phases":[{"badge":"Phase 1","name":"Μοντελοποίηση Απειλών STRIDE & Διάγραμμα Ροής Δεδομένων (DFD)","dur":"⏱️ 25 λεπτά","objs":["Αποδόμηση εφαρμογής σε Διεργασίες, Αποθήκες Δεδομένων, Ροές Δεδομένων και Εξωτερικές Οντότητες.","Εντοπισμός ορίων εμπιστοσύνης μεταξύ δημοσίου διαδικτύου και εσωτερικής βάσης.","Χαρτογράφηση απειλών στις 6 κατηγορίες του STRIDE."],"steps":[{"type":"p","text":"1. Εξετάστε το αρχιτεκτονικό διάγραμμα στο `/workspace/docs/architecture.png`.\\n2. Συμπληρώστε τον πίνακα απειλών STRIDE για τα REST endpoints.\\n3. Καταγράψτε τεχνικά αντίμετρα για κάθε κατηγορία απειλής."}]},{"badge":"Phase 2","name":"Αυτοματοποιημένο SAST & Έλεγχος Εξαρτήσεων (SCA) σε CI/CD","dur":"⏱️ 45 λεπτά","objs":["Ρύθμιση αυτοματοποιημένης σάρωσης CI/CD που μπλοκάρει εκδόσεις με κρίσιμα ευρήματα.","Εκτέλεση ανάλυσης ευπαθειών σε εξαρτήσεις (`trivy fs .` και `pip-audit`).","Εντοπισμός ευάλωτων βιβλιοθηκών τρίτων με γνωστά CVEs."],"steps":[{"type":"p","text":"1. Εκτέλεση πλήρους ελέγχου SAST:\\n```bash\\nsemgrep scan --config auto --error /workspace/vulnerable_microservice/\\n```"},{"type":"p","text":"2. Εκτέλεση ελέγχου εξαρτήσεων (SCA):\\n```bash\\ntrivy fs --severity HIGH,CRITICAL /workspace/vulnerable_microservice/\\n```"},{"type":"p","text":"3. Εξέταση των αποτελεσμάτων και καταγραφή των εντοπισθέντων CVEs."}]},{"badge":"Phase 3","name":"Διόρθωση Ευπαθειών στον Κώδικα (SQLi, Stored XSS & IDOR)","dur":"⏱️ 30 λεπτά","objs":["Μετατροπή μη ασφαλών ερωτημάτων SQL σε παραμετροποιημένα ερωτήματα ORM.","Υλοποίηση κωδικοποίησης εξόδου HTML (context-aware encoding) για αποτροπή XSS.","Επιβολή ελέγχων εξουσιοδότησης στο backend για αποτροπή ευπαθειών IDOR."],"steps":[{"type":"p","text":"1. Διόρθωση SQLi στο `/src/controllers/users.py` με χρήση παραμετροποιημένων ερωτημάτων SQLAlchemy.\\n2. Διόρθωση XSS με ενεργοποίηση αυτόματης διαφυγής χαρακτήρων στο Jinja2.\\n3. Προσθήκη ελέγχου ταυτότητας ιδιοκτήτη στο `/src/controllers/documents.py` για διόρθωση IDOR:\\n```python\\nif document.owner_id != current_user.id:\\n raise HTTPException(status_code=403, detail=\\"Access Denied\\")\\n```"}]},{"badge":"Phase 4","name":"Διαχείριση Μυστικών & Επαλήθευση Πύλης Ποιότητας CI/CD","dur":"⏱️ 20 λεπτά","objs":["Μεταφορά σκληρά κωδικοποιημένων κλειδιών σε μεταβλητές περιβάλλοντος και HashiCorp Vault.","Επανεκτέλεση του αγωγού CI/CD και επιβεβαίωση 100% επιτυχίας στις πύλες ασφάλειας.","Σύνταξη της τελικής αναφοράς επαλήθευσης SSDLC."],"steps":[{"type":"p","text":"1. Εκτέλεση ελέγχου pre-commit για αποτροπή καταχώρισης μυστικών στο git.\\n2. Εκκίνηση της τελικής αυτοματοποιημένης εκτέλεσης CI/CD:\\n```bash\\n./scripts/run_ci_pipeline.sh\\n```\\n3. Επιβεβαίωση ότι όλοι οι έλεγχοι SAST και SCA ολοκληρώνονται επιτυχώς με μηδέν ευπάθειες."}]}],"checklist":["Το μοντέλο απειλών STRIDE καλύπτει και τις 6 κατηγορίες.","Τα εργαλεία Semgrep και Trivy εκτελούνται επιτυχώς στον αυτοματοποιημένο αγωγό.","Οι ευπάθειες SQLi, XSS και IDOR έχουν εξαλειφθεί πλήρως στον διορθωμένο κώδικα.","Όλα τα διαπιστευτήρια αφαιρέθηκαν από το ιστορικό του git και φορτώνονται με ασφάλεια."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Πλαίσιο Ασφαλούς Κύκλου Ανάπτυξης (SSDLC) & Ανθεκτικό Microservice API","desc":"Μια εταιρεία λογισμικού υγείας που αναπτύσσει πλατφόρμα ηλεκτρονικού ιατρικού φακέλου (EHR) υπόκειται σε αυστηρές κανονιστικές απαιτήσεις (GDPR/HIPAA). Ως Επικεφαλής Αρχιτέκτονας DevSecOps, θα σχεδιάσετε μια ολοκληρωμένη πολιτική SSDLC, θα κατασκευάσετε έναν αυτοματοποιημένο αγωγό ασφάλειας πολλαπλών σταδίων (SAST, SCA, Secret Scanning, DAST), θα υλοποιήσετε ένα ενισχυμένο microservice σε Python/FastAPI και θα παραδώσετε αυτοματοποιημένες δοκιμές επαλήθευσης.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Πολιτική SSDLC & Μοντέλο Απειλών STRIDE","desc":"Σύνταξη του εταιρικού προτύπου SSDLC και δημιουργία φακέλου μοντελοποίησης απειλών με ανάλυση ροών δεδομένων και ορίων εμπιστοσύνης.","spec":["Αρχιτεκτονική multi-cloud landing zone με διαχωρισμένες οργανωτικές μονάδες.","Εφαρμογή Service Control Policies (SCPs) για επιβολή ελάχιστου προνομίου.","Συγκεντρωτική συλλογή CloudTrail logs σε κλειδωμένα S3 buckets."],"deliv":"📦 Παραδοτέο Οροσήμου: Έγγραφο πολιτικής SSDLC + φάκελος μοντέλου STRIDE."},{"num":"M2","title":"Υλοποίηση Ενισχυμένου Microservice API","desc":"Ανάπτυξη του backend FastAPI με αυστηρή επικύρωση εισόδου (Pydantic), παραμετροποιημένα ερωτήματα SQL, περιορισμό ρυθμού και ασφαλή έλεγχο JWT.","spec":["Ανάπτυξη μηχανής CSPM για έλεγχο υποδομών βάσει CIS Cloud Benchmarks.","Αυτοματοποιημένη αποκατάσταση για μη κρυπτογραφημένα buckets και ανοικτά security groups.","Ρύθμιση προστασίας CWPP για virtual machines και serverless συναρτήσεις."],"deliv":"📦 Παραδοτέο Οροσήμου: Κώδικας microservice + σουίτα δοκιμών PyTest."},{"num":"M3","title":"Αγωγός DevSecOps Πολλαπλών Σταδίων & Γεννήτρια SBOM","desc":"Κατασκευή αγωγού CI/CD με secret scanning, SAST, SCA, σάρωση εικόνων container και αυτόματη εξαγωγή SBOM CycloneDX.","spec":["Σχεδιασμός ασφαλών προτύπων Terraform με προεπιλεγμένη κρυπτογράφηση και ιδιωτικά δίκτυα.","Εφαρμογή ελέγχων Policy-as-Code με Open Policy Agent (OPA/Rego) και Checkov.","Αποκλεισμός ανάπτυξης μη συμμορφούμενων υποδομών μέσω CI/CD."],"deliv":"📦 Παραδοτέο Οροσήμου: Ρυθμίσεις αγωγού CI/CD + παραγόμενο αρχείο SBOM."},{"num":"M4","title":"Αυτοματοποιημένος Δυναμικός Έλεγχος (DAST) & Επιτελικός Φάκελος","desc":"Ενσωμάτωση δυναμικής σάρωσης OWASP ZAP στο στάδιο διάθεσης και σύνταξη της τελικής επιτελικής έκθεσης διασφάλισης SSDLC.","spec":["Αρχιτεκτονική ενίσχυσης Kubernetes με Cilium eBPF network policies και mTLS.","Επιβολή Pod Security Standards (Restricted profile) και sandboxing με gVisor.","Σύνταξη πλάνου αντιμετώπισης απειλών cloud και cross-region disaster recovery."],"deliv":"📦 Παραδοτέο Οροσήμου: Αναφορά σάρωσης DAST + Επιτελική Έκθεση Διασφάλισης SSDLC (10–12 σελίδες)."}],"deliverables":["Πηγαίος Κώδικας Ενισχυμένου Microservice API (`/src/app/`)","Αρχείο Ρύθμισης Αγωγού DevSecOps (`.github/workflows/devsecops.yml`)","Αρχείο Software Bill of Materials σε μορφή CycloneDX (`sbom.cyclonedx.json`)","Ολοκληρωμένη Έκθεση Πλαισίου SSDLC & Διασφάλισης Ασφάλειας (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου Ελεγκτή Ασφάλειας Cloud & Containers σε Python","desc":"Οι cloud-native υποδομές με Docker και Kubernetes παρουσιάζουν μοναδικές ευπάθειες, όπως διαφυγή από containers (breakout), εκτεθειμένα daemon sockets και επισφαλείς ρυθμίσεις Pods. Θα κατασκευάσετε έναν ελεγκτή ασφάλειας containers σε Python ( cloud_posture_scanner.py ). Το εργαλείο θα συνδέεται στο Docker daemon μέσω UNIX socket, θα ελέγχει τα ενεργά containers για κινδύνους διαφυγής ( privileged: true , CAP_SYS_ADMIN , host PID/network namespace), θα αναλύει στατικά αρχεία Kubernetes YAML βάσει των προτύπων CIS και θα παράγει αναφορές συμμόρφωσης.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Client API Docker Socket & Επιθεωρητής Containers","desc":"Κατασκευή HTTP client που επικοινωνεί μέσω UNIX domain socket ( docker.sock ) για καταγραφή containers και επιθεώρηση HostConfig.","spec":["Σύνδεση στο UNIX socket `/var/run/docker.sock`.","Αποστολή αιτημάτων `GET /containers/json` και επεξεργασία JSON αποκρίσεων.","Εξαγωγή μεταδεδομένων: `Privileged`, `CapAdd`, `NetworkMode`, `PidMode`, `Binds`."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα docker_auditor.py με επιθεώρηση ενεργών containers."},{"num":"M2","title":"Μηχανή Ανάλυσης Ευπαθειών Διαφυγής Container","desc":"Υλοποίηση κανόνων αξιολόγησης ρυθμίσεων container έναντι γνωστών τεχνικών διαφυγής (breakout).","spec":["Επισήμανση του `Privileged == true` ως κρίσιμου κινδύνου διαφυγής.","Εντοπισμός επικίνδυνων Linux Capabilities (`CAP_SYS_ADMIN`, `CAP_SYS_PTRACE`).","Εντοπισμός επικίνδυνων host mounts (`/var/run/docker.sock`, `/`)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα escape_detector.py με εντοπισμό ευάλωτων containers."},{"num":"M3","title":"Στατικός Αναλυτής Kubernetes YAML & Βαθμολογητής CIS","desc":"Κατασκευή αναλυτή YAML που επιθεωρεί πόρους Kubernetes ( Deployment , Pod , DaemonSet ) βάσει των προτύπων CIS.","spec":["Έλεγχος `securityContext`: επαλήθευση `runAsNonRoot: true`, `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: false`.","Έλεγχος ορίων πόρων (`resources.limits.cpu/memory`) για αποφυγή DoS.","Επαλήθευση αφαίρεσης capabilities (`drop: [\'ALL\']`) και αποφυγή `hostNetwork: true`."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα k8s_scanner.py με αξιολόγηση 10 αρχείων YAML."},{"num":"M4","title":"Γεννήτρια Αναφορών, Κονσόλα CLI & Δοκιμές","desc":"Ενοποίηση των μηχανών ελέγχου σε ενιαίο εργαλείο CLI με γραφικά Rich, εξαγωγή JSON και δοκιμές pytest.","spec":["Υπολογισμός συνολικού ποσοστού συμμόρφωσης CIS (0–100%).","Έγχρωμη απεικόνιση αποτελεσμάτων στο τερματικό και εξαγωγή αναφοράς HTML.","Συγγραφή αυτοματοποιημένων δοκιμών pytest."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένο εργαλείο cloud_posture_scanner.py + αναφορά HTML και βίντεο."}],"deliverables":["Πηγαίος κώδικας Ελεγκτή Ασφάλειας Cloud & Containers (`/cloud_scanner/`)","Στατικός Αναλυτής Kubernetes YAML & Κανόνες CIS Pod Security","Σουίτα αυτοματοποιημένων δοκιμών με σενάρια ευπαθών containers","Τεχνική Έκθεση Cloud-Native Ασφάλειας (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 9","quiz":[{"q":"Στο Μοντέλο Συνυπευθυνότητας Cloud για Infrastructure as a Service (IaaS), ποιο επίπεδο ασφάλειας παραμένει ευθύνη του πελάτη;","opts":[{"k":"A","v":"Φυσική ασφάλεια κέντρου δεδομένων, βιομετρικές κλειδαριές εισόδου και γεννήτριες ισχύος εγκαταστάσεων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Ενημερώσεις firmware του hypervisor και συντήρηση φυσικών διακομιστών στις ζώνες διαθεσιμότητας, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Συντήρηση υποθαλάσσιων καλωδίων οπτικών ινών μεταξύ γεωγραφικών περιφερειών του παρόχου cloud, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Φυσική καταστροφή μονάδων υλικού HSM κατά την απόσυρση εξοπλισμού από τον κατασκευαστή, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Ενημερώσεις λειτουργικού συστήματος, ρυθμίσεις εφαρμογών, κανόνες firewall και κρυπτογράφηση δεδομένων."}],"ans":"E","exp":"Στο IaaS ο πάροχος ασφαλίζει τη φυσική υποδομή και τον hypervisor, ενώ ο πελάτης είναι υπεύθυνος για το λειτουργικό σύστημα, τις εφαρμογές, τα δεδομένα και τα δικαιώματα πρόσβασης."},{"q":"Ποιος βασικός κίνδυνος ασφάλειας προκύπτει όταν ένα Docker container εκτελείται με \'--privileged\' ή προσαρτά το \'/var/run/docker.sock\';","opts":[{"k":"A","v":"Το container μπορεί να διαφύγει από την απομόνωση, αποκτώντας δικαιώματα root στον κεντρικό υπολογιστή."},{"k":"B","v":"Το container περιορίζεται αυστηρά σε χώρο εκτέλεσης μνήμης RAM μεγέθους εξήντα τεσσάρων kilobytes, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Το container διαγράφει αυτόματα όλους τους αποθηκευτικούς κάδους cloud του ενεργού λογαριασμού, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Το container επιβάλλει την κρυπτογράφηση όλης της κίνησης με μετα-κβαντικά σχήματα πλεγμάτων, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Το container μετατρέπει σχεσιακές βάσεις δεδομένων σε απλά αρχεία κειμένου τοπικά στον δίσκο, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"A","exp":"Η εκτέλεση με \'--privileged\' ή η έκθεση του docker.sock δίνει πλήρη πρόσβαση στον δαίμονα Docker και στις συσκευές του host, επιτρέποντας άμεση διαφυγή από το container και έλεγχο του εξυπηρετητή."},{"q":"Στα Πρότυπα Ασφάλειας Pods του Kubernetes (PSS), ποιο προφίλ παρέχει τη μέγιστη θωράκιση απαγορεύοντας όλα τα προνόμια;","opts":[{"k":"A","v":"Privileged Profile, επιτρέποντας απεριόριστα δικαιώματα σε όλες τις συσκευές του υποκείμενου host, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Restricted Profile, επιβάλλοντας αυστηρή θωράκιση (non-root, read-only filesystem, αφαίρεση capabilities)."},{"k":"C","v":"Baseline Profile, αποτρέποντας γνωστές κλιμακώσεις προνομίων με ευρεία συμβατότητα εφαρμογών, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Legacy Profile, διατηρώντας συμβατότητα με παλαιότερες εκδόσεις μηχανών εκτέλεσης containers, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Default Profile, αποδίδοντας δικαιώματα εκτέλεσης root σε όλες τις νέες εφαρμογές containers, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"B","exp":"Το προφίλ \'Restricted\' επιβάλλει τις αυστηρότερες πρακτικές ασφάλειας (εκτέλεση χωρίς root, αφαίρεση Linux capabilities, read-only σύστημα αρχείων) αποτρέποντας διαφυγή."},{"q":"Ποια βασική δυνατότητα προσφέρει ο στατικός έλεγχος Infrastructure as Code (IaC) όπως το Checkov στην ασφάλεια cloud;","opts":[{"k":"A","v":"Μεταγλώττιση αρχείων Terraform HCL σε εκτελέσιμους οδηγούς συσκευών πυρήνα του λειτουργικού, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Αντικατάσταση εικονικών δικτύων VPC με τοπικά μη κρυπτογραφημένα δίκτυα εκπομπής Ethernet, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Εντοπισμό εσφαλμένων ρυθμίσεων cloud (ανοικτά S3 buckets, μη κρυπτογραφημένοι δίσκοι) πριν τη διάθεση."},{"k":"D","v":"Αυτόματη παραγωγή ιδιωτικών κλειδιών RSA-4096 για όλες τις εφαρμογές κινητών τηλεφώνων, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Διαχείριση καρτών φυσικής πρόσβασης και βιομετρικών αισθητήρων στα κέντρα δεδομένων, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"C","exp":"Ο έλεγχος IaC αναλύει αρχεία Terraform και Kubernetes στο pipeline CI/CD, εντοπίζοντας επικίνδυνες ρυθμίσεις πριν από τη δημιουργία των πόρων στο cloud."},{"q":"Στην αρχιτεκτονική Cloud IAM, ποιο είναι το βασικό όφελος της προσωρινής Ανάληψης Ρόλων (Role Assumption) έναντι των στατικών κλειδιών πρόσβασης;","opts":[{"k":"A","v":"Οι ρόλοι επιτρέπουν σε μη ταυτοποιημένους χρήστες να εκτελούν εντολές διαχειριστή σε όλες τις περιοχές, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Οι ρόλοι μετατρέπουν σχεσιακούς πίνακες σε μη σχεσιακά έγγραφα δεδομένων κατά την εκτέλεση ερωτημάτων, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Οι ρόλοι καταργούν την ανάγκη κρυπτογράφησης TLS κατά την επικοινωνία με τα APIs του cloud, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Οι ρόλοι παρέχουν βραχύβια διαπιστευτήρια αυτόματης λήξης, εξαλείφοντας τον κίνδυνο διαρροής μόνιμων κλειδιών."},{"k":"E","v":"Οι ρόλοι περιορίζουν τη συχνότητα του επεξεργαστή κατά την εκτέλεση απαιτητικών υπολογιστικών εργασιών, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"D","exp":"Τα στατικά κλειδιά διαρρέουν συχνά σε κώδικα. Η ανάληψη ρόλων χρησιμοποιεί προσωρινά διακριτικά αυτόματης λήξης, ελαχιστοποιώντας τον κίνδυνο παραβίασης."},{"q":"Ποια βασική δυνατότητα ασφάλειας παρέχει ένα Service Mesh (π.χ. Istio) για την επικοινωνία μικροϋπηρεσιών στο Kubernetes;","opts":[{"k":"A","v":"Αυτόματη μεταγλώττιση scripts Python σε οδηγούς συσκευών πυρήνα σε όλους τους κόμβους του cluster, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Αντικατάσταση ερωτημάτων SQL με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα σε τοπικούς φακέλους, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Μόνιμη κατάργηση όλων των κανόνων firewall για μεγιστοποίηση της ταχύτητας δρομολόγησης πακέτων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Διαχείριση συστημάτων ψύξης και γεννητριών πετρελαίου στα εταιρικά κέντρα δεδομένων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Διαφανή αμοιβαία κρυπτογράφηση mTLS, κρυπτογραφική ταυτότητα υπηρεσιών (SPIFFE) και εξουσιοδότηση."}],"ans":"E","exp":"Το Service Mesh χρησιμοποιεί sidecar proxies για την επιβολή αμοιβαίας κρυπτογράφησης mTLS, ταυτότητας υπηρεσιών και πολιτικών πρόσβασης μεταξύ μικροϋπηρεσιών χωρίς αλλαγές στον κώδικα."},{"q":"Ποια εσφαλμένη ρύθμιση cloud ευθύνεται συχνότερα για καταστροφικά περιστατικά μαζικής διαρροής δεδομένων;","opts":[{"k":"A","v":"Δημόσια προσβάσιμοι κάδοι αποθήκευσης (AWS S3, Azure Blobs) χωρίς πολιτικές ελέγχου πρόσβασης."},{"k":"B","v":"Χρήση κρυπτογράφησης TLS 1.3 αντί για απαρχαιωμένα πρωτόκολλα επιπέδου μεταφοράς SSL 3.0, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Ρύθμιση εφεδρικών παροχών ισχύος σε πολλαπλές γεωγραφικές ζώνες διαθεσιμότητας cloud, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Δέσμευση άνω των εξήντα τεσσάρων gigabytes μνήμης RAM σε συστοιχίες βάσεων δεδομένων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Επιβολή ταυτοποίησης πολλαπλών παραγόντων στις διαχειριστικές πύλες εισόδου του cloud, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"A","exp":"Η διαμόρφωση κάδων αποθήκευσης cloud με δημόσια πρόσβαση (public read) επιτρέπει σε οποιονδήποτε στο διαδίκτυο να αντλήσει ευαίσθητα δεδομένα χωρίς ταυτοποίηση."},{"q":"Στο Serverless computing (π.χ. AWS Lambda), ποιο είναι ένα κρίσιμο αρχιτεκτονικό ζήτημα ασφάλειας;","opts":[{"k":"A","v":"Διαχείριση ταχύτητας ανεμιστήρων και εφεδρικών τροφοδοτικών στα κέντρα δεδομένων του παρόχου, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Εφαρμογή ελάχιστου προνομίου ανά συνάρτηση, εφήμερα περιβάλλοντα εκτέλεσης και εξαρτήσεις τρίτων."},{"k":"C","v":"Μεταγλώττιση συναρτήσεων σε στατικούς οδηγούς συσκευών πυρήνα κατά τη διάρκεια της διάθεσης, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Κατάργηση της ανάγκης κρυπτογράφησης συνδέσεων βάσεων δεδομένων σε περιφερειακά δίκτυα, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Απενεργοποίηση καταγραφής καταγραφών για μείωση του κόστους χρέωσης εκτέλεσης υπολογισμών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"B","exp":"Οι αρχιτεκτονικές serverless απαιτούν αυστηρά δικαιώματα IAM ανά συνάρτηση, ασφάλεια στις εξαρτήσεις τρίτων, ασφαλή διαχείριση μυστικών και παρακολούθηση των εφήμερων εκτελέσεων."},{"q":"Ποιο βασικό σκοπό εξυπηρετεί μια λύση Cloud Security Posture Management (CSPM) σε περιβάλλοντα multi-cloud;","opts":[{"k":"A","v":"Αποκρυπτογράφηση κίνησης TLS σε πραγματικό χρόνο χρησιμοποιώντας ενσωματωμένα κλειδιά CA, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Αντικατάσταση σχεσιακών βάσεων SQL με απλά αρχεία κειμένου αποθηκευμένα σε τοπικούς δίσκους, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Συνεχής έλεγχος των ρυθμίσεων υποδομής cloud έναντι προτύπων συμμόρφωσης και εντοπισμός αποκλίσεων."},{"k":"D","v":"Περιορισμός του εύρους ζώνης των απομακρυσμένων υπαλλήλων σε εξήντα τέσσερα kilobits το δευτερόλεπτο, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Διαχείριση φυλάκων φυσικής ασφάλειας και βιομετρικών κλειδαριών στα κέντρα δεδομένων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"C","exp":"Τα εργαλεία CSPM παρακολουθούν συνεχώς τους πόρους cloud (δικαιώματα, δίκτυα, storage), εντοπίζοντας εσφαλμένες ρυθμίσεις και επιβάλλοντας πρότυπα ασφάλειας (CIS benchmarks)."},{"q":"Πώς ενισχύει την ασφάλεια δικτύου η Μικρο-κατάτμηση (Micro-segmentation) μέσα σε Virtual Private Clouds (VPCs);","opts":[{"k":"A","v":"Συγχωνεύοντας όλους τους διακομιστές εφαρμογών και βάσεων σε ένα ενιαίο επίπεδο δίκτυο Layer 2, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Απενεργοποιώντας κάθε κρυπτογράφηση επιπέδου μεταφοράς στις εσωτερικές εικονικές κάρτες δικτύου, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Μετατρέποντας εγγραφές βάσεων δεδομένων σε απλά αρχεία κειμένου τοπικά στον υπολογιστή, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Επιβάλλοντας κανόνες firewall σε κάθε μεμονωμένο φόρτο εργασίας, αποτρέποντας την πλευρική μετακίνηση."},{"k":"E","v":"Δρομολογώντας όλη την εσωτερική κίνηση μέσω μη ασφαλών δημόσιων εξωτερικών διακομιστών proxy, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"D","exp":"Η μικρο-κατάτμηση εφαρμόζει αυστηρούς κανόνες ασφάλειας σε επίπεδο κάθε μεμονωμένης εικονικής μηχανής ή pod, αποτρέποντας την πλευρική μετακίνηση του εισβολέα σε περίπτωση παραβίασης."}]},{"part":"Μέρος 3 · Μηχανισμοί Προστασίας και Ασφαλής Μηχανική","time":"Κεφάλαιο 10 · ⏱️ 7–9 ώρες μελέτης","title":"10. Έλεγχος Ασφάλειας: SAST, DAST, Αξιολόγηση Ευπαθειών και Δοκιμές Διείσδυσης","subtitle":"Στατική ανάλυση · Δυναμική ανάλυση · Κύκλος διαχείρισης ευπαθειών · Μεθοδολογία και δεοντολογία δοκιμών διείσδυσης · CVSS και επαγγελματική αναφορά","outcomes":["Να συγκρίνετε τα SAST, DAST, την αξιολόγηση ευπαθειών και τη δοκιμή διείσδυσης ως προς το εύρος, τα πλεονεκτήματα και τους περιορισμούς τους.","Να περιγράφετε τον κύκλο διαχείρισης ευπαθειών και να ιεραρχείτε τα ευρήματα με βάση το CVSS και την πιθανότητα εκμετάλλευσης.","Να εξηγείτε τα μοντέλα, τις φάσεις και τις αναγνωρισμένες μεθοδολογίες των δοκιμών διείσδυσης.","Να διατυπώνετε τις νομικές και δεοντολογικές απαιτήσεις του εξουσιοδοτημένου ελέγχου, συμπεριλαμβανομένων των κανόνων εμπλοκής.","Να συντάσσετε ένα εύρημα που συνδυάζει τεκμηρίωση, αξιολόγηση κινδύνου και εφαρμόσιμη πρόταση αποκατάστασης."],"intro":["Το Κεφάλαιο 9 περιέγραψε πώς αναπτύσσεται λογισμικό με ασφάλεια· το παρόν κεφάλαιο εξετάζει πώς μπορούμε να _επαληθεύσουμε_ ότι είναι ασφαλές. Καμία μεμονωμένη τεχνική δεν εντοπίζει κάθε αδυναμία. Η στατική ανάλυση διαβάζει τον κώδικα χωρίς να τον εκτελεί, η δυναμική ανάλυση εξετάζει μια εφαρμογή σε λειτουργία από έξω, η αξιολόγηση ευπαθειών ελέγχει ολόκληρο ένα περιβάλλον για γνωστές αδυναμίες και η δοκιμή διείσδυσης αποδεικνύει τι θα μπορούσε πράγματι να επιτύχει ένας ικανός αντίπαλος. Καθεμιά απαντά σε διαφορετικό ερώτημα, με διαφορετικό κόστος και σε διαφορετικό στάδιο.","Επειδή ορισμένες από αυτές τις δραστηριότητες χρησιμοποιούν πραγματικά επιθετικές τεχνικές, το κεφάλαιο δίνει ίση βαρύτητα στη μέθοδο και στη δεοντολογία. Εξηγεί τα νομικά θεμέλια του εξουσιοδοτημένου ελέγχου, τα όρια της δραστηριότητας μετά την εκμετάλλευση και τον χειρισμό ευαίσθητων αποδεικτικών στοιχείων, και δείχνει πώς πρέπει να βαθμολογούνται και να αναφέρονται τα ευρήματα, ώστε να οδηγούν σε αποκατάσταση και όχι σε ένα έγγραφο που δεν διαβάζει κανείς."],"sections":[{"id":"10.1","title":"Στατικός έλεγχος ασφάλειας εφαρμογών (SAST)","blocks":[{"type":"p","text":"Ο **στατικός έλεγχος ασφάλειας εφαρμογών** (Static Application Security Testing, SAST) αναλύει πηγαίο κώδικα, ενδιάμεσο κώδικα ή εκτελέσιμα _χωρίς να τα εκτελεί_. Είναι τεχνική «λευκού κουτιού»: το εργαλείο έχει πρόσβαση σε ολόκληρο τον κώδικα. Τα σύγχρονα εργαλεία SAST κατασκευάζουν ένα μοντέλο του προγράμματος και εκτελούν **ανάλυση μόλυνσης** (taint analysis), παρακολουθώντας τα δεδομένα από τις _πηγές_ (όπως οι παράμετροι HTTP) έως τα επικίνδυνα _σημεία κατάληξης_ (όπως η εκτέλεση SQL ή η έξοδος HTML). Αν μολυσμένα δεδομένα φτάσουν σε σημείο κατάληξης χωρίς να περάσουν από αναγνωρισμένο _μηχανισμό εξυγίανσης_, το εργαλείο αναφέρει πιθανή ευπάθεια μαζί με την ακριβή γραμμή του κώδικα."},{"type":"p","text":"Το μεγάλο πλεονέκτημα του SAST είναι ο χρόνος εφαρμογής του: μπορεί να εκτελείται στον επεξεργαστή κώδικα του προγραμματιστή και σε κάθε υποβολή, πολύ πριν εγκατασταθεί η εφαρμογή. Η κύρια αδυναμία του είναι η ακρίβεια. Επειδή δεν μπορεί να παρατηρήσει τη συμπεριφορά κατά την εκτέλεση, παράγει **ψευδώς θετικά** αποτελέσματα (αναφερόμενα ζητήματα που δεν είναι εκμεταλλεύσιμα) και παραλείπει σφάλματα που εξαρτώνται από τη διαμόρφωση ή από την επιχειρησιακή λογική. Τα επιτυχημένα προγράμματα προσαρμόζουν επομένως τους κανόνες στα πλαίσια ανάπτυξης που χρησιμοποιούν, αξιολογούν τα αποτελέσματα και αντιμετωπίζουν το SAST ως ένα από πολλά επίπεδα."}]},{"id":"10.2","title":"Δυναμικός έλεγχος ασφάλειας εφαρμογών (DAST)","blocks":[{"type":"p","text":"Ο **δυναμικός έλεγχος ασφάλειας εφαρμογών** (Dynamic Application Security Testing, DAST) εξετάζει μια εφαρμογή _σε λειτουργία_ από έξω, όπως θα έκανε ένας επιτιθέμενος, χωρίς πρόσβαση στον πηγαίο κώδικα. Ένας σαρωτής DAST, όπως το OWASP ZAP, πρώτα _ανιχνεύει_ την εφαρμογή για να ανακαλύψει σελίδες, παραμέτρους και σημεία πρόσβασης API και στη συνέχεια αποστέλλει ειδικά διαμορφωμένες εισόδους και αναλύει τις αποκρίσεις για ενδείξεις ευπάθειας —ένα μήνυμα σφάλματος SQL, ένα ανακλώμενο σενάριο, μια κεφαλίδα ασφάλειας που λείπει. Επειδή παρατηρεί την πραγματική συμπεριφορά, ένα εύρημα DAST είναι συνήθως πράγματι εκμεταλλεύσιμο, και μπορεί να εντοπίσει προβλήματα διαμόρφωσης και διακομιστή που το SAST δεν βλέπει."},{"type":"p","text":"Το DAST έχει επίσης όρια. Μπορεί να ελέγξει μόνο όσα καταφέρνει να προσεγγίσει, οπότε σελίδες πίσω από σύνθετη ταυτοποίηση ή ροές πολλών βημάτων ενδέχεται να παραλειφθούν, και δεν μπορεί να υποδείξει την υπεύθυνη γραμμή κώδικα. Εκτελείται σε όψιμο στάδιο του κύκλου ζωής, σε εγκατεστημένο περιβάλλον δοκιμών. Ο **διαδραστικός έλεγχος** (Interactive Application Security Testing, IAST) συνδυάζει τις δύο προσεγγίσεις, εξοπλίζοντας την εφαρμογή με αισθητήρες ενώ εκτελούνται οι δυναμικές δοκιμές, ώστε κάθε παρατηρούμενο ζήτημα να συνδέεται με τη θέση του στον κώδικα."}]},{"id":"10.3","title":"Ο κύκλος διαχείρισης ευπαθειών","blocks":[{"type":"p","text":"Η **αξιολόγηση ευπαθειών** εντοπίζει συστηματικά γνωστές αδυναμίες —ενημερώσεις που λείπουν, μη ασφαλείς διαμορφώσεις, εργοστασιακά διαπιστευτήρια— σε δίκτυα, υπολογιστές και εφαρμογές, συνήθως με αυτοματοποιημένους σαρωτές όπως τα Nessus, OpenVAS ή τα σενάρια του Nmap. Είναι εκτενής αλλά ρηχή: αναφέρει τι _ενδέχεται_ να είναι εκμεταλλεύσιμο χωρίς να επιχειρεί εκμετάλλευση. Η αξιολόγηση αποτελεί ένα στάδιο του συνεχούς **κύκλου διαχείρισης ευπαθειών**: _ανακάλυψη περιουσιακών στοιχείων_ (δεν μπορείς να προστατεύσεις ό,τι δεν γνωρίζεις ότι έχεις), _σάρωση_, _ανάλυση και ιεράρχηση_, _αποκατάσταση_, _επαλήθευση_ ότι η διόρθωση λειτουργεί και _αναφορά_ των τάσεων."},{"type":"p","text":"Η ιεράρχηση είναι το σημείο όπου δυσκολεύονται τα περισσότερα προγράμματα, επειδή οι σαρωτές αναφέρουν συνήθως χιλιάδες ευρήματα. Η σοβαρότητα από μόνη της δεν αρκεί. Μια τεκμηριωμένη προσέγγιση συνδυάζει την τεχνική σοβαρότητα (CVSS), την πιθανότητα εκμετάλλευσης —για παράδειγμα τη βαθμολογία **EPSS** ή την καταχώριση στον κατάλογο _Known Exploited Vulnerabilities_ της CISA— και την επιχειρησιακή σημασία και έκθεση του επηρεαζόμενου στοιχείου. Ένας διακομιστής εκτεθειμένος στο διαδίκτυο με ευπάθεια που εκμεταλλεύονται ενεργά οι επιτιθέμενοι χρειάζεται προσοχή σήμερα, ακόμη κι αν ένα «κρίσιμο» εύρημα σε ένα απομονωμένο μηχάνημα δοκιμών περιμένει."}]},{"id":"10.4","title":"Δοκιμές διείσδυσης: μοντέλα, φάσεις, δεοντολογία και πλαίσια","blocks":[{"type":"p","text":"Μια **δοκιμή διείσδυσης** είναι μια εξουσιοδοτημένη, προσομοιωμένη επίθεση που επιχειρεί να εκμεταλλευτεί ευπάθειες, ώστε να αποδείξει την πραγματική τους επίπτωση. Οι δοκιμές κατατάσσονται με βάση τη γνώση που δίνεται στον ελεγκτή: **μαύρου κουτιού** (χωρίς προηγούμενη πληροφόρηση, όπως ένας εξωτερικός επιτιθέμενος), **γκρίζου κουτιού** (ορισμένες πληροφορίες, όπως ένας λογαριασμός χρήστη) και **λευκού κουτιού** (πλήρης τεκμηρίωση και πηγαίος κώδικας, που προσφέρει την πληρέστερη κάλυψη στον διαθέσιμο χρόνο). Μια τυπική ανάθεση εξελίσσεται σε φάσεις: _προετοιμασία_ και καθορισμός πεδίου, _αναγνώριση_, _σάρωση και απαρίθμηση_, _εκμετάλλευση_, _δραστηριότητα μετά την εκμετάλλευση_ και _αναφορά_. Αναγνωρισμένες μεθοδολογίες, όπως οι PTES, OWASP Web Security Testing Guide, OSSTMM και NIST SP 800-115, δομούν αυτές τις φάσεις και καθιστούν τα αποτελέσματα επαναλήψιμα."},{"type":"p","text":"Η νομιμότητα στηρίζεται αποκλειστικά στην **εξουσιοδότηση**. Πριν ξεκινήσει οποιαδήποτε δοκιμή, ο πελάτης πρέπει να υπογράψει σύμβαση και **κανόνες εμπλοκής** (rules of engagement) που ορίζουν το πεδίο (ποια συστήματα, διευθύνσεις και εφαρμογές), τις επιτρεπόμενες τεχνικές, τα χρονικά παράθυρα, τα πρόσωπα επικοινωνίας έκτακτης ανάγκης και τον τρόπο χειρισμού ευαίσθητων δεδομένων. Ο έλεγχος ενός συστήματος εκτός του συμφωνημένου πεδίου —ακόμη κι ενός που φαίνεται προφανώς σχετικό— αποτελεί μη εξουσιοδοτημένη πρόσβαση. Οι επαγγελματίες ελεγκτές αποφεύγουν επίσης τις καταστροφικές ενέργειες και σταματούν αμέσως αν εντοπίσουν ενδείξεις πραγματικής, εν εξελίξει παραβίασης."}]},{"id":"10.5","title":"Όρια της φάσης μετά την εκμετάλλευση και χειρισμός αποδεικτικών στοιχείων","blocks":[{"type":"p","text":"Η φάση **μετά την εκμετάλλευση** (post-exploitation) αποδεικνύει την επιχειρησιακή επίπτωση μιας παραβίασης: ποια δεδομένα θα μπορούσαν να προσπελαστούν, αν ήταν δυνατή η κλιμάκωση προνομίων και πόσο μακριά θα μπορούσε να κινηθεί ο ελεγκτής μέσα στο δίκτυο. Είναι επίσης η φάση με τον μεγαλύτερο δεοντολογικό κίνδυνο. Ο κατευθυντήριος κανόνας είναι η **ελάχιστη αναγκαία ενέργεια**: αποδεικνύεις την πρόσβαση, δεν την εκμεταλλεύεσαι. Ένας ελεγκτής που φτάνει σε μια βάση δεδομένων πελατών καταγράφει ένα στιγμιότυπο της δομής του πίνακα και τον αριθμό των εγγραφών, όχι τις ίδιες τις εγγραφές. Κάθε μηχανισμός μόνιμης παρουσίας, λογαριασμός ή αρχείο που δημιουργείται κατά τη δοκιμή πρέπει να τεκμηριώνεται και να αφαιρείται στη συνέχεια."},{"type":"p","text":"Τα αποδεικτικά στοιχεία που συλλέγονται κατά τη δοκιμή —στιγμιότυπα, υποκλαπέντα διαπιστευτήρια, αποσπάσματα ευαίσθητων δεδομένων— είναι και τα ίδια ευαίσθητα. Πρέπει να αποθηκεύονται κρυπτογραφημένα, να κοινοποιούνται μόνο σε εξουσιοδοτημένους παραλήπτες, να διατηρούνται μόνο για όσο διάστημα απαιτεί η σύμβαση και στη συνέχεια να καταστρέφονται με ασφάλεια. Όταν εμπλέκονται προσωπικά δεδομένα, η επεξεργασία πρέπει επιπλέον να συμμορφώνεται με τη νομοθεσία προστασίας δεδομένων, όπως ο ΓΚΠΔ (Κεφάλαιο 13)."}]},{"id":"10.6","title":"Βαθμολόγηση και αναφορά: CVSS, τεκμηρίωση και αποκατάσταση","blocks":[{"type":"p","text":"Το **Common Vulnerability Scoring System (CVSS)** εκφράζει την τεχνική σοβαρότητα μιας ευπάθειας με βαθμολογία από 0 έως 10. Οι _βασικές μετρικές_ του περιγράφουν πώς μπορεί να γίνει εκμετάλλευση της ευπάθειας (διάνυσμα επίθεσης, πολυπλοκότητα, απαιτούμενα προνόμια, αλληλεπίδραση χρήστη) και ποια είναι η επίπτωσή της στην εμπιστευτικότητα, την ακεραιότητα και τη διαθεσιμότητα. Η βαθμολογία συνοδεύεται από μια _συμβολοσειρά διανύσματος_, όπως `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H` (βαθμολογία 9,8), η οποία καθιστά διαφανή τη συλλογιστική. Το CVSS μετρά τη σοβαρότητα και όχι τον κίνδυνο· το πλαίσιο του οργανισμού πρέπει πάντοτε να λαμβάνεται υπόψη."},{"type":"p","text":"Μια επαγγελματική αναφορά απευθύνεται σε δύο κοινά. Η **σύνοψη για τη διοίκηση** εξηγεί, σε μη τεχνική γλώσσα, τον συνολικό κίνδυνο και τις σημαντικότερες συστάσεις. Κάθε **τεχνικό εύρημα** περιλαμβάνει σαφή τίτλο, τα επηρεαζόμενα στοιχεία, περιγραφή, τεκμηρίωση _αναπαραγωγής_ βήμα προς βήμα, τη σοβαρότητα με το διάνυσμα CVSS, την επιχειρησιακή επίπτωση και μια συγκεκριμένη, εφαρμόσιμη **πρόταση αποκατάστασης** —όχι «βελτιώστε την ασφάλεια», αλλά «αντικαταστήστε τη συνένωση συμβολοσειρών στη γραμμή 42 του `search.php` με παραμετροποιημένο ερώτημα και εφαρμόστε έναν κανόνα WAF ως προσωρινό μέτρο». Ένας επανέλεγχος επαληθεύει στη συνέχεια ότι οι διορθώσεις είναι αποτελεσματικές."},{"type":"table","caption":"Πίνακας 10.1 — Σύγκριση προσεγγίσεων ελέγχου","head":["Προσέγγιση","Πρόσβαση","Πότε","Πλεονέκτημα","Περιορισμός"],"rows":[["SAST","Πηγαίος κώδικας (λευκό κουτί)","Κατά την ανάπτυξη","Πρώιμο, υποδεικνύει την ακριβή γραμμή","Ψευδώς θετικά, καμία εικόνα εκτέλεσης"],["DAST","Εφαρμογή σε λειτουργία (μαύρο κουτί)","Περιβάλλον δοκιμών","Επιβεβαιώνει την πραγματική συμπεριφορά","Περιορισμένη κάλυψη, όψιμο"],["Αξιολόγηση ευπαθειών","Δίκτυο, υπολογιστές, εφαρμογές","Συνεχώς","Ευρεία κάλυψη","Καμία απόδειξη εκμεταλλευσιμότητας"],["Δοκιμή διείσδυσης","Συμφωνημένο πεδίο","Περιοδικά / μετά από σημαντική αλλαγή","Αποδεικνύει την πραγματική επίπτωση","Χρονικά περιορισμένη, δαπανηρή, στιγμιαία εικόνα"]]}]}],"terms":[{"name":"Ανάλυση μόλυνσης","def":"Παρακολούθηση μη αξιόπιστων δεδομένων από τις πηγές έως τα επικίνδυνα σημεία κατάληξης στον κώδικα."},{"name":"Ψευδώς θετικό","def":"Αναφερόμενο ζήτημα που στην πραγματικότητα δεν είναι εκμεταλλεύσιμο."},{"name":"EPSS","def":"Σύστημα πρόβλεψης εκμετάλλευσης: η εκτιμώμενη πιθανότητα να γίνει εκμετάλλευση μιας ευπάθειας."},{"name":"Κανόνες εμπλοκής","def":"Υπογεγραμμένο έγγραφο που ορίζει το πεδίο, τις μεθόδους, τον χρόνο και τα πρόσωπα επικοινωνίας μιας δοκιμής."},{"name":"Μετά την εκμετάλλευση","def":"Δραστηριότητες μετά την αρχική πρόσβαση που αποδεικνύουν την επίπτωση, με όριο την ελάχιστη αναγκαία ενέργεια."},{"name":"Διάνυσμα CVSS","def":"Συμβολοσειρά που καταγράφει κάθε μετρική που χρησιμοποιήθηκε για τον υπολογισμό μιας βαθμολογίας CVSS."}],"summary":["Τα SAST, DAST, η αξιολόγηση ευπαθειών και η δοκιμή διείσδυσης απαντούν σε διαφορετικά ερωτήματα και αλληλοσυμπληρώνονται.","Η διαχείριση ευπαθειών είναι συνεχής κύκλος· η ιεράρχηση πρέπει να συνδυάζει σοβαρότητα, πιθανότητα εκμετάλλευσης και πλαίσιο του στοιχείου.","Οι δοκιμές διείσδυσης ακολουθούν αναγνωρισμένες φάσεις και μεθοδολογίες και είναι νόμιμες μόνο εντός υπογεγραμμένου πεδίου και κανόνων εμπλοκής.","Η φάση μετά την εκμετάλλευση πρέπει να αποδεικνύει την πρόσβαση με την ελάχιστη αναγκαία ενέργεια, ενώ τα αποδεικτικά στοιχεία της δοκιμής προστατεύονται όπως τα δεδομένα παραγωγής.","Οι καλές αναφορές συνδυάζουν διαφανή βαθμολόγηση CVSS με αναπαραγώγιμη τεκμηρίωση και συγκεκριμένη αποκατάσταση."],"review":["Γιατί το SAST μπορεί να αναφέρει μια ευπάθεια που το DAST δεν μπορεί να επιβεβαιώσει, και αντιστρόφως;","Δύο ευρήματα: CVSS 9,1 σε έναν απομονωμένο εργαστηριακό διακομιστή και CVSS 7,5 σε έναν διακομιστή εκτεθειμένο στο διαδίκτυο που περιλαμβάνεται στον κατάλογο CISA KEV. Ποιο διορθώνετε πρώτο και γιατί;","Κατά τη διάρκεια μιας δοκιμής ανακαλύπτετε ότι ένα σύστημα λίγο έξω από το πεδίο σας είναι ευάλωτο. Τι πρέπει να κάνετε;","Αναδιατυπώστε τη σύσταση «Διορθώστε το πρόβλημα XSS» ώστε να γίνει εφαρμόσιμη πρόταση αποκατάστασης."],"cli":{"title":"Προσομοιωτής Αξιολόγησης Ευπαθειών & Δοκιμών Διείσδυσης Web","desc":"Ελέγξτε επικεφαλίδες ασφάλειας HTTP, ανακαλύψτε κρυφά endpoints με το Gobuster, εκτελέστε σάρωση ευπαθειών με το Nikto και δοκιμάστε παραμέτρους με το SQLMap.","meta":["⏱️ ~30 min","🐚 pentester@kali-sec:~$"],"tasks":[{"pill":"Task 1","name":"Έλεγχος Επικεφαλίδων Ασφάλειας HTTP","instr":"Εξετάστε τις επικεφαλίδες απόκρισης του στόχου με την εντολή `curl -I`.","hint":"Εκτελέστε: curl -I https://target-server.lab.internal","cmd":"$ curl -I https://target-server.lab.internal","ok":"Οι επικεφαλίδες ελέγχθηκαν: Εντοπίστηκε απουσία HSTS, Content Security Policy και X-Frame-Options."},{"pill":"Task 2","name":"Ανακάλυψη Κρυφών Καταλόγων με το Gobuster","instr":"Εκτελέστε ανακάλυψη καταλόγων στον στόχο με το εργαλείο `gobuster` και τη λίστα `wordlists/common.txt`.","hint":"Εκτελέστε: gobuster dir -u https://target-server.lab.internal -w wordlists/common.txt","cmd":"$ gobuster dir -u https://target-server.lab.internal -w wordlists/common.txt","ok":"Οι κατάλογοι ανακαλύφθηκαν: Εντοπίστηκε το κρυφό endpoint /api/v1/admin/debug και ο φάκελος /backup ."},{"pill":"Task 3","name":"Εκτέλεση Σαρωτή Ευπαθειών Web Server (Nikto)","instr":"Εκτελέστε αυτοματοποιημένο έλεγχο ευπαθειών web server στον στόχο με το `nikto`.","hint":"Εκτελέστε: nikto -h https://target-server.lab.internal","cmd":"$ nikto -h https://target-server.lab.internal","ok":"Η σάρωση Nikto ολοκληρώθηκε: Καταγράφηκαν παρωχημένη έκδοση web server και εκτεθειμένες επικεφαλίδες."},{"pill":"Task 4","name":"Αυτοματοποιημένος Έλεγχος SQL Injection με το SQLMap","instr":"Ελέγξτε την παράμετρο `id` στο endpoint `https://target-server.lab.internal/item?id=1` με το `sqlmap`.","hint":"Εκτελέστε: sqlmap -u \\"https://target-server.lab.internal/item?id=1\\" --batch","cmd":"$ sqlmap -u \\"https://target-server.lab.internal/item?id=1\\" --batch","ok":"Το SQLMap επιβεβαίωσε την ευπάθεια: Η παράμετρος \'id\' είναι ευάλωτη σε Union-based και Boolean blind SQL injection!"}]},"lab":{"title":"Ολοκληρωμένη Αξιολόγηση Ευπαθειών & Δοκιμές Διείσδυσης Web (OWASP Top 10 & WSTG)","desc":"Σε αυτό το εργαστήριο 2 ωρών, οι φοιτητές εκτελούν μια επαγγελματική δοκιμή διείσδυσης web εφαρμογής ακολουθώντας τον οδηγό OWASP WSTG v4.2 και το πρότυπο PTES. Θα συντάξετε Κανόνες Εμπλοκής (RoE), θα εκτελέσετε αναγνώριση, θα σαρώσετε για ευπαθείς υπηρεσίες (Nmap NSE), θα εντοπίσετε σφάλματα εφαρμογής με το OWASP ZAP, θα εκτελέσετε ελεγχόμενα Proof-of-Concept exploits, θα υπολογίσετε σκορ CVSS v3.1 και θα συντάξετε μια πλήρη τεχνική έκθεση pentest.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Kali Linux 2024.x VM / Parrot Security OS","Target environment: OWASP Juice Shop & Multi-tier vulnerable banking portal (`10.0.5.20`)","Penetration testing suite: `nmap`, `nikto`, `gobuster`, `sqlmap`, `zap-cli`, `hydra`, `metasploit-framework`","CVSS v3.1 / v4.0 Calculator toolset"],"phases":[{"badge":"Phase 1","name":"Προκαταρκτικές Διαδικασίες, Κανόνες Εμπλοκής (RoE) & Αναγνώριση","dur":"⏱️ 25 λεπτά","objs":["Καθορισμός ορίων εύρους (εγκεκριμένοι στόχοι IP, εξαιρούμενα συστήματα).","Εκτέλεση παθητικής αναγνώρισης OSINT και ελέγχου μεταφοράς ζώνης DNS (`dig AXFR`).","Καταγραφή εκδόσεων υπηρεσιών με σενάρια NSE του Nmap."],"steps":[{"type":"p","text":"1. Έλεγχος υπογεγραμμένου εγγράφου εξουσιοδότησης RoE στο `/workspace/roe_authorization.pdf`.\\n2. Εκτέλεση σάρωσης ευπαθειών με το Nmap:\\n```bash\\nnmap -sV -sC --script vuln -p 1-65535 10.0.5.20 -oA /workspace/nmap_vuln_scan\\n```\\n3. Ανάλυση ανοιχτών θυρών: Web (80/443), SSH (22), Management (8080)."}]},{"badge":"Phase 2","name":"Αυτοματοποιημένη Σάρωση DAST & Αξιολόγηση Ευπαθειών","dur":"⏱️ 45 λεπτά","objs":["Εκκίνηση spider και ενεργού σαρωτή OWASP ZAP εναντίον του στόχου web.","Fuzzing κρυφών παραμέτρων και αντιγράφων ασφαλείας με Gobuster / ffuf.","Διαλογή ευρημάτων και εξάλειψη ψευδώς θετικών ενδείξεων."],"steps":[{"type":"p","text":"1. Εκτέλεση fuzzing καταλόγων και αρχείων:\\n```bash\\ngobuster dir -u http://10.0.5.20:8080/ -w /usr/share/wordlists/dirb/big.txt -x php,json,bak,old -o /workspace/gobuster.txt\\n```\\n2. Εκτέλεση αυτοματοποιημένης σάρωσης ZAP:\\n```bash\\nzap-baseline.py -t http://10.0.5.20:8080/ -r /workspace/zap_report.html\\n```\\n3. Εξέταση των επισημασμένων ευπαθειών στην αναφορά HTML."}]},{"badge":"Phase 3","name":"Ελεγχόμενη Εκμετάλλευση & Απόδειξη Έννοιας (Proof of Concept - PoC)","dur":"⏱️ 30 λεπτά","objs":["Εκτέλεση ελεγχόμενου exploit SQL injection για ανάκτηση έκδοσης βάσης δεδομένων.","Επίδειξη Stored XSS ενεργοποιώντας ένα ασφαλές πλαίσιο alert.","Εκμετάλλευση IDOR για πρόσβαση σε τιμολόγιο άλλου χρήστη."],"steps":[{"type":"p","text":"1. Εκμετάλλευση SQL injection με το SQLMap:\\n```bash\\nsqlmap -u \\"http://10.0.5.20:8080/rest/products/search?q=apple\\" --banner --current-db --batch\\n```\\n2. Επαλήθευση του PoC και λήψη αποδεικτικών στιγμιοτύπων.\\n3. Άμεση διακοπή για αποφυγή αλλοίωσης της βάσης."}]},{"badge":"Phase 4","name":"Βαθμολόγηση CVSS v3.1 & Σύνταξη Έκθεσης Pentest","dur":"⏱️ 20 λεπτά","objs":["Υπολογισμός διανύσματος CVSS v3.1 Base Vector (π.χ. 9.8 Critical για SQLi).","Συγγραφή τεχνικών περιγραφών αιτίου και οδηγιών αποκατάστασης.","Σύνθεση της τελικής Επιτελικής & Τεχνικής Έκθεσης Δοκιμών Διείσδυσης."],"steps":[{"type":"p","text":"1. Υπολογισμός βαθμολογιών CVSS για όλα τα επιβεβαιωμένα ευρήματα.\\n2. Μορφοποίηση ευρημάτων σε πρότυπα (Τίτλος, Κρισιμότητα, CVSS, Επίπτωση, Βήματα PoC, Διόρθωση).\\n3. Παράδοση της τελικής επιτελικής σύνοψης."}]}],"checklist":["Όλες οι σαρώσεις πραγματοποιήθηκαν αυστηρά εντός του εγκεκριμένου χρονικού παραθύρου RoE.","Οι ευπάθειες συνοδεύονται από επαληθευμένα PoCs με μηδέν ψευδώς θετικά.","Οι βαθμολογίες CVSS v3.1 αντικατοπτρίζουν ορθά το Attack Vector και την Επίπτωση.","Οι συστάσεις αποκατάστασης παρέχουν άμεσα εφαρμόσιμες διορθώσεις σε επίπεδο κώδικα."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αυτοματοποιημένη Διαχείριση Ευπαθειών & Αγωγός Συνεχούς Pentesting","desc":"Ένας όμιλος ηλεκτρονικού εμπορίου που λειτουργεί 50 web εφαρμογές και API gateways απαιτεί μια αυτοματοποιημένη πλατφόρμα συνεχών δοκιμών διείσδυσης και διαχείρισης ευπαθειών. Σας ανατίθεται να αναπτύξετε μια πλατφόρμα σε Python/Docker που ενορχηστρώνει προγραμματισμένες σαρώσεις DAST (ZAP/Nuclei), παρακολουθεί τα SLAs διόρθωσης, συσχετίζει ευρήματα με βάσεις CVE και οπτικοποιεί την ασφάλεια σε διαδικτυακό πίνακα ελέγχου.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Μηχανή Ανακάλυψης Εξωτερικής Επιφάνειας Επίθεσης","desc":"Ανάπτυξη του asm_discovery.py για αυτόματη ανακάλυψη subdomains, διευθύνσεων IP cloud και ανοιχτών θυρών.","spec":["Σχεδιασμός ποσοτικού δείκτη ανθρώπινου κινδύνου βάσει συμπεριφοράς και εκπαίδευσης.","Κατηγοριοποίηση προσωπικού σε βαθμίδες επικινδυνότητας (Οικονομικά, Διαχειριστές, Υπάλληλοι).","Μέτρηση αρχικού ποσοστού ευαλωτότητας σε phishing (PPP) της επιχείρησης."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα ανακάλυψης ASM + σχήμα καταγραφής περιουσιακών στοιχείων."},{"num":"M2","title":"Ενορχηστρωτής DAST & Μηχανή Σάρωσης (ZAP / Nuclei)","desc":"Ανάπτυξη του dast_orchestrator.py για ασύγχρονη εκτέλεση containers με προσαρμοσμένα πρότυπα σάρωσης ευπαθειών.","spec":["Ανάπτυξη προσαρμοσμένων μηνιαίων ενοτήτων micro-learning διάρκειας 5 λεπτών.","Εξειδικευμένη εκπαίδευση αντιμετώπισης BEC για τη διοίκηση και το λογιστήριο.","Πρόγραμμα επιβράβευσης εργαζομένων που αναφέρουν ύποπτα μηνύματα."],"deliv":"📦 Παραδοτέο Οροσήμου: Κώδικας ενορχηστρωτή σάρωσης + σουίτα δοκιμών."},{"num":"M3","title":"Ιεράρχηση Κινδύνου CVSS / EPSS & Αποδιπλασιασμός Ευρημάτων","desc":"Υλοποίηση αλγορίθμων αποδιπλασιασμού ευρημάτων και υπολογισμού δυναμικού κινδύνου συνδυάζοντας CVSS και πιθανότητα EPSS.","spec":["Αρχιτεκτονική email gateway με αυστηρό DMARC (`p=reject`), SPF και DKIM.","Ανάπτυξη BIMI και MTA-STS για ασφαλή μεταφορά ηλεκτρονικού ταχυδρομείου.","Ενσωμάτωση φίλτρου AI/NLP στα γραμματοκιβώτια για εντοπισμό επιθέσεων πλαστοπροσωπίας BEC."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα ιεράρχησης κινδύνου + σχήμα βάσης δεδομένων."},{"num":"M4","title":"Πίνακας Διαχείρισης Ευπαθειών & Επιβολή SLAs Διόρθωσης","desc":"Κατασκευή διαδικτυακού πίνακα ελέγχου με ανοιχτές ευπάθειες, μέσο χρόνο αποκατάστασης (MTTR) και ειδοποιήσεις υπέρβασης SLA.","spec":["Σχεδιασμός κουμπιού αναφοράς Phish Alarm στο Outlook με αυτόματη σύνδεση στο SOC.","Ορισμός διαδικασίας άμεσης ανάκλησης κωδικών και μαζικής διαγραφής κακόβουλων emails.","Σύνταξη επίσημου Καταστατικού Προγράμματος Αντιμετώπισης Κοινωνικής Μηχανικής."],"deliv":"📦 Παραδοτέο Οροσήμου: Διαδικτυακή εφαρμογή Dashboard + Επιτελική Έκθεση Διασφάλισης (10–12 σελίδες)."}],"deliverables":["Πλήρης Πηγαίος Κώδικας Πλατφόρμας σε Python (`/vuln_platform/`)","Αρχείο Ενορχήστρωσης DAST Containers (`docker-compose.yml`)","Διεπαφή Διαδικτυακού Πίνακα Ελέγχου Διαχείρισης Ευπαθειών","Οδηγός Τεχνικής Αρχιτεκτονικής & Λειτουργίας (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένης Πλατφόρμας Phishing Simulation & Ελεγκτή Email Auth σε Python","desc":"Ο ανθρώπινος παράγοντας και οι επιθέσεις κοινωνικής μηχανικής αποτελούν το κύριο σημείο εισόδου για ransomware και υποκλοπές δεδομένων. Θα κατασκευάσετε μια εκπαιδευτική πλατφόρμα προσομοίωσης phishing και ανάλυσης ασφάλειας email σε Python ( phish_sim.py ). Το εργαλείο θα παράγει προσωποποιημένες εκπαιδευτικές καμπάνιες με tracking pixels, θα καταγράφει τις ενέργειες των χρηστών σε ασφαλή εκπαιδευτική σελίδα και θα περιλαμβάνει αναλυτή κεφαλίδων email που επαληθεύει ψηφιακές υπογραφές DKIM, εγγραφές SPF και ευθυγράμμιση DMARC.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Μηχανή Εκστρατειών & Παραγωγός Προσωποποιημένων Emails","desc":"Κατασκευή αγωγού παραγωγής emails με πρότυπα Jinja2 HTML, ενσωμάτωση HMAC tokens και tracking pixels.","spec":["Παραγωγή υπογεγραμμένων tokens με HMAC-SHA256 (`user_id + campaign_id`).","Ενσωμάτωση προσωποποιημένων URLs (`/login?token=...`) και tracking beacon.","Αποστολή μέσω SMTP με έλεγχο ρυθμού (rate limiting)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα campaign_engine.py με παραγωγή εκπαιδευτικών emails."},{"num":"M2","title":"Εκπαιδευτική Σελίδα Landing & Καταγραφή Αλληλεπιδράσεων","desc":"Ανάπτυξη εφαρμογής FastAPI με κλωνοποιημένες σελίδες εισόδου (Microsoft 365, Google) και ασφαλή καταγραφή ενεργειών.","spec":["Καταγραφή σταδίων: `Email Opened` -> `Link Clicked` -> `Credentials Submitted`.","Προστασία ιδιωτικότητας: ΜΗΔΕΝΙΚΗ αποθήκευση κωδικών, καταγραφή μόνο ένδειξης `submitted=True`.","Άμεση εμφάνιση εκπαιδευτικού μηνύματος με επισήμανση των ενδείξεων απάτης."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα landing_server.py + εκπαιδευτική διεπαφή."},{"num":"M3","title":"Ελεγκτής Αυθεντικοποίησης DNS SPF, DKIM & DMARC","desc":"Υλοποίηση αρθρώματος ελέγχου ασφάλειας DNS που αναλύει εγγραφές TXT για αξιολόγηση προστασίας από spoofing.","spec":["Ανάκτηση εγγραφής SPF: ανάλυση μηχανισμών (`ip4`, `include`) και επισήμανση επισφαλών ρυθμίσεων (`+all`).","Ανάκτηση DMARC (`_dmarc.domain.com`): ανάλυση πολιτικής (`p=reject`, `pct`) και ευθυγράμμισης (`aspf`, `adkim`).","Επαλήθευση κρυπτογραφικής υπογραφής DKIM σε κεφαλίδες email με τη βιβλιοθήκη `dkimpy`."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα email_auth_auditor.py με έλεγχο 10 domains."},{"num":"M4","title":"Αναλυτής Κεφαλίδων Email & Dashboard Στατιστικών Εκστρατείας","desc":"Ανάπτυξη αναλυτή εγκληματολογικής κεφαλίδων email και dashboard απεικόνισης στατιστικών ευαλωτότητας εργαζομένων.","spec":["Ανάλυση κεφαλίδων `Received` για ανακατασκευή της διαδρομής IP του αποστολέα.","Εντοπισμός ανωμαλιών: αναντιστοιχία `From` και `Return-Path`, πλαστογραφημένα message IDs.","Παραγωγή στατιστικών: Phish-Prone Percentage (PPP), ποσοστό κλικ και ολοκλήρωση εκπαίδευσης."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρης πλατφόρμα phish_sim.py + analytics dashboard."}],"deliverables":["Πηγαίος κώδικας Πλατφόρμας Phishing Simulation (`/phish_sim/`)","Διακομιστής Landing Page & Καταγραφής με FastAPI","Μηχανή Ελέγχου DNS SPF/DKIM/DMARC","Έκθεση Εκπαίδευσης & Άμυνας Ηλεκτρονικού Ταχυδρομείου (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 10","quiz":[{"q":"Στα πρότυπα αυθεντικοποίησης ηλεκτρονικού ταχυδρομείου, ποιος είναι ο ρόλος του DMARC;","opts":[{"k":"A","v":"Ορίζει πολιτικές διαχείρισης μηνυμάτων που αποτυγχάνουν σε SPF/DKIM και παράγει αναφορές συμμόρφωσης."},{"k":"B","v":"Συμπιέζει τα επισυναπτόμενα αρχεία χρησιμοποιώντας ιδιόκτητους αλγορίθμους κατά την παράδοση, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Μεταφράζει το κείμενο του μηνύματος σε ξένες γλώσσες χρησιμοποιώντας νευρωνικά δίκτυα μηχανικής μάθησης, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Διαγράφει οριστικά όλα τα ανεπιθύμητα μηνύματα από τα εισερχόμενα χωρίς ειδοποίηση των διαχειριστών, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Αντικαθιστά το πρωτόκολλο SMTP με μη κρυπτογραφημένες εκπομπές datagrams UDP στο δίκτυο, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"A","exp":"Το DMARC συνδυάζει SPF και DKIM επιβάλλοντας πολιτικές (none, quarantine, reject) για αποτυχημένα μηνύματα και παράγει αναφορές για απόπειρες πλαστοπροσωπίας του domain."},{"q":"Ποια τεχνική κοινωνικής μηχανικής βασίζεται στη δημιουργία ενός κατασκευασμένου σεναρίου για τη χειραγώγηση του θύματος;","opts":[{"k":"A","v":"Baiting, αφήνοντας μολυσμένες μονάδες USB σε δημόσιους χώρους στάθμευσης της εταιρείας, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Pretexting, επινοώντας ένα αληθοφανές σενάριο και ρόλο για να παραπλανηθεί το θύμα."},{"k":"C","v":"Tailgating, ακολουθώντας φυσικά έναν εξουσιοδοτημένο υπάλληλο μέσα από μια ασφαλή πόρτα."},{"k":"D","v":"Quid Pro Quo, προσφέροντας μια υποτιθέμενη υπηρεσία (όπως τεχνική υποστήριξη) με αντάλλαγμα κωδικούς."},{"k":"E","v":"Watering Hole, μολύνοντας έναν νόμιμο ιστότοπο που επισκέπτονται συχνά οι εργαζόμενοι-στόχοι."}],"ans":"B","exp":"Το Pretexting περιλαμβάνει τη δημιουργία ενός αληθοφανούς ψευδούς σεναρίου (π.χ. υπόδυση ελεγκτή ή ανώτερου στελέχους) για την εξαπάτηση του θύματος και την απόσπαση ευαίσθητων δεδομένων."},{"q":"Ποιο διάνυσμα επίθεσης χαρακτηρίζει το Business Email Compromise (BEC);","opts":[{"k":"A","v":"Κατακλυσμός διακομιστών ηλεκτρονικού ταχυδρομείου με ογκομετρική κίνηση DDoS για διακοπή υπηρεσιών, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"B","v":"Διάθεση κακόβουλου λογισμικού ransomware μέσω μολυσμένων συσκευών USB που αφήνονται σε γραφεία, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Υπόδυση στελεχών ή προμηθευτών μέσω πλαστών ή παραβιασμένων emails για εκτέλεση δόλιων τραπεζικών εμβασμάτων."},{"k":"D","v":"Υποκλοπή επικοινωνιών οπτικών ινών χρησιμοποιώντας μη εξουσιοδοτημένους οπτικούς διαχωριστές, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Εκμετάλλευση κενών υπερχείλισης μνήμης buffer σε οδηγούς καρτών δικτύου του λειτουργικού συστήματος, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"C","exp":"Το BEC στοχεύει επιχειρήσεις υποδυόμενο στελέχη διοίκησης (CEO fraud) ή προμηθευτές για να εξαπατήσει το λογιστήριο ώστε να εκτελέσει πληρωμές σε τραπεζικούς λογαριασμούς του επιτιθέμενου."},{"q":"Τι είναι το \'MFA Fatigue\' (Prompt Bombing) και πώς το εκμεταλλεύονται οι επιτιθέμενοι;","opts":[{"k":"A","v":"Αποκρυπτογράφηση κωδικών πρόσβασης εκτός σύνδεσης μέσω συστοιχιών καρτών γραφικών υψηλής ισχύος, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Υποκλοπή γραπτών μηνυμάτων SMS εκμεταλλευόμενοι αδυναμίες στο πρωτόκολλο σηματοδοσίας SS7, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Υποκλοπή ιδιωτικών κλειδιών παρόχου ταυτότητας για πλαστογράφηση ψηφιακών βεβαιώσεων SAML 2.0, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Αποστολή συνεχών ειδοποιήσεων έγκρισης MFA μέχρι ο χρήστης να πατήσει κατά λάθος \'Έγκριση\' λόγω κόπωσης."},{"k":"E","v":"Εγκατάσταση καταγραφέων πληκτρολογίου (keyloggers) σε υπολογιστές μέσα στις εγκαταστάσεις, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"D","exp":"Στο MFA Fatigue ο επιτιθέμενος στέλνει αλλεπάλληλες ειδοποιήσεις push στο κινητό του χρήστη ώστε να αποδεχτεί μία από κούραση. Αντιμετωπίζεται με αντιστοίχιση αριθμών (Number Matching)."},{"q":"Ποιος δείκτης συμπεριφοράς συνδέεται συνήθως με δραστηριότητα κακόβουλης εσωτερικής απειλής (Insider Threat);","opts":[{"k":"A","v":"Εγκατάσταση ενημερώσεων ασφάλειας του λειτουργικού συστήματος κατά τις προγραμματισμένες ώρες συντήρησης, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Χρήση φυσικών κλειδιών ασφαλείας MFA για την προστασία του εταιρικού φορητού υπολογιστή, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Συμμετοχή σε προαιρετικά σεμινάρια εκπαίδευσης ασφάλειας και προσομοιώσεις επιθέσεων phishing, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Υποβολή αιτημάτων διαχείρισης αλλαγών για προγραμματισμένη συντήρηση ευρετηρίων βάσεων δεδομένων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Πρόσβαση σε ευαίσθητα δεδομένα εκτός ωραρίου και προσπάθεια εξαγωγής μεγάλου όγκου σε εξωτερικό cloud."}],"ans":"E","exp":"Οι ενδείξεις εσωτερικής απειλής περιλαμβάνουν ασυνήθιστη πρόσβαση σε αρχεία εκτός ωραρίου, μαζική λήψη ευαίσθητων δεδομένων και προσπάθειες εξαγωγής σε εξωτερικά μέσα ή cloud storage."},{"q":"Ποιος είναι ο κύριος στόχος της εκτέλεσης προσομοιώσεων επιθέσεων phishing σε έναν οργανισμό;","opts":[{"k":"A","v":"Να εντοπιστούν κενά εκπαίδευσης και να εκπαιδευτούν οι υπάλληλοι στην αναγνώριση επιθέσεων με ασφάλεια."},{"k":"B","v":"Να διαπομπευθούν οι υπάλληλοι που αποτυγχάνουν αναρτώντας τα ονόματά τους σε εσωτερικούς πίνακες, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Να δικαιολογηθεί η άμεση απόλυση εργαζομένων χωρίς επίσημη διαδικασία αξιολόγησης από το HR, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Να διακοπεί οριστικά η εξωτερική επικοινωνία email για όλα τα τμήματα της επιχείρησης, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Να αντικατασταθούν τα αυτόματα φίλτρα email με χειροκίνητο έλεγχο όλων των εισερχομένων μηνυμάτων, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"A","exp":"Οι προσομοιώσεις phishing μετρούν την ευπάθεια του οργανισμού, εκπαιδεύουν το προσωπικό σε ασφαλείς συμπεριφορές και ενισχύουν την κουλτούρα άμεσης αναφοράς ύποπτων μηνυμάτων."},{"q":"Πώς χρησιμοποιούν οι επιτιθέμενοι deepfake ήχο και βίντεο τεχνητής νοημοσύνης σε σύγχρονες επιθέσεις κοινωνικής μηχανικής;","opts":[{"k":"A","v":"Σπάζοντας συμμετρικά κλειδιά κρυπτογράφησης AES-256 με επιταχυνόμενα κβαντικά νευρωνικά δίκτυα, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Κλωνοποιώντας φωνές στελεχών σε πραγματικό χρόνο για έγκριση παράνομων εμβασμάτων ή απόσπαση κωδικών."},{"k":"C","v":"Αλλοιώνοντας πίνακες μνήμης του χρονοπρογραμματιστή του πυρήνα για παράκαμψη κωδικών πρόσβασης, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Εισάγοντας κακόβουλο κώδικα SQL σε κεφαλίδες cookies του περιηγητή κατά τη χειραψία επιπέδου μεταφοράς, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Δημιουργώντας μη εξουσιοδοτημένα peer-to-peer τούνελ σε υποθαλάσσια καλώδια διεθνών επικοινωνιών, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"B","exp":"Τα deepfakes επιτρέπουν την αληθοφανή κλωνοποίηση φωνής και εικόνας στελεχών σε τηλεφωνικές ή βιντεοκλήσεις για απάτες. Αντιμετωπίζονται με δευτερεύουσα επαλήθευση μέσω άλλου καναλιού (out-of-band)."},{"q":"Τι απαιτεί συγκεκριμένα από τους εργαζόμενους μια εταιρική πολιτική \'Καθαρού Γραφείου και Καθαρής Οθόνης\' (Clean Desk/Screen);","opts":[{"k":"A","v":"Καθημερινή απολύμανση των επίπλων του γραφείου με πιστοποιημένα αντιβακτηριδιακά καθαριστικά, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Αντικατάσταση όλων των οθονών υπολογιστών με μονόχρωμα πάνελ υγρών κρυστάλλων χαμηλής ισχύος, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Κλείδωμα οθονών όταν απομακρύνονται και ασφαλή φύλαξη ευαίσθητων εγγράφων και ψηφιακών μέσων."},{"k":"D","v":"Μόνιμη απενεργοποίηση γραφικών περιβαλλόντων διεπαφής (GUI) στους σταθμούς εργασίας των υπαλλήλων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Διαγραφή όλων των τοπικών προσωρινών αρχείων του περιηγητή στο τέλος κάθε βάρδιας εργασίας, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"C","exp":"Η πολιτική καθαρού γραφείου και οθόνης αποτρέπει την οπτική υποκλοπή ευαίσθητων πληροφοριών, επιβάλλοντας το κλείδωμα των υπολογιστών και την ασφαλή φύλαξη εγγράφων σε συρτάρια."},{"q":"Ποια είναι η βασική διαφορά μεταξύ \'Spear Phishing\' και \'Whaling\' στην στοχευμένη κοινωνική μηχανική;","opts":[{"k":"A","v":"Το spear phishing χρησιμοποιεί μηνύματα SMS, ενώ το whaling λειτουργεί αποκλειστικά μέσω αναλογικού τηλεφώνου, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Το spear phishing εκτελείται μόνο από κράτη, ενώ το whaling εκτελείται μόνο από αυτοματοποιημένα botnets, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Το spear phishing στοχεύει κινητά τηλέφωνα, ενώ το whaling στοχεύει φυσικούς εξυπηρετητές κέντρων δεδομένων, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Το spear phishing στοχεύει συγκεκριμένα άτομα, ενώ το whaling στοχεύει αποκλειστικά ανώτατα στελέχη (C-suite)."},{"k":"E","v":"Το spear phishing περιλαμβάνει φυσικές διαρρήξεις, ενώ το whaling περιλαμβάνει αλλοίωση μνήμης λογισμικού, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"D","exp":"Το spear phishing είναι εξατομικευμένο για συγκεκριμένα πρόσωπα. Το whaling είναι ειδική μορφή του που στοχεύει αποκλειστικά ανώτατα διευθυντικά στελέχη (CEO, CFO) με σκοπό μεγάλα οικονομικά κέρδη."},{"q":"Γιατί είναι απαραίτητη μια \'Κουλτούρα Αναφοράς Χωρίς Ενοχοποίηση\' (Blameless Culture) για την αποτελεσματική κυβερνοάμυνα;","opts":[{"k":"A","v":"Εξαλείφει τη νομική ευθύνη του οργανισμού κατά τις υποχρεωτικές κοινοποιήσεις παραβιάσεων στις αρχές, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Καταργεί την ανάγκη χρήσης λογισμικού ανίχνευσης και απόκρισης τερματικών (EDR) στους υπολογιστές, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Επιτρέπει στους διαχειριστές να παρακάμπτουν τις εγκρίσεις αλλαγών κατά τη συντήρηση συστημάτων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Επιλύει αυτόματα προβλήματα συμφόρησης δικτύου επιπέδου μεταφοράς σε κατανεμημένες συνδέσεις, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Ενθαρρύνει την άμεση αναφορά λαθών ή ύποπτων συμβάντων χωρίς φόβο τιμωρίας, μειώνοντας τον χρόνο παραμονής του εισβολέα."}],"ans":"E","exp":"Όταν οι υπάλληλοι φοβούνται τιμωρία, αποκρύπτουν λάθη. Μια κουλτούρα χωρίς ενοχοποίηση διασφαλίζει ότι τα περιστατικά αναφέρονται αμέσως, επιτρέποντας την έγκαιρη αντιμετώπισή τους."}]},{"part":"Μέρος 4 · Λειτουργίες, Διερεύνηση και Διακυβέρνηση","time":"Κεφάλαιο 11 · ⏱️ 10–12 ώρες μελέτης","title":"11. Ανίχνευση, Προληπτική Αναζήτηση Απειλών, Απόκριση σε Περιστατικά και Εργαστηριακές Λειτουργίες","subtitle":"IDS/IPS · Υπογραφές και ανίχνευση ανωμαλιών · Τεχνικές αποφυγής · Προληπτική αναζήτηση απειλών · YARA και Sigma · Απομονωμένα εργαστήρια · Απόκριση σε περιστατικά κατά NIST · Λειτουργίες SOC","outcomes":["Να συγκρίνετε τα δικτυακά και τα τοπικά IDS/IPS, καθώς και την επιθεώρηση βάσει υπογραφών και βάσει ανωμαλιών.","Να εξηγείτε συνήθεις τεχνικές αποφυγής των IDS και τον ρόλο της κανονικοποίησης της κίνησης.","Να σχεδιάζετε μια προληπτική αναζήτηση απειλών βασισμένη σε υποθέσεις, αξιοποιώντας τηλεμετρία τερματικών και μνήμης.","Να συντάσσετε βασικούς κανόνες YARA και Sigma και να διαχειρίζεστε τις ανιχνεύσεις ως κώδικα.","Να εφαρμόζετε τον κύκλο απόκρισης σε περιστατικά του NIST και να περιγράφετε τις βαθμίδες ενός SOC και τη ροή ενός SIEM."],"intro":["Η πρόληψη αργά ή γρήγορα αποτυγχάνει. Το Κεφάλαιο 1 εισήγαγε την άμυνα σε βάθος ακριβώς επειδή κάθε προληπτικό μέτρο έχει κενά, και τα προηγούμενα κεφάλαια έδειξαν πώς τα εντοπίζουν οι ικανοί αντίπαλοι. Το παρόν κεφάλαιο αφορά, επομένως, όσα ακολουθούν: πώς ένας οργανισμός _ανιχνεύει_ κακόβουλη δραστηριότητα, _αναζητά_ προληπτικά απειλές που διέφυγαν από τους συναγερμούς του και _αποκρίνεται_ με πειθαρχημένο τρόπο που περιορίζει τη ζημιά και διαφυλάσσει τα αποδεικτικά στοιχεία.","Ξεκινάμε με τα συστήματα ανίχνευσης και πρόληψης εισβολών, τα δύο κύρια παραδείγματα επιθεώρησης και τις τεχνικές με τις οποίες οι επιτιθέμενοι τα αποφεύγουν. Στη συνέχεια στρεφόμαστε στην προληπτική αναζήτηση απειλών, στις γλώσσες κανόνων YARA και Sigma και στον σχεδιασμό απομονωμένων εργαστηρίων, όπου το κακόβουλο λογισμικό μπορεί να μελετηθεί με ασφάλεια. Το κεφάλαιο ολοκληρώνεται με τον κύκλο απόκρισης σε περιστατικά όπως τον ορίζει το NIST και με την οργάνωση ενός Κέντρου Επιχειρήσεων Ασφάλειας (SOC)."],"sections":[{"id":"11.1","title":"Αρχιτεκτονικές IDS και IPS και παραδείγματα επιθεώρησης","blocks":[{"type":"p","text":"Ένα **σύστημα ανίχνευσης εισβολών** (Intrusion Detection System, IDS) παρακολουθεί τη δραστηριότητα και εκδίδει ειδοποιήσεις· ένα **σύστημα πρόληψης εισβολών** (Intrusion Prevention System, IPS) βρίσκεται στη διαδρομή της κίνησης και μπορεί να αποκλείει αυτόματα την κακόβουλη δραστηριότητα. Ένα **δικτυακό IDS** (NIDS), όπως τα Suricata, Snort ή Zeek, αναλύει αντίγραφα της δικτυακής κίνησης από θύρα κατοπτρισμού ενός μεταγωγέα ή από δικτυακό διακλαδωτή (tap) και βλέπει την επικοινωνία μεταξύ πολλών υπολογιστών. Ένα **τοπικό IDS** (HIDS), όπως τα Wazuh ή OSSEC, εκτελείται σε μεμονωμένα συστήματα και παρατηρεί αλλαγές αρχείων, αρχεία καταγραφής και διεργασίες —συμπεριλαμβανομένης δραστηριότητας μέσα σε κρυπτογραφημένες συνδέσεις που ένας δικτυακός αισθητήρας δεν μπορεί να διαβάσει. Οι δύο οπτικές είναι συμπληρωματικές."},{"type":"p","text":"Η λογική της ανίχνευσης ακολουθεί δύο παραδείγματα. Η ανίχνευση **βάσει υπογραφών** αναζητά γνωστά μοτίβα, όπως μια συγκεκριμένη συμβολοσειρά εκμετάλλευσης· είναι ακριβής και εύκολα εξηγήσιμη, αλλά τυφλή απέναντι σε νέες επιθέσεις. Η ανίχνευση **βάσει ανωμαλιών ή συμπεριφοράς** μοντελοποιεί το φυσιολογικό και επισημαίνει αποκλίσεις, όπως έναν σταθμό εργασίας που ξαφνικά μεταφέρει gigabytes τη νύχτα· μπορεί να εντοπίσει άγνωστες επιθέσεις, αλλά παράγει περισσότερα ψευδώς θετικά αποτελέσματα και απαιτεί προσεκτικά καθορισμένη συμπεριφορά αναφοράς. Τα ώριμα προγράμματα συνδυάζουν και τα δύο και τα βελτιστοποιούν συνεχώς, επειδή μια ειδοποίηση που οι αναλυτές έχουν μάθει να αγνοούν είναι χειρότερη από την απουσία ειδοποίησης."}]},{"id":"11.2","title":"Τεχνικές αποφυγής και αυτοματοποιημένη αντιμετώπιση","blocks":[{"type":"p","text":"Οι επιτιθέμενοι προσπαθούν να κάνουν το IDS να «βλέπει» κάτι διαφορετικό από αυτό που λαμβάνει πράγματι ο στόχος. Ο **κατακερματισμός** διασπά ένα κακόβουλο φορτίο σε πολλά μικρά πακέτα ή σε επικαλυπτόμενα τμήματα· η **κωδικοποίηση** και η συσκότιση μεταμφιέζουν γνωστές συμβολοσειρές· η χειραγώγηση του χρονισμού ή των τιμών _TTL_ μπορεί να κάνει τον αισθητήρα και τον προορισμό να ανασυνθέτουν μια ροή με διαφορετικό τρόπο· και, όλο και συχνότερα, οι επιθέσεις απλώς κρύβονται μέσα σε **κρυπτογραφημένη** κίνηση TLS. Τα αντίμετρα περιλαμβάνουν την **κανονικοποίηση της κίνησης**, η οποία ανασυνθέτει τις ροές με τον ίδιο τρόπο όπως ο τελικός υπολογιστής, την επιθεώρηση TLS σε ελεγχόμενα σημεία όπου αυτό είναι νόμιμο και αναλογικό, καθώς και τη μεγαλύτερη αξιοποίηση της τοπικής τηλεμετρίας και των μεταδεδομένων, όπως ο χρονισμός των συνδέσεων."},{"type":"p","text":"Όταν ένα IPS ή ένα αυτοματοποιημένο σχέδιο ενεργειών αποκρίνεται, μπορεί να **απορρίψει** τα επίμαχα πακέτα, να **επαναφέρει** τη σύνδεση TCP, να **αποκλείσει** τη διεύθυνση προέλευσης για ένα διάστημα, να **αναδιαμορφώσει** ένα τείχος προστασίας ή να **απομονώσει** ένα τερματικό από το δίκτυο. Ο αυτοματισμός μειώνει δραματικά τον χρόνο απόκρισης, όμως ένας λανθασμένα ρυθμισμένος κανόνας μπορεί επίσης να διακόψει νόμιμη επιχειρησιακή δραστηριότητα. Γι\' αυτό ο αυτόματος αποκλεισμός επιφυλάσσεται για ανιχνεύσεις υψηλής βεβαιότητας, ενώ οι ειδοποιήσεις χαμηλότερης βεβαιότητας διοχετεύονται στους αναλυτές."}]},{"id":"11.3","title":"Προληπτική αναζήτηση απειλών και τηλεμετρία τερματικών","blocks":[{"type":"p","text":"Η **προληπτική αναζήτηση απειλών** (threat hunting) ξεκινά από την παραδοχή ότι ένας αντίπαλος μπορεί να βρίσκεται ήδη στο περιβάλλον χωρίς να έχει ενεργοποιήσει κανέναν συναγερμό. Η αναζήτηση καθοδηγείται από μια **υπόθεση**, που συνήθως προέρχεται από πληροφορίες απειλών ή από το ATT&CK —για παράδειγμα «ένας επιτιθέμενος χρησιμοποιεί προγραμματισμένες εργασίες για μόνιμη παρουσία στους διακομιστές μας». Ο αναλυτής υποβάλλει στη συνέχεια ερωτήματα στη διαθέσιμη τηλεμετρία, διερευνά τις ανωμαλίες και καταλήγει σε συμπέρασμα. Όποιο κι αν είναι το αποτέλεσμα, μια καλή αναζήτηση ολοκληρώνεται με τη μετατροπή της λογικής της σε αυτοματοποιημένη ανίχνευση, ώστε η ίδια συμπεριφορά να εντοπίζεται στο μέλλον."},{"type":"p","text":"Η αναζήτηση απειλών εξαρτάται από πλούσια **τηλεμετρία τερματικών**. Εργαλεία όπως το Sysmon της Microsoft καταγράφουν τη δημιουργία διεργασιών με την πλήρη γραμμή εντολών, τις δικτυακές συνδέσεις, τη φόρτωση οδηγών και τις αλλαγές στο μητρώο· οι πλατφόρμες EDR συλλέγουν παρόμοια δεδομένα σε μεγάλη κλίμακα· και στο Linux, το `auditd` και οι αισθητήρες που βασίζονται στο eBPF παρέχουν ισοδύναμη ορατότητα. Η **ανάλυση μνήμης** με πλαίσια όπως το Volatility μπορεί να αποκαλύψει εγχυμένο κώδικα, κρυφές διεργασίες και αποκρυπτογραφημένες ρυθμίσεις κακόβουλου λογισμικού που δεν γράφτηκαν ποτέ στον δίσκο —ικανότητα απαραίτητη απέναντι στις τεχνικές χωρίς αρχεία που περιγράφηκαν στο Κεφάλαιο 4."}]},{"id":"11.4","title":"YARA, Sigma και ανιχνεύσεις ως κώδικας","blocks":[{"type":"p","text":"Η **YARA** είναι μια γλώσσα αντιστοίχισης προτύπων για την ταξινόμηση αρχείων και περιοχών μνήμης. Ένας κανόνας έχει τρία μέρη: _meta_ (περιγραφικές πληροφορίες), _strings_ (πρότυπα κειμένου, δεκαεξαδικά ή κανονικές εκφράσεις) και μια _condition_ που τα συνδυάζει, για παράδειγμα `uint16(0) == 0x5A4D and 2 of ($s*)`, που σημαίνει «εκτελέσιμο Windows που περιέχει τουλάχιστον δύο από τις δηλωμένες συμβολοσειρές». Οι καλοί κανόνες στοχεύουν χαρακτηριστικά που ο δημιουργός του κακόβουλου λογισμικού δεν μπορεί να αλλάξει εύκολα —μοναδικές ακολουθίες κώδικα, δομές ρυθμίσεων— και όχι μία μόνο συμβολοσειρά, και δοκιμάζονται σε συλλογή νόμιμων αρχείων για την αποφυγή ψευδώς θετικών αποτελεσμάτων."},{"type":"p","text":"Ενώ η YARA επιθεωρεί αρχεία, η **Sigma** περιγράφει ύποπτα μοτίβα σε _συμβάντα αρχείων καταγραφής_, σε μορφή ανεξάρτητη από προμηθευτή, η οποία μπορεί να μετατραπεί σε ερωτήματα για διαφορετικές πλατφόρμες SIEM. Η προσέγγιση των **ανιχνεύσεων ως κώδικα** (detection-as-code) εφαρμόζει και στις δύο την πειθαρχία της μηχανικής λογισμικού: οι κανόνες αποθηκεύονται σε σύστημα ελέγχου εκδόσεων, ελέγχονται από ομοτίμους, δοκιμάζονται αυτόματα σε δείγματα δεδομένων, αντιστοιχίζονται σε τεχνικές του ATT&CK και εγκαθίστανται μέσω μιας ροής ανάπτυξης. Οι πλατφόρμες **SOAR** (ενορχήστρωση, αυτοματοποίηση και απόκριση ασφάλειας) εκτελούν στη συνέχεια σχέδια ενεργειών όταν ενεργοποιείται μια ανίχνευση —εμπλουτίζοντας την ειδοποίηση, ανοίγοντας ένα δελτίο και, αν η βεβαιότητα είναι υψηλή, απομονώνοντας τον υπολογιστή."}]},{"id":"11.5","title":"Σχεδιασμός απομονωμένων εργαστηρίων ανάλυσης","blocks":[{"type":"p","text":"Η μηχανική ανιχνεύσεων και η ανάλυση κακόβουλου λογισμικού απαιτούν έναν χώρο όπου ο εχθρικός κώδικας μπορεί να εκτελεστεί χωρίς να θέτει σε κίνδυνο πραγματικά συστήματα. Ένα ασφαλές εργαστήριο βασίζεται στην **εικονικοποίηση**: τα μηχανήματα ανάλυσης λειτουργούν ως εικονικές μηχανές σε αποκλειστικό φυσικό υπολογιστή, με **στιγμιότυπα** (snapshots) που επιτρέπουν την επαναφορά τους σε καθαρή κατάσταση μετά από κάθε πείραμα. Η δικτύωση ορίζεται ως _host-only_ ή ως εσωτερικό δίκτυο χωρίς διαδρομή προς το διαδίκτυο ή το περιβάλλον παραγωγής· όπου πρέπει να παρατηρηθεί η δικτυακή συμπεριφορά, προσομοιωμένες υπηρεσίες όπως τα INetSim ή FakeNet απαντούν στα αιτήματα του κακόβουλου λογισμικού."},{"type":"p","text":"Η απομόνωση πρέπει να είναι και διαδικαστική. Οι κοινόχρηστοι φάκελοι και ο συγχρονισμός του προχείρου μεταξύ φυσικού και εικονικού μηχανήματος πρέπει να απενεργοποιούνται, τα δείγματα να αποθηκεύονται σε αρχεία συμπίεσης με κωδικό και με σαφή σήμανση, ενώ οι αναλυτές πρέπει να θυμούνται ότι ορισμένα κακόβουλα προγράμματα ανιχνεύουν τις εικονικές μηχανές και αλλάζουν συμπεριφορά. Οι προφυλάξεις αυτές εφαρμόζουν την ίδια λογική περιορισμού που διέπει την απόκριση σε περιστατικά."}]},{"id":"11.6","title":"Ο κύκλος απόκρισης σε περιστατικά (NIST SP 800-61)","blocks":[{"type":"p","text":"Η Ειδική Έκδοση 800-61 του NIST περιγράφει την απόκριση σε περιστατικά ως κύκλο τεσσάρων φάσεων. Πρώτη έρχεται η **προετοιμασία**, η οποία καθορίζει όλα τα υπόλοιπα: εγκεκριμένο σχέδιο, καθορισμένοι ρόλοι, κατάλογοι επαφών, πρότυπα επικοινωνίας, εργαλεία, καταγραφή και τακτικές ασκήσεις. Η **ανίχνευση και ανάλυση** επιβεβαιώνει ότι σημειώθηκε περιστατικό, προσδιορίζει το εύρος και τη σοβαρότητά του και τεκμηριώνει κάθε βήμα. Ο **περιορισμός, η εξάλειψη και η ανάκαμψη** περιορίζουν τη ζημιά —βραχυπρόθεσμα με την απομόνωση συστημάτων και την απενεργοποίηση παραβιασμένων λογαριασμών, μακροπρόθεσμα με την ανακατασκευή τους— αφαιρούν τα ερείσματα του επιτιθέμενου και αποκαθιστούν την κανονική λειτουργία από αξιόπιστες πηγές. Η **δραστηριότητα μετά το περιστατικό** περιλαμβάνει μια ανασκόπηση διδαγμάτων χωρίς απόδοση ευθυνών μέσα σε λίγες εβδομάδες και επιστρέφει τις βελτιώσεις στη φάση της προετοιμασίας."},{"type":"p","text":"Δύο εντάσεις διατρέχουν κάθε περιστατικό. Η πρώτη είναι μεταξύ **ταχύτητας και αποδεικτικών στοιχείων**: η απενεργοποίηση ενός μηχανήματος σταματά την επίθεση, αλλά καταστρέφει τα περιεχόμενα της μνήμης· γι\' αυτό τα αποδεικτικά στοιχεία πρέπει, όπου είναι δυνατόν, να συλλέγονται πριν από τις ενέργειες που διαταράσσουν το σύστημα (Κεφάλαιο 12). Η δεύτερη είναι μεταξύ **περιορισμού και συλλογής πληροφοριών**: η πρόωρη απομάκρυνση του επιτιθέμενου, πριν γίνει γνωστό ολόκληρο το αποτύπωμά του, μπορεί απλώς να τον προειδοποιήσει και να τον ωθήσει να χρησιμοποιήσει άλλη κερκόπορτα. Η αναθεωρημένη καθοδήγηση (Rev. 3, 2025) ευθυγραμμίζει αυτές τις δραστηριότητες με τις λειτουργίες του NIST Cybersecurity Framework 2.0."},{"type":"callout","kind":"note","title":"ℹ️ Νομικές και κανονιστικές προθεσμίες","text":"Πολλά περιστατικά ενεργοποιούν υποχρεωτικές γνωστοποιήσεις —για παράδειγμα, εντός 72 ωρών στην εποπτική αρχή βάσει του ΓΚΠΔ για παραβιάσεις προσωπικών δεδομένων και έγκαιρη προειδοποίηση εντός 24 ωρών βάσει της NIS2 για σημαντικά περιστατικά (Κεφάλαιο 13). Το σχέδιο απόκρισης πρέπει να προσδιορίζει ποιος αποφασίζει και ποιος προβαίνει στη γνωστοποίηση."}]},{"id":"11.7","title":"Λειτουργίες SOC: βαθμίδες, η ροή του SIEM και σχεδιασμός σεναρίων χρήσης","blocks":[{"type":"p","text":"Ένα **Κέντρο Επιχειρήσεων Ασφάλειας** (Security Operations Centre, SOC) είναι η ομάδα και η υποδομή που παρακολουθούν συνεχώς έναν οργανισμό. Η εργασία κατανέμεται παραδοσιακά σε βαθμίδες: οι αναλυτές της **Βαθμίδας 1** διαλογούν τις εισερχόμενες ειδοποιήσεις, η **Βαθμίδα 2** διερευνά σε βάθος τα επιβεβαιωμένα περιστατικά και οι ειδικοί της **Βαθμίδας 3** αναζητούν απειλές, αναλύουν κακόβουλο λογισμικό και σχεδιάζουν ανιχνεύσεις. Το κεντρικό εργαλείο είναι η πλατφόρμα **SIEM** (διαχείριση πληροφοριών και συμβάντων ασφάλειας), της οποίας η ροή _συλλέγει_ αρχεία καταγραφής από πολλές πηγές, τα _κανονικοποιεί_ σε ένα κοινό σχήμα, τα _εμπλουτίζει_ με πλαίσιο, όπως οι υπεύθυνοι των στοιχείων και οι πληροφορίες απειλών, _συσχετίζει_ συμβάντα σε ειδοποιήσεις και τα _αποθηκεύει_ για διερεύνηση και κανονιστική συμμόρφωση."},{"type":"p","text":"Ένα SIEM είναι τόσο καλό όσο τα **σενάρια χρήσης** του —οι συγκεκριμένες απειλές που έχει ρυθμιστεί να ανιχνεύει. Κάθε σενάριο χρήσης πρέπει να δηλώνει την απειλή που αντιμετωπίζει (ιδανικά ως τεχνική του ATT&CK), τις πηγές δεδομένων που απαιτεί, τη λογική ανίχνευσης, το αναμενόμενο ποσοστό ψευδώς θετικών και τη διαδικασία απόκρισης. Η απόδοση ενός SOC μετράται συνήθως μέσω του **μέσου χρόνου ανίχνευσης (MTTD)** και του **μέσου χρόνου απόκρισης (MTTR)**, σε συνδυασμό με το ποσοστό των ειδοποιήσεων που αποδεικνύονται αξιοποιήσιμες —βασικό δείκτη του φόρτου εργασίας και της εξουθένωσης των αναλυτών."}]}],"terms":[{"name":"NIDS / HIDS","def":"Δικτυακά και τοπικά συστήματα ανίχνευσης εισβολών."},{"name":"Κανονικοποίηση κίνησης","def":"Ανασύνθεση της κίνησης όπως θα την ανασυνέθετε ο προορισμός, για την ακύρωση τεχνικών αποφυγής."},{"name":"Προληπτική αναζήτηση απειλών","def":"Προληπτική αναζήτηση αντιπάλων που διέφυγαν της ανίχνευσης, καθοδηγούμενη από υποθέσεις."},{"name":"YARA / Sigma","def":"Γλώσσες κανόνων για την αντιστοίχιση προτύπων σε αρχεία (YARA) και σε συμβάντα καταγραφής (Sigma)."},{"name":"Περιορισμός","def":"Ενέργειες απόκρισης που περιορίζουν τη διάδοση και την επίπτωση μιας επίθεσης."},{"name":"SIEM","def":"Πλατφόρμα που συλλέγει, κανονικοποιεί, συσχετίζει και αποθηκεύει συμβάντα ασφάλειας."}],"summary":["Οι δικτυακοί και οι τοπικοί αισθητήρες παρέχουν συμπληρωματική ορατότητα· η ανίχνευση βάσει υπογραφών και βάσει ανωμαλιών έχει η καθεμιά πλεονεκτήματα και αδυναμίες.","Οι επιτιθέμενοι αποφεύγουν την επιθεώρηση μέσω κατακερματισμού, κωδικοποίησης και κρυπτογράφησης· η κανονικοποίηση και η τοπική τηλεμετρία τούς αντιμετωπίζουν.","Η προληπτική αναζήτηση απειλών καθοδηγείται από υποθέσεις και πρέπει να καταλήγει στη δημιουργία νέων αυτοματοποιημένων ανιχνεύσεων.","Οι κανόνες YARA και Sigma, όταν διαχειρίζονται ως κώδικας και συνδέονται με SOAR, μετατρέπουν τη γνώση σε επαναλήψιμη ανίχνευση και απόκριση.","Η απόκριση σε περιστατικά ακολουθεί τον κύκλο του NIST, εξισορροπώντας την ταχύτητα με τη διαφύλαξη των αποδεικτικών στοιχείων, και το SOC την υλοποιεί μέσω βαθμίδων, ενός SIEM και μετρήσιμων σεναρίων χρήσης."],"review":["Γιατί ένας τοπικός αισθητήρας μπορεί να ανιχνεύσει μια επίθεση μέσα σε κίνηση HTTPS που διαφεύγει από ένα δικτυακό IDS;","Διατυπώστε μια υπόθεση αναζήτησης για την υποκλοπή διαπιστευτηρίων από τη διεργασία LSASS και αναφέρετε την τηλεμετρία που θα χρειαζόσασταν.","Γιατί ένας κανόνας YARA δεν πρέπει να βασίζεται σε μία μόνο συμβολοσειρά, όπως ένα όνομα τομέα C2;","Κατά τη διάρκεια ενός περιστατικού, ένας προϊστάμενος θέλει να απενεργοποιήσει αμέσως τον επηρεαζόμενο διακομιστή. Συζητήστε τα αντισταθμιστικά οφέλη και κόστη."],"cli":{"title":"Προσομοιωτής Τηλεμετρίας SIEM SOC & Περιορισμού Περιστατικών","desc":"Αναζητήστε συμβάντα ασφάλειας των Windows για απόπειρες υποκλοπής διαπιστευτηρίων, εκτελέστε κανόνες Sigma σε Sysmon logs, αναζητήστε κωδικοποιημένο PowerShell και απομονώστε το παραβιασμένο τερματικό.","meta":["⏱️ ~30 min","🐚 analyst@soc-tier2:~$"],"tasks":[{"pill":"Task 1","name":"Φιλτράρισμα Αρχείων Συμβάντων για Αποτυχημένες Συνδέσεις","instr":"Αναζητήστε στο `/var/log/siem/auth.log` αποτυχημένες συνδέσεις EventID 4625 με το `grep`.","hint":"Εκτελέστε: grep -E \\"EventID: 4625\\" /var/log/siem/auth.log","cmd":"$ grep -E \\"EventID: 4625\\" /var/log/siem/auth.log","ok":"Τα logs φιλτραρίστηκαν: Εντοπίστηκαν μαζικές απόπειρες brute-force στον χρήστη admin ."},{"pill":"Task 2","name":"Εκτέλεση Κανόνα Sigma για Εντοπισμό Credential Dumping","instr":"Εκτελέστε τον κανόνα Sigma `rules/win_lsass_dump.yml` στο αρχείο `/var/log/sysmon.log` με το `sigma-cli`.","hint":"Εκτελέστε: sigma-cli check -r rules/win_lsass_dump.yml /var/log/sysmon.log","cmd":"$ sigma-cli check -r rules/win_lsass_dump.yml /var/log/sysmon.log","ok":"ΕΠΙΤΥΧΗΣ ΑΝΙΧΝΕΥΣΗ SIGMA: Ειδοποίηση υψηλής κρισιμότητας! Πρόσβαση στη μνήμη του LSASS από το procdump.exe ."},{"pill":"Task 3","name":"Αναζήτηση στο SIEM για Εκτέλεση Συσκοτισμένου PowerShell","instr":"Αναζητήστε στο ευρετήριο SIEM εκτελέσεις PowerShell με κωδικοποίηση Base64 (`-enc`) με το `elastic-query`.","hint":"Εκτελέστε: elastic-query --index win-events --query \\"process.name:powershell.exe AND process.args:-enc\\"","cmd":"$ elastic-query --index win-events --query \\"process.name:powershell.exe AND process.args:-enc\\"","ok":"Το ερώτημα SIEM εντόπισε συμβάν: Το τερματικό WS-FINANCE-04 εκτέλεσε κωδικοποιημένο IEX download cradle."},{"pill":"Task 4","name":"Εκτέλεση Ενέργειας Απομόνωσης Τερματικού (Host Containment)","instr":"Απομονώστε το παραβιασμένο τερματικό `WS-FINANCE-04` από το δίκτυο με την εντολή `isolate-host`.","hint":"Εκτελέστε: isolate-host WS-FINANCE-04","cmd":"$ isolate-host WS-FINANCE-04","ok":"ΤΟ ΤΕΡΜΑΤΙΚΟ ΑΠΟΜΟΝΩΘΗΚΕ: Η δικτυακή κίνηση στο WS-FINANCE-04 διακόπηκε επιτυχώς."}]},"lab":{"title":"Πρακτική Απόκριση Περιστατικών SOC: Διαλογή Εισβολής Ransomware, Ανάλυση Αιτίου & Περιορισμός","desc":"Σε αυτό το εργαστήριο 2 ωρών, οι φοιτητές αναλαμβάνουν τον ρόλο Επικεφαλής Απόκρισης σε Περιστατικά (Incident Response Lead Tier-2/Tier-3) σε ένα εταιρικό SOC. Αντιμετωπίζοντας μια ενεργή εξάπλωση ransomware LockBit στο εσωτερικό δίκτυο, θα εφαρμόσετε τον κύκλο ζωής NIST SP 800-61r2: συσχέτιση τηλεμετρίας στο SIEM (Sysmon/Event Logs), προληπτική αναζήτηση απειλών με κανόνες Sigma, απομόνωση του πρώτου μολυσμένου συστήματος (patient zero) μέσω EDR, εξάλειψη μηχανισμών επιμονής και ανακατασκευή χρονολογίου για την τελική έκθεση.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["SOC Workstation with Python 3.11, jq, Elasticsearch/OpenSearch client tools","Security Information and Event Management (SIEM) log archive (`/var/log/soc_incident/`)","Sigma CLI converter & compiler (`sigma-cli`, `pySigma`)","Timeline generator toolset (`log2timeline`, `plasm-cli`, `timesketch`)"],"phases":[{"badge":"Phase 1","name":"Διαλογή Ειδοποιήσεων, Εκτίμηση Σοβαρότητας & Εισαγωγή Τηλεμετρίας","dur":"⏱️ 25 λεπτά","objs":["Εισαγωγή τηλεμετρίας SIEM και εντοπισμός αρχικών ειδοποιήσεων (αποτυχημένες συνδέσεις, πρόσβαση στο LSASS).","Κατηγοριοποίηση σοβαρότητας ως SEV-1 (Κρίσιμη Απειλή).","Εντοπισμός του αρχικού συστήματος μόλυνσης (`WS-FINANCE-04`) και του παραβιασμένου λογαριασμού (`CORP\\\\jdoe`)."],"steps":[{"type":"p","text":"1. Έλεγχος των ειδοποιήσεων του SOC:\\n```bash\\ncat /var/log/soc_incident/alerts.json | jq \'.[] | select(.severity==\\"critical\\")\'\\n```"},{"type":"p","text":"2. Αναζήτηση ιστορικού συνδέσεων του χρήστη `CORP\\\\jdoe`:\\n```bash\\ngrep -E \'jdoe|4624|4625\' /var/log/soc_incident/security_events.log | head -n 20\\n```"},{"type":"p","text":"3. Δημιουργία επίσημου δελτίου συμβάντος και ενεργοποίηση της ομάδας διαχείρισης κρίσεων."}]},{"badge":"Phase 2","name":"Προληπτική Αναζήτηση Απειλών & Ιχνηλάτηση Πλευρικής Μετακίνησης","dur"
