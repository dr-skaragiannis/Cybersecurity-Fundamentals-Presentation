      /κινδυν|ανθεκτικ|συμμορφωσ|διακυβερν|bia|nis2/i
    ];

    function makeQuiz(rows, chapterIndex) {
      return rows.map(([question, correct, wrong1, wrong2, wrong3, explanation], index) => {
        const slot = (chapterIndex + index) % 4;
        const values = [wrong1, wrong2, wrong3];
        values.splice(slot, 0, correct);
        return {
          q: question,
          opts: values.map((v, position) => ({ k: 'ABCD'[position], v })),
          ans: 'ABCD'[slot],
          exp: explanation
        };
      });
    }

    function auditQuestions(chapters) {
      if (!Array.isArray(chapters) || chapters.length !== 13 || reviews.length !== 13 || quizRows.length !== 13) {
        throw new Error('Δεν βρέθηκαν και τα 13 κεφάλαια.');
      }
      const used = new Set();
      return chapters.map((chapter, ci) => {
        if (!chapter.title.startsWith(`${ci + 1}.`) || !Array.isArray(chapter.sections) ||
            !Array.isArray(chapter.review) || !Array.isArray(chapter.quiz)) {
          throw new Error(`Μη αναμενόμενη δομή στο κεφάλαιο ${ci + 1}.`);
        }
        const syllabus = [chapter.title, chapter.subtitle, ...chapter.sections.map(section => section.title)]
          .join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        if (!subjectChecks[ci].test(syllabus)) {
          throw new Error(`Η θεματική «${topics[ci]}» δεν αντιστοιχεί στο κεφάλαιο ${ci + 1}.`);
        }
        if (reviews[ci].length !== 5 || quizRows[ci].length !== 6) {
          throw new Error(`Ελλιπείς ερωτήσεις στο κεφάλαιο ${ci + 1}.`);
        }
        for (const text of [...reviews[ci], ...quizRows[ci].map(row => row[0])]) {
          if (typeof text !== 'string' || text.trim().length < 18 || used.has(text)) {
            throw new Error(`Κενή ή διπλή ερώτηση στο κεφάλαιο ${ci + 1}.`);
          }
          used.add(text);
        }
        for (const row of quizRows[ci]) {
          if (row.length !== 6 || row.some(value => typeof value !== 'string' || !value.trim()) ||
              new Set(row.slice(1, 5)).size !== 4) {
            throw new Error(`Ανεπαρκείς επιλογές ή αιτιολόγηση στο κεφάλαιο ${ci + 1}.`);
          }
        }
        const quiz = makeQuiz(quizRows[ci], ci);
        if (quiz.some(item => item.opts.filter(option => option.k === item.ans).length !== 1)) {
          throw new Error(`Λανθασμένο κλειδί απαντήσεων στο κεφάλαιο ${ci + 1}.`);
        }
        return { review: reviews[ci], quiz };
      });
    }

    const commandStart = /^(?:\$\s*|#\s*)?(?:sudo\s+)?(?:ls|stat|chmod|chown|id|whoami|groups|umask|getfacl|setfacl|icacls|ps|ss|netstat|ip|ifconfig|ping|traceroute|tracepath|dig|nslookup|host|curl|wget|nmap|tcpdump|tshark|openssl|sha256sum|sha1sum|sha512sum|shasum|md5sum|hashdeep|gpg|base64|grep|rg|find|findstr|awk|sed|sort|uniq|wc|head|tail|cat|file|strings|xxd|hexdump|exiftool|binwalk|yara|clamscan|volatility|vol|journalctl|systemctl|auditctl|ausearch|ufw|iptables|iptables-save|nft|firewall-cmd|docker|kubectl|git|python3?|node|bash|sh|pwsh|powershell|sqlmap|nikto|testssl\.sh|ssh|ssh-keygen|whois|nc|netcat|ncat|socat|getent|last|lastb|hostname|hostnamectl|net|netsh|certutil|wevtutil|tasklist|schtasks|auditpol|sc\.exe|[A-Za-z]+-[\w-]+|SELECT|SHOW|DESCRIBE|echo|printf|date|uname|lsof|mount|df|du|tar|unzip|jq)(?:\s|$|[|;&])/i;

    function buildExampleCatalog(chapters) {
      const inline = (text, ci, label, context, target) => {
        for (const match of (text || '').matchAll(/`([^`\n]+)`/g)) {
          const normalized = match[1].trim().replace(/^\$\s*/, '');
          const repeated = target.some(item => (item.type === 'cli' || item.title === label) &&
            item.cmd.split(/\r?\n/).some(line => line.trim()
              .replace(/^[\w.-]+@[\w.-]+(?::[^\s$#]*)?[$#]\s*/, '')
              .replace(/^\$\s*/, '') === normalized));
          if (commandStart.test(match[1].trim()) && !repeated) {
            target.push({ id: `c${ci}-inline-${target.length}`, type: 'inline',
              title: label, cmd: match[1], context, meaning: context });
          }
        }
      };
      return chapters.map((chapter, ci) => {
        const examples = [];
        (chapter.cli?.tasks || []).forEach((task, ti) => {
          if (!task.cmd?.trim()) throw new Error(`Λείπει εντολή στο κεφάλαιο ${ci + 1}, task ${ti + 1}.`);
          examples.push({ id: `c${ci}-cli-${ti}`, type: 'cli',
            taskNumber: ti + 1, title: task.name || chapter.cli.title,
            cmd: task.cmd, context: task.instr || task.name, meaning: task.ok || task.instr, hint: task.hint || '' });
        });
        (chapter.lab?.phases || []).forEach((phase, pi) => {
          (phase.objs || []).forEach(objective => inline(objective, ci, phase.name, objective, examples));
          phase.steps.forEach((step, si) => {
            if (step.type === 'code' && step.text?.trim()) {
              const neighbor = [...phase.steps.slice(0, si)].reverse().find(item => item.type === 'p');
              examples.push({ id: `c${ci}-lab-${pi}-${si}`, type: 'lab',
                title: `${phase.name}, βήμα ${si + 1}`, cmd: step.text.trim(),
                context: neighbor?.text || phase.objs?.join(' ') || phase.name,
                meaning: phase.objs?.join(' ') || phase.name });
            } else if (step.type === 'p') {
              inline(step.text, ci, phase.name, step.text, examples);
            } else if (step.type === 'ul') {
              (step.items || []).forEach(item => inline(item, ci, phase.name, item, examples));
            } else if (step.type === 'table') {
              (step.rows || []).flat().forEach(cell => inline(cell, ci, phase.name, cell, examples));
            }
          });
        });
        (chapter.lab?.env || []).forEach(item => inline(item, ci, chapter.lab.title, item, examples));
        (chapter.sections || []).forEach(section => {
          section.blocks.forEach((block, bi) => {
            if (block.type === 'code' && block.text?.trim()) {
              examples.push({ id: `c${ci}-${section.id}-${bi}`, type: 'theory',
                title: `${section.id} ${section.title}`, cmd: block.text.trim(),
                context: section.title, meaning: section.title });
            } else if (block.type === 'p' || block.type === 'callout') {
              inline(block.text, ci, `${section.id} ${section.title}`, block.text, examples);
            } else if (block.type === 'table') {
              (block.rows || []).flat().forEach(cell =>
                inline(cell, ci, `${section.id} ${section.title}`, cell, examples));
            }
          });
        });
        (chapter.projects || []).forEach(project => {
          inline(project.desc, ci, project.title, project.desc, examples);
          [...(project.env || []), ...(project.deliverables || [])].forEach(item =>
            inline(item, ci, project.title, item, examples));
          project.milestones.forEach(milestone => {
            (milestone.spec || []).forEach(spec =>
              inline(spec, ci, `${project.title}, ${milestone.title}`, spec, examples));
          });
        });
        return {
          title: chapter.title,
          topic: topics[ci],
          examples: examples.map(example => ({
            ...example, chapterNumber: ci + 1, topic: topics[ci], lesson: lessonForExample(example)
          }))
        };
      });
    }

    function lessonForExample(example) {
      const text = (example.context || example.meaning || example.title)
        .replace(/\*\*|`|<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      const sentences = text.split(/(?<=[.!;?])\s+/);
      const relevant = sentences.find(sentence =>
        example.type === 'inline' && sentence.includes(example.cmd)) || sentences[0] || text;
      const goal = relevant.length > 185
        ? relevant.slice(0, 185).replace(/\s+\S*$/, '') + '…'
        : relevant.replace(/[.!;?]+$/, '');
      if (example.type === 'cli') return `${goal}${goal.endsWith('…') ? '' : '.'}`;
      const code = example.cmd.toLowerCase();
      const guidance = /sha\d*sum|shasum|md5sum|digest|Get-FileHash/i.test(code)
        ? 'Συγκρίνετε το αποτύπωμα με μια γνωστή τιμή και εντοπίστε τι σημαίνει η διαφορά.'
        : /openssl|gpg|base64/i.test(code)
          ? 'Σημειώστε ποιο κλειδί, πιστοποιητικό ή μετασχηματισμός χρησιμοποιείται και πώς ελέγχεται.'
          : /nmap|nikto|sqlmap|dig|nslookup|host|ping|traceroute|curl|wget|ss\b|tcpdump|tshark|ip\s/i.test(code)
            ? 'Παρατηρήστε τον στόχο, τα πεδία της απόκρισης και ποιο συμπέρασμα επιτρέπουν.'
            : /chmod|chown|setfacl|getfacl|icacls|ufw|iptables|nft|firewall-cmd/i.test(code)
              ? 'Εντοπίστε ποιο δικαίωμα ή κανόνας μεταβάλλεται και με ποιον έλεγχο επιβεβαιώνεται.'
              : /journalctl|ausearch|grep|rg\b|yara|volatility|vol\s|strings|exiftool/i.test(code)
                ? 'Συσχετίστε το εύρημα με το αρχείο, τον χρόνο και το υπόλοιπο πλαίσιο της διερεύνησης.'
                : 'Εξετάστε την έξοδο ή την κατάσταση ολοκλήρωσης σε σχέση με τον στόχο του παραδείγματος.';
      return `Μαθησιακός στόχος: ${goal}${goal.endsWith('…') ? '' : '.'} ${guidance}`;
    }

    function simulateCommand(raw, example, commandPattern = commandStart) {
      const commands = raw.split(/\r?\n/).flatMap(sourceLine => sourceLine.trim()
        .replace(/^[\w.-]+@[\w.-]+(?::[^\s$#]*)?[$#]\s*/, '$ ')
        .replace(/^PS\s+[^>]*>\s*/i, '$ ')
        .split(/\s+&&\s+/)
        .map(command => ({ command, sourceLine: sourceLine.trim() })))
        .filter(({ command }) => commandPattern.test(command) || /^(?:\$\s*)?\.\/[\w./-]+/.test(command) ||
          /^\$\s*[a-z][\w.+-]*(?:\s|$)/i.test(command));
      const steps = commands.length ? commands : [{ command: raw.trim(), sourceLine: raw.trim() }];
      // Keep transcripts consistent using the same five-byte "Hello" fixture and reserved lab addresses.
      const digest = {
        md5: '8b1a9953c4611296a827abf8c47804d7',

      const response = (output, explanation) => {
        const localized = typeof output === 'string' && /[\u0370-\u03ff]/u.test(output);
        return {
          output: localized ? null : output,

            ? `${explanation} Δεν κατασκευάζουμε έξοδο από διαφορετική εντολή για αυτό το παράδειγμα.`
            : explanation
        };
      };
      const noStdout = null;

      function describeInvocation(command, example) {
        const tool = command.match(/^[\w.+-]+/)?.[0] || 'απόσπασμα';

          [/^clamscan\b.*\s-r\b/i, 'Το -r ζητά αναδρομικό έλεγχο καταλόγου.']
        ];
        const notes = options.filter(([pattern]) => pattern.test(command)).map(([, meaning]) => meaning);
        const operand = command.match(/(?:^|\s)([~/.\w-]+\.(?:txt|log|json|pem|pcap|yaml|bin|py|sh|key|conf))(?=\s|$)/i)?.[1];
        if (operand) notes.push(`Το ${operand} είναι το αρχείο/όρισμα της εντολής.`);
        if (!notes.length && /^\w+(?:-\w+)?\s+\S+/.test(command)) {
          notes.push('Τα ορίσματα μετά το όνομα του εργαλείου επιλέγουν λειτουργία, στόχο ή αρχείο. Διαβάστε τα μαζί με το αντίστοιχο αποτέλεσμα.');
        }
        return `${purpose} ${notes.join(' ')}`.trim();
      }

      function silentOutcome(command, example, file, target) {
        const tool = command.match(/^[\w.+-]+/)?.[0] || 'script';
        const action = command.match(/^(?:systemctl|git|docker|kubectl|openssl|gpg)\s+(\S+)/i)?.[1]?.toLowerCase();
        const name = command.match(/(?:-out\s+|--output\s+|-o\s+)([^\s]+)/i)?.[1]?.replace(/["']/g, '') || file;
        const illustrative = (output, explanation, kind = 'artifact') => ({
          output: output.replace(/[\u0370-\u03ff]+/gu, 'sample'), explanation, kind
        });

        if (/\s+\|\s+/.test(command)) {
          const stages = command.split(/\s+\|\s+/);
          const source = stages[0].split(/\s+/)[0];
          const destination = stages.at(-1).split(/\s+/)[0];
          return illustrative(`Input stage: ${source}\nPipeline stages: ${stages.length}\nFinal stage: ${destination}\nExample value: lab fixture record`,
            `Το ${source} παρέχει δεδομένα στο pipeline με ${stages.length} στάδια και το ${destination} παράγει την τελική μορφή. Η δοκιμαστική εγγραφή δείχνει τη ροή χωρίς να παριστάνει πραγματική μέτρηση.`, 'summary');
        }
        if (/^yara\b/i.test(command) || /^rule\s+\w+/i.test(command)) {
          const rulePath = command.match(/\b[\w./-]+\.yar(?:a)?\b/i)?.[0] || 'lab.yar';
          const sample = command.match(/\b[\w./-]+\.(?:bin|exe|txt|dat)\b/i)?.[0] || file;
          const ruleName = command.match(/^rule\s+(\w+)/i)?.[1] || 'LabRule';
          const showStrings = /\s-s(?:\s|$)/.test(command);
          return illustrative(`// Illustrative contents of ${rulePath}\nrule ${ruleName} {\n  strings:\n    $marker = "LAB" ascii nocase\n  condition:\n    $marker\n}\n\n// Example fixture bytes in ${sample}: 4c 41 42 ("LAB")\n// Illustrative match\n${ruleName} ${sample}${showStrings ? '\n0x0:$marker: LAB' : ''}`,
            `Το yara εφαρμόζει τον κανόνα του ${rulePath} στο ${sample}. Το $marker αναζητά τα bytes LAB χωρίς διάκριση πεζών.${showStrings ? ' Το -s εμφανίζει το offset 0x0 και τη συμβολοσειρά που ταίριαξε.' : ''} Αν δεν υπάρξει ταίριασμα, το YARA δεν τυπώνει γραμμή. Η τελευταία γραμμή είναι εκπαιδευτικό παράδειγμα match, όχι διαπίστωση για το πραγματικό δείγμα.`, 'rule');
        }
        if (/^(?:chmod|chown|setfacl|icacls)\b/i.test(command)) {
          const mode = command.match(/(?:^|\s)([0-7]{3,4})(?=\s|$)/)?.[1];
          const symbolic = command.match(/\b[ugoa]*[+\-=][rwxXst]+\b/)?.[0];
          const owner = command.match(/^chown\s+(?:-\w+\s+)*([\w-]+)(?::([\w-]+))?\s+\S+$/i)?.[1] || 'analyst';
          const group = command.match(/^chown\s+(?:-\w+\s+)*[\w-]+:([\w-]+)\s+\S+$/i)?.[1] || 'analysts';
          const rule = command.match(/(?:-m\s+|\/grant\s+)([^\s]+)/i)?.[1];
          const output = mode ? `File: ${file}\nMode: 0${mode.replace(/^0/, '')}\nOwner: ${owner}\nGroup: ${group}`
            : rule ? `File: ${file}\nACL entry: ${rule}\nOwner: ${owner}`
              : symbolic ? `File: ${file}\nRequested mode change: ${symbolic}\nOwner: ${owner}`
                : `File: ${file}\nOwner: ${owner}\nGroup: ${group}`;
          return illustrative(output, `Η ${tool} αφορά μόνο το ${file}. ${mode ? `Το ${mode} είναι οκταδικό mode: κάθε ψηφίο υπολογίζεται από r=4, w=2, x=1 για ιδιοκτήτη, ομάδα και λοιπούς.` : symbolic ? `Το ${symbolic} μεταβάλλει τα επιλεγμένα bits, δεν δίνει καθολική πρόσβαση.` : rule ? `Η εγγραφή ${rule} ορίζει συγκεκριμένο δικαίωμα ACL.` : `Η ιδιοκτησία στο παράδειγμα είναι ${owner}:${group}.`} Τα πεδία είναι ενδεικτική τελική κατάσταση, όχι stdout της εντολής.`);
        }
        if (/^systemctl\b/i.test(command)) {
          const unit = command.match(/^systemctl\s+\S+\s+(\S+)/i)?.[1] || 'ssh.service';
          const active = action === 'stop' ? 'inactive' : 'active';
          const enabled = action === 'disable' ? 'disabled' : 'enabled';
          return illustrative(`Unit: ${unit}\nActiveState: ${active}\nUnitFileState: ${enabled}`,
            `Η systemctl ${action || 'status'} αφορά την υπηρεσία ${unit}. ActiveState περιγράφει την τρέχουσα εκτέλεση και UnitFileState την εκκίνηση κατά το boot. Η διαφορά τους εξηγεί γιατί το enable δεν ξεκινά αυτόματα την υπηρεσία.`);
        }
        if (/^git\b/i.test(command)) {
          const namedFile = command.match(/\b[\w.-]+\.(?:txt|js|html|json|py|md|log)\b/i)?.[0] || file;
          return illustrative(action === 'add' ? `Index: ${namedFile} (staged)\nWorking tree: ${namedFile} (modified)`
            : action === 'diff' ? `diff --git a/${namedFile} b/${namedFile}\n--- a/${namedFile}\n+++ b/${namedFile}\n@@ -1 +1 @@\n-old value\n+new value`
              : `Branch: main\nFile: ${namedFile}\nRepository state: ${action || 'updated'}`,
            `Η git ${action || ''} αφορά το ${namedFile}. ${action === 'add' ? 'Staged σημαίνει ότι η αλλαγή μπήκε στο index, όχι ότι δημιουργήθηκε commit.' : action === 'diff' ? 'Οι γραμμές - και + είναι παλιό και νέο περιεχόμενο σε ενδεικτικό diff του ίδιου αρχείου.' : 'Η κατάσταση του αποθετηρίου είναι παράδειγμα και δεν πιστοποιεί τον κώδικα.'}`);
        }
        if (/^(?:curl|wget)\b/i.test(command)) {
          return illustrative(`URL: https://${target}/${file}\nHTTP status: 200 OK\nSaved file: ${name}\nSize: 5 bytes`,
            `Η ${tool} κατέγραψε ενδεικτική μεταφορά από ${target} στο ${name}. Ο HTTP κωδικός 200 αφορά το αίτημα, ενώ το μέγεθος αφορά το αρχείο. Ούτε το ένα πιστοποιεί το περιεχόμενο.`);
        }
        if (/^openssl\b/i.test(command)) {
          const type = /genpkey|genrsa|pkey/i.test(action || '') ? 'private key' : /req|x509/i.test(action || '') ? 'certificate request' : /\benc\b/i.test(command) ? 'encrypted data' : 'cryptographic data';
          return illustrative(`Generated file: ${name}\nObject type: ${type}\nFile mode: 0600`,
            `Η openssl ${action || ''} παράγει ${type} στο ${name} σύμφωνα με τις παραμέτρους της εντολής. Το mode 0600 περιορίζει ανάγνωση/εγγραφή στον ιδιοκτήτη, αλλά δεν αποδεικνύει εγκυρότητα κλειδιού ή πιστοποιητικού.`);
        }
        if (/^gpg\b/i.test(command)) {
          const outputFile = name === 'sample.txt' ? `${file}.gpg` : name;
          return illustrative(`Generated file: ${outputFile}\nFormat: OpenPGP encrypted message\nRecipient: analyst@lab.example`,
            `Η gpg παρήγαγε ενδεικτικό κρυπτογραφημένο μήνυμα στο ${outputFile}. Το recipient περιγράφει το επιλεγμένο δημόσιο κλειδί, όχι ότι το μήνυμα αποκρυπτογραφήθηκε.`);
        }
        if (/^(?:ufw|iptables|nft|firewall-cmd|netsh)\b/i.test(command)) {
          const port = command.match(/(?:--dport\s+|\ballow\s+|\bport\s+)(\d{2,5})/)?.[1] || '443';
          const actionName = /\b(?:deny|drop|reject)\b/i.test(command) ? 'deny' : 'allow';
          return illustrative(`Tool: ${tool}\nRule: ${actionName} tcp/${port}\nSource: 192.0.2.0/24`,
            `Ο κανόνας της ${tool} αφορά TCP θύρα ${port} και τη δοκιμαστική πηγή 192.0.2.0/24. Η τιμή ${actionName} περιγράφει ενδεικτική επίδραση του κανόνα, όχι συνολική πολιτική του firewall.`);
        }
        if (/^kubectl\b/i.test(command)) {
          const resource = command.match(/\b(?:deployment|pod|service)\/?([\w-]+)/i)?.[1] || 'lab-api';
          const state = /\bdelete\b/i.test(command) ? 'removed' : 'configured';
          return illustrative(`Resource: deployment.apps/${resource}\nNamespace: lab\nState: ${state}`,
            `Η kubectl ${action || ''} αφορά τον πόρο ${resource} στο namespace lab. Το ${state} περιγράφει το ενδεικτικό αποτέλεσμα για αυτόν τον πόρο, όχι την υγεία όλων των pods.`);
        }
        if (/^docker\b/i.test(command)) {
          const image = command.match(/\b[\w.-]+:[\w.-]+\b/)?.[0] || 'lab:latest';
          const state = /\bstop\b/i.test(command) ? 'exited' : 'running';
          return illustrative(`Image: ${image}\nContainer state: ${state}\nContainer ID: 3a9d7c2f1b44`,
            `Η docker ${action || ''} αφορά την εικόνα ${image}. Το ${state} είναι κατάσταση του ενδεικτικού container, όχι αποτέλεσμα ελέγχου ευπαθειών.`);
        }
        if (/^(?:Set-|New-|Remove-|Enable-|Disable-|pwsh|powershell|sc\.exe)\b/i.test(command)) {
          const subject = command.match(/(?:-Name\s+|-DisplayName\s+)([\w-]+)/i)?.[1] || tool;
          return illustrative(`Object: ${subject}\nOperation: ${tool}\nExample state: ${/^Remove-|^Disable-/i.test(command) ? 'disabled' : 'enabled'}`,
            `Η ${tool} αλλάζει το αντικείμενο ${subject}. Η τελική τιμή είναι εκπαιδευτικό στιγμιότυπο του ίδιου αντικειμένου, όχι απόκριση μιας άσχετης υπηρεσίας.`);
        }
        if (/^(?:echo|printf)\b/i.test(command) && />\s*\S+/.test(command)) {
          return illustrative(`File: ${name}\nContent: ${command.match(/['"]([^'"]+)['"]/)?.[1] || 'Hello'}`,
            `Η ανακατεύθυνση > γράφει σε ${name} αντί στην οθόνη. Το περιεχόμενο είναι παράδειγμα του αποτελέσματος της ίδιας εντολής.`);
        }
        if (/^(?:python3?|node|bash|sh)\b/i.test(command) || /^\.\//.test(command)) {
          const script = command.match(/\b[\w./-]+\.(?:py|js|sh)\b/i)?.[0] || command.split(/\s+/).at(-1);
          return illustrative(`Script: ${script}\nInput: lab fixture\nExample artifact: analysis summary`,
            `Η ${tool} ξεκινά το ${script}. Το παράδειγμα δείχνει το είδος παραγόμενου αρχείου/σύνοψης, όχι συγκεκριμένο stdout που δεν μπορεί να συναχθεί χωρίς τον κώδικα και τα δεδομένα του.`);
        }
        const setting = command.match(/\b(?:enabled|port|mode|action|status)\s*[:=]\s*[\w.-]+/i)?.[0];
        if (setting) return illustrative(`Relevant expression: ${setting}\nConfiguration key: ${setting.split(/[:=]/)[0].trim()}\nExample value: ${setting.split(/[:=]/)[1].trim()}`,
          `Η ρύθμιση ${setting} δείχνει κλειδί και τιμή στο ίδιο απόσπασμα. Εξηγούμε την τιμή που φαίνεται, όχι απάντηση διαφορετικού εργαλείου.`, 'summary');
        const argumentsText = command.trim().split(/\s+/).slice(1, 5).join(' ') || '(no arguments)';
        return illustrative(`Program: ${tool}\nArguments: ${argumentsText}\nExample outcome: lab operation completed`,
          `Το ${tool} λαμβάνει τα ορίσματα ${argumentsText}. Το εκπαιδευτικό αποτέλεσμα αναφέρεται μόνο στη συγκεκριμένη κλήση. Χωρίς πραγματικά δεδομένα δεν επινοείται επιπλέον stdout.`, 'summary');
      }

      function logResult(filter, source = filter) {
        const candidate = filter.match(/^(?:grep|rg|findstr)(?:\s+-[a-zA-Z]+)*\s+(?:['"]([^'"]+)['"]|([^\s|]+))/i);
        const pattern = candidate?.[1] || candidate?.[2];
        if (!pattern) return null;
        const flags = /(?:^|\s)-(?:[a-z]*i[a-z]*)(?:\s|$)/i.test(filter) ? 'i' : '';
        let expression;
        try { expression = new RegExp(pattern, flags); }
        catch { return null; }
        const authEntries = [
          'Mar  1 12:00:00 lab sshd[1234]: Failed password for invalid user guest from 192.0.2.42 port 51024 ssh2',
          'Mar  1 12:00:00 lab sshd[1234]: Failed password for invalid user guest from 192.0.2.42 port 51024 ssh2',
          'Mar  1 12:04:00 lab sshd[1235]: Accepted publickey for analyst from 192.0.2.42 port 51025 ssh2'
        ];
        const appEntries = [
          'Mar  1 12:06:00 lab app[1236]: ERROR invalid configuration value',
          'Mar  1 12:07:00 lab app[1236]: WARN retrying request'
        ];
        const mailEntries = [
          'Authentication-Results: lab.example; dmarc=fail; spf=fail',
          'From: security@lab.example',
          'Subject: Account verification'
        ];
        const webEntries = [
          '192.0.2.42 - - [01/Mar/2026:12:00:00 +0000] "GET /login HTTP/1.1" 401 142',
          '192.0.2.42 - - [01/Mar/2026:12:01:00 +0000] "GET /dashboard HTTP/1.1" 200 843'
        ];
        const accountEntries = [
          'root:x:0:0:root:/root:/bin/bash'
        ];
        const journalUnit = source.match(/^journalctl\b.*?\s-u\s+([\w.-]+)/i)?.[1] || '';
        const entries = /\.(?:eml|msg)\b/i.test(source) ? mailEntries
          : /(?:\/etc\/passwd|\bpasswd\b)/i.test(source) ? accountEntries
            : /(?:auth|secure|sshd)\.?(?:log)?\b/i.test(source) ? authEntries
              : /(?:access|nginx|apache)\.log\b/i.test(source) ? webEntries
              : /(?:app|error)\.log\b/i.test(source) ? appEntries
                : /^(?:ssh|sshd)(?:\.service)?$/i.test(journalUnit) ? authEntries
                  : /^nginx(?:\.service)?$/i.test(journalUnit) ? webEntries
                    : /^(?:app|lab-api)(?:\.service)?$/i.test(journalUnit) ? appEntries
                : /\.log\b|^journalctl\b/i.test(source)
                  ? [...authEntries, ...appEntries, ...webEntries]
                  : null;
        if (!entries) return null;
        const invert = /(?:^|\s)-(?:[a-z]*v[a-z]*)(?:\s|$)/i.test(filter);
        return entries.filter(line => expression.test(line) !== invert);
      }

      function noMatches(command, file) {
        const pattern = command.match(/^(?:grep|rg|findstr)(?:\s+-[a-zA-Z]+)*\s+(?:['"]([^'"]+)['"]|([^\s|]+))/i);
        const query = (pattern?.[1] || pattern?.[2] || 'search').replace(/[\u0370-\u03ff]+/gu, 'sample');
        return {
          output:`Input: ${file.replace(/[\u0370-\u03ff]+/gu, 'sample')}\nPattern: ${query}\nMatching lines: 0`,
          explanation:`Στο υποθετικό αρχείο ${file} το φίλτρο ${query} δεν επέστρεψε εγγραφές. Το 0 μετρά αντιστοιχίες στο δείγμα, δεν αποδεικνύει ότι δεν υπάρχουν συμβάντα σε πραγματικά logs.`,
          kind:'summary'
        };
      }

      // Interpret values that actually appear in the transcript; do not infer privileges from a UID.
      function interpret(c, output, explanation) {
        const details = [];
        const add = (fragment, meaning) => {
          if (fragment && output.includes(fragment) && !details.some(item => item.fragment === fragment)) {
            details.push({ fragment, meaning });
          }
        };
        const match = expression => output.match(expression)?.[0];
        const mode = 'Το 0640 είναι οκταδικά δικαιώματα: ιδιοκτήτης 6 = 4 (ανάγνωση) + 2 (εγγραφή), ομάδα 4 = μόνο ανάγνωση, λοιποί 0. Το x θα πρόσθετε 1. Το UID δεν είναι αυτός ο αριθμός δικαιωμάτων.';
        const uid = 'Το UID 1000 είναι αριθμητική ταυτότητα του analyst, όχι επίπεδο δικαιωμάτων. Συνήθως το useradd ξεκινά κανονικούς χρήστες από UID_MIN=1000 στο /etc/login.defs και επιλέγει διαθέσιμο UID, ενώ root είναι UID 0. Αν αρχείο ανήκει στο UID 1000 και έχει mode 0640, εφαρμόζονται τα bits ιδιοκτήτη 6 = ανάγνωση 4 + εγγραφή 2, επειδή ταυτίζεται το UID, όχι επειδή ο αριθμός 1000 «δίνει» αυτά τα δικαιώματα. ACL μπορεί να επηρεάζει επιπλέον τον έλεγχο.';
        add(match(/^Matching lines: 0$/m), 'Στο εκπαιδευτικό αρχείο δεν βρέθηκε γραμμή που να ταιριάζει. Δεν τεκμηριώνει απουσία συμβάντων σε άλλα αρχεία.');
        add(match(/^rule \w+ \{$/m), 'Αυτή είναι η αρχή ενός ενδεικτικού κανόνα YARA. Η συνθήκη καθορίζει πότε ένα δείγμα παράγει match.');
        add(match(/\$marker = "LAB" ascii nocase/), 'Το $marker εντοπίζει τα ASCII bytes LAB χωρίς διάκριση πεζών/κεφαλαίων.');
        if (/^yara\b|^rule\b/i.test(c)) {
          add(match(/^\w+ [\w./-]+\.(?:bin|exe|txt|dat)$/m), 'Η γραμμή στο παράδειγμα δείχνει όνομα κανόνα και δείγμα που θα ταίριαζε, όχι εύρημα από πραγματική εκτέλεση.');
        }
        if (/^(?:id|whoami|groups|getent)\b/i.test(c)) {
          add(match(/uid=1000\(analyst\)/), uid);
          if (/^id\s+-u\b/i.test(c)) add('1000', uid);
          add(match(/gid=1000\(analysts\)/), 'Το GID 1000 είναι η πρωτεύουσα ομάδα του analyst. Ελέγχεται έναντι του group owner ενός αρχείου, δεν αντιστοιχεί σε δικαίωμα 1000.');
          add(match(/groups=1000\(analysts\),27\(sudo\)/), 'Το groups απαριθμεί την πρωτεύουσα ομάδα 1000(analysts) και τη συμπληρωματική 27(sudo). Οι αριθμοί είναι GID, όχι bits δικαιωμάτων. Η δυνατότητα sudo εξαρτάται από την πολιτική sudoers και δεν χαρίζει αυτόματα root.');
          add(match(/^analyst:x:1000:1000:[^\n]+/m), 'Στο /etc/passwd τα πεδία διαχωρίζονται με : : username, x (κωδικός αλλού), UID 1000, πρωτεύον GID 1000, περιγραφή, home και shell. Ο αριθμός 1000 είναι ταυτότητα, όχι άθροισμα δικαιωμάτων.');
          if (/^whoami\b/i.test(c)) add('analyst', 'Το whoami εμφανίζει το όνομα του ενεργού UID μέσω της βάσης λογαριασμών. Για αριθμό UID και GID εκτελέστε id.');
          if (/^groups\b/i.test(c)) add('analyst analysts', 'Η συμμετοχή στις ομάδες επηρεάζει πρόσβαση όταν το αρχείο ανήκει σε μία από αυτές. Για αρχείο 0640, η ομάδα μπορεί να διαβάζει (4), όχι να γράφει (2).');
        } else if (/^(?:ls|stat|getfacl|icacls|chmod|chown|setfacl|umask)\b/i.test(c)) {
          add(match(/-rw-r-----/), `Η πρώτη παύλα είναι τύπος κανονικού αρχείου, οι επόμενες τριάδες rw- / r-- / --- δίνουν owner/group/others. ${mode}`);
          add(match(/\b0640\b/), mode);
          add(match(/\b0644\b/), 'Το 0644 προκύπτει ως 6=4+2 για τον ιδιοκτήτη, 4 για την ομάδα, 4 για τους λοιπούς. Μετά το chmod 640 αφαιρείται η ανάγνωση των λοιπών.');
          add(match(/Uid:\s*\(?1000\/analyst\)?/), 'Ο αριθμός 1000 δείχνει τον ιδιοκτήτη αρχείου. Ο πυρήνας συγκρίνει UID διεργασίας και ιδιοκτήτη, ο αριθμός μόνος του δεν δίνει πρόσβαση.');
          add(match(/^# owner: analyst/m), 'Το όνομα είναι ο ιδιοκτήτης ACL. Η αντίστοιχη εγγραφή user:: εφαρμόζεται αν το ενεργό UID ταυτίζεται με του ιδιοκτήτη.');
          add(match(/^user::rw-/m), 'Ο ιδιοκτήτης μπορεί να διαβάζει (r=4) και να γράφει (w=2), όχι να εκτελεί (x=0): 6.');
          add(match(/^group::r--/m), 'Η ομάδα μπορεί μόνο να διαβάζει: r=4. Με ACL, ελέγξτε και τυχόν mask για τα αποτελεσματικά δικαιώματα.');
          add(match(/^other::---/m), 'Για όσους δεν ταυτίζονται με ιδιοκτήτη ή ομάδα δεν δίνεται r/w/x: 0.');
          add(match(/LAB\\analysts:\(R\)/), 'Το (R) στην ACL των Windows σημαίνει Read για την ομάδα LAB\\analysts, όχι δικαίωμα που προκύπτει από το όνομά της.');
          if (/^umask\b/i.test(c)) add('0022', 'Το umask αφαιρεί bits από το αρχικό mode: αρχείο 0666 & ~0022 = 0644, κατάλογος 0777 & ~0022 = 0755. Δεν αλλάζει UID/GID.');
          add(match(/Successfully processed 1 files; Failed processing 0 files/), 'Ένα αρχείο εξετάστηκε χωρίς σφάλμα. Η πολιτική πρόσβασης πρέπει ακόμη να ελεγχθεί ως προς την ανάγκη του χρήστη.');
        } else if (/^(?:sha(?:1|256|512)sum|shasum|md5sum|Get-FileHash|openssl\s+dgst|certutil\s+-hashfile|hashdeep)\b/i.test(c)) {
          const hexes = output.match(/\b[a-f0-9]{32,128}\b/ig) || [];

          const name = first.replace(/^[\w.-]+@[\w.-]+(?::[^\s$#]*)?[$#]\s*/, '')
            .replace(/^PS\s+[^>]*>\s*/i, '').replace(/^(?:\$\s*|#\s*|sudo\s+)+/i, '').split(/[\s|;]/)[0];

    // Each chapter is a literal in the upstream bundle. Replace only its own arrays before the module executes.
    function questionArraySpan(source, from, to, key) {
      const pattern = new RegExp('(?:,|\\{)\\s*(?:"' + key + '"|' + key + ')\\s*:\\s*\\[', 'g');
      const matches = [...source.slice(from, to).matchAll(pattern)];
      if (matches.length !== 1) throw new Error(`Δεν βρέθηκε μοναδικό πεδίο ${key} στο κεφάλαιο.`);
      const open = from + matches[0].index + matches[0][0].lastIndexOf('[');
      let depth = 0;
      let quote = null;
      for (let i = open; i < to; i++) {
        const char = source[i];
        if (quote) {
          if (char === '\\') { i++; continue; }
          if (char === quote) quote = null;
        } else if (char === '"' || char === "'" || char === '`') {
          quote = char;
        } else if (char === '[') {
          depth++;
        } else if (char === ']' && --depth === 0) {
          return { start: open, end: i + 1 };
        }
      }
      throw new Error(`Ατελές πεδίο ${key} στο αρχικό αρχείο.`);
    }

    function correctPresentation(source, chapters, verified, catalog) {
      const anchors = chapters.map(chapter => source.indexOf(JSON.stringify(chapter.title)));
      const scriptEnd = source.indexOf('</' + 'script>', anchors[anchors.length - 1]);
      if (anchors.some((at, index) => at < 0 || (index > 0 && at <= anchors[index - 1])) || scriptEnd < 0) {
        throw new Error('Η δομή της αρχικής παρουσίασης άλλαξε. Δεν έγινε φόρτωση μη ελεγμένων ερωτήσεων.');
      }
      const edits = [];
      chapters.forEach((chapter, ci) => {
        const from = anchors[ci] + JSON.stringify(chapter.title).length;
        const to = anchors[ci + 1] ?? scriptEnd;
        for (const key of ['review', 'quiz']) {
          const span = questionArraySpan(source, from, to, key);
          edits.push({ ...span, value: JSON.stringify(verified[ci][key]) });
        }
      });
      if (edits.length !== 26) throw new Error('Ο έλεγχος των 26 ενοτήτων ερωτήσεων απέτυχε.');
      edits.sort((a, b) => b.start - a.start);
      for (const edit of edits) source = source.slice(0, edit.start) + edit.value + source.slice(edit.end);
      const patchedAnchors = chapters.map(chapter => source.indexOf(JSON.stringify(chapter.title)));
      chapters.forEach((chapter, ci) => {
        const from = patchedAnchors[ci] + JSON.stringify(chapter.title).length;
        const to = patchedAnchors[ci + 1] ?? source.indexOf('</' + 'script>', from);
        for (const key of ['review', 'quiz']) {
          const span = questionArraySpan(source, from, to, key);
          if (source.slice(span.start, span.end) !== JSON.stringify(verified[ci][key])) {
            throw new Error(`Απέτυχε η επαλήθευση ${key} στο κεφάλαιο ${ci + 1}.`);
          }
        }
      });
      const payload = JSON.stringify(catalog).replace(/</g, '\\u003c');
      const boot = `(${startOutputSimulator.toString()})(${payload}, ${simulateCommand.toString()}, new RegExp(${JSON.stringify(commandStart.source)}, ${JSON.stringify(commandStart.flags)}));`;
      const end = source.lastIndexOf('</body>');
      if (end < 0 || boot.includes('</' + 'script>')) {
        throw new Error('Δεν ήταν δυνατή η ασφαλής εγκατάσταση του προσομοιωτή.');
      }
      source = source.slice(0, end) + '<script>' + boot + '</' + 'script>' + source.slice(end);
      return source;
    }

    async function fetchText(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`Source returned ${response.status}`);
        return await response.text();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchFirst(urls, parse) {
      let failure;
      for (const url of urls) {
        try { return parse(await fetchText(url)); }
        catch (error) { failure = error; }
      }
      throw failure;
    }

    function showAudit(chapters, verified) {
      document.title = 'Έλεγχος ερωτήσεων | Κυβερνοασφάλεια 101';
      document.getElementById('loading').remove();
      const page = document.createElement('main');
      page.className = 'qa';
      const add = (parent, tag, text) => {
        const element = document.createElement(tag);
        element.textContent = String(text).replace(/[ \t]*\u00b7[ \t]*/g, ', ');
        parent.append(element);
        return element;
      };
      add(page, 'div', 'ΚΥΒΕΡΝΟΑΣΦΑΛΕΙΑ 101, ΠΟΙΟΤΙΚΟΣ ΕΛΕΓΧΟΣ').className = 'loading-label';
      add(page, 'h1', 'Κάθε ερώτηση στο κεφάλαιό της.');
      add(page, 'p', '13 κεφάλαια, 65 ερωτήσεις ανασκόπησης και 78 ερωτήσεις κουίζ. Κάθε σωστή απάντηση συνοδεύεται από αιτιολόγηση.');
      const link = add(page, 'a', 'Δείτε επίσης τα αποτελέσματα των εντολών');
      link.href = '?outputs=1';
      chapters.forEach((chapter, ci) => {
        const group = add(page, 'details', '');
        add(group, 'summary', `${chapter.title}, ${topics[ci]}`);
        add(group, 'h2', 'Ενότητες κεφαλαίου');
        add(group, 'p', chapter.sections.map(section => `${section.id} ${section.title}`).join(', '));
        add(group, 'h2', 'Ερωτήσεις ανασκόπησης');
        const reviewList = add(group, 'ol', '');
        verified[ci].review.forEach(question => add(reviewList, 'li', question));
        add(group, 'h2', 'Κουίζ, σωστή απάντηση και αιτιολόγηση');
        const quizList = add(group, 'ol', '');
        verified[ci].quiz.forEach(item => {
          const question = add(quizList, 'li', item.q);
          const answer = item.opts.find(option => option.k === item.ans);
          add(question, 'small', `Σωστό: ${answer.k}. ${answer.v} ${item.exp}`);
        });
      });
      document.body.append(page);
    }

    function auditExamples(chapters, catalog) {
      if (catalog.length !== 13) throw new Error('Ο προσομοιωτής δεν καλύπτει και τα 13 κεφάλαια.');
      catalog.forEach((entry, ci) => {
        const expectedTasks = chapters[ci].cli.tasks.filter(task => task.cmd?.trim()).length;
        const expectedBlocks = chapters[ci].lab.phases.reduce((count, phase) =>
          count + phase.steps.filter(step => step.type === 'code' && step.text?.trim()).length, 0);
        const tasks = entry.examples.filter(example => example.type === 'cli');
        const blocks = entry.examples.filter(example => example.type === 'lab');
        if (tasks.length !== expectedTasks || blocks.length !== expectedBlocks || !tasks.length ||
            tasks.some((task, index) => task.taskNumber !== index + 1 || !task.title?.trim() ||
              task.cmd !== chapters[ci].cli.tasks[index].cmd)) {
          throw new Error(`Λείπουν παραδείγματα εντολών στο κεφάλαιο ${ci + 1}.`);
        }
        entry.examples.forEach(example => {
          const steps = simulateCommand(example.cmd, example);
          if (!example.lesson?.trim() || !steps.length || steps.some(step =>
            !step.output?.trim() || !step.explanation?.trim() || !step.invocation?.trim() ||
            /[\u0370-\u03ff]/u.test(step.output) || /no\s+(?:terminal\s+)?output|no\s+stdout/i.test(step.output) ||
            step.output.startsWith('$ ') || /^Exit status:\s*\d+$/i.test(step.output) ||
            (example.type === 'cli' && !example.cmd.split(/\r?\n/).some(line =>
              line.trim() === step.sourceLine) && example.cmd.trim() !== step.sourceLine) ||
            !step.details?.length || step.details.some(detail =>
              !detail.fragment || !step.output.includes(detail.fragment) || !detail.meaning?.trim()))) {
            console.warn(`Ελέγξτε την ενδεικτική απόκριση: κεφάλαιο ${ci + 1}, ${example.title}.`);
          }
        });
      });
      const checks = [
        ['id', /^uid=1000/, /UID_MIN=1000/],
        ['id -u', /^1000$/, /όχι επίπεδο δικαιωμάτων/],
        ['ls -l sample.txt', /-rw-r-----/, /6 = 4 .*2/],
        ['umask', /^0022$/, /0666 & ~0022 = 0644/],
        ['sha256sum sample.txt', /^185f8db32271fe25/, /256 bits = 64/],
        ['openssl rand -hex 32', /^[a-f0-9]{64}$/, /32 bytes × 8 = 256 bits/],
        ['nmap -sV -p 22 lab.example', /22\/tcp\s+open\s+ssh/, /22\/tcp/],
        ['nmap -sU -p 53 lab.example', /53\/udp\s+open\|filtered/, /open\|filtered/],
        ['curl -I https://lab.example/api', /^HTTP\/1\.1 200 OK/, /200 σημαίνει/],
        ['analyst@lab:~$ grep -Ei "Failed password" /var/log/auth.log', /Failed password/, /Η αυθεντικοποίηση απέτυχε/],
        ['grep -Ei "Failed password" /var/log/auth.log | sort | uniq -c', /^\s+2 .*Failed password/, /uniq -c/],
        ['grep "error" auth.log', /^Input: auth\.log\nPattern: error\nMatching lines: 0$/, /δεν βρέθηκε γραμμή/],
        ['chmod 640 sample.txt', /Mode: 0640/, /0640/],
        ['systemctl start ssh.service', /Unit: ssh\.service\nActiveState: active/, /ssh.service/],
        ['git add notes.txt', /Index: notes\.txt \(staged\)/, /staged/],
        ['yara lab.yar sample.bin', /rule LabRule \{[\s\S]*LabRule sample\.bin/, /κανόνα YARA/],
        ['Get-Service WinDefend', /WinDefend/, /υπηρεσία Microsoft Defender/],
        ['git status', /^On branch main/, /τρέχουσα τοπική διακλάδωση/]
      ];
      for (const [command, expected, lesson] of checks) {
        const step = simulateCommand(command, { title: 'Self-check' })[0];
        if (!expected.test(step.output) || !lesson.test(step.details.map(detail => detail.meaning).join(' '))) {
          console.warn(`Ο έλεγχος προσομοιωμένης εξόδου χρειάζεται διόρθωση: ${command}`);
        }
      }
      const prompted = 'analyst@lab:~$ grep -Ei "Failed password" /var/log/auth.log';
      const parsed = simulateCommand(prompted, { type: 'cli', title: 'Αποτυχημένες συνδέσεις' })[0];
      if (parsed.sourceLine !== prompted || !/Failed password/.test(parsed.output)) {
        console.warn('Ο έλεγχος αντιστοίχισης εντολής με prompt χρειάζεται διόρθωση.');
      }
      for (let ci = 0; ci < catalog.length; ci++) {
        const step = simulateCommand('example_config:\n  enabled: true', {
          chapterNumber: ci + 1, topic: catalog[ci].topic, context: catalog[ci].title
        })[0];
        if (step.kind !== 'summary' || !/Relevant expression: enabled:\s*true/.test(step.output) ||
            !step.invocation || !step.details.length) {
          console.warn(`Χρειάζεται έλεγχος του παραδείγματος fallback στο κεφάλαιο ${ci + 1}.`);
        }
      }
    }

    function showOutputAudit(catalog) {
      document.title = 'Αποτελέσματα εντολών | Κυβερνοασφάλεια 101';
      document.getElementById('loading').remove();
      document.body.classList.add('output-page');
      const page = document.createElement('main');
      page.className = 'qa qa-output';
      const add = (parent, tag, text) => {
        const node = document.createElement(tag);
        node.textContent = String(text).replace(/[ \t]*\u00b7[ \t]*/g, ', ');
        parent.append(node);
        return node;
      };
      const masthead = add(page, 'header', '');
      masthead.className = 'qa-masthead';
      add(masthead, 'div', 'ΚΥΒΕΡΝΟΑΣΦΑΛΕΙΑ 101 / ΕΚΠΑΙΔΕΥΤΙΚΑ OUTPUTS').className = 'loading-label';
      add(masthead, 'h1', 'Από την εντολή στο αποτέλεσμά της.');
      add(masthead, 'p', 'Αγγλικά παραδείγματα output και ελληνικές επεξηγήσεις, οργανωμένα ανά κεφάλαιο και Task.');
      const back = add(masthead, 'a', 'Επιστροφή στην παρουσίαση  ↗');
      back.className = 'qa-return';
      back.href = './index.html';
      catalog.forEach((chapter, ci) => {
        const group = add(page, 'details', '');
        group.className = 'qa-chapter';
        if (ci === 0) group.open = true;
        const summary = add(group, 'summary', '');
        add(summary, 'span', String(ci + 1).padStart(2, '0')).className = 'qa-summary-number';
        add(summary, 'span', chapter.title.replace(/^\d+\.\s*/, '')).className = 'qa-summary-title';
        add(summary, 'span', `${chapter.examples.length} παραδείγματα`).className = 'qa-summary-count';
        const caret = add(summary, 'span', '+');
        caret.className = 'qa-summary-caret';
        caret.setAttribute('aria-hidden', 'true');
        const content = add(group, 'div', '');
        content.className = 'qa-chapter-content';
        const tasks = chapter.examples.filter(example => example.type === 'cli');
        if (tasks.length) {
          add(content, 'h2', 'Εργαστήριο CLI / Λίστα εργασιών').className = 'qa-section-title';
          const taskNav = add(content, 'nav', '');
          taskNav.setAttribute('aria-label', `Tasks κεφαλαίου ${ci + 1}`);
          const taskList = add(taskNav, 'ol', '');
          taskList.className = 'qa-task-list';
          tasks.forEach(task => {
            const item = add(taskList, 'li', '');
            const taskLink = add(item, 'a', '');
            taskLink.href = `#output-task-${ci + 1}-${task.taskNumber}`;
            taskLink.className = 'qa-task-link';
            add(taskLink, 'span', `Task ${task.taskNumber}`).className = 'qa-task-number';
            add(taskLink, 'span', task.title).className = 'qa-task-title';
            const arrow = add(taskLink, 'span', '↓');
            arrow.className = 'qa-task-arrow';
            arrow.setAttribute('aria-hidden', 'true');
          });
          add(content, 'h2', 'Εντολές, αποκρίσεις και ερμηνείες').className = 'qa-section-title';
        }
        chapter.examples.forEach((example, index) => {
          if (index === tasks.length && index < chapter.examples.length && tasks.length) {
            add(content, 'h2', 'Επιπλέον παραδείγματα του κεφαλαίου').className = 'qa-section-title';
          }
          const wrap = add(content, 'section', '');
          wrap.className = 'qa-example';
          if (example.type === 'cli') wrap.id = `output-task-${ci + 1}-${example.taskNumber}`;
          add(wrap, 'span', example.type === 'cli' ? `Task ${example.taskNumber}` : `ΠΑΡΑΔΕΙΓΜΑ ${String(index + 1).padStart(2, '0')}`).className = 'qa-example-label';
          add(wrap, 'h3', example.title);
          if (example.type !== 'cli') add(wrap, 'p', example.lesson);
          const steps = simulateCommand(example.cmd, example);
          steps.forEach((step, si) => {
            const stepSection = add(wrap, 'div', '');
            stepSection.className = 'qa-step';
            add(stepSection, 'div', steps.length > 1 ? `Εντολή ${si + 1}` : 'Εντολή / απόσπασμα').className = 'qa-code-label';
            add(stepSection, 'pre', step.command).className = 'qa-command';
            add(stepSection, 'div', 'Τι κάνει και τι σημαίνουν οι παράμετροι').className = 'qa-code-label';
            add(stepSection, 'p', step.invocation).className = 'qa-explanation';
            add(stepSection, 'div', step.kind === 'rule'
              ? 'Ενδεικτικός κανόνας YARA και match (EN)'
              : step.kind === 'summary' ? 'Ενδεικτική σύνοψη αποτελέσματος (EN)'
                : step.kind === 'artifact' ? 'Ενδεικτικό παραγόμενο αποτέλεσμα (EN)'
                  : 'Ενδεικτικό output της εντολής (EN)').className = 'qa-code-label';
            add(stepSection, 'pre', step.output).className = 'qa-response';
            add(stepSection, 'h4', 'Πώς διαβάζουμε το αποτέλεσμα').className = 'qa-field-title';
            const fields = add(stepSection, 'dl', '');
            fields.className = 'qa-field-list';
            step.details.forEach(detail => {
              const row = add(fields, 'div', '');
              add(row, 'dt', detail.fragment);
              add(row, 'dd', detail.meaning);
            });
          });
        });
      });
      document.body.append(page);
    }

    async function showPresentation() {
      try {
        const chaptersPromise = fetchFirst(chapterSources, text => JSON.parse(text));
        const params = new URLSearchParams(location.search);
        const isAudit = params.get('audit') === '1';
        const isOutputAudit = params.get('outputs') === '1';
        const sourcePromise = isAudit || isOutputAudit ? null : fetchFirst(sources, text => {
          if (!text.includes('<div id="root"></div>')) throw new Error('Μη αναμενόμενο αρχείο παρουσίασης.');
          return text;
        });
        const [chapters, source] = sourcePromise
          ? await Promise.all([chaptersPromise, sourcePromise])
          : [await chaptersPromise, null];
        const catalog = buildExampleCatalog(chapters);
        auditExamples(chapters, catalog);
        if (isOutputAudit) { showOutputAudit(catalog); return; }
        const verified = auditQuestions(chapters);
        if (isAudit) { showAudit(chapters, verified); return; }
        const html = correctPresentation(source, chapters, verified, catalog);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('Έλεγχος περιεχομένου:', error);
        status.textContent = `Δεν ήταν δυνατή η ασφαλής φόρτωση: ${error.message}`;
        sourceLink.classList.add('visible');
        auditLink.classList.add('visible');
        outputLink.classList.add('visible');
      }
    }

    showPresentation();
  </script>
