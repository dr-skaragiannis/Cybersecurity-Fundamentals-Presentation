    function makeQuiz(rows, chapterIndex) {
      return rows.map(([question, correct, wrong1, wrong2, wrong3, explanation], index) => {
        const slot = (chapterIndex + index) % 4;
        const values = [wrong1, wrong2, wrong3];
        values.splice(slot, 0, correct);
        return {
          q: question,
          opts: values.map((v, position) => ({ k: 'ABCD'[position], v })),
          ans: 'ABCD'[slot],
          exp: explanation
        };
      });
    }

    function auditQuestions(chapters) {
      if (!Array.isArray(chapters) || chapters.length !== 13 || reviews.length !== 13 || quizRows.length !== 13) {
        throw new Error('Δεν βρέθηκαν και τα 13 κεφάλαια.');
      }
      const used = new Set();
      return chapters.map((chapter, ci) => {
        if (!chapter.title.startsWith(`${ci + 1}.`) || !Array.isArray(chapter.sections) ||
            !Array.isArray(chapter.review) || !Array.isArray(chapter.quiz)) {
          throw new Error(`Μη αναμενόμενη δομή στο κεφάλαιο ${ci + 1}.`);
        }
        const syllabus = [chapter.title, chapter.subtitle, ...chapter.sections.map(section => section.title)]
          .join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        if (!subjectChecks[ci].test(syllabus)) {
          throw new Error(`Η θεματική «${topics[ci]}» δεν αντιστοιχεί στο κεφάλαιο ${ci + 1}.`);
        }
        if (reviews[ci].length !== 5 || quizRows[ci].length !== 6) {
          throw new Error(`Ελλιπείς ερωτήσεις στο κεφάλαιο ${ci + 1}.`);
        }
        for (const text of [...reviews[ci], ...quizRows[ci].map(row => row[0])]) {
          if (typeof text !== 'string' || text.trim().length < 18 || used.has(text)) {
            throw new Error(`Κενή ή διπλή ερώτηση στο κεφάλαιο ${ci + 1}.`);
          }
          used.add(text);
        }
        for (const row of quizRows[ci]) {
          if (row.length !== 6 || row.some(value => typeof value !== 'string' || !value.trim()) ||
              new Set(row.slice(1, 5)).size !== 4) {
            throw new Error(`Ανεπαρκείς επιλογές ή αιτιολόγηση στο κεφάλαιο ${ci + 1}.`);
          }
        }
        const quiz = makeQuiz(quizRows[ci], ci);
        if (quiz.some(item => item.opts.filter(option => option.k === item.ans).length !== 1)) {
          throw new Error(`Λανθασμένο κλειδί απαντήσεων στο κεφάλαιο ${ci + 1}.`);
        }
        return { review: reviews[ci], quiz };
      });
    }

    // Each chapter is a literal in the upstream bundle. Replace only its own arrays before the module executes.
    function questionArraySpan(source, from, to, key) {
      const pattern = new RegExp('(?:,|\\{)\\s*(?:"' + key + '"|' + key + ')\\s*:\\s*\\[', 'g');
      const matches = [...source.slice(from, to).matchAll(pattern)];
      if (matches.length !== 1) throw new Error(`Δεν βρέθηκε μοναδικό πεδίο ${key} στο κεφάλαιο.`);
      const open = from + matches[0].index + matches[0][0].lastIndexOf('[');
      let depth = 0;
      let quote = null;
      for (let i = open; i < to; i++) {
        const char = source[i];
        if (quote) {
          if (char === '\\') { i++; continue; }
          if (char === quote) quote = null;
        } else if (char === '"' || char === "'" || char === '`') {
          quote = char;
        } else if (char === '[') {
          depth++;
        } else if (char === ']' && --depth === 0) {
          return { start: open, end: i + 1 };
        }
      }
      throw new Error(`Ατελές πεδίο ${key} στο αρχικό αρχείο.`);
    }

    function correctPresentation(source, chapters, verified) {
      const anchors = chapters.map(chapter => source.indexOf(JSON.stringify(chapter.title)));
      const scriptEnd = source.indexOf('</' + 'script>', anchors[anchors.length - 1]);
      if (anchors.some((at, index) => at < 0 || (index > 0 && at <= anchors[index - 1])) || scriptEnd < 0) {
        throw new Error('Η δομή της αρχικής παρουσίασης άλλαξε. Δεν έγινε φόρτωση μη ελεγμένων ερωτήσεων.');
      }
      const edits = [];
      chapters.forEach((chapter, ci) => {
        const from = anchors[ci] + JSON.stringify(chapter.title).length;
        const to = anchors[ci + 1] ?? scriptEnd;
        for (const key of ['review', 'quiz']) {
          const span = questionArraySpan(source, from, to, key);
          edits.push({ ...span, value: JSON.stringify(verified[ci][key]) });
        }
      });
      if (edits.length !== 26) throw new Error('Ο έλεγχος των 26 ενοτήτων ερωτήσεων απέτυχε.');
      edits.sort((a, b) => b.start - a.start);
      for (const edit of edits) source = source.slice(0, edit.start) + edit.value + source.slice(edit.end);
      const patchedAnchors = chapters.map(chapter => source.indexOf(JSON.stringify(chapter.title)));
      chapters.forEach((chapter, ci) => {
        const from = patchedAnchors[ci] + JSON.stringify(chapter.title).length;
        const to = patchedAnchors[ci + 1] ?? source.indexOf('</' + 'script>', from);
        for (const key of ['review', 'quiz']) {
          const span = questionArraySpan(source, from, to, key);
          if (source.slice(span.start, span.end) !== JSON.stringify(verified[ci][key])) {
            throw new Error(`Απέτυχε η επαλήθευση ${key} στο κεφάλαιο ${ci + 1}.`);
          }
        }
      });
      return source;
    }

    async function fetchText(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`Source returned ${response.status}`);
        return await response.text();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchFirst(urls, parse) {
      let failure;
      for (const url of urls) {
        try { return parse(await fetchText(url)); }
        catch (error) { failure = error; }
      }
      throw failure;
    }

        });
        const [chapters, source] = sourcePromise
          ? await Promise.all([chaptersPromise, sourcePromise])
          : [await chaptersPromise, null];
        const verified = auditQuestions(chapters);
        if (!sourcePromise) { showAudit(chapters, verified); return; }
        const html = correctPresentation(source, chapters, verified);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('Έλεγχος ερωτήσεων:', error);
        status.textContent = `Δεν ήταν δυνατή η ασφαλής φόρτωση: ${error.message}`;
        sourceLink.classList.add('visible');
        auditLink.classList.add('visible');
      }
    }

    showPresentation();
  </script>
</body>
</html>
