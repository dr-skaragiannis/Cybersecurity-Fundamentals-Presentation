ασταθούν —για παράδειγμα, καθώς υιοθετούνται οι μετακβαντικοί αλγόριθμοι που τυποποίησε το NIST."}]}],"terms":[{"name":"Υβριδική κρυπτογράφηση","def":"Χρήση ασύμμετρης κρυπτογραφίας για την προστασία ενός συμμετρικού κλειδιού συνεδρίας που κρυπτογραφεί τα δεδομένα."},{"name":"Αντίσταση συγκρούσεων","def":"Η αδυναμία εύρεσης δύο διαφορετικών εισόδων με την ίδια σύνοψη."},{"name":"Ψηφιακή υπογραφή","def":"Τιμή που υπολογίζεται με ιδιωτικό κλειδί και αποδεικνύει την ακεραιότητα και την προέλευση ενός μηνύματος."},{"name":"Αρχή πιστοποίησης","def":"Αξιόπιστη οντότητα που υπογράφει πιστοποιητικά τα οποία συνδέουν δημόσια κλειδιά με ταυτότητες."},{"name":"Εμπρόσθια μυστικότητα","def":"Η ιδιότητα κατά την οποία η διαρροή μακροπρόθεσμων κλειδιών δεν εκθέτει την κίνηση προηγούμενων συνεδριών."},{"name":"HSM","def":"Μονάδα ασφάλειας υλικού: ανθεκτική σε παραβίαση συσκευή που φυλάσσει κλειδιά και εκτελεί κρυπτογραφικές λειτουργίες."}],"summary":["Οι συμμετρικοί αλγόριθμοι είναι γρήγοροι αλλά απαιτούν κοινό κλειδί· οι ασύμμετροι επιλύουν τη διανομή κλειδιών· τα υβριδικά σχήματα συνδυάζουν και τα δύο.","Οι συναρτήσεις κατακερματισμού παρέχουν έλεγχο ακεραιότητας και όχι εμπιστευτικότητα· οι κωδικοί απαιτούν αργές συναρτήσεις κατακερματισμού με αλάτι.","Οι ψηφιακές υπογραφές παρέχουν ακεραιότητα και αυθεντικότητα· η μη αποποίηση εξαρτάται επιπλέον από τη φύλαξη των κλειδιών και το νομικό πλαίσιο.","Η ΥΔΚ συνδέει κλειδιά με ταυτότητες μέσω αλυσίδων πιστοποιητικών· η διαχείριση του κύκλου ζωής και η ανάκληση είναι απαραίτητες.","Το TLS 1.3 προσφέρει γρήγορη χειραψία με εμπρόσθια μυστικότητα, όμως οι περισσότερες πραγματικές αποτυχίες οφείλονται σε κακή διαχείριση κλειδιών."],"review":["Γιατί τα πρακτικά συστήματα δεν κρυπτογραφούν μεγάλα αρχεία απευθείας με RSA;","Ένας προγραμματιστής αποθηκεύει τους κωδικούς ως συνόψεις SHA-256 χωρίς αλάτι. Εξηγήστε τον κίνδυνο και προτείνετε καλύτερο σχεδιασμό.","Περιγράψτε βήμα προς βήμα πώς ένας φυλλομετρητής επαληθεύει την αλυσίδα πιστοποιητικών ενός ιστοτόπου.","Εξηγήστε την εμπρόσθια μυστικότητα και γιατί το TLS 1.3 κατάργησε τη στατική ανταλλαγή κλειδιών RSA."],"cli":{"title":"Προσομοιωτής Κρυπτογραφίας OpenSSL, Παραγωγής Κλειδιών & PKI","desc":"Δημιουργήστε ζεύγος κλειδιών RSA 4096-bit, εξάγετε το δημόσιο κλειδί, δημιουργήστε αίτημα υπογραφής πιστοποιητικού (CSR) και εξετάστε πιστοποιητικά X.509 με το OpenSSL.","meta":["⏱️ ~30 min","🐚 analyst@crypto-lab:~$"],"tasks":[{"pill":"Task 1","name":"Παραγωγή Ιδιωτικού Κλειδιού RSA 4096-bit","instr":"Δημιουργήστε ένα ιδιωτικό κλειδί RSA 4096-bit και αποθηκεύστε το στο `private.key` με το `openssl genrsa`.","hint":"Εκτελέστε: openssl genrsa -out private.key 4096","cmd":"$ openssl genrsa -out private.key 4096","ok":"Το ιδιωτικό κλειδί RSA 4096-bit δημιουργήθηκε επιτυχώς με εκθέτη e=65537."},{"pill":"Task 2","name":"Εξαγωγή Δημόσιου Κλειδιού RSA από το Ιδιωτικό Κλειδί","instr":"Εξάγετε το αντίστοιχο δημόσιο κλειδί από το `private.key` στο αρχείο `public.key`.","hint":"Εκτελέστε: openssl rsa -in private.key -pubout -out public.key","cmd":"$ openssl rsa -in private.key -pubout -out public.key","ok":"Το δημόσιο κλειδί εξήχθη επιτυχώς σε μορφή PEM."},{"pill":"Task 3","name":"Δημιουργία Αιτήματος Υπογραφής Πιστοποιητικού (CSR)","instr":"Δημιουργήστε ένα αίτημα υπογραφής πιστοποιητικού SHA-256 `req.csr` για το όνομα `api.secure-gateway.corp`.","hint":"Εκτελέστε: openssl req -new -key private.key -out req.csr","cmd":"$ openssl req -new -key private.key -out req.csr","ok":"Το CSR δημιουργήθηκε με αποτύπωμα SHA-256! Έτοιμο για υποβολή στην Αρχή Πιστοποίησης."},{"pill":"Task 4","name":"Έλεγχος Ιδιοτήτων & Εγκυρότητας Πιστοποιητικού X.509","instr":"Εμφανίστε τα αναγνώσιμα πεδία του πιστοποιητικού X.509 (Subject, Issuer, Validity) από το `cert.crt`.","hint":"Εκτελέστε: openssl x509 -in cert.crt -text -noout","cmd":"$ openssl x509 -in cert.crt -text -noout","ok":"Το πιστοποιητικό επικυρώθηκε! Επιβεβαιώθηκαν το CN, το κλειδί RSA 4096 και η περίοδος εγκυρότητας."}]},"lab":{"title":"Ανάπτυξη Υποδομής PKI Δύο Επιπέδων, Διαχείριση Κύκλου Ζωής Πιστοποιητικών & Ενίσχυση TLS 1.3","desc":"Σε αυτό το ολοκληρωμένο εργαστήριο 2 ωρών, οι φοιτητές κατασκευάζουν μια εταιρική Υποδομή Δημόσιου Κλειδιού (PKI) από το μηδέν με το OpenSSL. Θα δημιουργήσετε μια απομονωμένη (offline) Root Αρχή Πιστοποίησης (CA), μια Ενδιάμεση Εκδίδουσα CA (Subordinate CA), θα ρυθμίσετε λίστες ανάκλησης CRL και πρωτόκολλο OCSP, θα εκδώσετε πιστοποιητικά εξυπηρετητών με SAN (Subject Alternative Names) και θα ενισχύσετε web servers με TLS 1.3 και Perfect Forward Secrecy (PFS).","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Linux PKI workstation with OpenSSL 3.0+ / 3.2+ FIPS compliant utilities","Directory structure: `/root/ca/root-ca/` and `/root/ca/intermediate-ca/`","Nginx web server with TLS 1.3 support","Command line tools: `openssl`, `curl -v`, `sslscan`, `testssl.sh`"],"phases":[{"badge":"Phase 1","name":"Αρχικοποίηση Offline Root CA & Αυτοϋπογεγραμμένο Πιστοποιητικό Root","dur":"⏱️ 25 λεπτά","objs":["Δημιουργία ασφαλούς ιεραρχίας καταλόγων PKI και αρχείων ρυθμίσεων OpenSSL.","Παραγωγή κρυπτογραφημένου ιδιωτικού κλειδιού Root CA RSA 4096-bit με AES-256.","Αυτοϋπογραφή του 20ετούς Πιστοποιητικού Root με `basicConstraints=critical,CA:TRUE`."],"steps":[{"type":"p","text":"1. Αρχικοποίηση δομής καταλόγων Root CA:\\n```bash\\nmkdir -p /root/ca/root-ca/{certs,crl,newcerts,private}\\nchmod 700 /root/ca/root-ca/private\\ntouch /root/ca/root-ca/index.txt\\necho 1000 > /root/ca/root-ca/serial\\n```"},{"type":"p","text":"2. Παραγωγή ιδιωτικού κλειδιού Root CA:\\n```bash\\nopenssl genrsa -aes256 -out /root/ca/root-ca/private/root-ca.key 4096\\n```"},{"type":"p","text":"3. Δημιουργία αυτοϋπογεγραμμένου πιστοποιητικού Root:\\n```bash\\nopenssl req -config /root/ca/root-ca/openssl.cnf -key /root/ca/root-ca/private/root-ca.key -new -x509 -days 7300 -sha256 -extensions v3_ca -out /root/ca/root-ca/certs/root-ca.crt\\n```"}]},{"badge":"Phase 2","name":"Έκδοση Ενδιάμεσης CA & Αλυσίδα Εμπιστοσύνης","dur":"⏱️ 45 λεπτά","objs":["Παραγωγή ιδιωτικού κλειδιού Ενδιάμεσης CA και CSR.","Υπογραφή του πιστοποιητικού Ενδιάμεσης CA με το κλειδί της Root CA και περιορισμό `pathlen:0`.","Σύνθεση του πλήρους πακέτου αλυσίδας πιστοποιητικών (CA-bundle)."],"steps":[{"type":"p","text":"1. Παραγωγή κλειδιού και CSR Ενδιάμεσης CA:\\n```bash\\nopenssl genrsa -aes256 -out /root/ca/intermediate-ca/private/intermediate-ca.key 4096\\nopenssl req -config /root/ca/intermediate-ca/openssl.cnf -new -sha256 -key /root/ca/intermediate-ca/private/intermediate-ca.key -out /root/ca/intermediate-ca/csr/intermediate-ca.csr\\n```"},{"type":"p","text":"2. Υπογραφή του πιστοποιητικού Ενδιάμεσης CA από τη Root CA:\\n```bash\\nopenssl ca -config /root/ca/root-ca/openssl.cnf -extensions v3_intermediate_ca -days 3650 -notext -md sha256 -in /root/ca/intermediate-ca/csr/intermediate-ca.csr -out /root/ca/intermediate-ca/certs/intermediate-ca.crt\\n```"},{"type":"p","text":"3. Δημιουργία αρχείου αλυσίδας εμπιστοσύνης (chain):\\n```bash\\ncat /root/ca/intermediate-ca/certs/intermediate-ca.crt /root/ca/root-ca/certs/root-ca.crt > /root/ca/intermediate-ca/certs/ca-chain.cert.pem\\n```"}]},{"badge":"Phase 3","name":"Έκδοση Πιστοποιητικού Εξυπηρετητή με Subject Alternative Names (SAN)","dur":"⏱️ 30 λεπτά","objs":["Παραγωγή ιδιωτικού κλειδιού server και CSR με πολλαπλά SAN DNS entries.","Υπογραφή του πιστοποιητικού server από την Ενδιάμεση CA.","Επαλήθευση της αλυσίδας εμπιστοσύνης με `openssl verify`."],"steps":[{"type":"p","text":"1. Παραγωγή ιδιωτικού κλειδιού server:\\n```bash\\nopenssl genrsa -out /etc/ssl/server.key 2048\\n```"},{"type":"p","text":"2. Έκδοση πιστοποιητικού server με επεκτάσεις SAN από την Ενδιάμεση CA:\\n```bash\\nopenssl ca -config /root/ca/intermediate-ca/openssl.cnf -extensions server_cert -days 375 -notext -md sha256 -in server.csr -out server.crt\\n```"},{"type":"p","text":"3. Επαλήθευση αλυσίδας εμπιστοσύνης:\\n```bash\\nopenssl verify -CAfile /root/ca/intermediate-ca/certs/ca-chain.cert.pem server.crt\\n```"}]},{"badge":"Phase 4","name":"Ενίσχυση Web Server TLS 1.3 & Ανάκληση Πιστοποιητικών (CRL/OCSP)","dur":"⏱️ 20 λεπτά","objs":["Ρύθμιση του Nginx για απενεργοποίηση παλαιών πρωτοκόλλων και επιβολή TLS 1.3 με σουίτες ECDHE.","Ανάκληση παραβιασμένου πιστοποιητικού στο OpenSSL και δημοσίευση υπογεγραμμένης CRL.","Έλεγχος ασφάλειας TLS του εξυπηρετητή με το εργαλείο `sslscan`."],"steps":[{"type":"p","text":"1. Ρύθμιση παραμέτρων TLS στο Nginx:\\n```nginx\\nssl_protocols TLSv1.2 TLSv1.3;\\nssl_prefer_server_ciphers off;\\nssl_ciphers \'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384\';\\n```"},{"type":"p","text":"2. Ανάκληση πιστοποιητικού:\\n```bash\\nopenssl ca -config /root/ca/intermediate-ca/openssl.cnf -revoke /root/ca/intermediate-ca/certs/compromised.crt\\nopenssl ca -config /root/ca/intermediate-ca/openssl.cnf -gencrl -out /var/www/pki/intermediate.crl\\n```"},{"type":"p","text":"3. Έλεγχος ποιότητας κρυπτογραφικών σουιτών με `sslscan 127.0.0.1:443`."}]}],"checklist":["Η Root CA έχει basicConstraints=critical,CA:TRUE και ιδιωτικό κλειδί με δικαιώματα 0400.","Η Ενδιάμεση CA έχει περιορισμό pathlen=0.","Το πιστοποιητικό server περιέχει έγκυρα SANs και περνά τον έλεγχο openssl verify .","Ο Nginx απορρίπτει TLS 1.0/1.1 και αδύναμους ciphers CBC κατά τη σάρωση με sslscan ."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Διαχείριση Κρυπτογραφικών Κλειδιών & Σχεδιασμός Υβριδικού Πρωτοκόλλου Κρυπτογράφησης","desc":"Μια αεροδιαστημική αμυντική βιομηχανία απαιτεί ένα εξαιρετικά ασφαλές, υβριδικό κρυπτογραφικό πρωτόκολλο επικοινωνίας για ανταλλαγή δεδομένων τηλεμετρίας μεταξύ σταθμών βάσης και αυτόνομων οχημάτων. Σας ανατίθεται ως Επικεφαλής Αρχιτέκτονας Κρυπτογραφίας να σχεδιάσετε ένα υβριδικό σύστημα (AES-256-GCM + X25519 ECDH), να υλοποιήσετε έναν αγωγό αυτοματοποίησης πιστοποιητικών και να συντάξετε μια επίσημη πολιτική KMS.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Προδιαγραφή Υβριδικού Πρωτοκόλλου & Κεντρική Μηχανή Κρυπτογράφησης","desc":"Ανάπτυξη του hybrid_crypto.py για εφήμερη ανταλλαγή κλειδιών ECDH, παραγωγή κλειδιών με HKDF και κρυπτογράφηση AES-256-GCM.","spec":["Αρχιτεκτονική αγωγού συλλογής logs για διαχείριση 20.000 EPS σε hybrid cloud περιβάλλον.","Σχεδιασμός Kafka buffers και parsers για κανονικοποίηση σε σχήμα OCSF.","Προδιαγραφή κλιμακωτής αποθήκευσης hot-warm-cold με WORM αρχειοθέτηση."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα κρυπτογραφίας Python + επαλήθευση δοκιμαστικών διανυσμάτων."},{"num":"M2","title":"Υποσύστημα Ψηφιακών Υπογραφών & Μη Αποποίησης","desc":"Υλοποίηση ψηφιακών υπογραφών Ed25519 σε πακέτα τηλεμετρίας με ενσωματωμένη προστασία από επιθέσεις επανάληψης (replay).","spec":["Ανάπτυξη 25 κανόνων ανίχνευσης Sigma YAML αντιστοιχισμένων στο MITRE ATT&CK.","Υλοποίηση κανόνων συσχέτισης πολλαπλών σταδίων (Pass-the-Hash, C2 beaconing).","Κατασκευή μηχανής δυναμικής καταστολής ψευδών συναγερμών (μείωση 80%)."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα επαλήθευσης υπογραφών + αναφορά επιδόσεων."},{"num":"M3","title":"Αυτοματοποιημένη Υπηρεσία Έκδοσης & Ανανέωσης Πιστοποιητικών (ACME)","desc":"Ανάπτυξη πράκτορα που επικοινωνεί με ACME CA για αυτόματη περιστροφή πιστοποιητικών mTLS κάθε 60 ημέρες.","spec":["Αρχιτεκτονική μηχανής αυτοματοποιημένων playbooks SOAR.","Υλοποίηση playbooks: απομόνωση host μέσω EDR API, sinkholing κακόβουλων domains και ανάκληση tokens.","Σχεδιασμός σημείων έγκρισης human-in-the-loop μέσω Slack/Teams."],"deliv":"📦 Παραδοτέο Οροσήμου: Δαίμονας ανανέωσης ACME + σενάριο δοκιμών."},{"num":"M4","title":"Επιχειρησιακή Πολιτική Διαχείρισης Κρυπτογραφικών Κλειδιών (KMS)","desc":"Σύνταξη της πλήρους πολιτικής KMS με αποθήκευση HSM, διαμοιρασμό μυστικών Shamir και οδικό χάρτη μετάβασης σε μετα-κβαντική κρυπτογραφία.","spec":["Κατασκευή real-time dashboard λειτουργίας SOC με μετρικές MTTD (< 15 min) και MTTR (< 60 min).","Καθορισμός διαδικασιών κλιμάκωσης αναλυτών Tier 1/2/3 και οδηγών triage.","Σύνταξη πλήρους Εγχειριδίου Λειτουργίας SOC & Threat Hunting (15 σελίδες)."],"deliv":"📦 Παραδοτέο Οροσήμου: Ολοκληρωμένο Έγγραφο Αρχιτεκτονικής & Πολιτικής KMS (10–12 σελίδες)."}],"deliverables":["Πηγαίος Κώδικας Υβριδικής Βιβλιοθήκης Κρυπτογραφίας (`/src/hybrid_crypto/`)","Πράκτορας Αυτόματης Ανανέωσης Πιστοποιητικών ACME (`/src/acme_agent/`)","Δοκιμαστικά Διανύσματα & Μετρήσεις Απόδοσης (`benchmarks.json`)","Φάκελος Πολιτικής & Αρχιτεκτονικής Διαχείρισης Κλειδιών KMS (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου SIEM Log Collector & Μηχανής Συσχέτισης Κανόνων Sigma σε Python","desc":"Τα κέντρα επιχειρήσεων ασφαλείας (SOC) βασίζονται σε συστήματα SIEM για συλλογή και ανάλυση εκατομμυρίων logs σε πραγματικό χρόνο. Θα κατασκευάσετε ένα πλήρες Mini-SIEM σε Python ( mini_siem.py ). Η μηχανή θα δέχεται εγγραφές Syslog (RFC 5424), θα τις κανονικοποιεί σε μορφή JSON (OCSF), θα τις αξιολογεί έναντι κανόνων ανίχνευσης Sigma σε YAML, θα εντοπίζει επιθέσεις πολλαπλών συμβάντων (π.χ. brute-force) και θα ενεργοποιεί αυτοματοποιημένες ενέργειες SOAR μέσω webhooks.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Ασύγχρονος Δέκτης Syslog & Αγωγός Συλλογής","desc":"Δημιουργία του network listener που συλλέγει μηνύματα Syslog μέσω UDP 514 και TCP 514 με ουρές buffering.","spec":["Υλοποίηση servers `asyncio.DatagramProtocol` και `asyncio.Protocol` στη θύρα 514.","Προώθηση μηνυμάτων σε ασύγχρονη ουρά `asyncio.Queue`.","Διαχείριση backpressure για αποφυγή υπερχείλισης μνήμης."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα syslog_receiver.py με διαχείριση 5.000 EPS."},{"num":"M2","title":"Κανονικοποίηση Logs & Αναλυτής Σχήματος OCSF","desc":"Υλοποίηση parsers που μετατρέπουν αδόμητα logs σε τυποποιημένα JSON συμβάντα OCSF.","spec":["Ανάλυση logs Linux auth (`Failed password for invalid user`).","Ανάλυση Nginx access logs (HTTP μέθοδος, status, IP, URI).","Συμπλήρωση τυποποιημένων πεδίων OCSF (`@timestamp`, `src_ip`, `event_type`, `severity`)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα normalizer.py + δοκιμές για 10 μορφές logs."},{"num":"M3","title":"Μεταγλωττιστής Κανόνων Sigma YAML & Μηχανή Αντιστοίχισης AST","desc":"Κατασκευή μηχανής που φορτώνει κανόνες Sigma YAML, αναλύει λογικές συνθήκες και αξιολογεί τα κανονικοποιημένα συμβάντα σε πραγματικό χρόνο.","spec":["Ανάλυση κανόνων Sigma YAML (`title`, `logsource`, `detection`).","Μεταγλώττιση τροποποιητών (`contains`, `endswith`, `re`) σε συναρτήσεις Python.","Παρακολούθηση sliding-window: ενεργοποίηση ειδοποίησης όταν μια συνθήκη εμφανίζεται > 5 φορές σε 60s από την ίδια IP."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα sigma_engine.py με 15 κανόνες Sigma."},{"num":"M4","title":"Διανομέας Ειδοποιήσεων Webhook & Κονσόλα SOC","desc":"Κατασκευή επιπέδου διαχείρισης ειδοποιήσεων με αποθήκευση σε SQLite, αποστολή webhooks σε SOAR/Slack και web κονσόλα SOC με FastAPI.","spec":["Αποθήκευση ειδοποιήσεων σε SQLite (`alert_id`, `rule_name`, `severity`, `src_ip`).","Αποστολή αυτοματοποιημένων JSON webhooks σε εξωτερικά endpoints SOAR.","Παροχή web dashboard στο FastAPI με ζωντανή ανανέωση ειδοποιήσεων."],"deliv":"📦 Παραδοτέο Λογισμικού: Ολοκληρωμένη εφαρμογή mini_siem.py + web dashboard."}],"deliverables":["Πλήρης πηγαίος κώδικας SIEM (`/mini_siem/`)","Φάκελος κανόνων ανίχνευσης Sigma (`/rules/`) με 20+ κανόνες","Web κονσόλα διαχείρισης περιστατικών SOC (FastAPI + WebSockets)","Εγχειρίδιο Μηχανικής Ανίχνευσης SIEM (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 7","quiz":[{"q":"Σε ένα Κέντρο Επιχειρήσεων Ασφάλειας (SOC), ποιος είναι ο βασικός αρχιτεκτονικός σκοπός ενός συστήματος SIEM;","opts":[{"k":"A","v":"Να μεταγλωττίζει απλά scripts χρηστών σε οδηγούς συσκευών πυρήνα κατά την εκκίνηση του συστήματος, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Να αντικαθιστά συμμετρικούς αλγορίθμους με μετα-κβαντικά ασύμμετρα κρυπτογραφικά σχήματα πλεγμάτων, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Να συγκεντρώνει, να κανονικοποιεί και να συσχετίζει αρχεία καταγραφής από πολλαπλές πηγές για εντοπισμό απειλών."},{"k":"D","v":"Να δημιουργεί τούνελ peer-to-peer υψηλής ταχύτητας σε υποθαλάσσια καλώδια διεθνών επικοινωνιών, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Να διαχειρίζεται κάρτες φυσικής πρόσβασης στις εγκαταστάσεις και βάσεις βιομετρικών δεδομένων προσωπικού, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"C","exp":"Το SIEM συλλέγει logs από endpoints, δίκτυο και cloud, τα κανονικοποιεί και εκτελεί κανόνες συσχέτισης για τον εντοπισμό επιθέσεων και την άμεση ειδοποίηση των αναλυτών."},{"q":"Πώς βοηθά το πλαίσιο MITRE ATT&CK τους αναλυτές ασφάλειας στον εντοπισμό απειλών και στην προσομοίωση αντιπάλων;","opts":[{"k":"A","v":"Παράγοντας αυτόματα έγκυρα ιδιωτικά κλειδιά RSA-4096 για όλους τους σταθμούς εργασίας της επιχείρησης, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Αντικαθιστώντας ερωτήματα SQL με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα σε τοπικούς φακέλους, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Επιβάλλοντας αυστηρούς φυσικούς βιομετρικούς ελέγχους στις εξωτερικές πύλες εισόδου των εγκαταστάσεων, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Κατηγοριοποιώντας τις συμπεριφορές επιτιθέμενων σε έναν δομημένο πίνακα Τακτικών, Τεχνικών και Διαδικασιών (TTPs)."},{"k":"E","v":"Μεταφράζοντας τον κώδικα JavaScript σε ιδιόκτητες εντολές μηχανής επιπέδου υλικού επεξεργαστή, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"D","exp":"Το MITRE ATT&CK είναι μια παγκόσμια βάση γνώσης τακτικών, τεχνικών και διαδικασιών (TTPs) βασισμένη σε πραγματικές επιθέσεις, προσφέροντας κοινή γλώσσα για ανάλυση και άμυνα."},{"q":"Ποιο είναι το βασικό τεχνικό πλεονέκτημα της περιγραφής κανόνων ανίχνευσης μέσω του ανοικτού προτύπου Sigma;","opts":[{"k":"A","v":"Οι κανόνες Sigma μετατρέπουν σχεσιακούς πίνακες SQL σε μη σχεσιακά έγγραφα δεδομένων κατά την εκτέλεση, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Το Sigma καταργεί την ανάγκη αποθήκευσης καταγραφών διαγράφοντας τα συμβάντα αμέσως μετά τη συλλογή, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Το Sigma κρυπτογραφεί τα swap partitions του λειτουργικού με μετα-κβαντικούς αλγορίθμους πλεγμάτων, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Το Sigma περιορίζει τα δικαιώματα του διαχειριστή root κατά τη διάρκεια προγραμματισμένης συντήρησης, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Το Sigma παρέχει μια ανεξάρτητη μορφή YAML που μεταγλωττίζεται σε ερωτήματα για Splunk, Elastic, Sentinel κ.ά."}],"ans":"E","exp":"Το Sigma είναι ένα ανοικτό πρότυπο YAML που επιτρέπει τη συγγραφή κανόνων ανίχνευσης μία φορά και τη μεταγλώττισή τους στη γλώσσα ερωτημάτων οποιουδήποτε SIEM (Splunk, Elastic, QRadar)."},{"q":"Ποια κύρια δυνατότητα προσφέρει μια πλατφόρμα SOAR σε ένα σύγχρονο Κέντρο Επιχειρήσεων Ασφάλειας (SOC);","opts":[{"k":"A","v":"Αυτοματοποιεί ροές αντιμετώπισης περιστατικών (playbooks) εκτελώντας ενέργειες περιορισμού σε ταχύτητα μηχανής."},{"k":"B","v":"Μεταγλωττίζει τον πηγαίο κώδικα εφαρμογών σε οδηγούς συσκευών πυρήνα υψηλής υπολογιστικής ταχύτητας, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Καταργεί πλήρως την ανάγκη χρήσης ψηφιακών πιστοποιητικών σε όλα τα εσωτερικά και εξωτερικά δίκτυα."},{"k":"D","v":"Διαχειρίζεται τα συστήματα κλιματισμού HVAC και τις γεννήτριες ισχύος στα εταιρικά κέντρα δεδομένων, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Δρομολογεί όλη την εσωτερική κίνηση του τοπικού δικτύου μέσω αναξιόπιστων εξωτερικών κόμβων proxy, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"A","exp":"Το SOAR διασυνδέει εργαλεία ασφάλειας και εκτελεί αυτοματοποιημένα playbooks (απομόνωση σταθμών, αποκλεισμός IPs, ανάκληση tokens) για την άμεση αντιμετώπιση απειλών σε δευτερόλεπτα."},{"q":"Στον κύκλο ζωής απόκρισης περιστατικών PICERL, ποιος είναι ο κύριος στόχος της φάσης \'Περιορισμού\' (Containment);","opts":[{"k":"A","v":"Να συντάξει εκθέσεις διερεύνησης περιστατικού και να διανείμει περιλήψεις στο διοικητικό συμβούλιο, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Να σταματήσει την εξάπλωση του συμβάντος και να αποτρέψει περαιτέρω ζημιά διατηρώντας τα ιατροδικαστικά πειστήρια."},{"k":"C","v":"Να αγοράσει νέο υλικό εξυπηρετητών και να αντικαταστήσει όλους τους δρομολογητές του δικτύου, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Να εκτελέσει ετήσιες δοκιμές διείσδυσης (penetration testing) και ασκήσεις προσομοίωσης red team, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Να επαναφέρει άμεσα όλα τα αντίγραφα ασφαλείας των βάσεων δεδομένων στο περιβάλλον παραγωγής, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"B","exp":"Ο Περιορισμός (Containment) αποσκοπεί στον άμεσο έλεγχο της εξάπλωσης της επίθεσης (απομόνωση δικτύου, απενεργοποίηση λογαριασμών), διαφυλάσσοντας παράλληλα τα ψηφιακά πειστήρια."},{"q":"Γιατί είναι απαραίτητη η τήρηση μιας αυστηρής \'Αλυσίδας Επιμέλειας\' (Chain of Custody) κατά τις ψηφιακές ιατροδικαστικές έρευνες;","opts":[{"k":"A","v":"Για να βελτιστοποιεί την ταχύτητα εγγραφής του δίσκου κατά τη δημιουργία αντιγράφων τομέα-προς-τομέα, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Για να μετατρέπει δυαδικά αρχεία μνήμης σε αναγνώσιμο κείμενο κατά τη διάρκεια της ανάλυσης, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Για να τεκμηριώνει χρονολογικά την κατοχή πειστηρίων, διασφαλίζοντας ακεραιότητα και αποδεκτή ισχύ στο δικαστήριο."},{"k":"D","v":"Για να παρακάμπτει τους ελέγχους ασφάλειας του λειτουργικού κατά τη συλλογή πτητικής μνήμης RAM, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Για να επιτρέπει σε απλούς χρήστες να αλλάζουν την κατάσταση των καταγεγραμμένων περιστατικών, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"C","exp":"Η Αλυσίδα Επιμέλειας καταγράφει ποιος συνέλεξε, μετέφερε και ανέλυσε τα ψηφιακά πειστήρια, αποδεικνύοντας μέσω κρυπτογραφικών hashes ότι δεν αλλοιώθηκαν ώστε να γίνονται δεκτά στο δικαστήριο."},{"q":"Ποια είναι η βασική διαφορά μεταξύ Δεικτών Παραβίασης (IoCs) και Δεικτών Επίθεσης (IoAs);","opts":[{"k":"A","v":"Τα IoCs αφορούν μόνο φυσικές κλειδαριές, ενώ τα IoAs αφορούν μόνο μονάδες διαχείρισης μνήμης MMU, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Τα IoCs παράγονται μόνο από κβαντικούς υπολογιστές, ενώ τα IoAs παράγονται μόνο από κλασικούς διακομιστές, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Τα IoCs κρυπτογραφούνται με κλειδιά AES, ενώ τα IoAs κατακερματίζονται με απλά checksums MD5, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Τα IoCs είναι ιατροδικαστικά ίχνη παρελθούσας παραβίασης (hashes, IPs), ενώ τα IoAs εντοπίζουν ενεργή συμπεριφορά."},{"k":"E","v":"Τα IoCs εξετάζονται μόνο από νομικές ομάδες, ενώ τα IoAs παρακολουθούνται μόνο από το τμήμα HR, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"D","exp":"Τα IoCs δείχνουν τι συνέβη στο παρελθόν (hashes κακόβουλων αρχείων, κακόβουλες IPs). Τα IoAs εστιάζουν στη συμπεριφορά και την πρόθεση του επιτιθέμενου κατά την εξέλιξη της επίθεσης."},{"q":"Ποια προληπτική πρακτική ασφάλειας περιλαμβάνει τη διερεύνηση τηλεμετρίας δικτύου για τον εντοπισμό απειλών που διέφυγαν από τα εργαλεία ανίχνευσης;","opts":[{"k":"A","v":"Disaster Recovery Failover, μεταφέροντας φορτία containers μεταξύ γεωγραφικών ζωνών διαθεσιμότητας cloud."},{"k":"B","v":"Στατική Συσκότιση Κώδικα (Obfuscation), αναδιατάσσοντας εντολές μηχανής για παρεμπόδιση αντίστροφης μηχανικής, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Διαπραγμάτευση Εύρους Pen Testing, καθορίζοντας συμβατικούς όρους ευθύνης πριν από ασκήσεις red team."},{"k":"D","v":"Θερμική Επιβράδυνση Υλικού, μειώνοντας τη συχνότητα του επεξεργαστή για αποτροπή υπερθέρμανσης, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Threat Hunting, δοκιμάζοντας υποθέσεις σε δεδομένα τηλεμετρίας για τον εντοπισμό κρυφών ενεργειών επιτιθέμενων."}],"ans":"E","exp":"Το Threat Hunting είναι μια προληπτική διαδικασία όπου οι αναλυτές διατυπώνουν υποθέσεις και αναλύουν δεδομένα για να εντοπίσουν προηγμένες απειλές (APTs) που απέφυγαν τις αυτόματες ειδοποιήσεις."},{"q":"Γιατί η φάση των \'Διδαγμάτων\' (Lessons Learned) θεωρείται κρίσιμη στη μακροπρόθεσμη διαχείριση περιστατικών;","opts":[{"k":"A","v":"Για τη διεξαγωγή ανάλυσης ριζικών αιτιών χωρίς απόδοση ευθυνών και την εφαρμογή μέτρων για αποτροπή επανάληψης."},{"k":"B","v":"Για τη μόνιμη απόσυρση όλων των δρομολογητών και την αντικατάστασή τους με ασύρματα σημεία πρόσβασης."},{"k":"C","v":"Για τη δημόσια αποκάλυψη των διαπιστευτηρίων πελατών σε πλατφόρμες μέσων κοινωνικής δικτύωσης."},{"k":"D","v":"Για την κατάργηση της ανάγκης μελλοντικής συνεχούς παρακολούθησης και καταγραφής αρχείων ασφάλειας."},{"k":"E","v":"Για τη μετατροπή όλων των σχεσιακών πινάκων βάσεων δεδομένων σε μη σχεσιακά έγγραφα δεδομένων."}],"ans":"A","exp":"Τα Διδάγματα (Lessons Learned) διασφαλίζουν την ανάλυση ριζικών αιτιών (RCA), τον εντοπισμό κενών στην απόκριση και την εφαρμογή νέων μέτρων ώστε να αποτραπεί η επανάληψη του συμβάντος."},{"q":"Ποιο βασικό σκοπό εξυπηρετεί η κανονικοποίηση αρχείων καταγραφής σε μορφή CEF ή JSON κατά τη συλλογή από το SIEM;","opts":[{"k":"A","v":"Κρυπτογράφηση αρχείων καταγραφής με αλγορίθμους κβαντικής διανομής κλειδιών σε δίκτυα ευρείας περιοχής, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Ομογενοποίηση διαφορετικών μορφών καταγραφής σε κοινό σχήμα, επιτρέποντας συσχέτιση και ενιαία αναζήτηση."},{"k":"C","v":"Συμπίεση δεδομένων καταγραφής σε ακουστικά σήματα για μακροχρόνια αρχειοθέτηση σε οπτικούς δίσκους, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Παράκαμψη ελέγχων πρόσβασης του λειτουργικού κατά τη συλλογή πτητικής μνήμης RAM από τον πυρήνα, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Απενεργοποίηση καταγραφών όποτε η χρήση του επεξεργαστή υπερβεί το 80% των διαθέσιμων πόρων, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"B","exp":"Η κανονικοποίηση μετατρέπει ετερογενή logs από διαφορετικές συσκευές σε ενιαία πεδία (π.χ. src_ip, user), επιτρέποντας την κοινή αναζήτηση και τη συσχέτιση κανόνων."}]},{"part":"Μέρος 3 · Μηχανισμοί Προστασίας και Ασφαλής Μηχανική","time":"Κεφάλαιο 8 · ⏱️ 9–11 ώρες μελέτης","title":"8. Ταυτότητα, Υπηρεσίες Καταλόγου και Ομοσπονδιακή Ενιαία Σύνδεση","subtitle":"IAM · Παράγοντες ταυτοποίησης και MFA · FIDO2 · RBAC και ABAC · LDAP και Active Directory · Kerberos · SAML, OAuth 2.0 και OpenID Connect","outcomes":["Να διακρίνετε την αναγνώριση, την ταυτοποίηση (αυθεντικοποίηση), την εξουσιοδότηση και την καταγραφή.","Να συγκρίνετε τους παράγοντες ταυτοποίησης και να εξηγείτε γιατί το FIDO2 αντιστέκεται στο ηλεκτρονικό ψάρεμα.","Να επιλέγετε μεταξύ RBAC, ABAC και ελέγχου πρόσβασης βάσει κανόνων για ένα δεδομένο σενάριο.","Να εξηγείτε τη ροή εισιτηρίων του Kerberos και τις αρχές πίσω από τις επιθέσεις Kerberoasting, pass-the-ticket και golden ticket.","Να περιγράφετε τον ρόλο των SAML, OAuth 2.0 και OpenID Connect, καθώς και συνήθεις αδυναμίες της ομοσπονδίας ταυτοτήτων."],"intro":["Καθώς οι οργανισμοί μεταφέρονται σε υπηρεσίες νέφους και στην απομακρυσμένη εργασία, η περίμετρος του δικτύου χάνει το νόημά της και **η ταυτότητα γίνεται η νέα περίμετρος**. Οι περισσότερες σύγχρονες εισβολές δεν σπάνε την κρυπτογράφηση ούτε εκμεταλλεύονται εξωτικές ευπάθειες· συνδέονται με κλεμμένα ή καταχρηστικά χρησιμοποιούμενα διαπιστευτήρια. Η κατανόηση του τρόπου με τον οποίο δημιουργούνται, επαληθεύονται, εξουσιοδοτούνται και ομοσπονδοποιούνται οι ταυτότητες είναι επομένως κεντρική για τη σύγχρονη άμυνα.","Το κεφάλαιο στηρίζεται στα κρυπτογραφικά θεμέλια του Κεφαλαίου 7. Ξεκινά με την αρχιτεκτονική της διαχείρισης ταυτότητας και πρόσβασης και με τους παράγοντες που χρησιμοποιούνται για την ταυτοποίηση, συμπεριλαμβανομένου του ανθεκτικού στο ψάρεμα FIDO2. Στη συνέχεια συγκρίνει τα μοντέλα ελέγχου πρόσβασης, εξηγεί τις υπηρεσίες καταλόγου και το πρωτόκολλο Kerberos στο οποίο στηρίζονται οι τομείς Windows —μαζί με τις επιθέσεις εναντίον του— και ολοκληρώνεται με τα πρωτόκολλα ομοσπονδίας SAML, OAuth 2.0 και OpenID Connect, που επιτρέπουν την ενιαία σύνδεση πέρα από τα όρια ενός οργανισμού."],"sections":[{"id":"8.1","title":"Αρχιτεκτονική IAM: αναγνώριση, ταυτοποίηση, εξουσιοδότηση και καταγραφή","blocks":[{"type":"p","text":"Η **διαχείριση ταυτότητας και πρόσβασης** (Identity and Access Management, IAM) οργανώνεται γύρω από τέσσερα διακριτά βήματα. Η **αναγνώριση** είναι η δήλωση μιας ταυτότητας, όπως η πληκτρολόγηση ενός ονόματος χρήστη. Η **ταυτοποίηση** ή **αυθεντικοποίηση** είναι η επαλήθευση αυτής της δήλωσης, για παράδειγμα με έλεγχο ενός κωδικού ή ενός κλειδιού ασφαλείας. Η **εξουσιοδότηση** καθορίζει τι επιτρέπεται να κάνει το υποκείμενο που ταυτοποιήθηκε. Η **καταγραφή** (ή λογιστική παρακολούθηση) καταγράφει τι έκανε πράγματι το υποκείμενο, υποστηρίζοντας τη λογοδοσία και τις έρευνες. Η σύγχυση αυτών των βημάτων οδηγεί σε σχεδιαστικά σφάλματα —για παράδειγμα, στην αντιμετώπιση ενός επιτυχώς ταυτοποιημένου χρήστη ως αυτομάτως εξουσιοδοτημένου για κάθε πόρο."},{"type":"p","text":"Η IAM καλύπτει επίσης τον **κύκλο ζωής της ταυτότητας**: οι λογαριασμοί πρέπει να δημιουργούνται όταν κάποιος εντάσσεται στον οργανισμό, να προσαρμόζονται όταν αλλάζει ρόλο και να απενεργοποιούνται άμεσα όταν αποχωρεί. Οι ορφανοί λογαριασμοί πρώην εργαζομένων και η σταδιακή συσσώρευση δικαιωμάτων κατά τη διάρκεια μιας επαγγελματικής πορείας —η λεγόμενη _διολίσθηση προνομίων_ (privilege creep)— συγκαταλέγονται στα πιο συνηθισμένα ευρήματα των ελέγχων ασφάλειας. Το καθιερωμένο αντίμετρο είναι οι περιοδικές **επισκοπήσεις πρόσβασης**, κατά τις οποίες οι προϊστάμενοι επιβεβαιώνουν ότι κάθε δικαίωμα εξακολουθεί να είναι αναγκαίο."}]},{"id":"8.2","title":"Παράγοντες ταυτοποίησης, MFA και FIDO2 ανθεκτικό στο ψάρεμα","blocks":[{"type":"p","text":"Οι παράγοντες ταυτοποίησης ομαδοποιούνται παραδοσιακά σε τρεις κατηγορίες: **κάτι που γνωρίζεις** (κωδικός ή PIN), **κάτι που έχεις** (κινητό τηλέφωνο, έξυπνη κάρτα ή κλειδί ασφαλείας) και **κάτι που είσαι** (βιομετρικό χαρακτηριστικό, όπως το δακτυλικό αποτύπωμα). Ο **έλεγχος ταυτότητας πολλαπλών παραγόντων** (Multi-Factor Authentication, MFA) συνδυάζει παράγοντες από _διαφορετικές_ κατηγορίες, ώστε η υποκλοπή ενός παράγοντα να μην αρκεί. Ωστόσο, δεν είναι όλες οι μορφές MFA εξίσου ισχυρές. Οι κωδικοί μίας χρήσης μέσω SMS μπορούν να υποκλαπούν με αντικατάσταση κάρτας SIM (SIM swapping)· οι χρονικά μεταβαλλόμενοι κωδικοί εφαρμογών ταυτοποίησης (TOTP, σύμφωνα με τα πρότυπα OATH) και οι ειδοποιήσεις push μπορούν ακόμη να αναμεταδοθούν από έναν διακομιστή ψαρέματος σε πραγματικό χρόνο."},{"type":"p","text":"Το **FIDO2/WebAuthn** αλλάζει ριζικά αυτή την εικόνα. Κατά την εγγραφή, ο αυθεντικοποιητής —ένα κλειδί ασφαλείας ή το ασφαλές υλικό ενός κινητού ή φορητού υπολογιστή— δημιουργεί ένα ζεύγος κλειδιών ειδικά για τον συγκεκριμένο ιστότοπο. Κατά τη σύνδεση, υπογράφει μια πρόκληση που περιλαμβάνει την προέλευση (origin) του ιστοτόπου. Ένας ψεύτικος ιστότοπος με διαφορετικό όνομα τομέα λαμβάνει επομένως μια υπογραφή άχρηστη για τον πραγματικό ιστότοπο, και δεν υπάρχει κοινό μυστικό προς υποκλοπή. Γι\' αυτό το FIDO2 χαρακτηρίζεται **ανθεκτικό στο ηλεκτρονικό ψάρεμα** και γι\' αυτό τα _passkeys_ που βασίζονται σε αυτό αντικαθιστούν τους κωδικούς σε πολλές υπηρεσίες."}]},{"id":"8.3","title":"Μοντέλα ελέγχου πρόσβασης: RBAC, ABAC και έλεγχος βάσει κανόνων","blocks":[{"type":"p","text":"Αφού ταυτοποιηθεί ένα υποκείμενο, το σύστημα πρέπει να αποφασίσει τι επιτρέπεται να κάνει. Στον **έλεγχο πρόσβασης βάσει ρόλων** (Role-Based Access Control, RBAC), τα δικαιώματα ανατίθενται σε ρόλους (για παράδειγμα _νοσηλευτής_, _λογιστής_, _διαχειριστής βάσης δεδομένων_) και οι χρήστες λαμβάνουν ρόλους. Το RBAC είναι εύκολο στην κατανόηση και στον έλεγχο, όμως οι μεγάλοι οργανισμοί μπορεί να αντιμετωπίσουν _έκρηξη ρόλων_ όταν κάθε εξαίρεση απαιτεί νέο ρόλο. Ο **έλεγχος πρόσβασης βάσει χαρακτηριστικών** (Attribute-Based Access Control, ABAC) αξιολογεί πολιτικές επί χαρακτηριστικών του υποκειμένου, του πόρου, της ενέργειας και του περιβάλλοντος —για παράδειγμα, «οι ιατροί μπορούν να διαβάζουν τους φακέλους ασθενών της δικής τους κλινικής, κατά τη διάρκεια της βάρδιάς τους, από διαχειριζόμενη συσκευή». Το ABAC είναι πιο εκφραστικό, αλλά δυσκολότερο στην ανάλυση και στον έλεγχο."},{"type":"p","text":"Ο **έλεγχος πρόσβασης βάσει κανόνων** εφαρμόζει γενικούς κανόνες που δεν εξαρτώνται από τον μεμονωμένο χρήστη, όπως οι κανόνες ενός τείχους προστασίας ή ο κανόνας «καμία σύνδεση μεταξύ μεσονυκτίου και 5 π.μ.». Στην πράξη οι οργανισμοί συνδυάζουν τα μοντέλα: οι ρόλοι παρέχουν μια σταθερή βάση, τα χαρακτηριστικά εξειδικεύουν τις αποφάσεις ανάλογα με το πλαίσιο και οι γενικοί κανόνες επιβάλλουν περιορισμούς για ολόκληρο τον οργανισμό."}]},{"id":"8.4","title":"Υπηρεσίες καταλόγου: X.500, LDAP και Active Directory","blocks":[{"type":"p","text":"Μια **υπηρεσία καταλόγου** είναι μια εξειδικευμένη, ιεραρχική βάση δεδομένων που αποθηκεύει πληροφορίες για χρήστες, ομάδες, υπολογιστές και άλλους πόρους και είναι βελτιστοποιημένη για συχνές αναγνώσεις. Το εννοιολογικό της μοντέλο προέρχεται από τα πρότυπα **X.500**, ενώ το **Lightweight Directory Access Protocol (LDAP)** είναι ο συνήθης τρόπος υποβολής ερωτημάτων και τροποποίησης. Κάθε εγγραφή προσδιορίζεται από ένα _διακεκριμένο όνομα_ (distinguished name), όπως `CN=Maria Papadopoulou,OU=Finance,DC=example,DC=com`."},{"type":"p","text":"Οι **Active Directory Domain Services (AD DS)** της Microsoft συνδυάζουν έναν κατάλογο LDAP με ταυτοποίηση Kerberos, DNS και πολιτικές ομάδας (Group Policy). Οργανώνουν τα αντικείμενα σε _τομείς_, _δέντρα_ και _δάση_, ενώ οι _ελεγκτές τομέα_ αναπαράγουν τον κατάλογο μεταξύ τους. Επειδή το AD ελέγχει την ταυτοποίηση σχεδόν κάθε συστήματος σε μια επιχείρηση Windows, η παραβίαση ενός λογαριασμού διαχειριστή τομέα σημαίνει συνήθως παραβίαση ολόκληρου του οργανισμού. Γι\' αυτό η ασφάλεια του AD οργανώνεται γύρω από την **κλιμακωτή διαχείριση** (tiered administration): οι λογαριασμοί υψηλών προνομίων χρησιμοποιούνται μόνο σε αποκλειστικά, θωρακισμένα συστήματα και ποτέ σε συνηθισμένους σταθμούς εργασίας, όπου τα διαπιστευτήριά τους θα μπορούσαν να υποκλαπούν."}]},{"id":"8.5","title":"Το Kerberos και οι επιθέσεις εναντίον του","blocks":[{"type":"p","text":"Το **Kerberos** επιτρέπει στους χρήστες να ταυτοποιούνται μία φορά και στη συνέχεια να έχουν πρόσβαση σε πολλές υπηρεσίες χωρίς να αποστέλλουν τον κωδικό τους μέσω του δικτύου. Ένα αξιόπιστο **Κέντρο Διανομής Κλειδιών** (Key Distribution Center, KDC) —στο AD, κάθε ελεγκτής τομέα— περιλαμβάνει δύο λογικές υπηρεσίες. Κατά τη σύνδεση, η **Υπηρεσία Ταυτοποίησης** (Authentication Service, AS) επαληθεύει τον χρήστη και εκδίδει ένα **Εισιτήριο Χορήγησης Εισιτηρίων** (Ticket-Granting Ticket, TGT), κρυπτογραφημένο με το κλειδί του ειδικού λογαριασμού `krbtgt`. Όταν ο χρήστης θέλει να προσπελάσει μια υπηρεσία, ο πελάτης παρουσιάζει το TGT στην **Υπηρεσία Χορήγησης Εισιτηρίων** (Ticket-Granting Service, TGS), η οποία εκδίδει ένα _εισιτήριο υπηρεσίας_ κρυπτογραφημένο με το κλειδί του λογαριασμού που εκτελεί την υπηρεσία. Η υπηρεσία αποκρυπτογραφεί το εισιτήριο και παραχωρεί την πρόσβαση. Τα εισιτήρια έχουν περιορισμένη διάρκεια ισχύος και το πρωτόκολλο προϋποθέτει συγχρονισμένα ρολόγια."},{"type":"p","text":"Ο σχεδιασμός αυτός επιτρέπει αρκετές γνωστές επιθέσεις. Στο **Kerberoasting**, οποιοσδήποτε χρήστης του τομέα ζητά εισιτήρια υπηρεσίας για λογαριασμούς που διαθέτουν _όνομα κύριας υπηρεσίας_ (Service Principal Name, SPN) και τα «σπάει» εκτός σύνδεσης· οι αδύναμοι κωδικοί λογαριασμών υπηρεσιών υποχωρούν γρήγορα. Στο **pass-the-ticket**, κλεμμένα εισιτήρια επαναχρησιμοποιούνται από άλλο μηχάνημα. Ένα **golden ticket** είναι ένα πλαστό TGT που δημιουργείται με το κλεμμένο κλειδί του `krbtgt` και παρέχει απεριόριστη πρόσβαση στον τομέα. Τα αντίμετρα περιλαμβάνουν μεγάλους τυχαίους κωδικούς ή διαχειριζόμενους λογαριασμούς υπηρεσιών ομάδας (gMSA), χρήση αποκλειστικά κρυπτογράφησης AES, προστασία των ελεγκτών τομέα ως στοιχείων της ανώτατης βαθμίδας (Tier 0), διπλή επαναφορά του κωδικού του `krbtgt` μετά από παραβίαση και παρακολούθηση ασυνήθιστων αιτημάτων εισιτηρίων."}]},{"id":"8.6","title":"Ομοσπονδιακή ταυτότητα και ενιαία σύνδεση: SAML, OAuth 2.0 και OpenID Connect","blocks":[{"type":"p","text":"Η **ομοσπονδία ταυτοτήτων** (federation) επεκτείνει την ενιαία σύνδεση πέρα από έναν οργανισμό: ο χρήστης ταυτοποιείται στον δικό του **πάροχο ταυτότητας** (Identity Provider, IdP) και πολλοί **πάροχοι υπηρεσιών** αποδέχονται αυτή την ταυτοποίηση. Το **SAML 2.0** ανταλλάσσει ψηφιακά υπογεγραμμένους _ισχυρισμούς_ (assertions) σε XML και χρησιμοποιείται ευρέως σε επιχειρησιακές εφαρμογές ιστού. Το **OAuth 2.0** δεν είναι, αυστηρά μιλώντας, πρωτόκολλο ταυτοποίησης αλλά πλαίσιο _εξουσιοδότησης_: επιτρέπει σε έναν χρήστη να παραχωρήσει σε μια εφαρμογή περιορισμένη πρόσβαση στους πόρους του (για παράδειγμα «ανάγνωση του ημερολογίου μου») μέσω έκδοσης ενός _διακριτικού πρόσβασης_ (access token), χωρίς να κοινοποιήσει τον κωδικό του. Το **OpenID Connect (OIDC)** προσθέτει ένα επίπεδο ταυτότητας πάνω από το OAuth 2.0, μέσω ενός υπογεγραμμένου _διακριτικού ταυτότητας_ (ID token) που δηλώνει ποιος είναι ο χρήστης."},{"type":"p","text":"Η ομοσπονδία συγκεντρώνει την εμπιστοσύνη και, επομένως, τον κίνδυνο. Αν ένας επιτιθέμενος υποκλέψει το κλειδί υπογραφής διακριτικών του παρόχου ταυτότητας, μπορεί να πλαστογραφήσει πρόσβαση σε κάθε συνδεδεμένη υπηρεσία —όπως συνέβη με την τεχνική _Golden SAML_ που χρησιμοποιήθηκε κατά την εκστρατεία SolarWinds. Άλλες συνήθεις αδυναμίες είναι οι εφαρμογές που δεν επικυρώνουν την υπογραφή, τον αποδέκτη ή τον χρόνο λήξης των διακριτικών· τα κλεμμένα διακριτικά συνεδρίας που επαναχρησιμοποιούνται από άλλη συσκευή· και το _ψάρεμα συγκατάθεσης_ (consent phishing), κατά το οποίο οι χρήστες εξαπατώνται ώστε να παραχωρήσουν ευρεία δικαιώματα OAuth σε κακόβουλη εφαρμογή. Οι άμυνες περιλαμβάνουν την προστασία των κλειδιών υπογραφής σε HSM, την αυστηρή επικύρωση των διακριτικών, τη μικρή διάρκεια ισχύος διακριτικών δεσμευμένων σε συσκευή και την έγκριση από διαχειριστή για συγκαταθέσεις OAuth υψηλού κινδύνου."}]}],"terms":[{"name":"Ταυτοποίηση έναντι εξουσιοδότησης","def":"Επαλήθευση του ποιος είναι ένα υποκείμενο έναντι απόφασης για το τι επιτρέπεται να κάνει."},{"name":"FIDO2 / passkey","def":"Ταυτοποίηση δημόσιου κλειδιού δεσμευμένη στην προέλευση, ανθεκτική στο ψάρεμα και χωρίς κοινό μυστικό."},{"name":"ABAC","def":"Έλεγχος πρόσβασης με βάση χαρακτηριστικά του υποκειμένου, του πόρου, της ενέργειας και του περιβάλλοντος."},{"name":"TGT","def":"Εισιτήριο χορήγησης εισιτηρίων του Kerberos, για τη λήψη εισιτηρίων υπηρεσίας χωρίς εκ νέου εισαγωγή διαπιστευτηρίων."},{"name":"Kerberoasting","def":"Αίτηση εισιτηρίων υπηρεσίας και «σπάσιμο» των κωδικών λογαριασμών υπηρεσιών εκτός σύνδεσης."},{"name":"OIDC","def":"OpenID Connect: επίπεδο ταυτότητας πάνω από το OAuth 2.0 που εκδίδει υπογεγραμμένα διακριτικά ταυτότητας."}],"summary":["Η ταυτότητα είναι η σύγχρονη περίμετρος· η IAM διακρίνει την αναγνώριση, την ταυτοποίηση, την εξουσιοδότηση και την καταγραφή και διαχειρίζεται ολόκληρο τον κύκλο ζωής της ταυτότητας.","Το MFA συνδυάζει παράγοντες από διαφορετικές κατηγορίες· το FIDO2 αντιστέκεται στο ψάρεμα επειδή οι υπογραφές δεσμεύονται στην προέλευση του ιστοτόπου.","Το RBAC προσφέρει απλότητα, το ABAC ακρίβεια με βάση το πλαίσιο και ο έλεγχος βάσει κανόνων επιβάλλει γενικούς περιορισμούς.","Το Active Directory και το Kerberos είναι στόχοι υψηλής αξίας· η κλιμακωτή διαχείριση και η σωστή διαχείριση των λογαριασμών υπηρεσιών είναι απαραίτητες.","Τα πρωτόκολλα ομοσπονδίας επιτρέπουν την ενιαία σύνδεση, αλλά συγκεντρώνουν τον κίνδυνο στα κλειδιά υπογραφής και στην επικύρωση των διακριτικών."],"review":["Γιατί ένας κωδικός μίας χρήσης μέσω SMS είναι πιο αδύναμος από ένα κλειδί ασφαλείας FIDO2 απέναντι σε έναν διακομιστή ψαρέματος πραγματικού χρόνου;","Σχεδιάστε μια πολιτική πρόσβασης για ένα σύστημα ιατρικών φακέλων με RBAC και, στη συνέχεια, εξειδικεύστε την με χαρακτηριστικά ABAC.","Εξηγήστε γιατί το Kerberoasting είναι εφικτό για οποιονδήποτε ταυτοποιημένο χρήστη του τομέα και πώς το περιορίζουν οι λογαριασμοί gMSA.","Γιατί το OAuth 2.0 από μόνο του δεν επαρκεί για την ταυτοποίηση χρηστών και τι προσθέτει το OIDC;"],"cli":{"title":"Προσομοιωτής Ασφάλειας Καταλόγου LDAP & Ταυτότητας JWT/OAuth2","desc":"Αναζητήστε μέλη ομάδων σε καταλόγους LDAP, αποκωδικοποιήστε JSON Web Tokens (JWT), επαληθεύστε ψηφιακές υπογραφές και ελέγξτε δικαιώματα OAuth2.","meta":["⏱️ ~30 min","🐚 analyst@identity-ops:~$"],"tasks":[{"pill":"Task 1","name":"Αναζήτηση Χαρακτηριστικών Χρήστη σε Active Directory / LDAP","instr":"Εκτελέστε αναζήτηση LDAP για ανάκτηση στοιχείων λογαριασμού και ομάδων του χρήστη `jdoe`.","hint":"Εκτελέστε: ldapsearch -x -b \\"dc=corp,dc=internal\\" \\"uid=jdoe\\"","cmd":"$ ldapsearch -x -b \\"dc=corp,dc=internal\\" \\"uid=jdoe\\"","ok":"Τα γνωρίσματα LDAP ανακτήθηκαν: Ο χρήστης είναι μέλος της ομάδας SecOps-Admins ."},{"pill":"Task 2","name":"Αποκωδικοποίηση & Έλεγχος Ισχυρισμών (Claims) σε JSON Web Token (JWT)","instr":"Αποκωδικοποιήστε την επικεφαλίδα και το σώμα του `sample_jwt.txt` με το `jwt-cli`.","hint":"Εκτελέστε: jwt-cli decode sample_jwt.txt","cmd":"$ jwt-cli decode sample_jwt.txt","ok":"Το JWT αποκωδικοποιήθηκε! Εντοπίστηκε ο αλγόριθμος RS256 και οι ρόλοι SOC_Tier2 ."},{"pill":"Task 3","name":"Επαλήθευση Ασύμμετρης Υπογραφής RS256 σε JWT","instr":"Επαληθεύστε κρυπτογραφικά την εγκυρότητα του JWT με το δημόσιο κλειδί `public.pem`.","hint":"Εκτελέστε: jwt-cli verify --key public.pem","cmd":"$ jwt-cli verify --key public.pem","ok":"Υπογραφή ΕΓΚΥΡΗ: Το διακριτικό είναι αυθεντικό και δεν έχει αλλοιωθεί."},{"pill":"Task 4","name":"Έλεγχος Δικαιωμάτων (Scopes) και Αδειών Πελάτη OAuth 2.0","instr":"Εξετάστε τις ρυθμίσεις του πελάτη OAuth για το `crm_app` με το εργαλείο `oauth-token`.","hint":"Εκτελέστε: oauth-token --inspect client_id=crm_app","cmd":"$ oauth-token --inspect client_id=crm_app","ok":"Οι ρυθμίσεις OAuth επιβεβαιώθηκαν! Επιβεβαιώθηκε η χρήση Authorization Code με PKCE."}]},"lab":{"title":"Επιχειρησιακή Διακυβέρνηση Ταυτότητας: Ομοσπονδιακό SSO (SAML/OIDC), RBAC & Ενίσχυση PAM","desc":"Σε αυτό το εργαστήριο 2 ωρών, οι φοιτητές υλοποιούν μια εταιρική αρχιτεκτονική διακυβέρνησης ταυτότητας και Ενιαίας Σύνδεσης (SSO). Θα ρυθμίσετε έναν Πάροχο Ταυτότητας (IdP) με OIDC και SAML 2.0 (Keycloak / Authentik), θα σχεδιάσετε ιεραρχίες ρόλων RBAC, θα επιβάλετε ταυτοποίηση MFA με FIDO2 / WebAuthn και TOTP, και θα αναπτύξετε έναν διακομιστή PAM (Privileged Access Management) με καταγραφή συνεδριών.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Ubuntu 24.04 Server with Docker & Docker Compose","Keycloak IAM / OpenID Connect Identity Provider instance (`http://idp.lab.internal:8080`)","OpenLDAP directory service with phpLDAPadmin interface","Command line tools: `ldapsearch`, `curl`, `jwt-cli`, `oauth2-proxy`, `oathtool`"],"phases":[{"badge":"Phase 1","name":"Σχήμα Καταλόγου LDAP & Ιεραρχία Οργανωσιακών Μονάδων (OU)","dur":"⏱️ 25 λεπτά","objs":["Ανάπτυξη ιεραρχίας OpenLDAP με διακριτές OUs (`Users`, `Groups`, `ServiceAccounts`).","Εισαγωγή λογαριασμών με σχήματα posixAccount και inetOrgPerson.","Εφαρμογή πολιτικών κωδικών πρόσβασης μέσω του module ppolicy."],"steps":[{"type":"p","text":"1. Έλεγχος δέντρου LDAP:\\n```bash\\nldapsearch -x -H ldap://127.0.0.1:389 -b \\"dc=corp,dc=internal\\" -s sub \\"(objectClass=*)\\"\\n```"},{"type":"p","text":"2. Προσθήκη νέας ομάδας ασφάλειας σε μορφή LDIF:\\n```text\\ndn: cn=DevSecOps,ou=Groups,dc=corp,dc=internal\\nobjectClass: top\\nobjectClass: posixGroup\\ngidNumber: 5001\\nmemberUid: jdoe\\n```"},{"type":"p","text":"3. Εισαγωγή αλλαγών με το `ldapadd`."}]},{"badge":"Phase 2","name":"Ρύθμιση Ομοσπονδιακού OpenID Connect (OIDC) & OAuth 2.1","dur":"⏱️ 45 λεπτά","objs":["Ρύθμιση Keycloak Realm με ομοσπονδιακή σύνδεση στο LDAP.","Καταχώριση εμπιστευτικού πελάτη με Authorization Code Flow και PKCE.","Έλεγχος των ID tokens και Access tokens για τυπικούς ισχυρισμούς (claims)."],"steps":[{"type":"p","text":"1. Σύνδεση της ομοσπονδίας χρηστών LDAP στο Keycloak.\\n2. Λήψη κωδικού εξουσιοδότησης OAuth2 και ανταλλαγή με token:\\n```bash\\ncurl -X POST \\"http://idp.lab.internal:8080/realms/corp/protocol/openid-connect/token\\" \\\\\\n -d \\"grant_type=authorization_code\\" \\\\\\n -d \\"client_id=portal_app\\" \\\\\\n -d \\"code=AUTHORIZATION_CODE\\" \\\\\\n -d \\"code_verifier=VERIFIER_STRING\\" \\\\\\n -d \\"redirect_uri=http://portal.lab.internal/callback\\"\\n```\\n3. Αποκωδικοποίηση και επαλήθευση του ληφθέντος JWT token."}]},{"badge":"Phase 3","name":"Ταυτοποίηση Πολλαπλών Παραγόντων (MFA) & Πολιτικές Υπό Όρους Πρόσβασης","dur":"⏱️ 30 λεπτά","objs":["Επιβολή υποχρεωτικού TOTP και WebAuthn / FIDO2 για προνομιούχους ρόλους.","Ρύθμιση πολιτικών Υπό Όρους Πρόσβασης βάσει επικινδυνότητας (γεωγραφικός αποκλεισμός IPs).","Δοκιμή τοπικού υπολογισμού TOTP με το εργαλείο `oathtool`."],"steps":[{"type":"p","text":"1. Παραγωγή κωδικού TOTP για διαχειριστικό λογαριασμό:\\n```bash\\noathtool --totp -b -d 6 \\"JBSWY3DPEHPK3PXP\\"\\n```"},{"type":"p","text":"2. Ρύθμιση της ροής ταυτοποίησης στο Keycloak ώστε το MFA να είναι ΥΠΟΧΡΕΩΤΙΚΟ για διαχειριστές.\\n3. Επιβεβαίωση απόρριψης συνδέσεων χωρίς δεύτερο παράγοντα."}]},{"badge":"Phase 4","name":"Διαχείριση Προνομιακής Πρόσβασης (PAM) & Τηλεμετρία Συνεδριών","dur":"⏱️ 20 λεπτά","objs":["Ανάπτυξη διακομιστή Jump-Host (Bastion) για προνομιακή πρόσβαση SSH/RDP.","Επιβολή κλιμάκωσης προνομίων Just-In-Time (JIT) και έκδοση εφήμερων πιστοποιητικών.","Έλεγχος καταγεγραμμένων διαχειριστικών συνεδριών."],"steps":[{"type":"p","text":"1. Ρύθμιση SSH Bastion με ταυτοποίηση πιστοποιητικών OpenSSH.\\n2. Σύνδεση στον διακομιστή και επαλήθευση αυτόματης καταγραφής συνεδρίας.\\n3. Έλεγχος καταγραφών συμμόρφωσης."}]}],"checklist":["Ο κατάλογος LDAP επιβάλλει μοναδικά UIDs και πολιτικές ισχυρών κωδικών.","Το Keycloak εκδίδει υπογεγραμμένα tokens JWT RS256 με έγκυρους ισχυρισμούς.","Η ροή Authorization Code με PKCE αποτρέπει επιθέσεις υποκλοπής κωδικών.","Το MFA είναι αυστηρά υποχρεωτικό για όλους τους προνομιούχους ρόλους."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αρχιτεκτονική Παρόχου Ταυτότητας Μηδενικής Εμπιστοσύνης & Broker Διακριτικών JWT","desc":"Ένας διεθνής οργανισμός fintech που λειτουργεί 200 μικροϋπηρεσίες σε Kubernetes αντικαθιστά τα κατακερματισμένα συστήματα ταυτοποίησής του. Ως Επικεφαλής Αρχιτέκτονας Ταυτότητας, σας ανατίθεται να αναπτύξετε έναν σύγχρονο Identity Broker Μηδενικής Εμπιστοσύνης που εκδίδει, επικυρώνει και ανακαλεί διακριτικά JWT/PASETO, ενσωματώνει το Open Policy Agent (OPA) για έλεγχο πρόσβασης βάσει γνωρισμάτων (ABAC) και υπολογίζει συνεχή προσαρμοστική επικινδυνότητα ανά αίτημα.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Υποσύστημα Κεντρικού Token Broker & Ασύμμετρης Υπογραφής","desc":"Ανάπτυξη του token_broker.py για έκδοση υπογεγραμμένων JWTs σύντομης διάρκειας (15 λεπτά) με έλεγχο μέσω JWKS.","spec":["Ενσωμάτωση μοντελοποίησης απειλών STRIDE στη φάση σχεδιασμού λογισμικού.","Ορισμός μη-λειτουργικών απαιτήσεων ασφάλειας κατά OWASP ASVS 4.0 Level 3.","Καθιέρωση προτύπων ασφαλούς προγραμματισμού και εκπαίδευσης προγραμματιστών."],"deliv":"📦 Παραδοτέο Οροσήμου: Κώδικας υπηρεσίας Token Broker + δοκιμές JWKS."},{"num":"M2","title":"Έλεγχος Πρόσβασης Βάσει Γνωρισμάτων (ABAC) με Open Policy Agent (OPA)","desc":"Σύνταξη κανόνων Rego για αξιολόγηση παραμέτρων αιτήματος (διαβάθμιση, γεωγραφική θέση, κατάσταση συσκευής).","spec":["Αρχιτεκτονική αυτοματοποιημένου CI/CD DevSecOps αγωγού με blocking gates στο GitHub Actions.","Ενσωμάτωση SAST (Semgrep), SCA (Trivy) και Secret Scanning (TruffleHog) σε κάθε PR.","Επιβολή πολιτικής μηδενικών κρίσιμων ευπαθειών πριν τη συγχώνευση κώδικα."],"deliv":"📦 Παραδοτέο Οροσήμου: Σουίτα πολιτικών Rego ( policy.rego ) + αυτοματοποιημένες δοκιμές."},{"num":"M3","title":"Μηχανή Ανάκλησης Διακριτικών σε Πραγματικό Χρόνο","desc":"Υλοποίηση ελέγχων ανάκλησης JTI μέσω Redis cache με καθυστέρηση κάτω του 1 millisecond.","spec":["Υλοποίηση ασφάλειας εφοδιαστικής αλυσίδας λογισμικού κατά το πλαίσιο SLSA Level 3.","Παραγωγή Software Bill of Materials (SBOM) σε μορφή CycloneDX/SPDX.","Ψηφιακή υπογραφή εικόνων containers με Sigstore Cosign και επαλήθευση εισόδου με Kyverno."],"deliv":"📦 Παραδοτέο Οροσήμου: Middleware ανάκλησης + αναφορά μετρήσεων καθυστέρησης."},{"num":"M4","title":"Πλαίσιο Ανίχνευσης & Απόκρισης σε Απειλές Ταυτότητας (ITDR)","desc":"Ανάπτυξη κανόνων ανίχνευσης για επιθέσεις Golden SAML, Kerberoasting και token replay, και παράδοση τελικού φακέλου αρχιτεκτονικής.","spec":["Ανάπτυξη DAST και συνεχούς API fuzz testing στο περιβάλλον δοκιμών.","Καθιέρωση προγράμματος υπεύθυνης αποκάλυψης ευπαθειών (VDP) και bug bounty.","Σύνταξη Εταιρικής Πολιτικής Διασφάλισης Ασφάλειας Εφαρμογών."],"deliv":"📦 Παραδοτέο Οροσήμου: Σουίτα κανόνων ITDR + Επιτελικό σχέδιο ασφάλειας ταυτότητας (10–12 σελίδες)."}],"deliverables":["Πλήρης Πηγαίος Κώδικας Token Broker & OPA Middleware (`/src/token_broker/`)","Αποθετήριο Πολιτικών OPA Rego (`/src/policies/abac.rego`)","Σουίτα Δοκιμών Ανάκλησης Tokens με Redis (`/tests/test_revocation.py`)","Φάκελος Στρατηγικής Ταυτότητας Μηδενικής Εμπιστοσύνης (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Ασύγχρονου Web Application Firewall (WAF) Reverse Proxy σε Python","desc":"Οι διαδικτυακές εφαρμογές δέχονται συνεχείς επιθέσεις SQL injection, XSS, SSRF και brute force. Θα κατασκευάσετε έναν ασύγχρονο Web Application Firewall (WAF) reverse proxy σε Python ( pywaf_proxy.py ) με httpx και FastAPI. Ο proxy θα επιθεωρεί μεθόδους, κεφαλίδες, query params και σώματα αιτημάτων (JSON/Form), θα εφαρμόζει λεξικογραφική ανάλυση για εντοπισμό SQLi/XSS, θα αποτρέπει επιθέσεις SSRF/Path Traversal, θα μπλοκάρει κακόβουλα αιτήματα και θα προσθέτει ασφαλείς κεφαλίδες OWASP.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Κορμός Ασύγχρονου HTTP Reverse Proxy","desc":"Ανάπτυξη μηχανής ASGI reverse proxy που δέχεται αιτήματα πελατών, τα προωθεί στο backend και επιστρέφει τις απαντήσεις.","spec":["Χρήση του `httpx.AsyncClient` για προώθηση αιτημάτων στο upstream backend.","Διατήρηση κεφαλίδων και αφαίρεση επικίνδυνων hop-by-hop headers.","Προσθήκη ασφαλών κεφαλίδων OWASP στην απάντηση (`Content-Security-Policy`, `X-Frame-Options`)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα proxy_core.py με επιτυχή δρομολόγηση κίνησης."},{"num":"M2","title":"Φίλτρο Λεξικογραφικής Ανάλυσης SQLi & XSS","desc":"Υλοποίηση middleware επιθεώρησης που ελέγχει URIs, παραμέτρους, κεφαλίδες και σώματα αιτημάτων για κακόβουλη σύνταξη injection.","spec":["Εντοπισμός SQLi: λογικές ταυτολογίες (`\' OR \'1\'=\'1`), `UNION SELECT`, σχόλια SQL.","Εντοπισμός XSS: `<script>`, `javascript:`, `onerror=`, SVG handlers.","Υπολογισμός βαθμολογίας ανωμαλίας: σε περίπτωση υπέρβασης ορίου, απόρριψη με HTTP 403 Forbidden."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα injection_shield.py + δοκιμές με payloads του OWASP Juice Shop."},{"num":"M3","title":"Μηχανή Προστασίας SSRF, Path Traversal & Rate Limiting","desc":"Υλοποίηση ελέγχων αποτροπής SSRF σε διευθύνσεις metadata/RFC 1918, διάσχισης καταλόγων ( ../ ) και rate limiting.","spec":["Έλεγχος διευθύνσεων URL: επίλυση DNS και αποκλεισμός ιδιωτικών δικτύων RFC 1918 και metadata `169.254.169.254`.","Καθαρισμός διευθύνσεων από διπλό url-encoding (`%252e%252e%252f`) και null bytes.","Υλοποίηση Token Bucket rate limiter (max 60 αιτήματα/λεπτό ανά IP) με επιστροφή HTTP 429."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα ssrf_ratelimit.py με δοκιμές SSRF και rate limiting."},{"num":"M4","title":"Κονσόλα WAF CLI, Καταγραφή & Πλήρεις Δοκιμές","desc":"Ενοποίηση όλων των επιπέδων σε ολοκληρωμένη εφαρμογή WAF με καταγραφή JSON, κονσόλα διαχείρισης και αυτοματοποιημένες δοκιμές.","spec":["Καταγραφή αποκλεισμένων αιτημάτων στο `/var/log/pywaf_blocks.json` με λεπτομέρειες επίθεσης.","Κατασκευή κονσόλας με ζωντανή απεικόνιση ρυθμαπόδοσης και μπλοκαρισμένων επιθέσεων.","Εκτέλεση δοκιμών με προσομοίωση επιθέσεων σε ευάλωτη εφαρμογή πίσω από τον WAF."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρης κώδικας pywaf_proxy.py + σουίτα δοκιμών pytest και βίντεο."}],"deliverables":["Πηγαίος κώδικας Ασύγχρονου WAF Reverse Proxy (`/pywaf/`)","Αρθρώματα ελέγχου SQLi, XSS, SSRF και Path Traversal","Σουίτα αυτοματοποιημένων επιθέσεων (50+ payloads)","Τεχνική Έκθεση Αρχιτεκτονικής WAF (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 8","quiz":[{"q":"Ποιος είναι ο κύριος στόχος ασφάλειας της Πολιτικής Ίδιας Προέλευσης (Same-Origin Policy - SOP) στον περιηγητή;","opts":[{"k":"A","v":"Να συμπιέζει αρχεία JavaScript σε μη κρυπτογραφημένο κώδικα bytecode πριν από τη μετάδοση στο δίκτυο, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Να επιβάλλει σε όλες τις εφαρμογές ιστού να επικοινωνούν αποκλειστικά μέσω μη ασφαλών συνδέσεων UDP, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"C","v":"Να αντικαθιστά σχεσιακές βάσεις δεδομένων με απλά αρχεία κειμένου αποθηκευμένα τοπικά στον υπολογιστή, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Να αποτρέπει scripts από μία προέλευση να διαβάζουν ή να τροποποιούν δεδομένα/DOM από διαφορετική προέλευση."},{"k":"E","v":"Να περιορίζει τη συχνότητα του επεξεργαστή κατά την εκτέλεση απαιτητικών γραφικών στον περιηγητή, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."}],"ans":"D","exp":"Η Πολιτική Ίδιας Προέλευσης (SOP) περιορίζει τον τρόπο με τον οποίο ένα script από μία προέλευση (πρωτόκολλο + host + θύρα) αλληλεπιδρά με δεδομένα άλλης προέλευσης, προστατεύοντας τον χρήστη."},{"q":"Ποια κρίσιμη ευπάθεια προκύπτει σε υλοποιήσεις JWT όταν ο εξυπηρετητής αποδέχεται την κεφαλίδα αλγορίθμου \'none\';","opts":[{"k":"A","v":"Το token κρυπτογραφείται πλήρως χρησιμοποιώντας ασύμμετρα κλειδιά ελλειπτικών καμπυλών 4096-bit, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Η εφαρμογή κλειδώνει αυτόματα όλους τους διαχειριστικούς λογαριασμούς μετά από τρεις αποτυχίες, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Ο περιηγητής εκτελεί ατέρμονα βρόχο προσπαθώντας να επιλύσει εξωτερικούς διακομιστές DNS, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Το περιεχόμενο του token μετατρέπεται σε απλό κείμενο και αποστέλλεται σε εκτυπωτές δικτύου, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Ο επιτιθέμενος μπορεί να πλαστογραφήσει αυθαίρετα claims χωρίς υπογραφή, παρακάμπτοντας τον έλεγχο."}],"ans":"E","exp":"Εάν ο διακομιστής αποδέχεται alg=\'none\', θεωρεί έγκυρα τα ανυπόγραφα tokens, επιτρέποντας στον επιτιθέμενο να τροποποιήσει τα claims (π.χ. role: admin) και να αποκτήσει πλήρη πρόσβαση."},{"q":"Ποια βασική άμυνα παρέχει η Πολιτική Ασφάλειας Περιεχομένου (CSP) κατά των επιθέσεων Cross-Site Scripting (XSS);","opts":[{"k":"A","v":"Περιορίζει τις πηγές από τις οποίες φορτώνονται scripts και εικόνες και απαγορεύει την εκτέλεση inline scripts."},{"k":"B","v":"Μεταγλωττίζει τον κώδικα JavaScript σε ιδιόκτητα δυαδικά αρχεία κατά τη μεταφορά στο δίκτυο, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"C","v":"Διαγράφει αυτόματα τα cookies του περιηγητή όποτε επιλεγεί ένας μη κρυπτογραφημένος σύνδεσμος HTTP, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"D","v":"Κρυπτογραφεί πίνακες βάσεων δεδομένων με εφήμερα συμμετρικά κλειδιά ανά αίτημα χρήστη, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Αποτρέπει απομακρυσμένους χρήστες από τη δημιουργία συνδέσεων VPN προς τον εξυπηρετητή ιστού, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"A","exp":"Οι κεφαλίδες CSP ορίζουν ποιες πηγές scripts είναι έμπιστες και απαγορεύουν την εκτέλεση μη εγκεκριμένων inline scripts, εξουδετερώνοντας επιθέσεις XSS."},{"q":"Τι είναι η Ευπάθεια Εξουσιοδότησης σε Επίπεδο Αντικειμένου (BOLA / IDOR) στην ασφάλεια APIs;","opts":[{"k":"A","v":"Το API μεταδίδει δεδομένα μέσω μη κρυπτογραφημένου HTTP αντί να επιβάλλει κρυπτογράφηση TLS 1.3, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Το API παραλείπει να ελέγξει αν ο ταυτοποιημένος χρήστης έχει δικαίωμα πρόσβασης στο συγκεκριμένο ID πόρου."},{"k":"C","v":"Το API επιστρέφει δομημένα δεδομένα JSON αντί για έγγραφα XML στους πελάτες που το καλούν, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Ο μηχανισμός περιορισμού ρυθμού (token bucket) του API υπερχειλίζει κατά τη διάρκεια νόμιμης κίνησης, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"E","v":"Ο εξυπηρετητής του API καταρρέει λόγω σφάλματος μη έγκυρου δείκτη μνήμης σε οδηγούς συσκευών, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"B","exp":"Το BOLA/IDOR συμβαίνει όταν ένα API δέχεται ένα ID πόρου (π.χ. /api/invoices/105) χωρίς να ελέγξει αν ο συνδεδεμένος χρήστης είναι πράγματι ο νόμιμος κάτοχος του συγκεκριμένου πόρου."},{"q":"Ποιον βασικό μηχανισμό ασφάλειας επιβάλλει το HTTP Strict Transport Security (HSTS) στους περιηγητές ιστού;","opts":[{"k":"A","v":"Απαιτεί από τους χρήστες ταυτοποίηση πολλαπλών παραγόντων πριν την προβολή δημόσιων ιστοσελίδων, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"B","v":"Μετατρέπει σχεσιακούς πίνακες βάσεων δεδομένων σε μη σχεσιακά έγγραφα δεδομένων σε πραγματικό χρόνο, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Επιβάλλει στους περιηγητές να συνδέονται αποκλειστικά μέσω κρυπτογραφημένου HTTPS, αποτρέποντας SSL stripping."},{"k":"D","v":"Απενεργοποιεί τους τοπικούς κανόνες firewall του υπολογιστή κατά τη λήψη αρχείων από το διαδίκτυο, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Κρυπτογραφεί όλα τα πακέτα δικτύου με μετα-κβαντικούς αλγορίθμους πλεγμάτων στο τοπικό δίκτυο, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."}],"ans":"C","exp":"Το HSTS αναγκάζει τον περιηγητή να μετατρέπει αυτόματα κάθε κλήση HTTP σε HTTPS και απαγορεύει τη σύνδεση εάν υπάρχουν σφάλματα πιστοποιητικού, αποτρέποντας επιθέσεις SSL stripping."},{"q":"Πώς προστατεύει τις υπηρεσίες εφαρμογών ο Περιορισμός Ρυθμού (Rate Limiting) με τον αλγόριθμο Token Bucket;","opts":[{"k":"A","v":"Κρυπτογραφώντας αυτόματα όλες τις εγγραφές της βάσης δεδομένων με εφήμερα κλειδιά AES-256, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Αντικαθιστώντας ερωτήματα SQL με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα τοπικά στον δίσκο, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"C","v":"Απενεργοποιώντας την προστασία ASLR του πυρήνα του λειτουργικού συστήματος κατά την εκκίνηση, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Περιορίζοντας τον ρυθμό κλήσεων ανά πελάτη, αποτρέποντας επιθέσεις brute-force και εξάντληση πόρων (DoS)."},{"k":"E","v":"Δρομολογώντας όλα τα εξερχόμενα αιτήματα HTTP μέσω μη εξουσιοδοτημένων εξωτερικών διακομιστών proxy, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"D","exp":"Το Rate Limiting περιορίζει τον αριθμό κλήσεων ανά χρήστη ή IP σε ορισμένο χρόνο (π.χ. 100 req/min), προστατεύοντας το σύστημα από επιθέσεις εξάντλησης πόρων και brute-force."},{"q":"Ποια βασική ευπάθεια αντιμετωπίζεται με τη σωστή ρύθμιση των κεφαλίδων Cross-Origin Resource Sharing (CORS);","opts":[{"k":"A","v":"Αποτροπή απόρριψης τεμαχισμένων πακέτων TCP από μεταγωγείς δικτύου σε περιόδους αιχμής, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Αποτροπή εκτέλεσης αναδρομικών ερωτημάτων join από εξυπηρετητές βάσεων δεδομένων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Αποτροπή αυτόματης ενημέρωσης διορθώσεων ασφάλειας στους υπολογιστές των τελικών χρηστών, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Αποτροπή δημιουργίας αυτο-υπογεγραμμένων ψηφιακών πιστοποιητικών X.509 κατά την εκκίνηση, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Αποτροπή μη εξουσιοδοτημένων εξωτερικών domains από την ανάγνωση ευαίσθητων δεδομένων API μέσω περιηγητών."}],"ans":"E","exp":"Οι κεφαλίδες CORS επιτρέπουν στον εξυπηρετητή να ορίζει ρητά ποια εξωτερικά domains επιτρέπεται να διαβάζουν απαντήσεις API μέσω του περιηγητή του χρήστη."},{"q":"Ποιο πρόβλημα ασφάλειας προκύπτει σε APIs GraphQL όταν δεν επιβάλλονται όρια βάθους και πολυπλοκότητας ερωτημάτων;","opts":[{"k":"A","v":"Οι επιτιθέμενοι μπορούν να στείλουν βαθιά εμφωλευμένα κυκλικά ερωτήματα που εξαντλούν τη CPU και τη βάση (DoS)."},{"k":"B","v":"Οι επιτιθέμενοι μπορούν να αποκρυπτογραφήσουν ιδιωτικά κλειδιά TLS με κλασικούς αλγορίθμους, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Οι επιτιθέμενοι μπορούν να πλαστογραφήσουν βιομετρικά αποτυπώματα σε κινητά τηλέφωνα, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"D","v":"Οι επιτιθέμενοι μπορούν να αλλάξουν τους πίνακες δρομολόγησης του τοπικού δικτύου, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Οι επιτιθέμενοι μπορούν να εξαναγκάσουν τους περιηγητές να διαγράψουν την τοπική αποθήκευση, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"A","exp":"Επειδή το GraphQL επιτρέπει αιτήματα σχεσιακών δεδομένων, οι επιτιθέμενοι μπορούν να στείλουν αναδρομικά εμφωλευμένα ερωτήματα προκαλώντας εξάντληση πόρων και κατάρρευση του διακομιστή."},{"q":"Πώς προστατεύει τους χρήστες μιας εφαρμογής ιστού η ρύθμιση της ιδιότητας \'HttpOnly\' σε ένα session cookie;","opts":[{"k":"A","v":"Κρυπτογραφεί πίνακες βάσεων δεδομένων με εφήμερα συμμετρικά κλειδιά ανά αίτημα χρήστη, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"B","v":"Εμποδίζει την πρόσβαση στο cookie μέσω JavaScript (document.cookie), αποτρέποντας την υποκλοπή μέσω XSS."},{"k":"C","v":"Υποχρεώνει όλους τους χρήστες να συνδέονται μέσω ιδιωτικών τούνελ IPsec VPN πριν από την πλοήγηση, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Συμπιέζει αυτόματα αρχεία εικόνων πριν από τη μετάδοσή τους σε δίκτυα ευρείας περιοχής, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"E","v":"Αποτρέπει καταρρεύσεις του πυρήνα του λειτουργικού συστήματος από μη έγκυρους δείκτες μνήμης, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"B","exp":"Η ιδιότητα HttpOnly απαγορεύει την ανάγνωση του cookie από scripts στον περιηγητή (document.cookie), εμποδίζοντας την άμεση υποκλοπή του session token σε περίπτωση επίθεσης XSS."},{"q":"Ποιος είναι ο βασικός επιχειρησιακός ρόλος ενός Web Application Firewall (WAF) στην άμυνα εφαρμογών;","opts":[{"k":"A","v":"Να μεταγλωττίζει τον πηγαίο κώδικα εφαρμογών σε οδηγούς συσκευών πυρήνα υψηλής υπολογιστικής ταχύτητας, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Να αντικαθιστά συμμετρικούς αλγορίθμους με μετα-κβαντικά ασύμμετρα κρυπτογραφικά σχήματα πλεγμάτων."},{"k":"C","v":"Να ελέγχει την κίνηση HTTP/HTTPS στο Επίπεδο 7, εντοπίζοντας και απορρίπτοντας επιθέσεις όπως SQLi και XSS."},{"k":"D","v":"Να δημιουργεί τούνελ peer-to-peer υψηλής ταχύτητας σε υποθαλάσσια καλώδια διεθνών επικοινωνιών, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Να διαχειρίζεται κάρτες φυσικής πρόσβασης στις εγκαταστάσεις και βάσεις βιομετρικών δεδομένων προσωπικού, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"C","exp":"Το WAF ελέγχει τα αιτήματα HTTP/HTTPS στο επίπεδο εφαρμογής (Layer 7), εφαρμόζοντας κανόνες προστασίας για τον αποκλεισμό επιθέσεων ιστού πριν φτάσουν στον εξυπηρετητή."}]},{"part":"Μέρος 3 · Μηχανισμοί Προστασίας και Ασφαλής Μηχανική","time":"Κεφάλαιο 9 · ⏱️ 8–10 ώρες μελέτης","title":"9. Ασφαλής Σχεδίαση και Ανάπτυξη Λογισμικού","subtitle":"Shift-left και DevSecOps · Έγχυση κώδικα · Cross-site scripting · CSRF και clickjacking · Ασφάλεια API, SSRF και σπασμένος έλεγχος πρόσβασης · Μυστικά και εφοδιαστική αλυσίδα λογισμικού","outcomes":["Να εξηγείτε την ασφάλεια shift-left και πώς ενσωματώνονται οι δραστηριότητες ασφάλειας σε μια ροή DevSecOps.","Να εξηγείτε τη βασική αιτία της έγχυσης και να εφαρμόζετε παραμετροποιημένα ερωτήματα.","Να διακρίνετε το αποθηκευμένο, το ανακλώμενο και το βασισμένο στο DOM XSS και να εφαρμόζετε κωδικοποίηση εξόδου ανάλογα με το πλαίσιο και CSP.","Να περιγράφετε τις επιθέσεις CSRF, clickjacking, SSRF και τον σπασμένο έλεγχο πρόσβασης, μαζί με τις άμυνές τους.","Να περιγράφετε πώς η ανάλυση σύνθεσης λογισμικού, τα SBOM και το SLSA προστατεύουν την εφοδιαστική αλυσίδα λογισμικού."],"intro":["Οι περισσότερες ευπάθειες δεν δημιουργούνται από τους επιτιθέμενους· γράφονται, ακούσια, από τους προγραμματιστές. Ένας μόνο έλεγχος επικύρωσης που λείπει μπορεί να εκθέσει εκατομμύρια εγγραφές, ενώ η διόρθωση ενός σφάλματος μετά την κυκλοφορία κοστίζει πολύ περισσότερο από την πρόληψή του κατά τον σχεδιασμό. Η ασφαλής μηχανική λογισμικού στοχεύει, επομένως, να καταστήσει την ασφάλεια φυσιολογική ιδιότητα της καθημερινής αναπτυξιακής εργασίας και όχι έναν τελικό έλεγχο πριν από την κυκλοφορία.","Το κεφάλαιο παρουσιάζει πρώτα τη φιλοσοφία _shift-left_ και τις αρχές μηχανικής που καθοδηγούν τον ασφαλή σχεδιασμό. Στη συνέχεια εξηγεί, για καθεμιά από τις σημαντικότερες κατηγορίες ευπαθειών ιστού —έγχυση, cross-site scripting, πλαστογράφηση αιτημάτων μεταξύ ιστοτόπων, πλαστογράφηση αιτημάτων από την πλευρά του διακομιστή και σπασμένο έλεγχο πρόσβασης— γιατί προκύπτει το σφάλμα και ποια άμυνα αντιμετωπίζει τη βασική του αιτία. Ολοκληρώνεται με τη διαχείριση μυστικών, την καταγραφή και την προστασία της εφοδιαστικής αλυσίδας λογισμικού. Οι κατηγορίες ευπαθειών που εξετάζονται αντιστοιχούν σε μεγάλο βαθμό στο OWASP Top 10."],"sections":[{"id":"9.1","title":"Ασφάλεια shift-left, DevSecOps και βασικές αρχές μηχανικής","blocks":[{"type":"p","text":"Ο όρος **shift-left** σημαίνει τη μετακίνηση των δραστηριοτήτων ασφάλειας νωρίτερα —«προς τα αριστερά»— στο χρονοδιάγραμμα της ανάπτυξης. Οι απαιτήσεις ασφάλειας ορίζονται μαζί με τις λειτουργικές· η **μοντελοποίηση απειλών** (για παράδειγμα με τη μέθοδο STRIDE: πλαστοπροσωπία, αλλοίωση, αποποίηση, αποκάλυψη πληροφοριών, άρνηση υπηρεσίας, κλιμάκωση προνομίων) εντοπίζει τους κινδύνους όσο ο σχεδιασμός μπορεί ακόμη να αλλάξει με χαμηλό κόστος· και αυτοματοποιημένοι έλεγχοι εκτελούνται σε κάθε αλλαγή του κώδικα. Το **DevSecOps** ενσωματώνει αυτούς τους ελέγχους στη ροή συνεχούς ενοποίησης και παράδοσης, ώστε μια υποβολή κώδικα που εισάγει μια βιβλιοθήκη με γνωστή ευπάθεια ή έναν ενσωματωμένο κωδικό να αποτυγχάνει στη μεταγλώττιση, όπως ακριβώς και ένας αποτυχημένος έλεγχος μονάδας."},{"type":"p","text":"Ορισμένες αρχές μηχανικής καθοδηγούν τη συγγραφή ασφαλούς κώδικα. **Επικύρωση της εισόδου** στην πλευρά του διακομιστή, με βάση λίστα όσων αναμένονται, επειδή κάθε είσοδος από έξω από το όριο εμπιστοσύνης μπορεί να είναι εχθρική. **Κωδικοποίηση της εξόδου** σύμφωνα με το πλαίσιο στο οποίο χρησιμοποιείται. **Ελαχιστοποίηση της επιφάνειας επίθεσης** με την αφαίρεση αχρησιμοποίητων λειτουργιών και σημείων πρόσβασης. **Ασφαλής αποτυχία**, ώστε τα σφάλματα να απορρίπτουν την πρόσβαση και να μη διαρρέουν εσωτερικές λεπτομέρειες. Και προτίμηση των δοκιμασμένων **λειτουργιών ασφάλειας των πλαισίων ανάπτυξης** έναντι αυτοσχέδιων μηχανισμών, στο πνεύμα της αρχής της οικονομίας μηχανισμού από το Κεφάλαιο 1."}]},{"id":"9.2","title":"Έγχυση SQL και NoSQL: παραμετροποίηση έναντι συνένωσης συμβολοσειρών","blocks":[{"type":"p","text":"Η **έγχυση** (injection) συμβαίνει όταν μη αξιόπιστα δεδομένα ερμηνεύονται ως μέρος μιας εντολής. Η κλασική περίπτωση είναι ένα ερώτημα SQL που κατασκευάζεται με συνένωση συμβολοσειρών, όπως `\\"SELECT FROM users WHERE name = \'\\" + input + \\"\'\\"`. Αν ένας επιτιθέμενος εισαγάγει `\' OR \'1\'=\'1`, η συνθήκη γίνεται πάντα αληθής και το ερώτημα επιστρέφει όλους τους χρήστες· πιο σύνθετα φορτία μπορούν να διαβάσουν άλλους πίνακες, να τροποποιήσουν δεδομένα ή, σε ορισμένες διαμορφώσεις, να εκτελέσουν εντολές του λειτουργικού συστήματος. Η βασική αιτία είναι η ανάμειξη κώδικα και δεδομένων* σε μία συμβολοσειρά."},{"type":"p","text":"Η οριστική άμυνα είναι το **παραμετροποιημένο ερώτημα** (prepared statement), στο οποίο η δομή του SQL αποστέλλεται στη βάση δεδομένων χωριστά από τις τιμές: `SELECT * FROM users WHERE name = ?`. Η βάση δεδομένων αντιμετωπίζει τότε την είσοδο αυστηρά ως δεδομένα, όποιους χαρακτήρες κι αν περιέχει. Οι βιβλιοθήκες αντιστοίχισης αντικειμένων–σχέσεων (ORM) παρέχουν την ίδια προστασία όταν χρησιμοποιούνται σωστά. Η επικύρωση εισόδου και οι λογαριασμοί βάσης δεδομένων με ελάχιστα προνόμια είναι πολύτιμα πρόσθετα επίπεδα, όμως η χειροκίνητη διαφυγή ειδικών χαρακτήρων είναι επιρρεπής σε σφάλματα και δεν πρέπει να αποτελεί τη βασική άμυνα. Οι βάσεις NoSQL δεν είναι απρόσβλητες: η αποδοχή αντικειμένων JSON όπως `{\\"$ne\\": null}` σε ένα ερώτημα MongoDB μπορεί να παρακάμψει την ταυτοποίηση με ακριβώς τον ίδιο τρόπο."}]},{"id":"9.3","title":"Cross-site scripting: αποθηκευμένο, ανακλώμενο και βασισμένο στο DOM","blocks":[{"type":"p","text":"Το **cross-site scripting (XSS)** είναι έγχυση στον φυλλομετρητή ιστού. Ο επιτιθέμενος κάνει έναν ιστότοπο να παραδώσει κώδικα JavaScript που εκτελείται στον φυλλομετρητή του θύματος με όλα τα προνόμια του ιστοτόπου —διαβάζοντας δεδομένα συνεδρίας, εκτελώντας ενέργειες εκ μέρους του χρήστη ή αλλοιώνοντας τη σελίδα. Στο **αποθηκευμένο XSS**, το κακόβουλο σενάριο αποθηκεύεται στον διακομιστή (για παράδειγμα σε ένα σχόλιο) και σερβίρεται σε κάθε επισκέπτη. Στο **ανακλώμενο XSS**, το σενάριο είναι μέρος ενός ειδικά κατασκευασμένου συνδέσμου και επιστρέφεται αμέσως στην απόκριση. Στο **XSS βασισμένο στο DOM**, η ευπάθεια βρίσκεται εξ ολοκλήρου σε κώδικα της πλευράς του πελάτη που γράφει μη αξιόπιστα δεδομένα στη σελίδα, για παράδειγμα μέσω της ιδιότητας `innerHTML`."},{"type":"p","text":"Η κύρια άμυνα είναι η **κωδικοποίηση εξόδου ανάλογα με το πλαίσιο**: δεδομένα που εισάγονται σε HTML, σε χαρακτηριστικό HTML, σε JavaScript ή σε URL πρέπει να κωδικοποιούνται σύμφωνα με τους κανόνες του αντίστοιχου πλαισίου. Τα σύγχρονα πλαίσια ανάπτυξης, όπως τα React και Angular, κωδικοποιούν εξ ορισμού, και οι προγραμματιστές πρέπει να αποφεύγουν παρακάμψεις όπως το `dangerouslySetInnerHTML`, εκτός αν το περιεχόμενο έχει εξυγιανθεί με μια βιβλιοθήκη όπως η DOMPurify. Μια **Πολιτική Ασφάλειας Περιεχομένου** (Content Security Policy, CSP) προσθέτει άμυνα σε βάθος, δίνοντας εντολή στον φυλλομετρητή να εκτελεί μόνο σενάρια από εγκεκριμένες πηγές, ενώ η σημαία `HttpOnly` στα cookies εμποδίζει τα σενάρια να διαβάζουν τα cookies συνεδρίας."}]},{"id":"9.4","title":"Πλαστογράφηση αιτημάτων μεταξύ ιστοτόπων και clickjacking","blocks":[{"type":"p","text":"Στην **πλαστογράφηση αιτημάτων μεταξύ ιστοτόπων** (Cross-Site Request Forgery, CSRF), ένας κακόβουλος ιστότοπος κάνει τον φυλλομετρητή του θύματος να στείλει αίτημα σε άλλον ιστότοπο στον οποίο το θύμα είναι συνδεδεμένο. Επειδή οι φυλλομετρητές επισυνάπτουν αυτόματα τα cookies, ο ιστότοπος-στόχος βλέπει ένα ταυτοποιημένο αίτημα —για παράδειγμα αλλαγής της διεύθυνσης email του λογαριασμού ή μεταφοράς χρημάτων— που ο χρήστης δεν σκόπευε ποτέ να στείλει. Οι άμυνες περιλαμβάνουν τα **διακριτικά anti-CSRF** (απρόβλεπτες τιμές ενσωματωμένες στις φόρμες, τις οποίες επαληθεύει ο διακομιστής), το χαρακτηριστικό **SameSite** των cookies, το οποίο εμποδίζει την αποστολή τους με τα περισσότερα αιτήματα μεταξύ ιστοτόπων, και την επανεπαλήθευση ταυτότητας για ευαίσθητες ενέργειες."},{"type":"p","text":"Το **clickjacking** ενσωματώνει αόρατα τον ιστότοπο-στόχο μέσα σε ένα πλαίσιο (frame) στη σελίδα του επιτιθέμενου και εξαπατά τον χρήστη ώστε να πατήσει κουμπιά που δεν βλέπει. Αποτρέπεται με την απαγόρευση της ενσωμάτωσης σε πλαίσια μέσω της οδηγίας `frame-ancestors` της CSP ή της παλαιότερης κεφαλίδας `X-Frame-Options`."}]},{"id":"9.5","title":"Ασφάλεια API: σπασμένος έλεγχος πρόσβασης, SSRF και XXE","blocks":[{"type":"p","text":"Ο **σπασμένος έλεγχος πρόσβασης** είναι η πιο διαδεδομένη κατηγορία του OWASP Top 10. Η συνηθέστερη μορφή του στις διεπαφές API είναι η _μη ασφαλής άμεση αναφορά σε αντικείμενο_ (IDOR, γνωστή και ως BOLA): ένα αίτημα όπως `GET /api/invoices/1043` επιστρέφει το τιμολόγιο ακόμη κι όταν ανήκει σε άλλον πελάτη, επειδή ο διακομιστής ελέγχει _ότι_ ο χρήστης είναι συνδεδεμένος αλλά όχι _αν_ του ανήκει το αντικείμενο. Κάθε αίτημα πρέπει να εξουσιοδοτείται στον διακομιστή, για κάθε αντικείμενο, σύμφωνα με την αρχή της πλήρους διαμεσολάβησης. Οι διεπαφές API πρέπει επίσης να επιβάλλουν ταυτοποίηση με σωστά επικυρωμένα διακριτικά, να εφαρμόζουν όρια ρυθμού αιτημάτων και να επιστρέφουν μόνο τα πεδία που χρειάζεται ο πελάτης."},{"type":"p","text":"Η **πλαστογράφηση αιτημάτων από την πλευρά του διακομιστή** (Server-Side Request Forgery, SSRF) εξαπατά έναν διακομιστή ώστε να πραγματοποιήσει αιτήματα για λογαριασμό του επιτιθέμενου —για παράδειγμα, μια λειτουργία «λήψη εικόνας από URL» που κατευθύνεται σε εσωτερικές υπηρεσίες ή στο σημείο μεταδεδομένων του νέφους `169.254.169.254`, το οποίο μπορεί να αποκαλύψει προσωρινά διαπιστευτήρια. Οι άμυνες περιλαμβάνουν λίστες επιτρεπόμενων προορισμών, αποκλεισμό εσωτερικών περιοχών διευθύνσεων και χρήση της θωρακισμένης υπηρεσίας μεταδεδομένων (IMDSv2). Οι επιθέσεις **εξωτερικής οντότητας XML** (XML External Entity, XXE) εκμεταλλεύονται αναλυτές XML που επιλύουν εξωτερικές αναφορές, επιτρέποντας την ανάγνωση αρχείων από τον διακομιστή· η θεραπεία είναι η απενεργοποίηση των εξωτερικών οντοτήτων και των ορισμών τύπου εγγράφου στη ρύθμιση του αναλυτή."}]},{"id":"9.6","title":"Μυστικά, καταγραφή και εφοδιαστική αλυσίδα λογισμικού","blocks":[{"type":"p","text":"Τα **μυστικά** —κωδικοί, κλειδιά API, ιδιωτικά κλειδιά— δεν πρέπει ποτέ να γράφονται σε πηγαίο κώδικα ή σε αρχεία ρυθμίσεων που καταχωρίζονται στο σύστημα ελέγχου εκδόσεων, επειδή τα αποθετήρια αντιγράφονται, κοινοποιούνται και ενίοτε δημοσιοποιούνται. Φυλάσσονται σε ειδικό διαχειριστή μυστικών (όπως το HashiCorp Vault ή ένα θησαυροφυλάκιο κλειδιών στο νέφος), εισάγονται κατά την εκτέλεση και εναλλάσσονται τακτικά· εργαλεία σάρωσης μυστικών στη ροή ανάπτυξης εντοπίζουν τις ακούσιες καταχωρίσεις. Η **καταγραφή ασφάλειας** πρέπει να καταγράφει συμβάντα ταυτοποίησης, αποτυχίες ελέγχου πρόσβασης και διαχειριστικές ενέργειες με επαρκές πλαίσιο για τη διερεύνηση, αλλά δεν πρέπει ποτέ να καταγράφει κωδικούς, διακριτικά ή περιττά προσωπικά δεδομένα."},{"type":"p","text":"Οι σύγχρονες εφαρμογές αποτελούνται κυρίως από κώδικα τρίτων: ένα τυπικό έργο μπορεί να εξαρτάται από εκατοντάδες πακέτα ανοιχτού κώδικα. Η **ανάλυση σύνθεσης λογισμικού** (Software Composition Analysis, SCA) εντοπίζει αυτές τις εξαρτήσεις και επισημαίνει όσες έχουν γνωστές ευπάθειες, όπως στο περιστατικό Log4Shell του 2021. Ένας **κατάλογος υλικών λογισμικού** (Software Bill of Materials, SBOM), σε μορφές όπως SPDX ή CycloneDX, απαριθμεί κάθε στοιχείο, ώστε τα επηρεαζόμενα συστήματα να εντοπίζονται μέσα σε λίγα λεπτά όταν ανακοινώνεται μια νέα ευπάθεια. Το πλαίσιο **SLSA** (_Supply-chain Levels for Software Artifacts_) ορίζει αυξανόμενα επίπεδα διασφάλισης για τη διαδικασία κατασκευής λογισμικού —όπως υπογεγραμμένες, αναπαραγώγιμες εκδόσεις με επαληθεύσιμη προέλευση— ώστε επιθέσεις όπως η παραβίαση της διαδικασίας κατασκευής της SolarWinds να γίνονται ανιχνεύσιμες."}]}],"terms":[{"name":"Shift-left","def":"Μετακίνηση των δραστηριοτήτων ασφάλειας σε πρωιμότερα στάδια του κύκλου ανάπτυξης."},{"name":"Μοντελοποίηση απειλών","def":"Συστηματικός εντοπισμός απειλών κατά ενός σχεδιασμού, π.χ. με τη μέθοδο STRIDE."},{"name":"Παραμετροποιημένο ερώτημα","def":"Ερώτημα με σταθερή δομή, του οποίου οι τιμές διαβιβάζονται χωριστά ως δεδομένα."},{"name":"XSS","def":"Cross-site scripting: έγχυση σεναρίου που εκτελείται στον φυλλομετρητή του θύματος υπό την προέλευση του ιστοτόπου."},{"name":"IDOR / BOLA","def":"Πρόσβαση σε αντικείμενα μέσω αναγνωριστικού χωρίς έλεγχο αν ο αιτών είναι εξουσιοδοτημένος γι\' αυτά."},{"name":"SBOM","def":"Κατάλογος υλικών λογισμικού: απογραφή όλων των στοιχείων ενός λογισμικού."}],"summary":["Η ασφάλεια κοστίζει λιγότερο όταν ενσωματώνεται νωρίς: η μοντελοποίηση απειλών και οι αυτοματοποιημένοι έλεγχοι στη ροή ανάπτυξης αποτελούν τον πυρήνα του DevSecOps.","Η έγχυση προκύπτει από την ανάμειξη κώδικα και δεδομένων· τα παραμετροποιημένα ερωτήματα εξαλείφουν τη βασική αιτία.","Το XSS αποτρέπεται με κωδικοποίηση εξόδου ανάλογα με το πλαίσιο, ασφαλείς προεπιλογές των πλαισίων ανάπτυξης και CSP.","Τα CSRF, clickjacking, SSRF και XXE έχουν συγκεκριμένες, καθιερωμένες άμυνες· ο σπασμένος έλεγχος πρόσβασης απαιτεί εξουσιοδότηση κάθε αντικειμένου στην πλευρά του διακομιστή.","Οι διαχειριστές μυστικών, η προσεκτική καταγραφή, η SCA, τα SBOM και το SLSA προστατεύουν την εφαρμογή και την εφοδιαστική της αλυσίδα."],"review":["Εξηγήστε γιατί η διαφυγή των εισαγωγικών είναι ασθενέστερη άμυνα κατά της έγχυσης SQL σε σύγκριση με τα παραμετροποιημένα ερωτήματα.","Κατατάξτε ως αποθηκευμένο, ανακλώμενο ή βασισμένο στο DOM XSS την εξής περίπτωση: μια σελίδα αναζήτησης που εμφανίζει το ερώτημα από το URL χρησιμοποιώντας innerHTML.","Γιατί το χαρακτηριστικό SameSite των cookies περιορίζει το CSRF αλλά όχι το XSS;","Όταν ανακοινώθηκε το Log4Shell, πώς θα βοηθούσε ένα SBOM έναν οργανισμό να ανταποκριθεί;"],"cli":{"title":"Προσομοιωτής Στατικού Ελέγχου Κώδικα & Σάρωσης Μυστικών","desc":"Σαρώστε ένα αποθετήριο κώδικα για σκληρά κωδικοποιημένα μυστικά (secrets), εκτελέστε στατική ανάλυση (Bandit/Semgrep) για εντοπισμό SQL Injection και επαληθεύστε παραμετροποιημένες διορθώσεις.","meta":["⏱️ ~30 min","🐚 developer@sec-devops:~$"],"tasks":[{"pill":"Task 1","name":"Σάρωση Πηγαίου Κώδικα για Ενσωματωμένα Μυστικά (Secrets)","instr":"Εκτελέστε σάρωση για εντοπισμό διαρροής κλειδιών και διαπιστευτηρίων με το `trufflehog`.","hint":"Εκτελέστε: trufflehog git file://.","cmd":"$ trufflehog git file://.","ok":"Εντοπίστηκαν μυστικά: Βρέθηκε σκληρά κωδικοποιημένο κλειδί AWS API στο src/config/db.py !"},{"pill":"Task 2","name":"Εκτέλεση Στατικού Ελέγχου Ασφάλειας (Bandit)","instr":"Εκτελέστε στατικό έλεγχο ασφάλειας στα αρχεία Python με το εργαλείο `bandit`.","hint":"Εκτελέστε: bandit -r src/","cmd":"$ bandit -r src/","ok":"Η σάρωση Bandit ολοκληρώθηκε: Εντοπίστηκε σφάλμα υψηλής κρισιμότητας B608 (SQL formatting)."},{"pill":"Task 3","name":"Εντοπισμός SQL Injection με Κανόνες Semgrep","instr":"Εκτελέστε το Semgrep για εντοπισμό ευπαθειών SQL
