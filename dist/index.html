α κατηγορείται, αλλά ένα επίπεδο ανίχνευσης που μπορεί να ενισχυθεί μέσω καλού σχεδιασμού και μιας θετικής κουλτούρας αναφοράς."],"sections":[{"id":"5.1","title":"Η ψυχολογία της εκμετάλλευσης","blocks":[{"type":"p","text":"Η κοινωνική μηχανική επιτυγχάνει επειδή στοχεύει νοητικές συντομεύσεις που υπό κανονικές συνθήκες μάς εξυπηρετούν. Ο ψυχολόγος Robert Cialdini περιέγραψε ορισμένες **αρχές της πειθούς** που οι επιτιθέμενοι εκμεταλλεύονται συστηματικά. _Αυθεντία_: οι άνθρωποι τείνουν να υπακούουν σε οδηγίες που φαίνεται να προέρχονται από έναν προϊστάμενο, το τμήμα πληροφορικής ή την αστυνομία. _Επείγον και σπανιότητα_: μια προθεσμία («ο λογαριασμός σας θα κλείσει σε μία ώρα») μειώνει τον διαθέσιμο χρόνο για προσεκτική σκέψη. _Κοινωνική απόδειξη_: υποθέτουμε ότι μια ενέργεια είναι ασφαλής αν φαίνεται ότι την κάνουν και άλλοι. _Συμπάθεια_ και _αμοιβαιότητα_: είμαστε πιο πρόθυμοι να βοηθήσουμε κάποιον που είναι φιλικός ή που μας έχει κάνει μια μικρή χάρη."},{"type":"p","text":"Οι αρχές αυτές είναι ισχυρές επειδή παρακάμπτουν τη συνειδητή σκέψη και ενεργοποιούν γρήγορες, αυτόματες αντιδράσεις. Το άγχος, η κούραση και ο υπερβολικός όγκος πληροφοριών καθιστούν όλους πιο ευάλωτους, ανεξάρτητα από την ευφυΐα ή τις τεχνικές τους γνώσεις. Οι αποτελεσματικές άμυνες δεν βασίζονται, επομένως, στη διαρκή εγρήγορση των ανθρώπων· εισάγουν _τριβή την κατάλληλη στιγμή_ —για παράδειγμα, υποχρεωτική επιβεβαιωτική κλήση πριν από οποιαδήποτε αλλαγή τραπεζικών στοιχείων— ώστε η αυτόματη αντίδραση να διακόπτεται ακριβώς όταν έχει σημασία."}]},{"id":"5.2","title":"Μέθοδοι επίθεσης: από το μαζικό ψάρεμα έως την κατασκευή προσχήματος","blocks":[{"type":"p","text":"Το **ηλεκτρονικό ψάρεμα** (phishing) είναι η μαζική αποστολή δόλιων μηνυμάτων που μιμούνται αξιόπιστους οργανισμούς, με σκοπό την υποκλοπή διαπιστευτηρίων ή την εγκατάσταση κακόβουλου λογισμικού. Το **στοχευμένο ψάρεμα** (spear-phishing) απευθύνεται σε συγκεκριμένο πρόσωπο ή ομάδα και χρησιμοποιεί στοιχεία που έχουν συλλεχθεί με έρευνα —ονόματα συναδέλφων, τρέχοντα έργα— ώστε να φαίνεται αξιόπιστο. Το **whaling** είναι στοχευμένο ψάρεμα που απευθύνεται σε ανώτατα στελέχη. Οι ίδιες τεχνικές εφαρμόζονται και σε άλλα κανάλια: το **vishing** χρησιμοποιεί τηλεφωνικές κλήσεις, συχνά με πλαστογραφημένη αναγνώριση καλούντος και, όλο και περισσότερο, με φωνές που παράγονται από τεχνητή νοημοσύνη, ενώ το **smishing** χρησιμοποιεί SMS ή εφαρμογές ανταλλαγής μηνυμάτων."},{"type":"p","text":"Η **κατασκευή προσχήματος** (pretexting) συνίσταται στην επινόηση ενός αληθοφανούς σεναρίου —ένας ελεγκτής που χρειάζεται μια αναφορά, ένας τεχνικός που πρέπει να «επαληθεύσει» έναν κωδικό— για την απόκτηση πληροφοριών ή πρόσβασης. Το **δόλωμα** (baiting) αφήνει ένα ελκυστικό αντικείμενο, όπως ένα USB με την ετικέτα «Μισθοδοσία 2026», σε σημείο όπου το θύμα θα το βρει και θα το συνδέσει στον υπολογιστή του. Το κοινό στοιχείο είναι ότι ο επιτιθέμενος δημιουργεί μια κατάσταση στην οποία η επιβλαβής ενέργεια μοιάζει φυσιολογική, εξυπηρετική ή επείγουσα."}]},{"id":"5.3","title":"Φυσικά κανάλια και κανάλια παρατήρησης","blocks":[{"type":"p","text":"Δεν πραγματοποιούνται όλες οι επιθέσεις κοινωνικής μηχανικής στο διαδίκτυο. Το **tailgating** (ή _piggybacking_) σημαίνει να ακολουθεί κανείς ένα εξουσιοδοτημένο πρόσωπο μέσα από μια ασφαλισμένη πόρτα, συχνά κρατώντας κούτες, ώστε το να του κρατήσει κάποιος την πόρτα να φαίνεται απλή ευγένεια. Η **παρακολούθηση πάνω από τον ώμο** (shoulder surfing) είναι η παρατήρηση μιας οθόνης ή ενός πληκτρολογίου για την υποκλοπή κωδικών ή PIN, ενώ η **έρευνα στα απορρίμματα** (dumpster diving) είναι η αναζήτηση χρήσιμων πληροφοριών σε πεταμένα έγγραφα και εξοπλισμό. Η φυσική πρόσβαση είναι ιδιαίτερα επικίνδυνη, επειδή μπορεί να παρακάμψει εντελώς πολλά δικτυακά μέτρα —ένας επιτιθέμενος που φτάνει σε έναν ξεκλείδωτο σταθμό εργασίας ή σε μια δικτυακή θύρα βρίσκεται ήδη «μέσα»."},{"type":"p","text":"Τα αντίμετρα συνδυάζουν τεχνολογία και συμπεριφορά: θαλάμους διπλής πόρτας (mantraps) και περιστροφικές πύλες που επιτρέπουν τη διέλευση ενός ατόμου κάθε φορά, εμφανείς κάρτες επισκεπτών, πολιτική καθαρού γραφείου και κλειδωμένης οθόνης, φίλτρα απορρήτου στις οθόνες, καταστροφή εγγράφων σε τεμαχιστές εγκάρσιας κοπής και πιστοποιημένη καταστροφή αποθηκευτικών μέσων. Το προσωπικό πρέπει να αισθάνεται ότι δικαιούται να ζητήσει ευγενικά στοιχεία από ένα άγνωστο πρόσωπο· αυτό γίνεται ευκολότερο όταν η διοίκηση το υποστηρίζει ρητά."}]},{"id":"5.4","title":"Προσωπική ψηφιακή ασφάλεια: stalkerware και διαρροή μεταδεδομένων","blocks":[{"type":"p","text":"Ορισμένες από τις πιο επιβλαβείς επιθέσεις δεν πραγματοποιούνται από απομακρυσμένους εγκληματίες, αλλά από πρόσωπα του στενού περιβάλλοντος του θύματος. Το **stalkerware** είναι εμπορικά διαθέσιμο λογισμικό το οποίο, μόλις εγκατασταθεί σε ένα κινητό τηλέφωνο, προωθεί κρυφά μηνύματα, τοποθεσία, φωτογραφίες και ιστορικό κλήσεων σε άλλο πρόσωπο. Συνδέεται συχνά με την κακοποίηση από σύντροφο. Προειδοποιητικά σημάδια αποτελούν η ανεξήγητη εξάντληση της μπαταρίας, άγνωστες εφαρμογές με δικαιώματα διαχειριστή συσκευής και ένας σύντροφος που γνωρίζει πράγματα που δεν θα έπρεπε. Επειδή η αφαίρεση του stalkerware μπορεί να ειδοποιήσει τον θύτη και να αυξήσει τον κίνδυνο, τα θύματα πρέπει να αναζητούν υποστήριξη από εξειδικευμένους φορείς πριν προβούν σε οποιαδήποτε ενέργεια."},{"type":"p","text":"Τα **μεταδεδομένα** —δεδομένα για τα δεδομένα— μπορεί να αποκαλύπτουν πολύ περισσότερα από όσα σκοπεύαμε. Τα μεταδεδομένα EXIF μιας φωτογραφίας μπορεί να περιέχουν τις ακριβείς συντεταγμένες GPS του σημείου λήψης, το μοντέλο της συσκευής και την ώρα· τα έγγραφα γραφείου μπορεί να περιλαμβάνουν το όνομα του συντάκτη και το ιστορικό αναθεωρήσεων. Πριν από τη δημόσια κοινοποίηση αρχείων, οι χρήστες πρέπει να αφαιρούν αυτά τα μεταδεδομένα, για παράδειγμα με την εντολή `exiftool -all=` ή με τις ενσωματωμένες λειτουργίες «κατάργησης ιδιοτήτων» των λειτουργικών συστημάτων και των σουιτών γραφείου."}]},{"id":"5.5","title":"Παραβίαση επιχειρηματικού email και κόπωση MFA","blocks":[{"type":"p","text":"Η **παραβίαση επιχειρηματικού ηλεκτρονικού ταχυδρομείου** (Business Email Compromise, BEC) είναι μια απάτη κατά την οποία ο επιτιθέμενος υποδύεται ένα ανώτατο στέλεχος, έναν προμηθευτή ή έναν δικηγόρο —είτε παραβιάζοντας ένα πραγματικό γραμματοκιβώτιο είτε καταχωρίζοντας ένα παρόμοιο όνομα τομέα— και ζητά μια επείγουσα πληρωμή ή αλλαγή τραπεζικών στοιχείων. Η BEC συχνά δεν περιλαμβάνει καθόλου κακόβουλο λογισμικό και, επομένως, διαφεύγει από τα τεχνικά φίλτρα· βασίζεται αποκλειστικά στην αυθεντία και στο επείγον. Οι αποτελεσματικές άμυνες είναι τόσο διαδικαστικές όσο και τεχνικές: οι αλλαγές στοιχείων πληρωμής επαληθεύονται μέσω γνωστού αριθμού τηλεφώνου, οι μεταφορές υψηλής αξίας απαιτούν έγκριση από δύο πρόσωπα (_δημιουργός–ελεγκτής_) και ο έλεγχος αυθεντικότητας email (SPF, DKIM και πολιτική DMARC `p=reject`) δυσχεραίνει σημαντικά την πλαστογράφηση τομέα."},{"type":"p","text":"Η **κόπωση MFA** (MFA fatigue ή _push bombing_) στοχεύει χρήστες που επαληθεύουν την ταυτότητά τους μέσω ειδοποιήσεων push. Έχοντας υποκλέψει έναν κωδικό, ο επιτιθέμενος προκαλεί δεκάδες αιτήματα έγκρισης σύνδεσης, συχνά αργά τη νύχτα, έως ότου ο εξαντλημένος χρήστης πατήσει «Έγκριση» —μερικές φορές μετά από τηλεφώνημα ενός ψεύτικου γραφείου υποστήριξης. Τα αντίμετρα περιλαμβάνουν την _αντιστοίχιση αριθμού_ (ο χρήστης πρέπει να πληκτρολογήσει έναν κωδικό που εμφανίζεται στην οθόνη σύνδεσης), όρια στον αριθμό των αιτημάτων και μεθόδους ανθεκτικές στο ψάρεμα, όπως τα κλειδιά ασφαλείας FIDO2 (Κεφάλαιο 8)."}]},{"id":"5.6","title":"Οικοδόμηση κουλτούρας ασφάλειας που ενθαρρύνει την αναφορά","blocks":[{"type":"p","text":"Τα προγράμματα ευαισθητοποίησης συχνά μετρούν το λάθος πράγμα. Το **ποσοστό κλικ** στις προσομοιωμένες εκστρατείες ηλεκτρονικού ψαρέματος αντανακλά κυρίως τη δυσκολία της προσομοίωσης· μπορεί να αυξηθεί ή να μειωθεί κατά βούληση. Πολύ πιο ουσιαστικός δείκτης είναι το **ποσοστό αναφοράς** —το ποσοστό των χρηστών που αναφέρουν ένα ύποπτο μήνυμα— σε συνδυασμό με τον **χρόνο έως την πρώτη αναφορά**. Μία μόνο έγκαιρη αναφορά επιτρέπει στην ομάδα ασφάλειας να αφαιρέσει ένα κακόβουλο μήνυμα από όλα τα γραμματοκιβώτια πριν το ανοίξουν οι περισσότεροι παραλήπτες."},{"type":"p","text":"Η κουλτούρα καθορίζει αν οι άνθρωποι θα προβούν σε αναφορά. Αν οι εργαζόμενοι που πατούν σε έναν σύνδεσμο ψαρέματος εκτίθενται δημόσια ή τιμωρούνται, θα αποκρύπτουν τα λάθη τους και ο οργανισμός θα χάνει την πιο έγκαιρη προειδοποίησή του. Μια κουλτούρα που ενθαρρύνει την αναφορά την καθιστά εύκολη (ένα κουμπί στο πρόγραμμα ηλεκτρονικού ταχυδρομείου), ευχαριστεί τους ανθρώπους για κάθε αναφορά —ακόμη και για τους ψευδείς συναγερμούς— και αντιμετωπίζει τα λάθη ως ευκαιρίες μάθησης. Με αυτόν τον τρόπο οι χρήστες γίνονται ενεργό επίπεδο ανίχνευσης και όχι αδυναμία του οργανισμού."}]}],"terms":[{"name":"Κοινωνική μηχανική","def":"Χειραγώγηση ανθρώπων ώστε να εκτελέσουν ενέργειες ή να αποκαλύψουν πληροφορίες προς όφελος του επιτιθέμενου."},{"name":"Στοχευμένο ψάρεμα","def":"Ηλεκτρονικό ψάρεμα προσαρμοσμένο σε συγκεκριμένο πρόσωπο ή ομάδα με στοιχεία που συλλέχθηκαν με έρευνα."},{"name":"Κατασκευή προσχήματος","def":"Επινόηση αληθοφανούς σεναρίου για την απόκτηση πληροφοριών ή πρόσβασης."},{"name":"BEC","def":"Παραβίαση επιχειρηματικού email: απάτη με υπόδυση αξιόπιστων προσώπων για εκτροπή πληρωμών."},{"name":"Κόπωση MFA","def":"Κατάκλυση ενός χρήστη με αιτήματα επαλήθευσης έως ότου εγκρίνει κάποιο."},{"name":"DMARC","def":"Πολιτική email που ορίζει στους παραλήπτες πώς να χειρίζονται μηνύματα που αποτυγχάνουν στους ελέγχους SPF/DKIM."}],"summary":["Η κοινωνική μηχανική εκμεταλλεύεται αυτόματες αντιδράσεις απέναντι στην αυθεντία, το επείγον, την κοινωνική απόδειξη, τη συμπάθεια και την αμοιβαιότητα.","Το ηλεκτρονικό ψάρεμα εμφανίζεται σε πολλές μορφές και κανάλια· η κατασκευή προσχήματος και το δόλωμα δημιουργούν καταστάσεις όπου οι επιβλαβείς ενέργειες μοιάζουν φυσιολογικές.","Η φυσική πρόσβαση μπορεί να παρακάμψει τα δικτυακά μέτρα και πρέπει να προστατεύεται τόσο με τεχνολογία όσο και με τη συμπεριφορά του προσωπικού.","Η BEC και η κόπωση MFA αντιμετωπίζονται με διαδικασίες επαλήθευσης, διπλή έγκριση, έλεγχο αυθεντικότητας email και MFA ανθεκτικό στο ψάρεμα.","Ο κρίσιμος δείκτης είναι το ποσοστό αναφοράς και όχι το ποσοστό κλικ· μια κουλτούρα χωρίς απόδοση ευθυνών μετατρέπει τους χρήστες σε επίπεδο ανίχνευσης."],"review":["Εντοπίστε τις αρχές πειθούς που χρησιμοποιούνται στο μήνυμα: «Είμαι ο Διευθύνων Σύμβουλος. Χρειάζομαι την πληρωμή του προμηθευτή μέσα στα επόμενα 30 λεπτά —μην τηλεφωνήσετε, είμαι σε σύσκεψη».","Γιατί η BEC δύσκολα σταματά με λογισμικό προστασίας από ιούς ή με περιβάλλοντα απομονωμένης εκτέλεσης; Ποια μέτρα είναι αποτελεσματικά;","Εξηγήστε πώς η αντιστοίχιση αριθμού αποτρέπει μια βασική επίθεση κόπωσης MFA.","Τεκμηριώστε γιατί το ποσοστό αναφοράς είναι καλύτερος δείκτης ευαισθητοποίησης από το ποσοστό κλικ."],"cli":{"title":"Προσομοιωτής Εγκληματολογίας Επικεφαλίδων Phishing & Άμυνας Κοινωνικής Μηχανικής","desc":"Αναλύστε ένα ύποπτο email πλαστοπροσωπίας διοίκησης, εξετάστε επικεφαλίδες RFC 5322, ελέγξτε εγγραφές SPF/DKIM/DMARC και αποκωδικοποιήστε κακόβουλες διευθύνσεις URL.","meta":["⏱️ ~30 min","🐚 analyst@email-forensics:~$"],"tasks":[{"pill":"Task 1","name":"Έλεγχος Επικεφαλίδων Email για Πλαστογράφηση Αποστολέα","instr":"Εξετάστε τις επικεφαλίδες στο `suspicious_email.eml` χρησιμοποιώντας το `mail-inspect`.","hint":"Εκτελέστε: mail-inspect suspicious_email.eml","cmd":"$ mail-inspect suspicious_email.eml","ok":"Η επικεφαλίδα ελέγχθηκε: Εντοπίστηκε αναντιστοιχία! Το εμφανιζόμενο όνομα είναι πλαστό."},{"pill":"Task 2","name":"Έλεγχος Αυθεντικοποίησης SPF για τον Τομέα Αποστολής","instr":"Ελέγξτε αν η IP αποστολής είναι εξουσιοδοτημένη στην εγγραφή SPF με το `spf-check`.","hint":"Εκτελέστε: spf-check --domain paypa1-security.com","cmd":"$ spf-check --domain paypa1-security.com","ok":"Αποτέλεσμα SPF: FAIL! Η IP 203.0.113.88 δεν είναι εξουσιοδοτημένη στις εγγραφές DNS."},{"pill":"Task 3","name":"Επαλήθευση Κρυπτογραφικής Υπογραφής DKIM","instr":"Επαληθεύστε την κρυπτογραφική υπογραφή του μηνύματος με το `dkim-verify`.","hint":"Εκτελέστε: dkim-verify suspicious_email.eml","cmd":"$ dkim-verify suspicious_email.eml","ok":"Αποτέλεσμα DKIM: INVALID! Η υπογραφή λείπει ή έχει παραποιηθεί."},{"pill":"Task 4","name":"Αποκωδικοποίηση Συσκοτισμένου Συνδέσμου Phishing (SafeLink)","instr":"Αποκωδικοποιήστε την κρυφή διεύθυνση υποκλοπής διαπιστευτηρίων με το `urldecoder`.","hint":"Εκτελέστε: urldecoder https://nam04.safelinks.protection.outlook.com/?url=http%3A%2F%2Fbad-actor-phish.ru%2Flogin%3Fid%3D4928","cmd":"$ urldecoder https://nam04.safelinks.protection.outlook.com/?url=http%3A%2F%2Fbad-actor-phish.ru%2Flogin%3Fid%3D4928","ok":"Το URL αποκωδικοποιήθηκε! Πραγματικός στόχος: http://bad-actor-phish.ru/login?id=4928 (Σελίδα Υποκλοπής)."}]},"lab":{"title":"Προηγμένη Άμυνα κατά της Κοινωνικής Μηχανικής: Διαλογή Phishing, Ενίσχυση Mail Gateway & Μετρικές Ευαισθητοποίησης","desc":"Αυτό το εργαστήριο 2 ωρών καθοδηγεί τους φοιτητές στην πλήρη επιχειρησιακή ροή ενός κέντρου προστασίας από phishing. Θα διερευνήσετε σύνθετες επιθέσεις Business Email Compromise (BEC) και υποκλοπής διαπιστευτηρίων, θα αναλύσετε επικεφαλίδες RFC 5322, θα ρυθμίσετε αυστηρές πολιτικές SPF, DKIM και DMARC στο DNS, θα διαμορφώσετε φίλτρα Secure Email Gateway (SEG) και θα σχεδιάσετε μετρικές ευαισθητοποίησης προσωπικού.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Linux / macOS workstation with `dig`, `swaks`, Python 3.11, OpenDKIM tools","Simulated Mail Transfer Agent (Postfix) & Dovecot IMAP sandbox","DNS Server sandbox (BIND9 / CoreDNS) for SPF/DKIM/DMARC TXT record publishing","Mail samples directory containing benign, spoofed, and weaponized `.eml` files"],"phases":[{"badge":"Phase 1","name":"Εγκληματολογία Επικεφαλίδων Email & Αυθεντικοποίηση Αποστολέα","dur":"⏱️ 25 λεπτά","objs":["Ανάλυση επικεφαλίδων RFC 5322/5321 (`From:`, `Reply-To:`, `Return-Path:`, αλυσίδες `Received:`).","Εντοπισμός διαδρομής αναμετάδοσης IP και γεωγραφικών αποκλίσεων GeoIP.","Έλεγχος επιθέσεων ομογράφων και παραπλήσιων τομέων (lookalike domains / punycode)."],"steps":[{"type":"p","text":"1. Εξετάστε το αρχείο του εισερχόμενου μηνύματος:\\n```bash\\ncat /var/mail/phish_sample_01.eml | head -n 35\\n```"},{"type":"p","text":"2. Ιχνηλατήστε τις αναμεταδόσεις `Received: from` από τον αρχικό πελάτη μέχρι την πύλη MX.\\n3. Εντοπίστε την αναντιστοιχία μεταξύ `Return-Path` και επικεφαλίδας `From`.\\n4. Εξάγετε τους συνδέσμους URL με σενάριο Python:\\n```bash\\npython3 scripts/extract_urls.py /var/mail/phish_sample_01.eml\\n```"}]},{"badge":"Phase 2","name":"Ανάπτυξη Αυθεντικοποίησης DNS: SPF, DKIM & DMARC","dur":"⏱️ 45 λεπτά","objs":["Σύνταξη και δημοσίευση εγγραφής SPF TXT που περιορίζει τις εξουσιοδοτημένες IPs αποστολής.","Δημιουργία ζεύγους κλειδιών RSA 2048-bit DKIM και ρύθμιση εγγραφής selector στο DNS.","Ρύθμιση αυστηρής πολιτικής DMARC (`v=DMARC1; p=reject; pct=100; rua=mailto:[email protected]`)."],"steps":[{"type":"p","text":"1. Δημοσίευση εγγραφής SPF στο αρχείο ζώνης DNS:\\n```dns\\n@ IN TXT \\"v=spf1 ip4:198.51.100.10 include:_spf.google.com -all\\"\\n```"},{"type":"p","text":"2. Παραγωγή κλειδιών OpenDKIM:\\n```bash\\nopendkim-genkey -s 2026mail -d corp.internal\\n```"},{"type":"p","text":"3. Δημοσίευση δημόσιου κλειδιού DKIM και εγγραφής πολιτικής DMARC:\\n```dns\\n_dmarc IN TXT \\"v=DMARC1; p=reject; sp=reject; aspf=s; adkim=s; rua=mailto:[email protected]\\"\\n```"},{"type":"p","text":"4. Επαλήθευση εγγραφών με την εντολή `dig`:\\n```bash\\ndig +short TXT _dmarc.corp.internal\\n```"}]},{"badge":"Phase 3","name":"Κανόνες Φιλτραρίσματος Περιεχομένου Secure Email Gateway (SEG)","dur":"⏱️ 30 λεπτά","objs":["Ρύθμιση κανόνων πύλης για αφαίρεση επικίνδυνων συνημμένων (ISO, VHD, LNK, EXE, XLSM).","Εισαγωγή οπτικών προειδοποιητικών banners για εξωτερικά emails με λέξεις-κλειδιά οικονομικής επείγουσας ανάγκης.","Αποκλεισμός εξερχόμενης επικοινωνίας προς πρόσφατα κατοχυρωμένους παραπλήσιους τομείς."],"steps":[{"type":"p","text":"1. Επεξεργασία κανόνων ελέγχου επικεφαλίδων στο Postfix:\\n```text\\n/^From:.(CEO|CFO|Payroll)./ WARN [EXTERNAL-SPOOF-ALERT]\\n```"},{"type":"p","text":"2. Δοκιμή αποστολής προσομοιωμένου μηνύματος με το εργαλείο `swaks`:\\n```bash\\nswaks --to [email protected] --from [email protected] --server 127.0.0.1\\n```"},{"type":"p","text":"3. Επιβεβαίωση ότι η πύλη απορρίπτει το μήνυμα λόγω αποτυχίας DMARC."}]},{"badge":"Phase 4","name":"Διαμόρφωση Μετρικών Ανθρώπινου Κινδύνου & Σχεδιασμός Ευαισθητοποίησης","dur":"⏱️ 20 λεπτά","objs":["Υπολογισμός Ποσοστού Ευπάθειας σε Phishing (PPP) και Επαναλαμβανόμενων Κλικ ανά τμήμα.","Σχεδιασμός μη τιμωρητικού κύκλου άμεσης εκπαίδευσης για τους εργαζομένους.","Σύνταξη λίστας ελέγχου απόκρισης σε περιστατικά υποκλοπής διαπιστευτηρίων."],"steps":[{"type":"p","text":"1. Υπολογισμός βασικών μετρικών PPP από δεδομένα προσομοίωσης εκστρατείας.\\n2. Σύνταξη οδηγού ανάκλησης διαπιστευτηρίων (επαναφορά MFA, ακύρωση tokens, έλεγχος κανόνων προώθησης).\\n3. Σύνθεση του τελικού φακέλου παραδοτέων εργαστηρίου."}]}],"checklist":["Η ανάλυση επικεφαλίδων εντοπίζει ορθά την αρχική IP και την πλαστογράφηση ονόματος.","Η εγγραφή SPF επιβάλλει αυστηρή πολιτική -all (hardfail).","Οι υπογραφές DKIM επικυρώνονται επιτυχώς έναντι των κλειδιών στο DNS.","Η πολιτική DMARC είναι ρυθμισμένη σε p=reject με διευθύνσεις αναφορών.","Οι μετρικές ανθρώπινου κινδύνου περιλαμβάνουν σαφή βήματα επανεκπαίδευσης."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Εταιρική Αρχιτεκτονική Άμυνας Anti-Phishing & Πλατφόρμα Προσομοίωσης Εκπαίδευσης","desc":"Ένας πολυεθνικός όμιλος παροχής υπηρεσιών υγείας με 15.000 εργαζομένους δέχεται συχνές επιθέσεις Business Email Compromise (BEC) και απόπειρες υποκλοπής ιατρικών δεδομένων. Ως Επικεφαλής Μηχανικός Κυβερνοασφάλειας, σας ανατίθεται να σχεδιάσετε ένα ολοκληρωμένο οικοσύστημα προστασίας: αυτοματοποιημένη διαλογή ύποπτων μηνυμάτων, ανάλυση συγκεντρωτικών αναφορών DMARC XML, ενίσχυση υποδομών email και κατασκευή πλατφόρμας εκπαιδευτικών προσομοιώσεων.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Υποσύστημα Συλλογής & Ανάλυσης Επικεφαλίδων Αναφερόμενων Emails","desc":"Ανάπτυξη του phish_triage.py για σύνδεση μέσω IMAP/API, ανάλυση αρχείων .eml και βαθμολόγηση επιπέδου απειλής.","spec":["Σχεδιασμός καταλόγου ταυτοτήτων με SCIM 2.0 για αυτοματοποιημένο provisioning.","Κατασκευή πινάκων RBAC/ABAC για 50 εταιρικούς ρόλους.","Καθορισμός ροών διαχείρισης κύκλου ζωής εργαζομένων (JML)."],"deliv":"📦 Παραδοτέο Οροσήμου: Σενάριο ανάλυσης Python + σχήμα εξόδου JSON."},{"num":"M2","title":"Πίνακας Αναλυτικής Συγκεντρωτικών Αναφορών DMARC XML","desc":"Ανάπτυξη του dmarc_analytics.py για επεξεργασία αναφορών RUA και εντοπισμό μη εξουσιοδοτημένων αποστολέων.","spec":["Αρχιτεκτονική ομοσπονδίας SAML 2.0 και OIDC με SaaS και εσωτερικές εφαρμογές.","Επιβολή ελέγχου ταυτότητας δύο παραγόντων με FIDO2 / WebAuthn.","Υλοποίηση πολιτικών conditional access βάσει συσκευής, IP και τοποθεσίας."],"deliv":"📦 Παραδοτέο Οροσήμου: Αναλυτής DMARC + πίνακας γραφημάτων."},{"num":"M3","title":"Μηχανή Αυτοματοποιημένου Ελέγχου URLs & Συνημμένων σε Sandbox","desc":"Ενσωμάτωση crawler περιηγητή για λήψη στιγμιοτύπων σελίδων και ανάλυση φορμών υποκλοπής κωδικών.","spec":["Αρχιτεκτονική PAM vault για διαχείριση λογαριασμών root και domain admin.","Υλοποίηση Just-In-Time (JIT) προσωρινών διαπιστευτηρίων με διπλή έγκριση.","Καταγραφή συνεδριών και αυτόματη εναλλαγή προνομιακών κωδικών κάθε 24 ώρες."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα ανάλυσης URL + συλλέκτης στιγμιοτύπων."},{"num":"M4","title":"Εκστρατεία Ευαισθητοποίησης Επιχείρησης & Οδηγός Περιστατικών","desc":"Σύνταξη εκπαιδευτικού προγράμματος, πίνακα δεικτών KPI και πλήρους οδηγού απόκρισης σε περιστατικά BEC για το SOC.","spec":["Σχεδιασμός μηχανής CARTA για συνεχή παρακολούθηση κινδύνου συνεδρίας χρήστη.","Ορισμός κανόνων step-up authentication και άμεσου τερματισμού συνεδρίας σε ανωμαλίες.","Σύνταξη έκθεσης συμμόρφωσης ελέγχου ταυτοτήτων κατά SOX 404 και ISO 27001."],"deliv":"📦 Παραδοτέο Οροσήμου: Στρατηγική ευαισθητοποίησης + οδηγός απόκρισης περιστατικών SOC."}],"deliverables":["Πλήρης Πηγαίος Κώδικας Συστήματος (`/phish_defense/`)","Διαδικτυακός Πίνακας Αναλυτικής DMARC (HTML/JS/Python)","Υπομονάδα Crawler Ανάλυσης URLs σε Sandbox","Επιτελική Έκθεση Στρατηγικής Anti-Phishing & Ανθρώπινου Κινδύνου (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Προσαρμοσμένου OpenID Connect IdP με PKCE & JWT σε Python","desc":"Οι σύγχρονες επιχειρήσεις βασίζονται σε διακομιστές OAuth 2.0 και OpenID Connect (OIDC) για ταυτοποίηση και εξουσιοδότηση. Θα κατασκευάσετε έναν πλήρη OpenID Connect Identity Provider (IdP) σε Python ( py_oidc_server.py ) με FastAPI. Ο server θα υλοποιεί τη ροή Authorization Code με PKCE (SHA-256), θα εκδίδει ψηφιακά υπογεγραμμένα JWT tokens (RS256), θα παρέχει endpoint .well-known/jwks.json και θα επιβάλλει έλεγχο ταυτότητας δύο παραγόντων με TOTP.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Μηχανή Ταυτοποίησης Argon2id & Επαλήθευσης TOTP MFA","desc":"Κατασκευή ασφαλούς αποθήκευσης διαπιστευτηρίων με κατακερματισμό Argon2id και παραγωγή QR codes TOTP.","spec":["Κατακερματισμός κωδικών με `argon2.PasswordHasher` (memory_cost=65536).","Παραγωγή μυστικών κλειδιών TOTP Base32 και επαλήθευση 6-ψήφιων κωδικών με pyotp.","Αποθήκευση χρηστών σε SQLite με ρόλους RBAC (`admin`, `auditor`, `user`)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα auth_engine.py + δοκιμές ταυτοποίησης."},{"num":"M2","title":"OIDC Discovery & Endpoint Δημόσιων Κλειδιών JWKS (RS256)","desc":"Παραγωγή ιδιωτικού κλειδιού υπογραφής RSA-2048 και παροχή των endpoints discovery και JWKS.","spec":["Υλοποίηση του `/.well-known/openid-configuration` με endpoints εξουσιοδότησης και tokens.","Μετατροπή δημόσιου κλειδιού σε JWKS (`kty: RSA`, `alg: RS256`, `kid`).","Υποστήριξη εναλλαγής κλειδιών (key rotation)."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα jwks_server.py + επαλήθευση απόκρισης JWKS."},{"num":"M3","title":"Ροή Authorization Code με PKCE & Έκδοση Tokens","desc":"Υλοποίηση των endpoints /authorize και /token με επικύρωση PKCE και έκδοση υπογεγραμμένων JWTs.","spec":["Επικύρωση PKCE: υπολογισμός `BASE64URL(SHA256(code_verifier))` και έλεγχος με το `code_challenge`.","Έκδοση ID Token RS256 με standard claims (`iss`, `sub`, `aud`, `exp`, `roles`).","Έκδοση Access Token (15 min) και Refresh Token με rotation."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα oauth_routes.py + δοκιμές ανταλλαγής tokens με PKCE."},{"num":"M4","title":"Επικύρωση JWT σε API Gateway Proxy & Εφαρμογή Demo","desc":"Ανάπτυξη middleware API Gateway που ανακτά τα κλειδιά JWKS, επαληθεύει ψηφιακές υπογραφές και επιβάλλει έλεγχο πρόσβασης RBAC.","spec":["Έλεγχος κεφαλίδας `Authorization: Bearer <token>`.","Επαλήθευση υπογραφής με τα δημόσια κλειδιά JWKS και έλεγχος λήξης (`exp`).","Επιβολή περιορισμών ρόλων: η διαδρομή `/api/admin` απαιτεί ρόλο `admin`."],"deliv":"📦 Παραδοτέο Λογισμικού: Πλήρης εφαρμογή OIDC IdP & Gateway + ολοκληρωμένες δοκιμές."}],"deliverables":["Πηγαίος κώδικας OIDC Identity Provider (`/py_oidc_server/`)","Middleware επικύρωσης JWTs στο API Gateway (`gateway_proxy.py`)","Σουίτα δοκιμών PyTest (PKCE, Expiry, Argon2id, RBAC)","Έγγραφο Προδιαγραφών Αρχιτεκτονικής Ταυτότητας (8–10 σελίδες)"],"env":[]}],"quizTitle":"Εξέταση Αξιολόγησης Κεφαλαίου 5","quiz":[{"q":"Στη σύγχρονη Ταυτοποίηση Πολλαπλών Παραγόντων (MFA), ποιες τρεις διακριτές κατηγορίες παραγόντων συνδυάζονται;","opts":[{"k":"A","v":"Κάτι που γνωρίζεις (κωδικός), κάτι που κατέχεις (token υλικού) και κάτι που είσαι (βιομετρικά στοιχεία)."},{"k":"B","v":"Κάτι που γράφεις (υπογραφή), κάτι που εκπέμπεις (διεύθυνση IP) και κάτι που διαβάζεις (κωδικός QR)."},{"k":"C","v":"Κάτι που υπολογίζεις (hash), κάτι που αποθηκεύεις (cookie) και κάτι που στέλνεις (διεύθυνση email), για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Κάτι που εγκαθιστάς (λογισμικό), κάτι που ρυθμίζεις (firewall) και κάτι που αναβαθμίζεις (πυρήνας)."},{"k":"E","v":"Κάτι που κρυπτογραφείς (κλειδί AES), κάτι που υπογράφεις (πιστοποιητικό) και κάτι που κατακερματίζεις."}],"ans":"A","exp":"Η πραγματική MFA απαιτεί συνδυασμό παραγόντων από τουλάχιστον δύο διαφορετικές κατηγορίες: Γνώση (τι ξέρεις), Κατοχή (τι έχεις), ή Εγγενές στοιχείο (τι είσαι)."},{"q":"Ποια είναι η θεμελιώδης λειτουργική διαφορά μεταξύ του OAuth 2.0 και του OpenID Connect (OIDC);","opts":[{"k":"A","v":"Το OAuth 2.0 σχεδιάστηκε για ταυτοποίηση χρήστη, ενώ το OIDC σχεδιάστηκε αποκλειστικά για κρυπτογράφηση υλικού, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"B","v":"Το OAuth 2.0 είναι πλαίσιο εξουσιοδότησης (εκχώρηση πρόσβασης), ενώ το OIDC προσθέτει επίπεδο ταυτότητας (ταυτοποίηση)."},{"k":"C","v":"Το OAuth 2.0 λειτουργεί αποκλειστικά μέσω UDP, ενώ το OIDC απαιτεί κρυπτογραφημένες συνδέσεις TCP, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"D","v":"Το OAuth 2.0 αντικαθιστά ασύμμετρα κλειδιά με κωδικούς, ενώ το OIDC καταργεί τα διακριτικά πρόσβασης (tokens), σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"E","v":"Το OAuth 2.0 αφορά μόνο κινητές συσκευές, ενώ το OIDC αφορά μόνο εξυπηρετητές παρασκηνίου (backends), χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."}],"ans":"B","exp":"Το OAuth 2.0 αφορά την εξουσιοδότηση (Access Tokens για APIs), ενώ το OIDC χτίζεται πάνω του παρέχοντας ταυτοποίηση χρήστη και στοιχεία ταυτότητας (ID Tokens σε μορφή JWT)."},{"q":"Γιατί η επέκταση PKCE είναι απαραίτητη κατά τη χρήση του OAuth 2.0 Authorization Code flow σε Single-Page Apps (SPAs);","opts":[{"k":"A","v":"Εξαλείφει την ανάγκη χρήσης κρυπτογράφησης TLS κατά την ανταλλαγή διακριτικών πρόσβασης (tokens), για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"B","v":"Αντικαθιστά τα JWTs με κρυπτογραφημένες βεβαιώσεις XML SAML 2.0 για εφαρμογές κινητών τηλεφώνων, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"C","v":"Προστατεύει δημόσιους πελάτες από υποκλοπή authorization code χωρίς να απαιτείται μυστικό (client secret)."},{"k":"D","v":"Αποτρέπει τους διαχειριστές βάσεων από το να δουν τους κατακερματισμένους κωδικούς των χρηστών, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"E","v":"Αναγκάζει τον περιηγητή να εκτελεί τη JavaScript σε απομονωμένο τμήμα μνήμης του πυρήνα, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"C","exp":"Οι δημόσιοι πελάτες (SPAs) δεν μπορούν να κρύψουν client secrets. Το PKCE παράγει δυναμικά code_verifier και challenge, αποτρέποντας την εξαργύρωση υποκλαπέντων κωδικών εξουσιοδότησης."},{"q":"Πώς παρέχει ο Έλεγχος Πρόσβασης Βάσει Ιδιοτήτων (ABAC) μεγαλύτερη ευελιξία σε σύγκριση με τον Έλεγχο Βάσει Ρόλων (RBAC);","opts":[{"k":"A","v":"Το ABAC αποδίδει στατικά δικαιώματα αυστηρά σε προκαθορισμένους ρόλους χωρίς να εξετάζει το πλαίσιο."},{"k":"B","v":"Το ABAC καταργεί πλήρως την ανάγκη ταυτοποίησης χρηστών βασιζόμενο σε ανώνυμα κρυπτογραφικά hashes, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Το ABAC απαιτεί όλες οι μηχανές αξιολόγησης να εκτελούνται απευθείας σε μονάδες ασφαλείας υλικού (HSM), για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Το ABAC λαμβάνει αποφάσεις πρόσβασης δυναμικά βάσει ιδιοτήτων χρήστη, πόρου, ενέργειας και περιβάλλοντος."},{"k":"E","v":"Το ABAC επιτρέπει σε οποιονδήποτε χρήστη να αποδίδει δικαιώματα διαχειριστή σε τυχαίους κόμβους, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."}],"ans":"D","exp":"Το ABAC αξιολογεί δυναμικές πολιτικές βάσει ιδιοτήτων του χρήστη, του πόρου, της ενέργειας και του περιβάλλοντος (π.χ. ώρα, τοποθεσία, κατάσταση ασφάλειας συσκευής)."},{"q":"Γιατί το Argon2id συνιστάται σήμερα έναντι του κλασικού SHA-256 για την αποθήκευση και κατακερματισμό κωδικών πρόσβασης;","opts":[{"k":"A","v":"Το Argon2id παράγει έξοδο μεταβλητού μήκους που παρακάμπτει τους περιορισμούς σχημάτων βάσεων δεδομένων."},{"k":"B","v":"Το Argon2id λειτουργεί ως ασύμμετρο κρυπτοσύστημα δημόσιου κλειδιού, καταργώντας την ανάγκη για salt, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"C","v":"Το Argon2id στέλνει αυτόματα ειδοποιήσεις παραβιασμένων κωδικών σε διεθνείς διωκτικές αρχές."},{"k":"D","v":"Το Argon2id κρυπτογραφεί κωδικούς με εφήμερα κανάλια κβαντικής διανομής κλειδιών σε τοπικά δίκτυα, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Το Argon2id είναι αλγόριθμος υψηλής απαίτησης μνήμης (memory-hard), ανθεκτικός σε επιθέσεις GPUs και ASICs."}],"ans":"E","exp":"Οι κλασικές συναρτήσεις όπως η SHA-256 είναι γρήγορες, επιτρέποντας δισεκατομμύρια δοκιμές το δευτερόλεπτο σε GPUs. Το Argon2id απαιτεί σημαντική μνήμη RAM, εξουδετερώνοντας επιθέσεις με κάρτες γραφικών."},{"q":"Σε μια υποδομή ταυτοποίησης Kerberos, ποιος είναι ο κρίσιμος αντίκτυπος μιας επίθεσης \'Golden Ticket\';","opts":[{"k":"A","v":"Ο επιτιθέμενος χρησιμοποιεί το κλειδί του λογαριασμού KRBTGT για να πλαστογραφεί TGTs με πλήρη πρόσβαση σε όλο το domain."},{"k":"B","v":"Ο επιτιθέμενος κλέβει cookies περιηγητή για να παρακάμψει προειδοποιήσεις πιστοποιητικών TLS, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Ο επιτιθέμενος εξαντλεί τη μνήμη των διακομιστών Active Directory μέσω επιθέσεων ενίσχυσης DNS, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Ο επιτιθέμενος αλλάζει κλειδιά μητρώου των υπολογιστών για να απενεργοποιήσει την κρυπτογράφηση δίσκων, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"E","v":"Ο επιτιθέμενος μετατρέπει μη κρυπτογραφημένα ερωτήματα LDAP σε υπογεγραμμένα έγγραφα SAML 2.0, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."}],"ans":"A","exp":"Η επίθεση Golden Ticket χρησιμοποιεί το κλειδί του λογαριασμού KRBTGT για την πλαστογράφηση έγκυρων TGTs για οποιονδήποτε χρήστη, αποκτώντας πλήρη και διαρκή έλεγχο σε ολόκληρο το Active Directory domain."},{"q":"Ποιος βασικός αμυντικός μηχανισμός αποτρέπει αυτοματοποιημένες επιθέσεις \'Credential Stuffing\' σε πύλες εισόδου ιστού;","opts":[{"k":"A","v":"Μεταγλώττιση του κώδικα JavaScript σε ιδιόκτητα εκτελέσιμα C++ πριν από τη διάθεση στην παραγωγή, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Περιορισμός ρυθμού (rate limiting), προσαρμοστική MFA βάσει κινδύνου, CAPTCHAs και έλεγχος διαρροών."},{"k":"C","v":"Απενεργοποίηση των διακριτικών επαναφοράς συνόδου TLS στους εξωτερικούς εξισορροπητές φορτίου, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"D","v":"Επιβολή σύνδεσης όλων των χρηστών μέσω τούνελ PPTP VPN πριν από την πλοήγηση στον ιστό, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Μετατροπή των πινάκων βάσεων δεδομένων σε απλά αρχεία κειμένου αποθηκευμένα σε τοπικούς φακέλους, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"B","exp":"Το credential stuffing εκμεταλλεύεται διαρροές κωδικών. Αντιμετωπίζεται με προσαρμοστική MFA, περιορισμό ρυθμού (rate limiting), CAPTCHA, ανίχνευση bots και έλεγχο σε βάσεις διαρροών (HaveIBeenPwned)."},{"q":"Ποια ευπάθεια ασφάλειας προκύπτει σε υλοποιήσεις SAML 2.0 SSO γνωστή ως \'XML Signature Wrapping\' (XSW);","opts":[{"k":"A","v":"Οι επιτιθέμενοι αποκρυπτογραφούν ιδιωτικά κλειδιά TLS με κβαντικούς αλγορίθμους παραγοντοποίησης, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Οι επιτιθέμενοι κατακλύζουν τους παρόχους ταυτότητας με ερωτήματα DNS για να εξαντλήσουν τη μνήμη, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Οι επιτιθέμενοι αναδιατάσσουν υπογεγραμμένα στοιχεία XML ώστε η υπογραφή να επαληθεύεται ενώ η εφαρμογή διαβάζει πλαστά δεδομένα."},{"k":"D","v":"Οι επιτιθέμενοι αλλάζουν τα σχήματα βάσεων δεδομένων απενεργοποιώντας τους περιορισμούς ξένων κλειδιών, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"E","v":"Οι επιτιθέμενοι μετατρέπουν τα SAML tokens σε μη ασφαλείς κεφαλίδες HTTP basic authentication, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"C","exp":"Στις επιθέσεις XSW, ο επιτιθέμενος εισάγει μια πλαστή βεβαίωση μετακινώντας την έγκυρη υπογεγραμμένη βεβαίωση σε άλλο σημείο του XML, ξεγελώντας την εφαρμογή ώστε να αποδεχτεί πλαστά δικαιώματα."},{"q":"Ποια είναι η βασική αρχή της Διαχείρισης Προνομιακής Πρόσβασης Just-in-Time (JIT PAM);","opts":[{"k":"A","v":"Μόνιμη απόδοση δικαιωμάτων διαχειριστή root σε όλο το προσωπικό ανάπτυξης λογισμικού, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Αποθήκευση κωδικών διαχειριστή σε μη κρυπτογραφημένα αρχεία ρυθμίσεων σε διακομιστές git, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Απενεργοποίηση καταγραφής συνόδων και ελέγχου κατά τη διάρκεια προγραμματισμένης συντήρησης, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Προσωρινή παραχώρηση αναβαθμισμένων δικαιωμάτων μόνο όταν απαιτείται για συγκεκριμένη εργασία και αυτόματη ανάκληση."},{"k":"E","v":"Δρομολόγηση συνδέσεων διαχείρισης SSH μέσω μη ταυτοποιημένων δημόσιων διακομιστών proxy, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."}],"ans":"D","exp":"Το JIT PAM εξαλείφει τα μόνιμα δικαιώματα παραχωρώντας προσωρινή πρόσβαση με έγκριση και αυτόματη λήξη, ελαχιστοποιώντας την επιφάνεια επίθεσης για υποκλοπή διαπιστευτηρίων."},{"q":"Πώς πραγματοποιείται συνήθως η Υποκλοπή Συνόδου (Session Hijacking) σε διαδικτυακές εφαρμογές που χρησιμοποιούν session cookies;","opts":[{"k":"A","v":"Ο επιτιθέμενος εκτελεί επιθέσεις εξαντλητικής αναζήτησης στη μονάδα ασφαλείας υλικού (HSM) της βάσης, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"B","v":"Ο επιτιθέμενος αλλάζει εγγραφές DNS για ανακατεύθυνση της κίνησης σε μη ασφαλείς διακομιστές NTP, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"C","v":"Ο επιτιθέμενος μετατρέπει σχεσιακούς πίνακες σε μη σχεσιακά έγγραφα δεδομένων σε πραγματικό χρόνο, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"D","v":"Ο επιτιθέμενος επανεκκινεί τον υπολογιστή του χρήστη σε περιβάλλον ανάκτησης χωρίς προνόμια, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."},{"k":"E","v":"Ο επιτιθέμενος υποκλέπτει ή προβλέπει ένα έγκυρο session token (μέσω XSS, sniffing ή fixation) για να υποδυθεί το θύμα."}],"ans":"E","exp":"Η υποκλοπή συνόδου συμβαίνει όταν ο επιτιθέμενος αποκτά το session ID του θύματος (μέσω XSS, υποκλοπής κίνησης ή προβλέψιμων tokens) για να αποκτήσει πρόσβαση ως ο νόμιμος χρήστης."}]},{"part":"Μέρος 2 · Αντίπαλοι και Επιθέσεις","time":"Κεφάλαιο 6 · ⏱️ 8–10 ώρες μελέτης","title":"6. Ασφάλεια Δικτύων: Επιθέσεις, Άμυνες και Τοπολογίες Botnet","subtitle":"DoS και DDoS · Ενίσχυση · Botnet και διοίκηση-έλεγχος · Επιθέσεις ενδιάμεσου · Τείχη προστασίας · VPN · Κατάτμηση, NAC και ασφάλεια ασύρματων δικτύων","outcomes":["Να διακρίνετε τις επιθέσεις άρνησης υπηρεσίας ογκομετρικού τύπου, επιπέδου πρωτοκόλλου και επιπέδου εφαρμογής και να εξηγείτε την ενίσχυση (amplification).","Να συγκρίνετε τις κεντρικές και τις ομότιμες αρχιτεκτονικές botnet και να περιγράφετε τον κύκλο ζωής ενός botnet.","Να εξηγείτε την πλαστογράφηση ARP, την πλαστογράφηση DNS και την απογύμνωση TLS, καθώς και τα μέτρα που τις αποτρέπουν.","Να σχεδιάζετε μια πολυεπίπεδη άμυνα κατά DDoS, από την άκρη του δικτύου έως την εφαρμογή.","Να περιγράφετε τον ρόλο και τα όρια των τειχών προστασίας, των VPN, της κατάτμησης, του 802.1X και του WPA3."],"intro":["Τα δίκτυα συνδέουν τα πάντα, και ό,τι συνδέεται μπορεί επίσης να δεχθεί επίθεση. Το κεφάλαιο εξετάζει πώς οι αντίπαλοι κάνουν κατάχρηση των δικτυακών πρωτοκόλλων για να διαταράξουν τη διαθεσιμότητα, να υποκλέψουν ή να αλλοιώσουν την κίνηση και να συντονίσουν χιλιάδες παραβιασμένες συσκευές. Προϋποθέτει βασική εξοικείωση με το μοντέλο TCP/IP· όπου μια λεπτομέρεια πρωτοκόλλου είναι απαραίτητη, εξηγείται στο κείμενο.","Το πρώτο μισό του κεφαλαίου εστιάζει στις επιθέσεις: την άρνηση υπηρεσίας και τις κατανεμημένες και ενισχυμένες μορφές της, την αρχιτεκτονική και τον κύκλο ζωής των botnet, καθώς και τις τεχνικές ενδιάμεσου (man-in-the-middle). Το δεύτερο μισό στρέφεται στην άμυνα. Δείχνει πώς λειτουργεί στην πράξη η πολυεπίπεδη αντιμετώπιση επιθέσεων DDoS και παρουσιάζει τα δομικά στοιχεία της δικτυακής άμυνας —τείχη προστασίας, εικονικά ιδιωτικά δίκτυα, κατάτμηση, έλεγχο πρόσβασης στο δίκτυο και ασφάλεια ασύρματων δικτύων— με σαφή διατύπωση του τι μπορεί και τι δεν μπορεί να επιτύχει το καθένα."],"sections":[{"id":"6.1","title":"Άρνηση υπηρεσίας: DoS, DDoS και ενίσχυση","blocks":[{"type":"p","text":"Μια επίθεση **άρνησης υπηρεσίας** (Denial of Service, DoS) στοχεύει να καταστήσει μια υπηρεσία μη διαθέσιμη στους νόμιμους χρήστες της. Όταν η κίνηση της επίθεσης προέρχεται ταυτόχρονα από πολλές πηγές, ονομάζεται **κατανεμημένη άρνηση υπηρεσίας** (Distributed Denial of Service, DDoS) και γίνεται πολύ δυσκολότερο να αποκλειστεί, επειδή δεν υπάρχει μία πηγή που να μπορεί απλώς να φιλτραριστεί. Οι επιθέσεις DDoS χωρίζονται σε τρεις γενικές οικογένειες. Οι **ογκομετρικές** κατακλύζουν το εύρος ζώνης του θύματος. Οι επιθέσεις **επιπέδου πρωτοκόλλου** εξαντλούν τους πόρους κατάστασης διακομιστών ή δικτυακών συσκευών· η κλασική _πλημμύρα SYN_ στέλνει πολλά αιτήματα σύνδεσης TCP χωρίς να ολοκληρώνει τη χειραψία, γεμίζοντας τον πίνακα ημιανοιχτών συνδέσεων του διακομιστή. Οι επιθέσεις **επιπέδου εφαρμογής** στέλνουν φαινομενικά νόμιμα αλλά απαιτητικά αιτήματα —όπως ερωτήματα αναζήτησης— που εξαντλούν την ίδια την εφαρμογή."},{"type":"p","text":"Η **ενίσχυση** (amplification) επιτρέπει σε έναν επιτιθέμενο με περιορισμένο εύρος ζώνης να παράγει τεράστιες πλημμύρες κίνησης. Ο επιτιθέμενος στέλνει μικρά αιτήματα με πλαστογραφημένη διεύθυνση προέλευσης (τη διεύθυνση του θύματος) σε δημόσιους διακομιστές, οι οποίοι επιστρέφουν πολύ μεγαλύτερες απαντήσεις. Πρωτόκολλα όπως τα DNS, NTP και memcached έχουν χρησιμοποιηθεί με αυτόν τον τρόπο, με συντελεστές ενίσχυσης από μερικές δεκάδες έως δεκάδες χιλιάδες. Δύο μέτρα αντιμετωπίζουν τη ρίζα του προβλήματος: τα δίκτυα πρέπει να απορρίπτουν εξερχόμενα πακέτα με πλαστογραφημένες διευθύνσεις προέλευσης (_φιλτράρισμα εισόδου_, BCP 38) και οι διαχειριστές δεν πρέπει να εκθέτουν στο διαδίκτυο ανοιχτούς αναλυτές DNS ή άλλους ενισχυτές."}]},{"id":"6.2","title":"Botnet: αρχιτεκτονικές, κύκλος ζωής και στρατολόγηση συσκευών IoT","blocks":[{"type":"p","text":"Ένα **botnet** είναι ένα δίκτυο παραβιασμένων συσκευών («bots») που ελέγχονται απομακρυσμένα από έναν διαχειριστή. Σε μια **κεντρική** αρχιτεκτονική, τα bots λαμβάνουν εντολές από έναν ή λίγους διακομιστές διοίκησης και ελέγχου (Command and Control, C2), ιστορικά μέσω IRC και σήμερα κυρίως μέσω HTTPS. Ο σχεδιασμός αυτός είναι απλός αλλά εύθραυστος: η κατάσχεση των διακομιστών C2 απενεργοποιεί το botnet. Τα **ομότιμα** (peer-to-peer) botnet κατανέμουν τις εντολές στα ίδια τα bots, κάτι που καθιστά την εξάρθρωσή τους πολύ δυσκολότερη. Οι διαχειριστές χρησιμοποιούν επίσης _αλγορίθμους παραγωγής ονομάτων τομέα_ (DGA), οι οποίοι δημιουργούν χιλιάδες υποψήφια ονόματα κάθε ημέρα, ώστε οι αμυνόμενοι να μην μπορούν να τα αποκλείσουν όλα εκ των προτέρων."},{"type":"p","text":"Ο κύκλος ζωής ενός botnet περιλαμβάνει τη **στρατολόγηση** (μόλυνση νέων συσκευών), τη **διοίκηση και τον έλεγχο**, την **αξιοποίηση** (DDoS επί πληρωμή, ανεπιθύμητη αλληλογραφία, μαζική δοκιμή διαπιστευτηρίων, εξόρυξη κρυπτονομισμάτων) και τη **συντήρηση** (ενημέρωση και προστασία των bots). Το botnet **Mirai** του 2016 έδειξε πόσο αδύναμο ήταν το Διαδίκτυο των Πραγμάτων: απλώς δοκίμαζε μια λίστα περίπου εξήντα εργοστασιακών ονομάτων χρήστη και κωδικών σε κάμερες και δρομολογητές, στρατολόγησε εκατοντάδες χιλιάδες συσκευές και εξαπέλυσε επιθέσεις που διατάραξαν σημαντικές υπηρεσίες του διαδικτύου. Το δίδαγμα για κατασκευαστές και διαχειριστές είναι σαφές —μοναδικά διαπιστευτήρια, αυτόματες ενημερώσεις και καμία περιττή απομακρυσμένη υπηρεσία."}]},{"id":"6.3","title":"Υποκλοπή και αλλοίωση: επιθέσεις ενδιάμεσου","blocks":[{"type":"p","text":"Σε μια **επίθεση ενδιάμεσου** (Man-in-the-Middle, MITM), ο αντίπαλος παρεμβάλλεται ανάμεσα σε δύο μέρη που επικοινωνούν, ώστε η κίνηση να διέρχεται από ένα σύστημα που ελέγχει. Σε ένα τοπικό δίκτυο, η **πλαστογράφηση ARP** το επιτυγχάνει αποστέλλοντας ψευδή μηνύματα που συσχετίζουν τη φυσική διεύθυνση του επιτιθέμενου με τη διεύθυνση IP της προεπιλεγμένης πύλης· τα θύματα στέλνουν στη συνέχεια την κίνησή τους στον επιτιθέμενο. Η **πλαστογράφηση DNS** επιστρέφει ψευδείς απαντήσεις σε ερωτήματα ονομάτων, ανακατευθύνοντας τους χρήστες σε κακόβουλους διακομιστές. Σε δημόσια δίκτυα Wi-Fi, ένα σημείο πρόσβασης _«κακός δίδυμος»_ (evil twin) με γνώριμο όνομα δικτύου μπορεί να προσελκύσει ανυποψίαστους χρήστες."},{"type":"p","text":"Μόλις βρεθεί στη μέση, ο επιτιθέμενος μπορεί είτε να **υποκλέπτει** παθητικά τη μη κρυπτογραφημένη κίνηση είτε να την τροποποιεί ενεργά —για παράδειγμα μέσω της _απογύμνωσης TLS_ (TLS stripping), η οποία υποβαθμίζει μια σύνδεση από HTTPS σε HTTP. Η κρυπτογραφία είναι το θεμελιώδες αντίμετρο: το σωστά επικυρωμένο TLS (Κεφάλαιο 7) καθιστά την υποκλαπείσα κίνηση μη αναγνώσιμη και την αλλοίωση ανιχνεύσιμη, ενώ ο μηχανισμός **HTTP Strict Transport Security (HSTS)** αποτρέπει την υποβάθμιση. Σε επίπεδο δικτύου, η _δυναμική επιθεώρηση ARP_ και η _παρακολούθηση DHCP_ (DHCP snooping) στους μεταγωγείς, η επικύρωση DNSSEC και ο έλεγχος ταυτότητας 802.1X περιορίζουν τις ευκαιρίες υποκλοπής."}]},{"id":"6.4","title":"Πολυεπίπεδη άμυνα κατά DDoS στην πράξη","blocks":[{"type":"p","text":"Καμία μεμονωμένη συσκευή δεν μπορεί να απορροφήσει κάθε επίθεση DDoS· γι\' αυτό η άμυνα οργανώνεται σε επίπεδα, καθένα από τα οποία χειρίζεται αυτό που κάνει καλύτερα. Στο **ανάντη** επίπεδο, οι πάροχοι διαδικτύου και οι υπηρεσίες «καθαρισμού» κίνησης στο νέφος απορροφούν τις ογκομετρικές πλημμύρες, αξιοποιώντας χωρητικότητα πολύ μεγαλύτερη από τη σύνδεση οποιουδήποτε μεμονωμένου οργανισμού· η δρομολόγηση anycast κατανέμει το φορτίο σε πολλά κέντρα δεδομένων. Στην **άκρη του δικτύου**, οι δρομολογητές εφαρμόζουν λίστες πρόσβασης και όρια ρυθμού, ενώ η _απομακρυσμένα ενεργοποιούμενη «μαύρη τρύπα»_ (remote-triggered black-holing) μπορεί να θυσιάσει μία διεύθυνση που δέχεται επίθεση για να προστατεύσει το υπόλοιπο δίκτυο."},{"type":"p","text":"Πιο κοντά στην υπηρεσία, **άμυνες επιπέδου πρωτοκόλλου**, όπως τα _SYN cookies_, επιτρέπουν στους διακομιστές να χειρίζονται πλημμύρες ημιανοιχτών συνδέσεων χωρίς να αποθηκεύουν κατάσταση. Στο επίπεδο της **εφαρμογής**, τα δίκτυα διανομής περιεχομένου (CDN), τα τείχη προστασίας εφαρμογών ιστού (WAF), η προσωρινή αποθήκευση και ο περιορισμός ρυθμού ανά πελάτη φιλτράρουν τα απαιτητικά αιτήματα, ενώ δοκιμασίες όπως τα CAPTCHA διαχωρίζουν τους ανθρώπους από τα bots. Τέλος, ένα τεκμηριωμένο **εγχειρίδιο ενεργειών** (runbook) —ποιον καλούμε, πώς ενεργοποιούμε τον καθαρισμό κίνησης, πώς επικοινωνούμε με τους πελάτες— εξασφαλίζει ότι ο οργανισμός αντιδρά σε λεπτά και όχι σε ώρες."}]},{"id":"6.5","title":"Τείχη προστασίας και εικονικά ιδιωτικά δίκτυα","blocks":[{"type":"p","text":"Ένα **τείχος προστασίας** (firewall) επιβάλλει μια πολιτική σχετικά με το ποια κίνηση επιτρέπεται να διέρχεται μεταξύ ζωνών του δικτύου. Τα _φίλτρα πακέτων_ εξετάζουν μεμονωμένα πακέτα με βάση τη διεύθυνση, τη θύρα και το πρωτόκολλο. Τα τείχη προστασίας _με διατήρηση κατάστασης_ (stateful) παρακολουθούν τις συνδέσεις, ώστε μια απάντηση να επιτρέπεται μόνο αν αντιστοιχεί σε αίτημα που έχει σταλεί. Τα _τείχη προστασίας νέας γενιάς_ αναγνωρίζουν επιπλέον εφαρμογές και χρήστες και μπορεί να ενσωματώνουν πρόληψη εισβολών. Ανεξάρτητα από τη γενιά, ένας κανόνας σχεδίασης είναι θεμελιώδης: η πολιτική πρέπει να **απορρίπτει εξ ορισμού** και να επιτρέπει μόνο τις ρητά αναγκαίες ροές, σύμφωνα με την αρχή των ασφαλών προεπιλογών."},{"type":"p","text":"Ένα **εικονικό ιδιωτικό δίκτυο** (Virtual Private Network, VPN) δημιουργεί ένα κρυπτογραφημένο τούνελ μέσα από ένα μη αξιόπιστο δίκτυο. Το **IPsec** λειτουργεί στο επίπεδο δικτύου και χρησιμοποιείται συχνά για συνδέσεις μεταξύ εγκαταστάσεων· τα **VPN που βασίζονται σε TLS** είναι βολικά για απομακρυσμένους χρήστες· το **WireGuard** είναι ένα σύγχρονο πρωτόκολλο με σκόπιμα μικρό όγκο κώδικα και σταθερή, σύγχρονη κρυπτογραφία. Είναι σημαντικό να κατανοηθεί τι _δεν_ κάνει ένα VPN: προστατεύει την κίνηση κατά τη μεταφορά, αλλά δεν καθιστά αξιόπιστη τη συσκευή που συνδέεται. Ένας παραβιασμένος φορητός υπολογιστής που συνδέεται μέσω VPN φέρνει τον επιτιθέμενο μέσα στο δίκτυο —ένας από τους λόγους για τους οποίους οι οργανισμοί μεταβαίνουν σε πρόσβαση μηδενικής εμπιστοσύνης (Κεφάλαιο 13)."}]},{"id":"6.6","title":"Κατάτμηση, έλεγχος πρόσβασης στο δίκτυο και ασφάλεια ασύρματων δικτύων","blocks":[{"type":"p","text":"Η **κατάτμηση δικτύου** (segmentation) διαιρεί ένα δίκτυο σε ζώνες —για παράδειγμα σταθμούς εργασίας χρηστών, διακομιστές, διεπαφές διαχείρισης και Wi-Fi επισκεπτών— και επιτρέπει μόνο την κίνηση που πραγματικά χρειάζεται κάθε ζώνη. Η κατάτμηση δεν αποτρέπει την πρώτη παραβίαση, περιορίζει όμως το πόσο μακριά μπορεί να κινηθεί ο επιτιθέμενος στη συνέχεια· η περίπτωση του WannaCry στο Κεφάλαιο 4 έδειξε το κόστος των επίπεδων δικτύων. Η _μικροκατάτμηση_ εφαρμόζει την ίδια ιδέα έως το επίπεδο των μεμονωμένων φόρτων εργασίας."},{"type":"p","text":"Ο **έλεγχος πρόσβασης στο δίκτυο** (Network Access Control, NAC) αποφασίζει αν μια συσκευή επιτρέπεται καν να συνδεθεί στο δίκτυο. Το πρότυπο **IEEE 802.1X** απαιτεί από κάθε συσκευή να επαληθεύσει την ταυτότητά της —συνήθως με πιστοποιητικό— πριν ενεργοποιηθεί η θύρα του μεταγωγέα ή η ασύρματη σύνδεση, και μπορεί να τοποθετεί μη συμμορφούμενες συσκευές σε δίκτυο καραντίνας. Η ασφάλεια των ασύρματων δικτύων έχει εξελιχθεί σημαντικά: το WEP είναι πλήρως παραβιασμένο, το WPA2 είναι ευάλωτο σε μαντεψιά κωδικών εκτός σύνδεσης όταν χρησιμοποιούνται αδύναμες φράσεις πρόσβασης, ενώ το **WPA3** εισάγει τη χειραψία SAE, η οποία αντιστέκεται σε τέτοιες μαντεψιές και παρέχει εμπρόσθια μυστικότητα. Στις επιχειρήσεις, η συνιστώμενη ρύθμιση παραμένει το WPA2/WPA3-Enterprise με 802.1X."}]}],"terms":[{"name":"DDoS","def":"Κατανεμημένη άρνηση υπηρεσίας: επίθεση κατά της διαθεσιμότητας από πολλές πηγές ταυτόχρονα."},{"name":"Ενίσχυση","def":"Αξιοποίηση τρίτων διακομιστών που επιστρέφουν μεγάλες απαντήσεις σε μικρά, πλαστογραφημένα αιτήματα."},{"name":"Botnet / C2","def":"Δίκτυο παραβιασμένων συσκευών και το κανάλι διοίκησης και ελέγχου που τις κατευθύνει."},{"name":"Πλαστογράφηση ARP","def":"Αποστολή ψευδών μηνυμάτων ARP για την ανακατεύθυνση της τοπικής κίνησης μέσω του επιτιθέμενου."},{"name":"Τείχος προστασίας με κατάσταση","def":"Τείχος προστασίας που παρακολουθεί τις συνδέσεις και επιτρέπει απαντήσεις μόνο σε νόμιμα αιτήματα."},{"name":"802.1X","def":"Έλεγχος πρόσβασης ανά θύρα που επαληθεύει την ταυτότητα των συσκευών πριν τους παραχωρήσει συνδεσιμότητα."}],"summary":["Οι επιθέσεις DDoS στοχεύουν το εύρος ζώνης, την κατάσταση των πρωτοκόλλων ή τους πόρους της εφαρμογής· η ενίσχυση πολλαπλασιάζει τη δύναμη του επιτιθέμενου μέσω πλαστογράφησης.","Τα botnet ελέγχονται μέσω κεντρικής ή ομότιμης διοίκησης-ελέγχου και αξιοποιούνται με πολλούς τρόπους· το Mirai ανέδειξε την αδυναμία των εργοστασιακών διαπιστευτηρίων στις συσκευές IoT.","Οι επιθέσεις ενδιάμεσου εκμεταλλεύονται την εμπιστοσύνη στα τοπικά πρωτόκολλα· τα κύρια αντίμετρα είναι το επικυρωμένο TLS, το HSTS και οι προστασίες στους μεταγωγείς.","Η άμυνα κατά DDoS είναι πολυεπίπεδη, από τον καθαρισμό κίνησης στο ανάντη δίκτυο έως τον περιορισμό ρυθμού στην εφαρμογή, και εξαρτάται από ένα προετοιμασμένο εγχειρίδιο ενεργειών.","Τα τείχη προστασίας, τα VPN, η κατάτμηση και ο NAC επιλύουν συγκεκριμένα προβλήματα —κανένα δεν καθιστά αξιόπιστη μια παραβιασμένη συσκευή."],"review":["Εξηγήστε γιατί ένας επιτιθέμενος που χρησιμοποιεί ενίσχυση DNS πρέπει να πλαστογραφεί τη διεύθυνση IP προέλευσης των αιτημάτων του.","Γιατί τα ομότιμα botnet εξαρθρώνονται δυσκολότερα από τα κεντρικά;","Περιγράψτε πώς το HSTS αποτρέπει μια επίθεση απογύμνωσης TLS σε δημόσιο δίκτυο Wi-Fi.","Μια εταιρεία δηλώνει: «Όλοι οι απομακρυσμένοι εργαζόμενοι χρησιμοποιούν το VPN μας, άρα οι φορητοί τους υπολογιστές είναι ασφαλείς». Αξιολογήστε κριτικά αυτή τη δήλωση."],"cli":{"title":"Προσομοιωτής Σάρωσης Δικτύου, Ανάλυσης Πακέτων & Άμυνας Firewall","desc":"Εκτελέστε σάρωση θυρών TCP SYN, αναλύστε χειραψίες TCP με το tcpdump και ρυθμίστε κανόνες firewall iptables για προστασία του εξυπηρετητή.","meta":["⏱️ ~30 min","🐚 analyst@net-sec:~$"],"tasks":[{"pill":"Task 1","name":"Εκτέλεση Αθόρυβης Σάρωσης Θυρών TCP SYN","instr":"Σαρώστε τον στόχο `10.0.5.20` στις θύρες 1-1000 με χρήση σάρωσης Nmap SYN (`-sS`).","hint":"Εκτελέστε: nmap -sS -p 1-1000 10.0.5.20","cmd":"$ nmap -sS -p 1-1000 10.0.5.20","ok":"Η σάρωση Nmap ολοκληρώθηκε! Εντοπίστηκαν ανοιχτές οι θύρες 22, 80, 443 και 3306."},{"pill":"Task 2","name":"Καταγραφή Πακέτων Χειραψίας Τριών Κατευθύνσεων TCP","instr":"Καταγράψτε 3 πακέτα στη διεπαφή `eth0` για κίνηση HTTP στη θύρα 80 με το `tcpdump`.","hint":"Εκτελέστε: tcpdump -i eth0 -nn -c 3 port 80","cmd":"$ tcpdump -i eth0 -nn -c 3 port 80","ok":"Η καταγραφή πακέτων επαληθεύτηκε! Αναλύθηκαν οι σημαίες SYN [S], SYN-ACK [S.] και ACK [.]."},{"pill":"Task 3","name":"Ρύθμιση Κανόνα Αποδοχής Firewall για το Εσωτερικό Υποδίκτυο","instr":"Ρυθμίστε το iptables να επιτρέπει εισερχόμενες συνδέσεις SSH (θύρα 22) μόνο από το υποδίκτυο `10.0.0.0/8`.","hint":"Εκτελέστε: iptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/8 -j ACCEPT","cmd":"$ iptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/8 -j ACCEPT","ok":"Ο κανόνας firewall αποθηκεύτηκε: Εξουσιοδοτήθηκε η εσωτερική πρόσβαση διαχείρισης."},{"pill":"Task 4","name":"Επιβολή Κανόνα Απόρριψης για Εξωτερική Πρόσβαση SSH","instr":"Προσθέστε κανόνα iptables για απόρριψη όλων των άλλων εξωτερικών συνδέσεων SSH στη θύρα 22.","hint":"Εκτελέστε: iptables -A INPUT -p tcp --dport 22 -j DROP","cmd":"$ iptables -A INPUT -p tcp --dport 22 -j DROP","ok":"Το firewall ενισχύθηκε! Η δημόσια πρόσβαση SSH αποκλείστηκε, εξαλείφοντας επιθέσεις brute-force."}]},"lab":{"title":"Τμηματοποίηση Δικτύου, Ανάπτυξη Περιμετρικού IDS/IPS (Suricata) & Μετριασμός DDoS","desc":"Σε αυτό το ολοκληρωμένο εργαστήριο 2 ωρών, οι φοιτητές αναλαμβάνουν την άμυνα δικτύου για μια επιχείρηση με κρίσιμες υπηρεσίες. Θα σχεδιάσετε τμηματοποίηση δικτύου DMZ, θα ρυθμίσετε φιλτράρισμα πακέτων stateful με το iptables, θα αναπτύξετε το σύστημα IDS/IPS Suricata, θα συντάξετε υπογραφές για εντοπισμό κίνησης Botnet C2 και θα υλοποιήσετε μηχανισμούς περιορισμού ρυθμού (rate limiting) κατά επιθέσεων DDoS και SYN floods.","meta":["⏱️ ~2 Ώρες (120 λεπτά)","📋 4 Δομημένες Φάσεις"],"env":["Ubuntu 24.04 LTS Gateway VM with multi-homed virtual interfaces (`eth0`, `eth1`, `eth2`)","Network tools: `suricata`, `iptables`, `nftables`, `tcpdump`, `tshark`, `hping3`, `nmap`","Traffic generator toolset for SYN flood emulation and C2 replay","Wireshark packet capture analyzer for protocol dissection"],"phases":[{"badge":"Phase 1","name":"Ανακάλυψη Τοπολογίας Δικτύου & Βάση Τμηματοποίησης","dur":"⏱️ 25 λεπτά","objs":["Καταγραφή διεπαφών δικτύου, πινάκων δρομολόγησης και ανοιχτών θυρών με `ip`, `route` και `ss`.","Σχεδιασμός αρχιτεκτονικής 3 επιπέδων (Public DMZ, Εφαρμογές, Βάσεις Δεδομένων).","Επαλήθευση κανόνων απομόνωσης μεταξύ VLANs."],"steps":[{"type":"p","text":"1. Ελέγξτε τις ρυθμίσεις δικτύου:\\n```bash\\nip addr show\\nip route show\\nss -tulpn\\n```"},{"type":"p","text":"2. Χαρτογραφήστε τα υποδίκτυα: DMZ (`192.168.10.0/24`), App Tier (`10.10.20.0/24`), DB Tier (`10.10.30.0/24`)."},{"type":"p","text":"3. Εκτελέστε ελέγχους συνδεσιμότητας με `ping` και `traceroute`."}]},{"badge":"Phase 2","name":"Φιλτράρισμα Πακέτων Stateful με iptables / nftables","dur":"⏱️ 45 λεπτά","objs":["Ρύθμιση προεπιλεγμένης πολιτικής DROP στις αλυσίδες INPUT, FORWARD και OUTPUT.","Αποδοχή υφιστάμενων συνδέσεων με παρακολούθηση κατάστασης `conntrack` (ESTABLISHED, RELATED).","Επιβολή αυστηρών κανόνων δρομολόγησης από το DMZ στη βάση δεδομένων."],"steps":[{"type":"p","text":"1. Εκκαθάριση υπαρχόντων κανόνων και ορισμός πολιτικής DROP:\\n```bash\\nsudo iptables -F\\nsudo iptables -P INPUT DROP\\nsudo iptables -P FORWARD DROP\\nsudo iptables -P OUTPUT ACCEPT\\n```"},{"type":"p","text":"2. Αποδοχή loopback και υφιστάμενων καταστάσεων συνδέσεων:\\n```bash\\nsudo iptables -A INPUT -i lo -j ACCEPT\\nsudo iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\\nsudo iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\\n```"},{"type":"p","text":"3. Άδεια επικοινωνίας των web servers του DMZ προς τη βάση στη θύρα 3306:\\n```bash\\nsudo iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 3306 -d 10.10.30.50 -j ACCEPT\\n```"}]},{"badge":"Phase 3","name":"Ανάπτυξη Υπογραφών IDS/IPS Suricata & Εντοπισμός Botnet C2","dur":"⏱️ 30 λεπτά","objs":["Ανάπτυξη του Suricata σε λειτουργία inline IPS στην περιμετρική πύλη.","Σύνταξη κανόνων Suricata για εντοπισμό σημάτων C2 (IRC/HTTP).","Επαλήθευση απόρριψης πακέτων και παραγωγής ειδοποιήσεων στα αρχεία `fast.log` και `eve.json`."],"steps":[{"type":"p","text":"1. Δημιουργία κανόνα στο `/etc/suricata/rules/botnet.rules`:\\n```text\\ndrop tcp any any -> any [6667,8080] (msg:\\"BOTNET C2 Beacon Detected\\"; flow:to_server,established; content:\\"USER bot_\\"; sid:1000001; rev:1;)\\n```"},{"type":"p","text":"2. Επανεκκίνηση και έλεγχος σύνταξης του Suricata:\\n```bash\\nsudo suricata -T -c /etc/suricata/suricata.yaml\\nsudo systemctl restart suricata\\n```"},{"type":"p","text":"3. Αναπαραγωγή κακόβουλης κίνησης C2 και παρακολούθηση ειδοποιήσεων:\\n```bash\\ntail -f /var/log/suricata/fast.log\\n```"}]},{"badge":"Phase 4","name":"Υλοποίηση Άμυνας κατά TCP SYN Floods & Επιθέσεων DDoS","dur":"⏱️ 20 λεπτά","objs":["Ενεργοποίηση TCP SYN Cookies στον πυρήνα του Linux (`net.ipv4.tcp_syncookies = 1`).","Ρύθμιση περιορισμού ρυθμού `hashlimit` στο iptables για αποτροπή SYN floods.","Προσομοίωση επίθεσης με `hping3` και παρατήρηση της ανθεκτικότητας των συνδέσεων."],"steps":[{"type":"p","text":"1. Ενεργοποίηση SYN Cookies μέσω sysctl:\\n```bash\\nsudo sysctl -w net.ipv4.tcp_syncookies=1\\nsudo sysctl -w net.ipv4.tcp_max_syn_backlog=4096\\n```"},{"type":"p","text":"2. Εφαρμογή κανόνα περιορισμού ρυθμού SYN στο iptables:\\n```bash\\nsudo iptables -A INPUT -p tcp --syn -m hashlimit --hashlimit-name syn_flood --hashlimit-mode srcip --hashlimit-above 25/sec --hashlimit-burst 50 -j DROP\\n```"},{"type":"p","text":"3. Επαλήθευση προστασίας υπό υψηλό φορτίο:\\n```bash\\nhping3 --flood -S -p 80 127.0.0.1 -c 1000\\n```"}]}],"checklist":["Η προεπιλεγμένη πολιτική DROP επιβάλλεται σε όλες τις αλυσίδες του firewall.","Το Conntrack διατηρεί ορθά την κατάσταση για τις νόμιμες συνδέσεις.","Το Suricata IPS απορρίπτει σε πραγματικό χρόνο τα πακέτα σημάτων C2.","Τα SYN cookies και το hashlimit αποτρέπουν την εξάντληση πόρων κατά τη διάρκεια SYN floods."]},"projects":[{"badge":"🚀 ΠΡΑΚΤΙΚΟ ΤΕΧΝΙΚΟ ΕΡΓΟ","title":"Αρχιτεκτονική Δικτύου Μηδενικής Εμπιστοσύνης & Μηχανή Εξουδετέρωσης Botnet C2","desc":"Ένας διεθνής τηλεπικοινωνιακός πάροχος αναβαθμίζει τις υποδομές των κέντρων δεδομένων του για υιοθέτηση Αρχιτεκτονικής Μηδενικής Εμπιστοσύνης (ZTNA). Ως Επικεφαλής Αρχιτέκτονας Ασφάλειας Δικτύων, πρέπει να καταργήσετε την επίπεδη δρομολόγηση, να σχεδιάσετε αυτοματοποιημένη μικροτμηματοποίηση σε SDN, να αναπτύξετε αγωγούς τηλεμετρίας IDS/IPS και να δημιουργήσετε μια μηχανή εξουδετέρωσης Botnet C2 με DNS Sinkholing.","meta":["⏱️","🎯 Αρχιτεκτονική Επιχειρησιακού Επιπέδου"],"milestones":[{"num":"M1","title":"Μικροτμηματοποίηση Μηδενικής Εμπιστοσύνης & Πίνακας Ροών Δεδομένων","desc":"Δημιουργία ολοκληρωμένου αρχιτεκτονικού σχεδίου με ζώνες επικάλυψης, ομάδες ασφάλειας και πολιτικές μικροτμηματοποίησης.","spec":["Σχεδιασμός μηχανής συνεχούς καταγραφής περιουσιακών στοιχείων μέσω σαρώσεων, cloud APIs και CMDB.","Κατηγοριοποίηση εξωτερικής επιφάνειας επίθεσης και εντοπισμός Shadow IT.","Δημιουργία βάσης δεδομένων ενεργητικού με βαθμολόγηση κρισιμότητας."],"deliv":"📦 Παραδοτέο Οροσήμου: Αρχιτεκτονικό διάγραμμα + Πίνακας διαζωνικής κίνησης."},{"num":"M2","title":"Μηχανή Τηλεμετρίας Πακέτων & Ταξινόμησης Ροών Πραγματικού Χρόνου","desc":"Ανάπτυξη του flow_monitor.py για καταγραφή ροών δικτύου, υπολογισμό εντροπίας και εντοπισμό σαρώσεων θυρών.","spec":["Σχεδιασμός αλγορίθμου ιεράρχησης ευπαθειών με συνδυασμό CVSS 4.0, EPSS και CISA KEV.","Ορισμός μαθηματικού τύπου επικινδυνότητας και αυτόματη ανάθεση SLAs (Critical: 48h, High: 7d).","Κατασκευή αγωγού αυτόματης διαλογής ευπαθειών."],"deliv":"📦 Παραδοτέο Οροσήμου: Μηχανή τηλεμετρίας Python + σουίτα δοκιμών απόδοσης."},{"num":"M3","title":"Αυτοματοποιημένο DNS Sinkholing & Ταξινομητής Botnet DGA","desc":"Ανάπτυξη αλγορίθμου εντοπισμού ονομάτων DGA υψηλής εντροπίας στο DNS και ανακατεύθυνση των ερωτημάτων C2 σε τοπικό sinkhole.","spec":["Αρχιτεκτονική αυτοματοποιημένης εγκατάστασης patches σε Linux και Windows Server.","Σχεδιασμός σταδιακής διάθεσης (canary staging) με αυτόματο rollback.","Καθορισμός κανόνων virtual patching σε WAF/IPS για ευπάθειες zero-day."],"deliv":"📦 Παραδοτέο Οροσήμου: Υπομονάδα DNS Sinkhole + σενάριο ανίχνευσης DGA."},{"num":"M4","title":"Μηχανή Μετριασμού DDoS & Επιτελικό Σχέδιο Άμυνας Δικτύου","desc":"Υλοποίηση αυτοματοποιημένου dynamic blackholing κατά τη διάρκεια επιθέσεων flood και παράδοση επιτελικού σχεδίου ανθεκτικότητας.","spec":["Κατασκευή διαδραστικού χάρτη κάλυψης MITRE ATT&CK συνδέοντας CVEs με τεχνικές επιτιθέμενων.","Σχεδιασμός executive CTEM dashboard με χρόνο παραμονής ευπαθειών και συμμόρφωση SLA.","Σύνταξη ετήσιας στρατηγικής διαχείρισης έκθεσης σε απειλές."],"deliv":"📦 Παραδοτέο Οροσήμου: Σενάρια μετριασμού DDoS + Επιτελικό σχέδιο άμυνας δικτύου."}],"deliverables":["Αρχιτεκτονικό Σχέδιο Μηδενικής Εμπιστοσύνης (PDF / Draw.io)","Πηγαίος Κώδικας Παρακολούθησης Ροών Δικτύου Python (`/net_engine/`)","Σουίτα DNS Sinkholing & Ταξινομητή DGA (`/dga_sinkhole/`)","Επιτελική Στρατηγική Ασφάλειας & Ανθεκτικότητας Δικτύου (10–12 σελίδες)"],"env":[]},{"badge":"⚡ ΕΦΑΡΜΟΣΜΕΝΟ ΕΡΓΟ ΑΝΑΠΤΥΞΗΣ ΕΡΓΑΛΕΙΩΝ ΑΣΦΑΛΕΙΑΣ","title":"Κατασκευή Αυτοματοποιημένου Concurrent Vulnerability Scanner & ATT&CK Mapper σε Python","desc":"Οι ομάδες ασφαλείας χρειάζονται συνεχή σάρωση ευπαθειών για εντοπισμό εκτεθειμένων υπηρεσιών και γνωστών CVEs. Θα κατασκευάσετε έναν ταχύ, ασύγχρονο σαρωτή ευπαθειών δικτύου σε Python ( vuln_scout.py ) με asyncio . Το εργαλείο θα εκτελεί ασύγχρονες σαρώσεις TCP, θα αναλύει banners υπηρεσιών, θα εξάγει αναγνωριστικά CPE, θα αναζητά CVEs στο API του NIST NVD, θα υπολογίζει βαθμολογίες CVSS 4.0 και θα αντιστοιχίζει τα ευρήματα στο MITRE ATT&CK.","meta":["⏱️","🛠️ Μηχανική Λογισμικού & Αυτοματοποίηση"],"milestones":[{"num":"M1","title":"Ασύγχρονος Σαρωτής Θυρών & Ανιχνευτής Υπηρεσιών","desc":"Κατασκευή του ασύγχρονου σαρωτή θυρών με έλεγχο ταυτοχρονισμού μέσω semaphores και προσαρμοστικά timeouts.","spec":["Χρήση του `asyncio.open_connection` με `Semaphore(500)` για υψηλή ταχύτητα.","Καταγραφή ανοικτής θύρας, καθυστέρησης RTT και κατάστασης.","Αποστολή ειδικών probes (HTTP GET, SSH, SMTP) για λήψη banners υπηρεσιών."],"deliv":"📦 Παραδοτέο Λογισμικού: Αρθρωμα scanner_core.py με σάρωση 1.000 θυρών σε < 5 δευτερόλεπτα."},{"num":"M2","title":"Μηχανή Αναγνώρισης Banners & Εξαγωγής CPE","desc":"Ανάλυση ακατέργαστων banners υπηρεσιών με regex για αναγνώριση κατασκευαστή, ονόματος προϊόντος και έκδοσης.","spec":["Εξαγωγή υπογραφών έκδοσης (π.χ. `Apache/2.4.49`, `Ope :"Αλλοιώνοντας αρχεία ριζικών ζωνών DNS για ανακατεύθυνση κίνησης σε κακόβουλους επιλυτές ονομάτων, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"D","v":"Εισάγοντας κακόβουλο κώδικα (π.χ. JavaScript) που εκτελείται στο πλαίσιο του περιηγητή του θύματος."},{"k":"E","v":"Απενεργοποιώντας κανόνες τείχους προστασίας του πυρήνα κατά τη σύνδεση τοπικού διαχειριστή, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."}],"ans":"D","exp":"Το XSS επιτρέπει την εκτέλεση κακόβουλης JavaScript στον περιηγητή του χρήστη, οδηγώντας σε υποκλοπή session cookies, τροποποίηση του DOM ή εκτέλεση μη εξουσιοδοτημένων ενεργειών."},{"q":"Ποια είναι η βασική διαφορά μεθοδολογίας μεταξύ Στατικής (SAST) και Δυναμικής (DAST) Δοκιμής Ασφάλειας Εφαρμογών;","opts":[{"k":"A","v":"Το SAST λειτουργεί αποκλειστικά σε πίνακες παραγωγής, ενώ το DAST λειτουργεί αποκλειστικά σε αποθετήρια git, σε κατανεμημένα περιβάλλοντα παραγωγής cloud πολλαπλών περιφερειών."},{"k":"B","v":"Το SAST απαιτεί αναγνώστες έξυπνων καρτών, ενώ το DAST απαιτεί μετα-κβαντική ασύμμετρη κρυπτογράφηση, χωρίς να απαιτείται χειροκίνητη παρέμβαση από το τεχνικό προσωπικό."},{"k":"C","v":"Το SAST ελέγχει τα όρια buffer των switches, ενώ το DAST μεταγλωττίζει δυαδικούς οδηγούς συσκευών, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"D","v":"Το SAST εκτελείται μόνο από διωκτικές αρχές, ενώ το DAST εκτελείται μόνο από εσωτερικές νομικές ομάδες, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"E","v":"Το SAST αναλύει πηγαίο κώδικα χωρίς εκτέλεση (white-box), ενώ το DAST ελέγχει την εφαρμογή εν ώρα εκτέλεσης (black-box)."}],"ans":"E","exp":"Το SAST εξετάζει τον πηγαίο κώδικα χωρίς να τον εκτελεί (white-box). Το DAST επιτίθεται στην εφαρμογή κατά την εκτέλεσή της μέσω HTTP (black-box) εντοπίζοντας runtime ευπάθειες."},{"q":"Στη μοντελοποίηση απειλών με το πλαίσιο STRIDE, ποια κατηγορία αφορά την αλλοίωση δεδομένων κατά τη μεταφορά ή την αποθήκευση;","opts":[{"k":"A","v":"Tampering, παραποιώντας δεδομένα ή την κατάσταση του συστήματος χωρίς εξουσιοδότηση."},{"k":"B","v":"Spoofing, υποδυόμενος μια έγκυρη ταυτότητα ή οντότητα για απόκτηση πρόσβασης."},{"k":"C","v":"Repudiation, αρνούμενος την τέλεση μιας συγκεκριμένης ενέργειας ή συναλλαγής."},{"k":"D","v":"Information Disclosure, διαρρέοντας εμπιστευτικά δεδομένα σε μη εξουσιοδοτημένα άτομα."},{"k":"E","v":"Elevation of Privilege, αποκτώντας ανώτερα δικαιώματα από τα αρχικά εγκεκριμένα."}],"ans":"A","exp":"Το STRIDE περιλαμβάνει Spoofing (πλαστοπροσωπία), Tampering (αλλοίωση/ακεραιότητα), Repudiation (αποποίηση), Information Disclosure (διαρροή), Denial of Service (άρνηση) και Elevation of Privilege (κλιμάκωση)."},{"q":"Ποιο βασικό σκοπό εξυπηρετεί ένα Software Bill of Materials (SBOM) στην ασφάλεια της εφοδιαστικής αλυσίδας λογισμικού;","opts":[{"k":"A","v":"Κρυπτογραφεί αυτόματα όλες τις εγγραφές της βάσης δεδομένων χρησιμοποιώντας εφήμερα ιδιωτικά κλειδιά ECC, για τον μετριασμό πιθανών μη εξουσιοδοτημένων αποκλίσεων ρυθμίσεων."},{"k":"B","v":"Παρέχει αναλυτική καταγραφή όλων των βιβλιοθηκών, εξαρτήσεων τρίτων και αδειών που περιέχονται στο λογισμικό."},{"k":"C","v":"Παράγει συνθετικούς λογαριασμούς χρηστών για δοκιμές διασφάλισης ποιότητας της διεπαφής χρήστη, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"D","v":"Καταργεί τους διακομιστές CI μεταγλωττίζοντας εκτελέσιμα αρχεία απευθείας στην προσωρινή μνήμη RAM."},{"k":"E","v":"Μετατρέπει σχεσιακούς πίνακες σε μη σχεσιακά έγγραφα δεδομένων κατά την εκκίνηση της εφαρμογής."}],"ans":"B","exp":"Το SBOM καταγράφει αναλυτικά όλα τα εξαρτώμενα πακέτα και βιβλιοθήκες ενός λογισμικού, επιτρέποντας τον άμεσο εντοπισμό ευπαθειών (π.χ. Log4j) στην εφοδιαστική αλυσίδα."},{"q":"Πώς επιτρέπει το Server-Side Request Forgery (SSRF) σε επιτιθέμενους να αποκτήσουν πρόσβαση σε εσωτερικούς πόρους cloud;","opts":[{"k":"A","v":"Εκτελώντας επιθέσεις λεξικού κατά των τοπικών προσωρινών αποθηκευμένων κωδικών του Active Directory, σύμφωνα με τις σύγχρονες αρχιτεκτονικές αρχές μηδενικής εμπιστοσύνης."},{"k":"B","v":"Εισάγοντας κακόβουλο κώδικα SQL σε κεφαλίδες cookies του περιηγητή κατά τη χειραψία επιπέδου μεταφοράς, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"C","v":"Εξαναγκάζοντας τον ευάλωτο εξυπηρετητή να στείλει αιτήματα HTTP σε εσωτερικές υπηρεσίες ή APIs μεταδεδομένων cloud."},{"k":"D","v":"Δημιουργώντας μη εξουσιοδοτημένα peer-to-peer τούνελ σε υποθαλάσσια καλώδια διεθνών επικοινωνιών, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"E","v":"Απενεργοποιώντας την προστασία ASLR του πυρήνα του λειτουργικού συστήματος κατά την εκκίνηση, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."}],"ans":"C","exp":"Το SSRF εξαπατά τον εξυπηρετητή ώστε να καλέσει διευθύνσεις URL του επιτιθέμενου, αποκτώντας πρόσβαση σε εσωτερικά endpoints (όπως το cloud metadata 169.254.169.254) πίσω από το firewall."},{"q":"Ποιος είναι ο πρωταρχικός τεχνικός στόχος ενός προγράμματος Bug Bounty για την αποκάλυψη ευπαθειών;","opts":[{"k":"A","v":"Ανάθεση όλης της ευθύνης ανάπτυξης λογισμικού της επιχείρησης σε ανεξάρτητους εξωτερικούς προγραμματιστές, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Μόνιμη αντικατάσταση των εσωτερικών ομάδων δοκιμών ποιότητας από αυτοματοποιημένα scripts ελέγχου, υπό τις τυπικές διαδικασίες λειτουργίας των εταιρικών πολιτικών ISMS."},{"k":"C","v":"Πώληση ευπαθειών μηδενικής ημέρας (zero-days) σε εμπορικές εταιρείες κυβερνοεπιχειρήσεων, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"D","v":"Παροχή κινήτρων σε ερευνητές ασφάλειας για τον εντοπισμό και υπεύθυνη αναφορά κενών πριν από κακόβουλη εκμετάλλευση."},{"k":"E","v":"Κατάργηση της ανάγκης για συνεχείς ελέγχους ασφάλειας και δοκιμές διείσδυσης (penetration testing), κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."}],"ans":"D","exp":"Τα προγράμματα Bug Bounty παρέχουν νόμιμο πλαίσιο και αμοιβές σε ηθικούς ερευνητές για την ανακάλυψη και υπεύθυνη αναφορά ευπαθειών πριν τις εκμεταλλευτούν κακόβουλοι δράστες."},{"q":"Ποια ευπάθεια αλλοίωσης μνήμης προκύπτει όταν αποδεσμευμένη δυναμική μνήμη προσπελαύνεται εκ νέου μέσω ενός δείκτη;","opts":[{"k":"A","v":"Buffer Underflow, διαβάζοντας δεδομένα που βρίσκονται αμέσως πριν από το όριο του πίνακα στη μνήμη, πριν την οριστικοποίηση αλλαγών στους κεντρικούς κόμβους αποθετηρίων."},{"k":"B","v":"Format String Vulnerability, αναλύοντας μη αξιόπιστους προσδιοριστές μορφοποίησης στη συνάρτηση printf, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Integer Overflow, υπερβαίνοντας το μέγιστο όριο αναπαράστασης ακεραίων στον καταχωρητή του επεξεργαστή, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Null Pointer Dereference, επιχειρώντας πρόσβαση στη διεύθυνση μηδέν προκαλώντας κατάρρευση διεργασίας, για τη διασφάλιση επιχειρησιακής συμμόρφωσης υψηλής διαθεσιμότητας."},{"k":"E","v":"Use-After-Free (UAF), προσπελαύνοντας μνήμη μετά την αποδέσμευσή της, οδηγώντας σε εκτέλεση αυθαίρετου κώδικα."}],"ans":"E","exp":"Το Use-After-Free (UAF) συμβαίνει όταν ένας δείκτης χρησιμοποιεί μνήμη που έχει ήδη αποδεσμευτεί. Εάν ο επιτιθέμενος καταλάβει αυτό το τμήμα μνήμης, μπορεί να εκτελέσει αυθαίρετο κώδικα."},{"q":"Ποια πρακτική ασφαλούς προγραμματισμού εξουδετερώνει άμεσα τις ευπάθειες CSRF σε αιτήματα HTTP που αλλάζουν κατάσταση;","opts":[{"k":"A","v":"Χρήση μοναδικών κρυπτογραφικά τυχαίων Anti-CSRF tokens και ρύθμιση της παραμέτρου SameSite=Strict στα cookies."},{"k":"B","v":"Αντικατάσταση σχεσιακών βάσεων με μη ευρετηριασμένα αρχεία κειμένου αποθηκευμένα σε τοπικούς φακέλους, σε όλα τα εσωτερικά τμήματα δικτύου και τερματικά της επιχείρησης."},{"k":"C","v":"Απενεργοποίηση των ελέγχων επαλήθευσης πιστοποιητικών TLS στους περιηγητές των τελικών χρηστών, κατά τη διάρκεια συνεχούς παρακολούθησης και διαχειριστικών ελέγχων."},{"k":"D","v":"Υποχρεωτική σύνδεση όλων των χρηστών μέσω ιδιωτικών τούνελ IPsec VPN πριν από την πρόσβαση στην εφαρμογή."},{"k":"E","v":"Μεταγλώττιση των υπηρεσιών παρασκηνίου σε ιδιόκτητα δυαδικά αρχεία πριν από τη διάθεση στην παραγωγή, χρησιμοποιώντας τυποποιημένες ρυθμίσεις πολιτικής ασφάλειας οργανισμού."}],"ans":"A","exp":"Το CSRF αντιμετωπίζεται με μοναδικά, απρόβλεπτα Anti-CSRF tokens σε κάθε αίτημα αλλαγής κατάστασης και με τη σωστή χρήση της ιδιότητας SameSite (Strict/Lax) στα cookies."}]},{"part":"Μέρος 3 · Μηχανισμοί Προστασίας και Ασφαλής Μηχανική","time":"Κεφάλαιο 7 · ⏱️ 9–11 ώρες μελέτης","title":"7. Κρυπτογραφικοί Μηχανισμοί και Υποδομή Δημόσιου Κλειδιού","subtitle":"Συμμετρική και ασύμμετρη κρυπτογράφηση · Συναρτήσεις κατακερματισμού · Ψηφιακές υπογραφές · ΥΔΚ και X.509 · TLS 1.3 · Διαχείριση κλειδιών","outcomes":["Να εξηγείτε τη διαφορά μεταξύ συμμετρικής και ασύμμετρης κρυπτογράφησης και γιατί τα πρακτικά συστήματα τις συνδυάζουν.","Να διατυπώνετε τις ιδιότητες ασφάλειας των κρυπτογραφικών συναρτήσεων κατακερματισμού και να διακρίνετε τον κατακερματισμό από την κρυπτογράφηση.","Να περιγράφετε πώς οι ψηφιακές υπογραφές παρέχουν ακεραιότητα, αυθεντικότητα και (υπό προϋποθέσεις) μη αποποίηση.","Να εξηγείτε τον ρόλο των αρχών πιστοποίησης, των αρχών καταχώρισης, των αλυσίδων πιστοποιητικών και της ανάκλησης σε μια ΥΔΚ.","Να σκιαγραφείτε τη χειραψία του TLS 1.3 και να εντοπίζετε συνήθεις αστοχίες στη διαχείριση κλειδιών."],"intro":["Η κρυπτογραφία αποτελεί το μαθηματικό θεμέλιο της εμπιστευτικότητας, της ακεραιότητας και της αυθεντικότητας στα ψηφιακά συστήματα. Το Κεφάλαιο 6 ολοκληρώθηκε με επιθέσεις που υποκλέπτουν και αλλοιώνουν την κίνηση· το παρόν κεφάλαιο παρέχει τα εργαλεία που καθιστούν άχρηστη μια τέτοια υποκλοπή. Στόχος δεν είναι η παραγωγή των υποκείμενων μαθηματικών, αλλά η ακριβής κατανόηση του τι εγγυάται κάθε κρυπτογραφικό δομικό στοιχείο, πώς συνδυάζονται τα στοιχεία αυτά και πού αποτυγχάνουν τα πραγματικά συστήματα.","Το κεφάλαιο αντιπαραβάλλει αρχικά τη συμμετρική με την ασύμμετρη κρυπτογράφηση και εξηγεί τις συναρτήσεις κατακερματισμού και τις ψηφιακές υπογραφές. Στη συνέχεια δείχνει πώς η υποδομή δημόσιου κλειδιού (ΥΔΚ ή PKI) συνδέει κλειδιά με ταυτότητες μέσω πιστοποιητικών και αναλύει τη χειραψία του TLS 1.3, που προστατεύει σήμερα το μεγαλύτερο μέρος της κίνησης στο διαδίκτυο. Κλείνει με τη διαχείριση κλειδιών —το πεδίο όπου, στην πράξη, σημειώνονται οι περισσότερες κρυπτογραφικές αποτυχίες."],"sections":[{"id":"7.1","title":"Συμμετρική και ασύμμετρη κρυπτογράφηση","blocks":[{"type":"p","text":"Στη **συμμετρική κρυπτογράφηση** χρησιμοποιείται το ίδιο μυστικό κλειδί για την κρυπτογράφηση και την αποκρυπτογράφηση. Σύγχρονοι συμμετρικοί αλγόριθμοι, όπως οι **AES** και **ChaCha20**, είναι εξαιρετικά γρήγοροι και, με κλειδιά 128 ή 256 bit, θεωρούνται ασφαλείς απέναντι σε όλες τις γνωστές πρακτικές επιθέσεις. Η αδυναμία τους είναι οργανωτική: τα δύο μέρη πρέπει να μοιράζονται ήδη το κλειδί, ενώ ένα δίκτυο _n_ συμμετεχόντων θα χρειαζόταν περίπου n²/2 διαφορετικά κλειδιά. Οι συμμετρικοί αλγόριθμοι πρέπει επίσης να χρησιμοποιούνται με κατάλληλο _τρόπο λειτουργίας_· οι τρόποι με ενσωματωμένη αυθεντικοποίηση, όπως ο AES-GCM, προστατεύουν τόσο την εμπιστευτικότητα όσο και την ακεραιότητα."},{"type":"p","text":"Η **ασύμμετρη κρυπτογράφηση** (κρυπτογράφηση δημόσιου κλειδιού) χρησιμοποιεί ένα ζεύγος μαθηματικά συσχετισμένων κλειδιών. Το **δημόσιο κλειδί** μπορεί να διανέμεται ελεύθερα, ενώ το **ιδιωτικό κλειδί** παραμένει μυστικό. Δεδομένα που κρυπτογραφούνται με το δημόσιο κλειδί αποκρυπτογραφούνται μόνο με το ιδιωτικό. Αλγόριθμοι όπως ο **RSA** και η **κρυπτογραφία ελλειπτικών καμπυλών (ECC)** επιλύουν το πρόβλημα της διανομής κλειδιών, είναι όμως χιλιάδες φορές πιο αργοί από τους συμμετρικούς. Γι\' αυτό τα πρακτικά συστήματα χρησιμοποιούν **υβριδική κρυπτογράφηση**: οι ασύμμετρες τεχνικές δημιουργούν ή προστατεύουν ένα τυχαίο συμμετρικό _κλειδί συνεδρίας_ και αυτό το κλειδί κρυπτογραφεί στη συνέχεια τον κύριο όγκο των δεδομένων. Κάθε σύνδεση TLS —και, όπως έδειξε το Κεφάλαιο 4, κάθε σύγχρονη επίθεση λυτρισμικού— ακολουθεί αυτό το πρότυπο."}]},{"id":"7.2","title":"Κρυπτογραφικές συναρτήσεις κατακερματισμού","blocks":[{"type":"p","text":"Μια **κρυπτογραφική συνάρτηση κατακερματισμού** αντιστοιχίζει είσοδο οποιουδήποτε μήκους σε έξοδο σταθερού μήκους, τη _σύνοψη_ (digest). Η SHA-256, για παράδειγμα, παράγει πάντοτε 256 bit. Τρεις ιδιότητες καθιστούν μια συνάρτηση κατακερματισμού κατάλληλη για εφαρμογές ασφάλειας. **Αντίσταση προεικόνας**: δεδομένης μιας σύνοψης, είναι υπολογιστικά ανέφικτο να βρεθεί είσοδος που την παράγει. **Αντίσταση δεύτερης προεικόνας**: δεδομένης μιας εισόδου, είναι ανέφικτο να βρεθεί διαφορετική είσοδος με την ίδια σύνοψη. **Αντίσταση συγκρούσεων**: είναι ανέφικτο να βρεθούν _οποιεσδήποτε_ δύο είσοδοι με την ίδια σύνοψη. Οι MD5 και SHA-1 έχουν απολέσει την αντίσταση συγκρούσεων και δεν πρέπει πλέον να χρησιμοποιούνται σε υπογραφές· οι SHA-256, SHA-3 και BLAKE2 παραμένουν ασφαλείς."},{"type":"p","text":"Ο κατακερματισμός δεν είναι κρυπτογράφηση: δεν υπάρχει κλειδί ούτε τρόπος «αποκρυπτογράφησης» μιας σύνοψης. Οι συνόψεις χρησιμοποιούνται για την επαλήθευση της ακεραιότητας αρχείων, για την ταυτοποίηση αποδεικτικών στοιχείων στην εγκληματολογική ανάλυση (Κεφάλαιο 12) και ως δομικά στοιχεία των υπογραφών. Σε συνδυασμό με ένα μυστικό κλειδί σχηματίζουν έναν κώδικα **HMAC**, ο οποίος αποδεικνύει ότι ένα μήνυμα προέρχεται από κάποιον που γνωρίζει το κλειδί. Για την αποθήκευση κωδικών πρόσβασης οι συνήθεις γρήγορες συναρτήσεις είναι ακατάλληλες, επειδή οι επιτιθέμενοι μπορούν να δοκιμάζουν δισεκατομμύρια μαντεψιές ανά δευτερόλεπτο. Ειδικές **συναρτήσεις κατακερματισμού κωδικών**, όπως οι Argon2, scrypt ή bcrypt, είναι σκόπιμα αργές και χρησιμοποιούν ένα μοναδικό τυχαίο _αλάτι_ (salt) για κάθε κωδικό."}]},{"id":"7.3","title":"Ψηφιακές υπογραφές και μη αποποίηση","blocks":[{"type":"p","text":"Μια **ψηφιακή υπογραφή** αντιστρέφει τους ρόλους του ζεύγους κλειδιών. Ο υπογράφων υπολογίζει τη σύνοψη του μηνύματος και τη μετασχηματίζει με το _ιδιωτικό_ του κλειδί· οποιοσδήποτε μπορεί να επαληθεύσει το αποτέλεσμα με το αντίστοιχο _δημόσιο_ κλειδί. Μια έγκυρη υπογραφή αποδεικνύει τρία πράγματα: ότι το μήνυμα δεν έχει αλλοιωθεί από τη στιγμή της υπογραφής (**ακεραιότητα**), ότι υπογράφηκε από τον κάτοχο του ιδιωτικού κλειδιού (**αυθεντικότητα**) και ότι ο υπογράφων δεν μπορεί εύκολα να ισχυριστεί αργότερα το αντίθετο (**μη αποποίηση**). Συνήθεις αλγόριθμοι είναι οι RSA-PSS, ECDSA και Ed25519."},{"type":"p","text":"Η μη αποποίηση, ωστόσο, είναι τόσο ισχυρή όσο η διαδικασία που την περιβάλλει. Αν το ιδιωτικό κλειδί ήταν αποθηκευμένο χωρίς προστασία σε κοινόχρηστο υπολογιστή, ο υπογράφων μπορεί εύλογα να υποστηρίξει ότι το χρησιμοποίησε κάποιος άλλος. Γι\' αυτό νομικά πλαίσια όπως ο Κανονισμός **eIDAS** της ΕΕ διακρίνουν τις απλές ηλεκτρονικές υπογραφές από τις _εγκεκριμένες_ ηλεκτρονικές υπογραφές, οι οποίες απαιτούν εγκεκριμένο πιστοποιητικό και πιστοποιημένη διάταξη δημιουργίας υπογραφής και έχουν έννομο αποτέλεσμα ισοδύναμο με εκείνο της ιδιόχειρης υπογραφής."}]},{"id":"7.4","title":"Υποδομή δημόσιου κλειδιού και ο κύκλος ζωής των πιστοποιητικών X.509","blocks":[{"type":"p","text":"Η κρυπτογραφία δημόσιου κλειδιού θέτει ένα νέο ερώτημα: πώς γνωρίζουμε ότι ένα δημόσιο κλειδί ανήκει πράγματι σε αυτόν που νομίζουμε; Ένας ενδιάμεσος επιτιθέμενος θα μπορούσε να το αντικαταστήσει με το δικό του. Μια **υποδομή δημόσιου κλειδιού** (ΥΔΚ ή PKI) απαντά σε αυτό το ερώτημα: μια αξιόπιστη **αρχή πιστοποίησης** (Certificate Authority, CA) υπογράφει ένα **πιστοποιητικό** που συνδέει ένα δημόσιο κλειδί με μια ταυτότητα, όπως ένα όνομα τομέα. Μια **αρχή καταχώρισης** (Registration Authority, RA) επαληθεύει την ταυτότητα του αιτούντος πριν η CA εκδώσει το πιστοποιητικό. Τα πιστοποιητικά ακολουθούν το πρότυπο **X.509** και περιέχουν, μεταξύ άλλων, το υποκείμενο, τον εκδότη, την περίοδο ισχύος, το δημόσιο κλειδί και επεκτάσεις όπως το _Εναλλακτικό Όνομα Υποκειμένου_ (Subject Alternative Name, SAN), που απαριθμεί τα ονόματα τομέα που καλύπτει το πιστοποιητικό."},{"type":"p","text":"Η εμπιστοσύνη οργανώνεται ως **αλυσίδα**: μια _ριζική CA_ εκτός σύνδεσης, της οποίας το πιστοποιητικό είναι προεγκατεστημένο στα λειτουργικά συστήματα και στους φυλλομετρητές, υπογράφει _ενδιάμεσες CA_, οι οποίες με τη σειρά τους υπογράφουν τα πιστοποιητικά τελικών οντοτήτων. Η επαλήθευση ακολουθεί την αλυσίδα προς τα πάνω έως μια αξιόπιστη ρίζα. Τα πιστοποιητικά έχουν **κύκλο ζωής** —αίτηση (μέσω αιτήματος υπογραφής πιστοποιητικού, CSR), έκδοση, εγκατάσταση, ανανέωση και, σε περίπτωση διαρροής του κλειδιού, **ανάκληση**, η οποία γνωστοποιείται μέσω λιστών ανάκλησης (CRL) ή του πρωτοκόλλου άμεσης κατάστασης (OCSP). Επειδή ο έλεγχος ανάκλησης είναι στην πράξη αναξιόπιστος, ο κλάδος κινείται προς πιστοποιητικά μικρής διάρκειας που ανανεώνονται αυτόματα με το πρωτόκολλο ACME."}]},{"id":"7.5","title":"Το TLS 1.3 και οι εφαρμογές της ΥΔΚ","blocks":[{"type":"p","text":"Το **Transport Layer Security (TLS)** προστατεύει την περιήγηση στον ιστό (HTTPS), τη μεταφορά ηλεκτρονικού ταχυδρομείου, τις διεπαφές προγραμματισμού (API) και πολλά άλλα πρωτόκολλα. Η έκδοση 1.3 (2018) απλοποίησε το πρωτόκολλο και αφαίρεσε παρωχημένες και ευάλωτες επιλογές. Η χειραψία απαιτεί μόνο έναν κύκλο επικοινωνίας. Ο πελάτης στέλνει ένα μήνυμα _ClientHello_ με τις σουίτες κρυπτογράφησης που υποστηρίζει και ένα εφήμερο μερίδιο κλειδιού Diffie–Hellman· ο διακομιστής απαντά με το δικό του μερίδιο, το πιστοποιητικό του και μια υπογραφή που αποδεικνύει ότι κατέχει το ιδιωτικό κλειδί. Στη συνέχεια οι δύο πλευρές παράγουν τα ίδια κλειδιά συνεδρίας. Επειδή τα κλειδιά Diffie–Hellman είναι εφήμερα, το TLS 1.3 παρέχει πάντοτε **εμπρόσθια μυστικότητα** (forward secrecy): η μεταγενέστερη υποκλοπή του ιδιωτικού κλειδιού του διακομιστή δεν επιτρέπει την αποκρυπτογράφηση κίνησης που είχε καταγραφεί στο παρελθόν."},{"type":"p","text":"Οι ίδιες αρχές της ΥΔΚ υποστηρίζουν και άλλες εφαρμογές. Το **S/MIME** υπογράφει και κρυπτογραφεί μηνύματα ηλεκτρονικού ταχυδρομείου· η **υπογραφή κώδικα** επιτρέπει στα λειτουργικά συστήματα να επαληθεύουν ότι ένα λογισμικό προέρχεται από γνωστό εκδότη και δεν έχει τροποποιηθεί —γι\' αυτό τα κλεμμένα πιστοποιητικά που χρησιμοποίησε το Stuxnet ήταν τόσο επιζήμια· και το **αμοιβαίο TLS (mTLS)** απαιτεί πιστοποιητικό τόσο από τον διακομιστή όσο και από τον πελάτη, πρότυπο που χρησιμοποιείται ευρέως για τον έλεγχο ταυτότητας μεταξύ υπηρεσιών στις σύγχρονες αρχιτεκτονικές."}]},{"id":"7.6","title":"Διαχείριση κλειδιών: εκεί όπου η κρυπτογραφία πραγματικά αποτυγχάνει","blocks":[{"type":"p","text":"Οι σύγχρονοι αλγόριθμοι σπάνια παραβιάζονται μαθηματικά· τα συστήματα αποτυγχάνουν επειδή τα κλειδιά παράγονται πρόχειρα, αποθηκεύονται απρόσεκτα ή δεν ανανεώνονται ποτέ. Τυπικές αστοχίες είναι τα ιδιωτικά κλειδιά που δημοσιεύονται κατά λάθος σε δημόσια αποθετήρια κώδικα, τα ενσωματωμένα διαπιστευτήρια στις εφαρμογές, οι προβλέψιμες γεννήτριες τυχαίων αριθμών και τα πιστοποιητικά που λήγουν χωρίς να το αντιληφθεί κανείς, προκαλώντας διακοπές λειτουργίας. Η **διαχείριση κλειδιών** καλύπτει ολόκληρο τον κύκλο ζωής: ασφαλή παραγωγή από κρυπτογραφικά ασφαλή πηγή τυχαιότητας, προστατευμένη αποθήκευση, ελεγχόμενη διανομή, τακτική εναλλαγή, ανάκληση και, τέλος, καταστροφή."},{"type":"p","text":"Τα κλειδιά υψηλής αξίας πρέπει να φυλάσσονται σε ειδικό υλικό. Μια **μονάδα ασφάλειας υλικού** (Hardware Security Module, HSM) ή μια υπηρεσία διαχείρισης κλειδιών στο νέφος εκτελεί τις κρυπτογραφικές λειτουργίες εσωτερικά, ώστε το ιδιωτικό κλειδί να μην εγκαταλείπει ποτέ τη συσκευή. Η πρόσβαση στα κλειδιά πρέπει να ακολουθεί τις αρχές του ελάχιστου προνομίου και του διαχωρισμού καθηκόντων, και κάθε χρήση πρέπει να καταγράφεται. Με ματιά στο μέλλον, οι οργανισμοί οφείλουν επίσης να τηρούν απογραφή του πού χρησιμοποιείται κάθε αλγόριθμος (_κρυπτογραφική ευελιξία_), ώστε οι ευάλωτοι αλγόριθμοι να μπορούν να αντικατ
